[project]
name = "obsidian-mcp-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "obsidian-remote-mcp==2.1.0",
  "fastmcp==3.4.7",
  "filelock==3.20.3",
  "python-frontmatter==1.1.0",
  "PyYAML==6.0.3",
  "watchdog==6.0.0",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
