---
# Talos machine configuration for the prox-ops cluster, rendered and applied
# with topf (https://github.com/postfinance/topf).
#
# Patches are merged in this order (lexicographic within each directory):
#   all/  ->  control-plane/ | worker/  ->  node/<host>/
#
# Render locally (offline, no node access):  topf render -o ./rendered
# Preview changes against live nodes:        topf apply --dry-run
clusterName: kubernetes
clusterEndpoint: https://10.20.67.20:6443

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.5
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.2

# The VM templates boot the Image Factory nocloud image
# (terraform/modules/talos-template), but every node runs with
# talos.platform=metal after its first upgrade through the generic installer,
# and the machine config carries all networking. Keep metal: tuppr reuses the
# installer path from each node's config, so a nocloud-installer path here would
# move nodes to the nocloud platform on their next upgrade. topf derives
# factory.talos.dev/metal-installer/<schematicId>:<talosVersion>.
platform: metal
secureboot: false

# Base schematic: QEMU guest agent + net.ifnames=0.
# GPU nodes override it below with the NVIDIA schematic.
schematicId: f683308f6e49ec36d715bd41c90d800910552d8cbc015c8363ec350594535fa1

# Talos secrets bundle (SOPS/age encrypted; topf decrypts it automatically).
secretsPath: talsecret.sops.yaml

# Node IPs must stay inside 10.20.67.0/28, the nodes range in all/60-ingress-firewall.yaml.
nodes:
