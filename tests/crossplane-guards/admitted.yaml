# Positive controls: every object here must be ADMITTED, given the setup in
# README.md. They prove the denials in denied.yaml come from the rule each
# fixture names, not from a policy that refuses everything. With the params
# ConfigMap deleted, every managed resource here must be DENIED (fail-closed).
# Placeholder values only.
---
apiVersion: azuread.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: people
  namespace: identity-people
spec:
  oidcTokenFilePath: /var/run/xp-assertion/people.jwt
  tenantID: placeholder-tenant
  clientID: placeholder-client-people
  credentials:
    source: OIDCTokenFile
---
apiVersion: azuread.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: apps
  namespace: identity-apps
spec:
  oidcTokenFilePath: /var/run/xp-assertion/apps.jwt
  tenantID: placeholder-tenant
  clientID: placeholder-client-apps
  credentials:
    source: OIDCTokenFile
---
apiVersion: azuread.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: ca
  namespace: identity-ca
spec:
  oidcTokenFilePath: /var/run/xp-assertion/ca.jwt
  tenantID: placeholder-tenant
  clientID: placeholder-client-ca
  credentials:
    source: OIDCTokenFile
---
apiVersion: groups.azuread.m.upbound.io/v1beta1
kind: Group
metadata:
  name: grp-observe-01
  namespace: identity-people
  annotations:
    crossplane.io/external-name: placeholder-group-01
spec:
  managementPolicies: ["Observe"]
  providerConfigRef:
    kind: ProviderConfig
    name: people
  forProvider: {}
---
apiVersion: groups.azuread.m.upbound.io/v1beta1
kind: Group
metadata:
  name: grp-access-01
  namespace: identity-people
spec:
  managementPolicies: ["Create", "Update", "Observe"]
  providerConfigRef:
    kind: ProviderConfig
    name: people
  forProvider:
    displayName: Fixture access group 01
    securityEnabled: true
---
apiVersion: invitations.azuread.m.upbound.io/v1beta1
kind: Invitation
metadata:
  name: guest-01
  namespace: identity-people
spec:
  managementPolicies: ["Create", "Observe"]
  providerConfigRef:
    kind: ProviderConfig
    name: people
  forProvider: {}
  initProvider:
    redirectUrl: https://example.com
    userEmailAddress: guest-01@example.com
    userDisplayName: Guest 01
---
apiVersion: applications.azuread.m.upbound.io/v1beta1
kind: Application
metadata:
  name: application-observe-01
  namespace: identity-apps
  annotations:
    crossplane.io/external-name: placeholder-app-01
spec:
  managementPolicies: ["Observe"]
  providerConfigRef:
    kind: ProviderConfig
    name: apps
  forProvider: {}
---
apiVersion: serviceprincipals.azuread.m.upbound.io/v1beta1
kind: Principal
metadata:
  name: principal-observe-01
  namespace: identity-apps
  annotations:
    crossplane.io/external-name: placeholder-principal-01
spec:
  managementPolicies: ["Observe"]
  providerConfigRef:
    kind: ProviderConfig
    name: apps
  forProvider: {}
---
apiVersion: conditionalaccess.azuread.m.upbound.io/v1beta1
kind: AccessPolicy
metadata:
  name: policy-01
  namespace: identity-ca
  annotations:
    crossplane.io/external-name: placeholder-policy-01
spec:
  managementPolicies: ["Observe"]
  providerConfigRef:
    kind: ProviderConfig
    name: ca
  forProvider: {}
