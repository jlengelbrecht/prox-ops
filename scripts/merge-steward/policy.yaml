# Merge steward policy. The steward reads this file from the default branch only.
#
# Anything the steward cannot match to a rule below gets the needs-human verdict.
# manual_packages mirrors the "automerge": false rules in .github/renovate/autoMerge.json5
# and .github/renovate.json5; test_policy_drift.py fails when the two disagree.
# Package patterns use Renovate's syntax: "/regex/" or an exact name.
version: 1

# The Renovate app. Only its PRs from this repository are evaluated. A same-repo PR by a
# person gets success as out of scope. Any other Bot and any fork PR get needs-human.
authors: ["renovate[bot]"]
# GitHub's committer for commits made through its API or web UI. Together with a valid
# signature, this is what shows a commit did not arrive by plain git push.
commit_signer: web-flow

base_branch: main
soak_status: renovate/stability-days
override_label: steward/human-approved
# The GitHub App that posts the merge-steward check run. Only its runs carry
# a render record the steward trusts.
steward_app_id: 5615799

# Check runs the steward ignores when it reads the head commit: its own check run and jobs.
ignore_checks: ["merge-steward", "merge-steward evaluate", "merge-steward review",
                "merge-steward advisory review", "merge-steward advisory"]

# Check runs that must exist on the head commit, come from the named GitHub App (15368 is
# GitHub Actions, 46505 GitGuardian) and conclude success: the ruleset's required set. A
# missing one is hold until the deadline (minutes after the head commit), then needs-human.
required_checks:
  - {name: "Flux Local Pre-Job", app_id: 15368}
  - {name: "Flux Local Success", app_id: 15368}
  - {name: "GitGuardian Security Checks", app_id: 46505}
  - {name: "Labeler", app_id: 15368}
  - {name: "Security Gate", app_id: 15368}
  - {name: "Multi-Layer Bug Detection", app_id: 15368}
  - {name: "Talos and Kubernetes versions agree", app_id: 15368}
  - {name: "Talos upgrade path is supported", app_id: 15368}
  # The secretless render job in the merge steward workflow.
  - {name: "merge-steward render", app_id: 15368}
required_checks_deadline_minutes: 120

# AI review. It runs only when the repository variable MERGE_STEWARD_AI is "true".
ai:
  # What the AI may decide. lower_only: the answers below give needs-human, and nothing it
  # says can clear another stage. This is the one setting to change if the AI's role widens.
  verdict_authority: lower_only
  # The AI's answers that give needs-human. medium and needs_review deliberately count as
  # a pass: they mean "worth a look", and the check is for what would break. Change this
  # only as a decision about how many PRs reach a human. high and changes_required must stay.
  needs_human_on:
    risks: [high]
    recommendations: [changes_required]
  # Which PRs get a review. Fork PRs never do, and no value here changes that.
  #   verdict:  the result feeds the merge-steward verdict
  #   advisory: the result is posted as a comment and changes no verdict
  #   off:      no review
  review_scope:
    renovate: verdict      # renovate[bot] from this repository
    same_repo: advisory    # any other author from this repository (advisory or off)
  # The model, and the only place to change it. alias is a LiteLLM model name, which the
  # review key must be allowed to use. A slow or cold model needs the longer timeouts.
  model:
    alias: qwen36-27b
    context_tokens: 65536         # the model's whole context, output included
    max_prompt_tokens: 40000      # what PR-Agent may send in one call
    call_timeout_seconds: 300     # one model call
    review_timeout_seconds: 780   # all of PR-Agent, retries included; under the job timeout
  # Upper bounds for the context file, in characters. Their sum stays within
  # ARTIFACTS__MAX_ARTIFACT_SIZE in .github/actions/merge-steward-review.
  context_chars: {render: 3000, evidence: 6000, release_notes: 14000}

# Update types that may pass when nothing else matches. Everything else (major,
# replacement, rollback, bump, unknown) is needs-human.
pass_update_types: [digest, pinDigest, pin, patch, minor]

# Releases that keep merging on required checks, including 0.x minors and prereleases that
# Renovate marks as breaking. An exception applies only when the PR is that one package in
# that one file, so anything else in the PR gets the normal verdict. The render stage
# accepts its tag and digest only on the named object, and only for tags matching
# tag_pattern. Spektr mirrors the Renovate rule "Auto-merge Spektr release and digest
# updates after required CI" in .github/renovate.json5: upstream releases are tested once
# they land in the cluster. test_policy_drift.py keeps the two in step. Majors are not on
# the list and stay needs-human.
release_exceptions:
  - package: ghcr.io/jlengelbrecht/agent-router-base
    file: kubernetes/apps/ai/agent-router/app/ocirepository.yaml
    update_types: [digest, patch, minor]
    tag_pattern: '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
    oci_repository:
      namespace: ai
      name: agent-router-base
      url: oci://ghcr.io/jlengelbrecht/agent-router-base

# Any changed file matching one of these globs gets needs-human.
protected_paths:
  # Node lifecycle and upgrade automation
  - talos/**
  - terraform/**
  - kubernetes/apps/system-upgrade/**
  # CI and automation: workflows, Renovate config, labels, repo scripts
  - .github/**
  - .gitleaks.toml
  - scripts/merge-steward/**
  # Secrets machinery and security boundaries
  - "**/*.sops.yaml"
  - kubernetes/apps/external-secrets/**
  - kubernetes/apps/identity-system/**
  - kubernetes/apps/security-system/**
  - kubernetes/apps/hsm-system/**
  - kubernetes/apps/openbao/**
  - kubernetes/apps/cert-manager/**
  # Stateful storage and the cluster backbone
  - kubernetes/apps/rook-ceph/**
  - kubernetes/flux/**
  - kubernetes/apps/flux-system/**
  - kubernetes/apps/kube-system/**
  - kubernetes/apps/network/**
  # Renovate rules that match on file names with "automerge": false
  - services/yubihsm-tools/**
  - services/openbao-hsm/**
  - services/obsidian-mcp/**
  - scripts/hindsight-logging-ci-assets.py
  - kubernetes/apps/observability/kube-prometheus-stack/app/helmrelease.yaml
  - kubernetes/apps/crossplane-system/provider-azuread/app/provider.yaml

# Packages a human merges. update_types lists the update types that need a human;
# "all" means every update type.
manual_packages:
  # Digest bumps pass every check while the image's build pipeline is broken (#1812).
  # Remove this rule once that pipeline is fixed.
  - reason: obsidian-mcp image needs a human until its build pipeline is fixed
    match: ["ghcr.io/jlengelbrecht/obsidian-mcp"]
    update_types: all
  - reason: rook-ceph and Ceph are fully manual
    match: ["/rook/", "/ceph/"]
    update_types: all
  - reason: YubiHSM device plugin is fully manual
    match: ["ghcr.io/squat/generic-device-plugin"]
    update_types: all
  - reason: LiteLLM, Hermes and Hindsight carry schema migrations
    # Regexes, so every image and chart name for these apps is caught (Renovate's rule lists
    # exact names; the steward is deliberately broader).
    match: ["/hermes-agent/", "/hindsight/", "/litellm/"]
    update_types: all
  - reason: Paperclip migrations need a pg_dump first
    match: ["/paperclip/"]
    update_types: all
  - reason: provider-azuread is fully manual
    match: ["/provider-azuread/"]
    update_types: all
  - reason: core infrastructure minor or major
    match: ["/authentik/", "/goauthentik/", "/nvidia/", "/nvidia-device-plugin/", "kube-prometheus-stack",
            "/envoy-gateway/", "/envoyproxy/", "/cert-manager/", "/cilium/", "/external-secrets/",
            "/cloudnative-pg/", "/flux-operator/", "/flux-instance/", "/coredns/", "/multus/",
            "siderolabs/talos", "ghcr.io/siderolabs/kubelet"]
    update_types: [minor, major]
  - reason: stateful data layer minor or major
    match: ["/postgresql/", "/postgres/", "/valkey/", "/redis/", "/mariadb/"]
    update_types: [minor, major]
  - reason: app runs database or storage migrations on minor or major
    match: ["/open-webui/", "/qdrant/", "/n8n/"]
    update_types: [minor, major]
  - reason: Loki, Alloy and Crossplane minor or major
    match: ["loki", "alloy", "grafana/loki", "grafana/alloy", "docker.io/grafana/loki",
            "docker.io/grafana/alloy", "crossplane"]
    update_types: [minor, major]
