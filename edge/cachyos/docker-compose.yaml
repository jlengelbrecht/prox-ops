# CachyOS RX 7900 XTX edge worker — the LAN-facing half.
#
# One service on purpose. llama-swap is the only edge process cluster traffic
# reaches (EDGE-WORKER-CONTRACT §3, ruling R3); llama-server is a child process
# of it inside this container, bound to 127.0.0.1 and published nowhere. The
# heartbeat producer and the interactive guard run on the host as
# `systemctl --user` units rather than as containers — see systemd/ and
# README.md §"Interactive priority".
#
# Publication, and why it is a docker port rather than a host process: 35.4
# measured that this host's ufw drops inbound TCP to a plain host process while
# letting docker-published ports through — docker's DNAT sits in
# PREROUTING/DOCKER-USER and never traverses ufw's INPUT chain. Publishing here
# therefore needs no firewall change and no sudo. See README.md §"ufw and
# publication".
#
# All host-specific values live in .env (untracked). env.example is the
# template. No address, key, or certificate belongs in this file.

name: edge-cachyos

services:
  llama-swap:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${EDGE_IMAGE:?set EDGE_IMAGE in .env}
    container_name: edge-llama-swap
    restart: unless-stopped

    # PID 1 is the supervisor, not llama-swap itself: it is what takes the
    # listener down when the host claims the GPU, without the interactive guard
    # needing docker privileges to do it. scripts/edge-supervisor.sh explains
    # why that indirection is worth a moving part.
    entrypoint: ["/edge/scripts/edge-supervisor.sh"]

    # ROCm needs the KFD control device and the render node. On this host both
    # are mode 0666, so no group_add is required; on a host where they are 0660
    # add the owning GIDs (`stat -c '%g' /dev/kfd /dev/dri/renderD128`) to a
    # group_add list here rather than loosening the device permissions.
    devices:
      - /dev/kfd
      - /dev/dri

    # Published on one address and one port. Binding the specific LAN address
    # rather than 0.0.0.0 keeps the endpoint off the host's other interfaces
    # (docker bridges, VPN links) instead of relying on them being uninteresting.
    ports:
      - "${EDGE_BIND_ADDR:?set EDGE_BIND_ADDR in .env}:${EDGE_PORT:?set EDGE_PORT in .env}:8443"

    environment:
      # A path, not the credential. The supervisor reads the file and passes
      # the value to llama-swap through its process environment, where the
      # config's ${env.EDGE_API_KEY} macro picks it up. Setting the credential
      # here instead would publish it to anyone who can run `docker inspect`.
      EDGE_API_KEY_FILE: ${EDGE_API_KEY_FILE:-/edge/secrets/api-key}
      EDGE_STATE_DIR: /edge/state
      LLAMA_SWAP_BIN: /usr/local/bin/llama-swap
      # Consumed by the healthcheck below, which resolves it through the
      # extra_hosts entry so it verifies the leaf's SAN rather than skipping it.
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?set EDGE_HOSTNAME in .env}

    volumes:
      # The GGUF cache. Read-only: llama.cpp only ever reads the model, and the
      # cluster's InferenceService mounts it the same way.
      - ${EDGE_MODEL_SOURCE:?set EDGE_MODEL_SOURCE in .env}:/models:ro
      # Dedicated edge CA, host leaf and host key. Never the Kubernetes
      # wildcard key. Generated by scripts/issue-edge-pki.sh; lives outside Git.
      - ${EDGE_PKI_SOURCE:?set EDGE_PKI_SOURCE in .env}:/pki:ro
      # One file, `api-key`, sourced from 1Password.
      - ${EDGE_SECRETS_SOURCE:?set EDGE_SECRETS_SOURCE in .env}:/edge/secrets:ro
      # Read-write, and shared with the host-side guard: the guard writes the
      # interactive claim, the supervisor writes the phase.
      - ${EDGE_STATE_SOURCE:?set EDGE_STATE_SOURCE in .env}:/edge/state
      # Mounted rather than baked in, so a guard or supervisor fix is a file
      # edit and a restart instead of an image rebuild, and so the code the
      # container runs is the code in Git.
      - ./scripts:/edge/scripts:ro
      - ./llama-swap.yaml:/etc/llama-swap/config.yaml:ro

    # The leaf's SAN is the edge hostname, so the in-container healthcheck has
    # to reach itself by that name for certificate validation to mean anything.
    # There is no LAN DNS record for it yet (34.19b is unstarted), and this
    # entry is scoped to the container, so it does not touch the host resolver.
    extra_hosts:
      - "${EDGE_HOSTNAME:?set EDGE_HOSTNAME in .env}:127.0.0.1"

    # /health is llama-swap's only unauthenticated route and answers as soon as
    # the proxy is listening. That is what a container healthcheck should ask:
    # "is the edge accepting requests", not "is a model warm". Probing a
    # model-bearing path here would hold the GPU warm forever and defeat the
    # on-demand lifecycle this whole design is built around.
    #
    # It fails, correctly, while the host has claimed the GPU — an INTERACTIVE
    # node is not accepting work, and docker should say so.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --cacert /pki/edge-ca.crt "https://$${EDGE_HOSTNAME}:8443/health"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # llama-swap's own graceful shutdown budget is 30s with a 35s hard backstop,
    # and the supervisor gives it 40s before escalating. Docker has to allow
    # more than both, or `docker compose down` cuts in-flight requests that were
    # about to finish.
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# The four state-bearing volumes are declared EXTERNAL on purpose. They are
# created once by the bring-up in README.md and they hold things that must
# survive a `docker compose down` and must never be silently recreated empty:
# the ~17 GB model cache, the edge CA and host key, the bearer credential, and
# the guard/heartbeat state. Without `external: true` Compose would create
# project-prefixed volumes of its own (cachyos_edge-model-cache and friends),
# the container would come up against empty mounts, and the model would be
# re-downloaded while the PKI and credential silently vanished.
volumes:
  edge-model-cache:
    external: true
  edge-pki:
    external: true
  edge-secrets:
    external: true
  edge-state:
    external: true
