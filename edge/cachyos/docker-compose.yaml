# CachyOS RX 7900 XTX edge worker — the LAN-facing half.
#
# One service on purpose. llama-swap is the only edge process cluster traffic
# reaches (EDGE-WORKER-CONTRACT §3, ruling R3); llama-server is a child process
# of it inside this container, bound to 127.0.0.1 and published nowhere. The
# heartbeat producer and the interactive guard run on the host as
# `systemctl --user` units rather than as containers — see systemd/ and
# README.md §"Interactive priority".
#
# Publication, and why it is a docker port rather than a host process: 35.4
# measured that this host's ufw drops inbound TCP to a plain host process while
# letting docker-published ports through — docker's DNAT sits in
# PREROUTING/DOCKER-USER and never traverses ufw's INPUT chain. Publishing here
# therefore needs no firewall change and no sudo. See README.md §"ufw and
# publication".
#
# All host-specific values live in .env (untracked). env.example is the
# template. No address, key, or certificate belongs in this file.

name: edge-cachyos

services:
  llama-swap:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${EDGE_IMAGE:?set EDGE_IMAGE in .env}
    container_name: edge-llama-swap
    restart: unless-stopped

    # PID 1 is the supervisor, not llama-swap itself: it is what takes the
    # listener down when the host claims the GPU, without the interactive guard
    # needing docker privileges to do it. scripts/edge-supervisor.sh explains
    # why that indirection is worth a moving part.
    entrypoint: ["/edge/scripts/edge-supervisor.sh"]

    # ROCm needs the KFD control device and the render node. On this host both
    # are mode 0666, so no group_add is required; on a host where they are 0660
    # add the owning GIDs (`stat -c '%g' /dev/kfd /dev/dri/renderD128`) to a
    # group_add list here rather than loosening the device permissions.
    devices:
      - /dev/kfd
      - /dev/dri

    # Published on one address and one port. Binding the specific LAN address
    # rather than 0.0.0.0 keeps the endpoint off the host's other interfaces
    # (docker bridges, VPN links) instead of relying on them being uninteresting.
    ports:
      - "${EDGE_BIND_ADDR:?set EDGE_BIND_ADDR in .env}:${EDGE_PORT:?set EDGE_PORT in .env}:8443"

    environment:
      # A path, not the credential. The supervisor reads the file and passes
      # the value to llama-swap through its process environment, where the
      # config's ${env.EDGE_API_KEY} macro picks it up. Setting the credential
      # here instead would publish it to anyone who can run `docker inspect`.
      #
      # Stated literally, not read from .env, and so is EDGE_STATE_DIR below.
      # Both name a path that differs on the two sides of this boundary: the
      # host units point them at the host copy of the credential and at
      # EDGE_STATE_HOST_DIR. A single value in .env would have to be wrong for
      # one side, so neither is in there.
      EDGE_API_KEY_FILE: /edge/secrets/api-key
      EDGE_STATE_DIR: /edge/state
      LLAMA_SWAP_BIN: /usr/local/bin/llama-swap
      # Same value on both sides of the container boundary, unlike the two
      # paths above -- read from .env with a default so a host that has not
      # added it yet still gets the documented default (see env.example and
      # README.md "Guard-ready lease") instead of the container failing to
      # start.
      EDGE_GUARD_LEASE_TTL: ${EDGE_GUARD_LEASE_TTL:-6}
      # Consumed by the healthcheck below, which resolves it through the
      # extra_hosts entry so it verifies the leaf's SAN rather than skipping it.
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:?set EDGE_HOSTNAME in .env}
      # How often the supervisor rescans /models for the cache-observation
      # manifest (STORY-035-9c Part A). Keep comfortably below the host-side
      # edge-heartbeat.sh's EDGE_CACHE_MANIFEST_MAX_AGE, the same relationship
      # EDGE_GUARD_LEASE_TTL above has to the guard's own sampling interval.
      EDGE_CACHE_SCAN_INTERVAL: ${EDGE_CACHE_SCAN_INTERVAL:-60}

    volumes:
      # The GGUF cache. Read-only: llama.cpp only ever reads the model, and the
      # cluster's InferenceService mounts it the same way.
      - ${EDGE_MODEL_SOURCE:?set EDGE_MODEL_SOURCE in .env}:/models:ro
      # Dedicated edge CA, host leaf and host key. Never the Kubernetes
      # wildcard key. Generated by scripts/issue-edge-pki.sh; lives outside Git.
      - ${EDGE_PKI_SOURCE:?set EDGE_PKI_SOURCE in .env}:/pki:ro
      # One file, `api-key`, sourced from 1Password.
      - ${EDGE_SECRETS_SOURCE:?set EDGE_SECRETS_SOURCE in .env}:/edge/secrets:ro
      # Read-write, and shared with the host-side guard and heartbeat: the
      # guard writes the interactive claim, the supervisor writes the phase.
      #
      # A bind mount of a real host directory, not a named volume, and that is
      # the whole point. The guard and the heartbeat are `systemctl --user`
      # units on the host; they cannot open a docker volume. A volume here
      # would give the supervisor one claim/phase directory and the host
      # daemons another, so the guard's claim would never withdraw the endpoint
      # and the supervisor's phase would never reach the heartbeat — with both
      # sides logging as if they were working. EDGE_STATE_HOST_DIR must be the
      # same path the units use (%S/edge-cachyos-state, i.e.
      # ~/.local/state/edge-cachyos-state); see env.example and README.md
      # §"Shared state directory".
      #
      # create_host_path: false so a wrong or missing path fails the container
      # loudly instead of docker silently creating an empty root-owned
      # directory that the units will never write to.
      - type: bind
        source: ${EDGE_STATE_HOST_DIR:?set EDGE_STATE_HOST_DIR in .env}
        target: /edge/state
        bind:
          create_host_path: false
      # Mounted rather than baked in, so a guard or supervisor fix is a file
      # edit and a restart instead of an image rebuild, and so the code the
      # container runs is the code in Git.
      #
      # From the INSTALLED copy at EDGE_LIBEXEC_DIR (scripts/install.sh),
      # never from a path relative to this checkout. `docker compose` resolves
      # relative volume paths against the directory it is invoked from, which
      # is how a live node ended up bound to a disposable Orca worktree: once
      # that worktree was deleted, the next `docker restart` had nothing to
      # mount. EDGE_LIBEXEC_DIR is a fixed, checkout-independent location that
      # install.sh refreshes on every pull — see README.md "Layout
      # independence".
      #
      # create_host_path: false, same reasoning as EDGE_STATE_HOST_DIR above:
      # a wrong or not-yet-installed path fails the container loudly instead
      # of docker silently creating an empty directory that the entrypoint
      # then can't find itself in.
      - type: bind
        source: ${EDGE_LIBEXEC_DIR:?set EDGE_LIBEXEC_DIR in .env}/scripts
        target: /edge/scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EDGE_LIBEXEC_DIR:?set EDGE_LIBEXEC_DIR in .env}/llama-swap.yaml
        target: /etc/llama-swap/config.yaml
        read_only: true
        bind:
          create_host_path: false

    # The leaf's SAN is the edge hostname, so the in-container healthcheck has
    # to reach itself by that name for certificate validation to mean anything.
    # There is no LAN DNS record for it yet (34.19b is unstarted), and this
    # entry is scoped to the container, so it does not touch the host resolver.
    extra_hosts:
      - "${EDGE_HOSTNAME:?set EDGE_HOSTNAME in .env}:127.0.0.1"

    # /health is llama-swap's only unauthenticated route and answers as soon as
    # the proxy is listening. That is what a container healthcheck should ask:
    # "is the edge accepting requests", not "is a model warm". Probing a
    # model-bearing path here would hold the GPU warm forever and defeat the
    # on-demand lifecycle this whole design is built around.
    #
    # It fails, correctly, while the host has claimed the GPU — an INTERACTIVE
    # node is not accepting work, and docker should say so.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --cacert /pki/edge-ca.crt "https://$${EDGE_HOSTNAME}:8443/health"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # llama-swap's own graceful shutdown budget is 30s with a 35s hard backstop,
    # and the supervisor gives it 40s before escalating. Docker has to allow
    # more than both, or `docker compose down` cuts in-flight requests that were
    # about to finish.
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# These three volume NAMES are declared EXTERNAL on purpose. Compose creates a
# project-prefixed volume for any name it declares itself, so without
# `external: true` a `docker compose up` on a host that had never run the
# bring-up would come up against empty mounts: the ~17 GB model would be
# re-downloaded and the PKI and the bearer credential would silently be gone.
# Declared external, Compose refuses to start until they exist.
#
# What that protects is exactly these three names, and nothing more. The mounts
# above are written as ${EDGE_*_SOURCE}, so the protection applies only while
# those variables hold these names. Point one at some other volume name and
# Compose will happily create it empty; point it at a host path and docker will
# use whatever is there. If you override them, you own the "does the data exist"
# question yourself.
#
# The claim/phase state is deliberately not in this list: it is a host-directory
# bind mount, because the host-side guard and heartbeat have to read and write
# the same files and cannot open a docker volume. That mount states
# `create_host_path: false`, which is how it fails loudly in the same way.
volumes:
  edge-model-cache:
    external: true
  edge-pki:
    external: true
  edge-secrets:
    external: true
