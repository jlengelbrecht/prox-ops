# STORY-035-9b (inherited): the router credential is deliberately NOT in
# edge.env, because that file's contract is that it is non-secret. This
# drop-in adds a SECOND EnvironmentFile= to edge-heartbeat.service alone
# (not the guard, not the supervisor — neither reads it), pointing at a
# dedicated mode-0600 file that holds nothing but EDGE_ROUTER_TOKEN (and
# optionally an override of EDGE_ROUTER_URL). Its copy of record is
# op://Automation/edge-bazzite-5090/router-credential.
#
# systemd applies EnvironmentFile= directives in order — the unit's own
# edge.env first, then this drop-in — so a non-empty value here wins over
# edge.env's empty EDGE_ROUTER_TOKEN= placeholder. Verify behaviorally (an
# authenticated heartbeat reaches the router after restart), or inspect the
# running unit's real environment:
#   systemctl --user show edge-heartbeat.service -p MainPID
#   tr '\0' '\n' </proc/<pid>/environ | grep -c '^EDGE_ROUTER_TOKEN=.'
# (count only — never print the value).
[Service]
EnvironmentFile=%h/.config/edge-bazzite/router.env
