name: Setup Cluster Tools
description: Install tools from mise (version-controlled) and configure kubeconfig for cluster access
inputs:
  talosconfig:
    description: Base64-encoded Talos/Kubernetes config
    required: true
  working-directory:
    description: Directory containing .mise.toml (defaults to repository root)
    required: false
    default: '.'

runs:
  using: composite
  steps:
    # mise-action reads .mise.toml but we only install CI-essential tools
    # to avoid filling disk with unnecessary packages (Python 3.14 is ~500MB)
    # Suppress mise venv warnings - we don't install Python in CI to save disk space
    # but .mise.toml has venv config for local development
    - name: Suppress mise Python venv warnings
      shell: bash
      run: |
        echo "MISE_PYTHON_VENV_AUTO_CREATE=0" >> $GITHUB_ENV

    # continue-on-error: a transient registry failure here must not take the
    # whole job with it. The retry step below is the real gate — it fails the
    # job only if a required tool is genuinely absent afterwards.
    - name: Setup mise and install tools
      id: mise-install
      continue-on-error: true
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      with:
        cache: true
        working_directory: ${{ inputs.working-directory }}
        # Only install tools needed for CI workflows (not full .mise.toml)
        # This prevents disk space exhaustion on cattle-runner
        install_args: "aqua:hashicorp/terraform aqua:kubernetes/kubectl aqua:siderolabs/talos aqua:fluxcd/flux2 aqua:helm/helm aqua:jqlang/jq aqua:mikefarah/yq aqua:kubernetes-sigs/kustomize"

    - name: Ensure required tools are present (retry)
      shell: bash
      run: |
        # The aqua/mise registries return intermittent HTTP 400s. Before this
        # retry existed, one blip killed the whole job: on 2026-08-11 three
        # worker upgrade jobs died at exactly the 10-minute mark inside the
        # step above, and k8s-work-2/3/4 were silently left un-upgraded.
        # See .claude/.ai-docs/troubleshooting/RCA-2026-08-15-talos-upgrade-stall.md
        #
        # This step handles NO secrets. It prints tool names and versions only;
        # nothing here reads or echoes the talosconfig input.
        set -uo pipefail

        TOOLS="aqua:hashicorp/terraform aqua:kubernetes/kubectl aqua:siderolabs/talos aqua:fluxcd/flux2 aqua:helm/helm aqua:jqlang/jq aqua:mikefarah/yq aqua:kubernetes-sigs/kustomize"
        REQUIRED_BINS="terraform kubectl talosctl flux helm jq yq kustomize"

        # mise shims may not be on PATH if the action above bailed out early.
        SHIM_DIR="${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims"
        case ":$PATH:" in
          *":$SHIM_DIR:"*) : ;;
          *) export PATH="$SHIM_DIR:$PATH" ;;
        esac

        missing_bins() {
          local m=""
          for b in $REQUIRED_BINS; do
            if ! command -v "$b" >/dev/null 2>&1; then m="$m $b"; fi
          done
          printf '%s' "$m"
        }

        if ! command -v mise >/dev/null 2>&1; then
          echo "::error::mise is not on PATH - the setup action could not bootstrap it"
          exit 1
        fi

        for attempt in 1 2 3; do
          MISSING="$(missing_bins)"
          if [ -z "$MISSING" ]; then
            break
          fi
          echo "Attempt ${attempt}/3 - missing:${MISSING}"
          # Bound each attempt so a hung download cannot consume the job timeout.
          if timeout 300 mise install $TOOLS; then
            echo "  mise install completed"
          else
            echo "  mise install attempt ${attempt} did not complete (rc=$?)"
          fi
          hash -r 2>/dev/null || true
          if [ "$attempt" -lt 3 ]; then
            sleep $(( attempt * 20 ))
          fi
        done

        MISSING="$(missing_bins)"
        if [ -n "$MISSING" ]; then
          echo "::error::Required tools still missing after 3 attempts:${MISSING}"
          echo "::error::mise-action outcome was '${{ steps.mise-install.outcome }}'"
          exit 1
        fi

        # Persist the shim dir for later steps in the calling job.
        echo "$SHIM_DIR" >> "$GITHUB_PATH"
        echo "✅ All required tools present"

    - name: Verify tool versions
      shell: bash
      run: |
        echo "============================================"
        echo "Installed tool versions (CI-essential subset):"
        echo "============================================"

        # Verify critical tools are present (fail fast if missing)
        if ! command -v kubectl &>/dev/null; then
          echo "❌ ERROR: kubectl not found - check install_args"
          exit 1
        fi
        if ! command -v talosctl &>/dev/null; then
          echo "❌ ERROR: talosctl not found - check install_args"
          exit 1
        fi
        if ! command -v terraform &>/dev/null; then
          echo "❌ ERROR: terraform not found - check install_args"
          exit 1
        fi

        echo "  terraform: $(terraform version 2>/dev/null | head -1 || echo 'version check failed')"
        echo "  kubectl:   $(kubectl version --client -o json 2>/dev/null | jq -r '.clientVersion.gitVersion' || kubectl version --client 2>&1 | head -1)"
        echo "  talosctl:  $(talosctl version --client 2>/dev/null | grep Tag | awk '{print $2}' || echo 'version check failed')"
        echo "  flux:      $(flux version --client 2>/dev/null | head -1 || echo 'not available')"
        echo "  helm:      $(helm version --short 2>/dev/null || echo 'not available')"
        echo "  kustomize: $(kustomize version 2>/dev/null || echo 'not available')"
        echo "  yq:        $(yq --version 2>/dev/null || echo 'not available')"
        echo "  jq:        $(jq --version 2>/dev/null || echo 'not available')"
        echo "============================================"

    - name: Setup kubeconfig
      shell: bash
      run: |
        # Save talosconfig
        mkdir -p "$HOME/.talos"
        echo "${{ inputs.talosconfig }}" | base64 -d > "$HOME/.talos/config"
        chmod 600 "$HOME/.talos/config"

        # Generate kubeconfig from talosconfig with resilient control plane fallback
        # Try each control plane node until one succeeds (handles node maintenance/upgrades)
        mkdir -p "$HOME/.kube"

        CONTROL_PLANE_IPS=("10.20.67.1" "10.20.67.2" "10.20.67.3")
        KUBECONFIG_GENERATED=false

        for NODE_IP in "${CONTROL_PLANE_IPS[@]}"; do
          echo "Attempting kubeconfig generation from control plane node: $NODE_IP"

          if talosctl kubeconfig \
            --talosconfig="$HOME/.talos/config" \
            --nodes="$NODE_IP" \
            --merge=false \
            --force \
            "$HOME/.kube/config" 2>&1; then

            echo "✅ Successfully generated kubeconfig from $NODE_IP"
            chmod 600 "$HOME/.kube/config"
            KUBECONFIG_GENERATED=true
            break
          else
            echo "⚠️  Failed to reach $NODE_IP, trying next control plane node..."
          fi
        done

        # Verify kubeconfig was generated from at least one control plane
        if [[ "$KUBECONFIG_GENERATED" != "true" ]]; then
          echo "❌ ERROR: Failed to generate kubeconfig from any control plane node"
          echo "Tried nodes: ${CONTROL_PLANE_IPS[*]}"
          exit 1
        fi

        # Verify kubeconfig is valid (do NOT print it — minify view leaks the API
        # server URL + cluster CA to the public Actions log on a public repo)
        echo "Verifying kubeconfig..."
        kubectl config view --minify -o jsonpath='{.clusters[0].name}' >/dev/null 2>&1 \
          && echo "kubeconfig valid" || echo "WARNING: kubeconfig minify check failed"

        # Verify cluster connectivity
        echo "Testing cluster API connectivity..."
        # Note: 'kubectl version --short' was REMOVED in kubectl v1.28+
        # Using 'kubectl get --raw /version' for lightweight API connectivity test
        if ! kubectl get --raw /version &>/dev/null; then
          echo "⚠️  WARNING: Generated kubeconfig is valid but cannot reach API server"
          echo "This may indicate network issues or cluster being upgraded"
          exit 1
        fi
        echo "✅ Cluster API server is reachable"
