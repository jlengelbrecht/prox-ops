---
# Merge steward: posts the `merge-steward` check run on every PR. It judges Renovate PRs
# from this repository: pass, needs-human, or in_progress while a release soaks. A
# same-repo PR by a person or by an app named in policy.yaml trusted_apps gets success as out
# of scope. Any other Bot and any fork PR get needs-human.
# Verdicts come from deterministic rules in scripts/merge-steward/policy.yaml. With the
# repository variable MERGE_STEWARD_AI set to "true", an AI review joins them and can only
# lower the result (.github/actions/merge-steward-review). Without it no review runs and nothing waits.
#
# The evaluate job runs on pull_request_target, status, check_suite, schedule
# and workflow_dispatch events, so both this file and the steward code come from the
# default branch. It never checks out or runs PR code: it reads PR data through the API. It never merges anything.
#
# The render job is the one place PR content is read from disk: it checks out the PR merge
# ref and renders it with flux-local in a pinned container. It holds no secrets and no app
# token, has a read-only token that is not persisted, and runs nothing from the PR. Its
# JSON goes to an artifact of this run, which the evaluate job classifies with
# default-branch code.
name: "Merge Steward"

# The unit tests live in merge-steward-tests.yaml, so pull_request and pull_request_target
# events do not create each other's skipped runs.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Renovate flips renovate/stability-days when a soak ends.
  status:
  # A check suite that finishes (or fails) after the PR event re-evaluates the PR it
  # belongs to. GitHub sends none for suites created by Actions itself.
  check_suite:
    types: [completed]
  schedule:
    # The full sweep, once an hour. The other one only evaluates open PRs whose head has no
    # merge-steward check, which is what a run that failed or hit the API rate limit leaves.
    - cron: "17 * * * *"
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to evaluate"
        required: true
        type: number
      dry_run:
        description: "Print the verdict only; post nothing and run no AI review"
        required: false
        default: true
        type: boolean

permissions: {}

env:
  # renovate: datasource=pypi depName=pyyaml
  PYYAML_VERSION: "6.0.3"
  # renovate: datasource=docker depName=ghcr.io/allenporter/flux-local
  FLUX_LOCAL_VERSION: "v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff"

jobs:
  # Renders the PR merge ref and its first parent (the base it merges into) with
  # flux-local and uploads the JSON. Renovate PRs from this repository only.
  render:
    name: merge-steward render
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the PR merged into its base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pull
          fetch-depth: 2
          persist-credentials: false

      # GitHub builds the merge ref asynchronously, so it can still be the previous push's
      # merge commit. Re-fetch it every 20 s for about 3 minutes until its second parent is
      # this event's head. If it never is, render nothing and record the run as stale.
      # The fetch is anonymous (public repository, no credentials persisted).
      - name: Wait for a merge ref built from this head
        id: base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if [ "$(git -C pull rev-parse HEAD^2)" = "$HEAD_SHA" ]; then
              {
                echo "fresh=true"
                echo "head=$HEAD_SHA"
                echo "sha=$(git -C pull rev-parse HEAD^1)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" = 10 ] && break
            sleep 20
            # A failed fetch is a retry, not a failed render.
            if git -C pull -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              fetch --quiet --no-tags --depth=2 origin "+$MERGE_REF:refs/remotes/origin/steward-merge"; then
              git -C pull -c core.hooksPath=/dev/null -c core.fsmonitor=false \
                checkout --quiet --force --detach refs/remotes/origin/steward-merge
            fi
          done
          echo "::warning::the PR merge ref was not rebuilt for this head; recording the render as stale"
          echo "fresh=false" >> "$GITHUB_OUTPUT"

      - name: Checkout that base
        if: steps.base.outputs.fresh == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false

      # Full context (--unified 100000) so each object diff carries the whole object;
      # CRDs included and Secrets skipped; app.kubernetes.io/version labels kept so
      # version skew stays visible. Logs go to files, never to the job log.
      # flux build writes kustomization files into both trees, so they stay writable.
      # meta.json is written after flux-local exits, outside the container, with the head
      # the merge ref was verified to contain. The container drops all capabilities.
      - name: Render with flux-local
        id: flux
        if: steps.base.outputs.fresh == 'true'
        run: |
          set -u
          out="$RUNNER_TEMP/render"
          mkdir -p "$out"
          rc=0
          for res in helmrelease kustomization; do
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
              -v "$PWD:/github/workspace" -v "$out:/out" -w /github/workspace/pull \
              "ghcr.io/allenporter/flux-local:${FLUX_LOCAL_VERSION}" \
              diff "$res" --output json --unified 100000 --limit-bytes 0 \
              --all-namespaces --no-skip-crds --skip-secrets \
              --path /github/workspace/pull/kubernetes/flux/cluster \
              --path-orig /github/workspace/base/kubernetes/flux/cluster \
              --sources "flux-system,homelab-identity=tests/flux-local/homelab-identity" \
              --strip-attrs "helm.sh/chart,checksum/config" \
              --output-file "/out/$res.json" > "$RUNNER_TEMP/flux-$res.log" 2>&1 || rc=1
            echo "$res: flux-local exit $rc"
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Record the render outcome
        env:
          FRESH: ${{ steps.base.outputs.fresh }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RC: ${{ steps.flux.outputs.rc }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/render"
          mkdir -p "$out"
          rm -f "$out/meta.json"
          if [ "$FRESH" = "true" ]; then
            printf '{"head_sha": "%s", "failed": %d}\n' "$HEAD_SHA" "${RC:-1}" > "$out/meta.json"
          else
            printf '{"head_sha": "%s", "stale": true}\n' "$HEAD_SHA" > "$out/meta.json"
          fi

      - name: Upload the render result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-steward-render
          path: |
            ${{ runner.temp }}/render/meta.json
            ${{ runner.temp }}/render/helmrelease.json
            ${{ runner.temp }}/render/kustomization.json
          if-no-files-found: warn
          retention-days: 3

  # A Renovate rebase usually leaves the diff as it was, and each one would otherwise queue a
  # model call on the single steward runner. This asks, without the model or that runner,
  # whether an earlier review still stands. Default-branch code, read-only token, no secrets,
  # and the PR is only read through the API. Only a push can be a rebase, so a reopen or a
  # manual run always gets a new review. A failure here leaves the output empty, which also
  # means a new review. The evaluate job repeats the comparison itself and does not trust this
  # output.
  review-gate:
    name: merge-steward reuse check
    if: >-
      vars.MERGE_STEWARD_AI == 'true' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # the branch activity log
      pull-requests: read
      checks: read
    outputs:
      reuse: ${{ steps.gate.outputs.reuse }}
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/merge-steward
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"
      - name: Look for a review of this diff
        id: gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/merge-steward/review_job.py gate --pr "$PR_NUMBER" --sha "$SHA"

  # The review whose result the evaluate job folds in. Also runs for a manual evaluation,
  # which is how a PR gets a review after a failed one or after AI was switched on. The login
  # here must match policy.yaml authors: review.mode expects a review for every author listed.
  #
  # The key lives in its own environment, limited to main, and not in merge-steward. A job
  # gets every secret of its environment, and this one runs next to hostile input on a
  # self-hosted runner, so it must not share an environment with the steward app's key.
  review:
    name: merge-steward review
    needs: [render, review-gate]
    if: >-
      !cancelled() && vars.MERGE_STEWARD_AI == 'true' && needs.review-gate.outputs.reuse != 'true' && (
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run) ||
      (github.event_name == 'pull_request_target' &&
        contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
        github.event.pull_request.user.login == 'renovate[bot]' &&
        github.event.pull_request.user.type == 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: gha-prox-ops-steward
    # Runner time only; time spent queued for the runner does not count. Keep this above
    # ai.model.review_timeout_seconds in policy.yaml.
    timeout-minutes: 20
    environment: merge-steward-review
    # A newer push replaces the review of the old one. The group is per PR on purpose: a
    # GitHub concurrency group holds one pending job and drops the rest, so a shared group
    # would lose queued reviews. The queue across PRs is the single runner (maxRunners: 1).
    concurrency:
      group: merge-steward-review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-steward
            .github/actions/merge-steward-review
      - uses: ./.github/actions/merge-steward-review
        with:
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          rendered: ${{ needs.render.result == 'success' }}
          llm-key: ${{ secrets.MERGE_STEWARD_LLM_KEY }}

  # Renders a same-repo PR from a person for its advisory review, so the model sees what a
  # change does to the cluster. Same container, same read-only token, same nothing-from-the-PR-runs
  # rules as the render job above, and no secrets. It is a separate job on purpose: evaluate
  # does not wait for it, so the merge-steward check for these PRs is not delayed by a render.
  # Its result goes to its own artifact, which only the advisory review reads.
  advisory-render:
    name: merge-steward advisory render
    if: >-
      vars.MERGE_STEWARD_AI == 'true' &&
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: merge-steward-advisory-render-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read   # the changed file names
    steps:
      # Only a PR that touches the cluster tree has anything to render. The others record an
      # explicit "no render" for the review instead of paying for a render of nothing.
      - name: Look for changes the render can show
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          names=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -Eq '^(kubernetes|tests/flux-local)/' <<<"$names"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the PR merged into its base
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pull
          fetch-depth: 2
          persist-credentials: false

      # Same wait as the render job: the merge ref is built asynchronously.
      - name: Wait for a merge ref built from this head
        id: base
        if: steps.scope.outputs.relevant == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if [ "$(git -C pull rev-parse HEAD^2)" = "$HEAD_SHA" ]; then
              {
                echo "fresh=true"
                echo "sha=$(git -C pull rev-parse HEAD^1)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" = 10 ] && break
            sleep 20
            if git -C pull -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              fetch --quiet --no-tags --depth=2 origin "+$MERGE_REF:refs/remotes/origin/steward-merge"; then
              git -C pull -c core.hooksPath=/dev/null -c core.fsmonitor=false \
                checkout --quiet --force --detach refs/remotes/origin/steward-merge
            fi
          done
          echo "::warning::the PR merge ref was not rebuilt for this head; recording the render as stale"
          echo "fresh=false" >> "$GITHUB_OUTPUT"

      - name: Checkout that base
        if: steps.base.outputs.fresh == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false

      - name: Render with flux-local
        id: flux
        if: steps.base.outputs.fresh == 'true'
        run: |
          set -u
          out="$RUNNER_TEMP/render"
          mkdir -p "$out"
          rc=0
          for res in helmrelease kustomization; do
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
              -v "$PWD:/github/workspace" -v "$out:/out" -w /github/workspace/pull \
              "ghcr.io/allenporter/flux-local:${FLUX_LOCAL_VERSION}" \
              diff "$res" --output json --unified 100000 --limit-bytes 0 \
              --all-namespaces --no-skip-crds --skip-secrets \
              --path /github/workspace/pull/kubernetes/flux/cluster \
              --path-orig /github/workspace/base/kubernetes/flux/cluster \
              --sources "flux-system,homelab-identity=tests/flux-local/homelab-identity" \
              --strip-attrs "helm.sh/chart,checksum/config" \
              --output-file "/out/$res.json" > "$RUNNER_TEMP/flux-$res.log" 2>&1 || rc=1
            echo "$res: flux-local exit $rc"
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Record the render outcome
        env:
          RELEVANT: ${{ steps.scope.outputs.relevant }}
          FRESH: ${{ steps.base.outputs.fresh }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RC: ${{ steps.flux.outputs.rc }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/render"
          mkdir -p "$out"
          rm -f "$out/meta.json"
          if [ "$RELEVANT" != "true" ]; then
            printf '{"head_sha": "%s", "skipped": true}\n' "$HEAD_SHA" > "$out/meta.json"
          elif [ "$FRESH" = "true" ]; then
            printf '{"head_sha": "%s", "failed": %d}\n' "$HEAD_SHA" "${RC:-1}" > "$out/meta.json"
          else
            printf '{"head_sha": "%s", "stale": true}\n' "$HEAD_SHA" > "$out/meta.json"
          fi

      - name: Upload the render result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-steward-advisory-render
          path: |
            ${{ runner.temp }}/render/meta.json
            ${{ runner.temp }}/render/helmrelease.json
            ${{ runner.temp }}/render/kustomization.json
          if-no-files-found: warn
          retention-days: 3

  # Same review for every other same-repo PR, kept apart so that their merge-steward check
  # does not wait in the review queue. Never for a fork, and not for a draft: these share the
  # one runner with verdict reviews, so each one delays them.
  advisory-review:
    name: merge-steward advisory review
    needs: advisory-render
    # A skipped, failed or stale render only means the review goes without it; a cancelled one
    # means a newer push replaced this run.
    if: >-
      !cancelled() && needs.advisory-render.result != 'cancelled' &&
      vars.MERGE_STEWARD_AI == 'true' &&
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: gha-prox-ops-steward
    timeout-minutes: 20
    environment: merge-steward-review
    concurrency:
      group: merge-steward-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-steward
            .github/actions/merge-steward-review
      - uses: ./.github/actions/merge-steward-review
        with:
          pr: ${{ github.event.pull_request.number }}
          rendered: ${{ needs.advisory-render.result == 'success' }}
          render-artifact: merge-steward-advisory-render
          llm-key: ${{ secrets.MERGE_STEWARD_LLM_KEY }}

  # Posts the advisory review as the steward app, like the verdict comment: the summary comment
  # and a comment on each changed line a finding points at. Nothing here runs PR code, and the
  # job reads the PR only through the API. The environment only admits runs from main.
  advisory-publish:
    name: merge-steward advisory
    needs: advisory-review
    if: needs.advisory-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: merge-steward
    permissions:
      contents: read
      pull-requests: read  # the workflow token only reads; the app writes
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/merge-steward
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"
      # Pull requests covers the summary comment and the comments on lines. The token expires
      # within the hour.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.STEWARD_APP_ID }}
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      # Absent when the policy turned this PR's review off, or PR-Agent wrote nothing.
      - name: Download the review result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-steward-review
          path: ${{ runner.temp }}/review
      - name: Post the advisory review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/merge-steward/steward.py --pr "$PR_NUMBER" --advisory-only --review-dir "$RUNNER_TEMP/review"

  evaluate:
    name: merge-steward evaluate
    # Events that can change the verdict: new code, the override label, the soak status,
    # a check suite finishing on a PR head, the sweep, or a manual run. Check suites of the
    # steward app are skipped so a published verdict does not trigger another evaluation.
    #
    # Status and check suite events are narrowed to Renovate branches before a runner is
    # queued. Only a Renovate PR's verdict depends on checks finishing: every other PR is
    # out of scope and gets its pass from pull_request_target, with the missing-only sweep
    # as the backstop. A status payload lists the branches that contain the commit (at most
    # 10), so an empty list, or a list of non-Renovate branches shorter than 10, proves no
    # Renovate branch holds it. A list of 10, or no list at all, is never filtered.
    needs: [render, review]
    # Runs when render or review is skipped (non-Renovate PRs, other events) or fails
    # (needs-human).
    if: >-
      !cancelled() && (
      (github.event_name == 'pull_request_target' &&
        (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
         github.event.label.name == 'steward/human-approved')) ||
      (github.event_name == 'status' && github.event.context == 'renovate/stability-days' &&
        (github.event.branches == null || github.event.branches[9] != null ||
         contains(join(github.event.branches.*.name, ' '), 'renovate/'))) ||
      (github.event_name == 'check_suite' &&
        github.event.check_suite.app.id != 5615799 &&
        github.event.check_suite.pull_requests[0] != null &&
        contains(join(github.event.check_suite.pull_requests.*.head.ref, ' '), 'renovate/')) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the steward app's key. The environment only admits runs from main, so a
    # workflow edited on a branch cannot use it to post this check.
    environment: merge-steward
    # PR events group by PR number; status and check suite events by head commit, so a burst
    # of finishing checks collapses into one pending evaluation. Nothing is cancelled in
    # progress: a run whose push is superseded stops by itself (--event-sha and the head
    # check while it waits), so an older run that queues late cannot cancel a newer one
    # that already holds this run's render result.
    concurrency:
      group: >-
        merge-steward-${{ github.event.pull_request.number || inputs.pr || github.event.sha ||
        github.event.check_suite.head_sha || 'sweep' }}
      cancel-in-progress: false
    permissions:
      contents: read        # read changed manifests and the branch activity log
      pull-requests: write  # steward/* labels; read the PR, comments and timeline
      issues: write         # create the steward/* labels
      checks: read          # read check runs on the head commit
      statuses: read        # read renovate/stability-days and other commit statuses
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/merge-steward

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"

      # The check run and the sticky comment come from the steward app, so the check's source
      # stays fixed for the ruleset and only the app can leave an approval record. Labels stay
      # on the workflow token, so they start no other workflow. Checks covers the check run
      # and pull requests the comment. The token expires within the hour. A dry run writes
      # nothing, so it needs no token.
      - name: Generate GitHub App token
        id: app-token
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.STEWARD_APP_ID }}
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write

      # Only from this run: the artifact the render job above uploaded for this event.
      - name: Download this run's render result
        if: github.event_name == 'pull_request_target' && needs.render.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-steward-render
          path: ${{ runner.temp }}/render

      # A cancelled review means a newer run replaced it. That run owns the verdict.
      - name: Download this run's AI review result
        id: review
        if: needs.review.result == 'success' || needs.review.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-steward-review
          path: ${{ runner.temp }}/review

      - name: Evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_STEWARD_AI: ${{ vars.MERGE_STEWARD_AI }}
          REVIEWED: ${{ needs.review.result == 'success' || needs.review.result == 'failure' }}
          STEWARD_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_SHA: ${{ github.event.sha }}
          CHECK_SHA: ${{ github.event.check_suite.head_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/merge-steward/steward.py ]; then
            echo "::notice::the steward code is not on the default branch yet; nothing to evaluate"
            exit 0
          fi
          review=()
          if [ "$REVIEWED" = "true" ]; then review=(--review-dir "$RUNNER_TEMP/review"); fi
          cd scripts/merge-steward
          case "$EVENT" in
            pull_request_target)
              case "$ACTION" in
                labeled) python steward.py --pr "$PR_NUMBER" --event-sha "$HEAD_SHA" --wait 300 --labeled-sha "$HEAD_SHA" ;;
                unlabeled) python steward.py --pr "$PR_NUMBER" --event-sha "$HEAD_SHA" --wait 300 ;;
                *) python steward.py --pr "$PR_NUMBER" --event-sha "$HEAD_SHA" --wait 1200 --render-dir "$RUNNER_TEMP/render" "${review[@]}" ;;
              esac ;;
            workflow_dispatch)
              if [ "$DRY_RUN" = "true" ]; then
                python steward.py --pr "$PR_NUMBER" --dry-run
              else
                python steward.py --pr "$PR_NUMBER" --wait 600 "${review[@]}"
              fi ;;
            status) python steward.py --sha "$STATUS_SHA" --wait 300 ;;
            check_suite) python steward.py --sha "$CHECK_SHA" --wait 120 ;;
            schedule)
              if [ "$SCHEDULE" = "17 * * * *" ]; then
                python steward.py --sweep
              else
                python steward.py --sweep --missing-only
              fi ;;
          esac
