---
# Merge steward: posts the `merge-steward` check run (pass, needs-human, or in_progress
# while a release soaks) on every PR. Only Renovate PRs from this repository can pass;
# every other PR gets needs-human until a repository admin adds `steward/human-approved`.
# All verdicts come from deterministic rules in scripts/merge-steward/policy.yaml.
#
# The evaluate job runs on pull_request_target, status and schedule events, so both this
# file and the steward code come from the default branch. It never checks out or runs PR
# code: it reads PR data through the API only. It never merges anything.
name: "Merge Steward"

on:
  # Unit tests run the PR's own code, without secrets.
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Renovate flips renovate/stability-days when a soak ends.
  status:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to evaluate"
        required: true
        type: number

permissions: {}

env:
  # renovate: datasource=pypi depName=pyyaml
  PYYAML_VERSION: "6.0.3"
  # renovate: datasource=pypi depName=pytest
  PYTEST_VERSION: "9.0.2"

jobs:
  test:
    name: merge-steward tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}" "pytest==${PYTEST_VERSION}"
      - name: Unit tests (output kept for the secret-shape check)
        run: |
          set -o pipefail
          python -m pytest -q scripts/merge-steward/tests 2>&1 | tee pytest.log
      - name: No secret-shaped strings in test output
        run: |
          if grep -Eq 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY' pytest.log; then
            echo "::error::secret-shaped string in steward test output"
            exit 1
          fi

  evaluate:
    name: merge-steward evaluate
    # Events that can change the verdict: new code, the override label, the soak status,
    # the sweep, or a manual run.
    if: >-
      (github.event_name == 'pull_request_target' &&
        (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
         github.event.label.name == 'steward/human-approved')) ||
      (github.event_name == 'status' && github.event.context == 'renovate/stability-days') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: merge-steward-${{ github.event.pull_request.number || inputs.pr || github.event.sha || 'sweep' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    permissions:
      contents: read        # read changed manifests through the API
      pull-requests: write  # sticky comment and steward/* labels
      issues: write         # create the steward/* labels and read label events
      checks: read          # read check runs on the head commit
      statuses: read        # read renovate/stability-days and other commit statuses
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/merge-steward

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"

      # The check run is posted by the homebot-0 app so its source stays fixed for the
      # ruleset. The token can only write checks and expires within the hour.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_SHA: ${{ github.event.sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/merge-steward/steward.py ]; then
            echo "::notice::the steward code is not on the default branch yet; nothing to evaluate"
            exit 0
          fi
          cd scripts/merge-steward
          case "$EVENT" in
            pull_request_target)
              if [ "$ACTION" = "labeled" ]; then
                python steward.py --pr "$PR_NUMBER" --wait 300 --labeled-sha "$HEAD_SHA"
              else
                python steward.py --pr "$PR_NUMBER" --wait 1200
              fi ;;
            workflow_dispatch) python steward.py --pr "$PR_NUMBER" --wait 600 ;;
            status) python steward.py --sha "$STATUS_SHA" --wait 300 ;;
            schedule) python steward.py --sweep ;;
          esac
