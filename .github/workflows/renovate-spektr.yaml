---
name: Renovate Spektr

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: false
        required: false
        type: boolean
      logLevel:
        description: Log Level
        default: info
        required: false
        type: choice
        options:
          - info
          - debug
          - trace
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: renovate-spektr
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate Spektr
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: "${{ steps.app-token.outputs.token }}"
          persist-credentials: false

      - name: Override default config from dispatch variables
        shell: bash
        run: |
          echo "RENOVATE_DRY_RUN=${{ inputs.dryRun || 'false' }}" >> "${GITHUB_ENV}"
          echo "LOG_LEVEL=${{ inputs.logLevel || 'info' }}" >> "${GITHUB_ENV}"

      - name: Renovate
        uses: renovatebot/github-action@eaf12548c13069dcc28bb75c4ee4610cdbe400c5 # v44.2.6
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"ghcr.io","hostType":"docker","username":"jlengelbrecht","password":"${{ secrets.GHCR_READ_PAT }}"}]
        with:
          configurationFile: .github/renovate/spektr.json5
          renovate-version: 44.154.0
          token: "${{ steps.app-token.outputs.token }}"
