name: 1Password agent MCP image

on:
  pull_request:
    paths:
      - services/onepassword-agent-mcp/**
      - .github/workflows/onepassword-agent-mcp.yaml
  push:
    branches: [main]
    paths:
      - services/onepassword-agent-mcp/**
      - .github/workflows/onepassword-agent-mcp.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test the broker
        working-directory: services/onepassword-agent-mcp/tests
        run: python3 -m unittest -v test_access test_server
      - name: Build image
        run: >-
          docker build --build-arg VCS_REF="${GITHUB_SHA}"
          -t onepassword-agent-mcp:verification services/onepassword-agent-mcp
      - name: Smoke test packaged runtime
        run: bash services/onepassword-agent-mcp/smoke-test.sh onepassword-agent-mcp:verification

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: onepassword-agent-mcp-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.24.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image and smoke test its digest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/jlengelbrecht/onepassword-agent-mcp"
          docker buildx build --platform linux/amd64 --build-arg VCS_REF="${GITHUB_SHA}" \
            --provenance=false --sbom=false --metadata-file /tmp/onepassword-agent-mcp.json \
            --tag "${image}:sha-${GITHUB_SHA}" --push \
            services/onepassword-agent-mcp
          digest="$(jq -r '."containerimage.digest"' /tmp/onepassword-agent-mcp.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash services/onepassword-agent-mcp/smoke-test.sh "${image}@${digest}"
          echo "Verified \`${image}:sha-${GITHUB_SHA}@${digest}\`." >> "$GITHUB_STEP_SUMMARY"
