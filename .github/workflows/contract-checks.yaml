---
name: "Contract Checks"

# STORY-035-1b. Wires the committed agent-router contract guards into CI.
# STORY-035-12 adds verify-stamp-cases.sh, which builds agent-stamp-validate
# from services/agent-router/** and runs it against the committed
# examples/stamp/ fixtures - so the path filter now covers that source tree
# too, not just contracts/agent-router/**. Path filter covers everything the
# checks READ, not just where they live: a catalog-only edit (no contracts/
# change) must still trigger verify-digests.sh and verify-placement-cases.sh,
# and a services/agent-router/** edit (no contracts/ change) must still
# trigger verify-stamp-cases.sh.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "contracts/agent-router/**"
      - "kubernetes/apps/ai/agent-router-catalog/**"
      - "kubernetes/apps/ai/agentgateway-pilot/app/httproute.yaml"
      - "services/agent-router/**"
      - ".github/workflows/contract-checks.yaml"
  push:
    branches: ["main"]
    paths:
      - "contracts/agent-router/**"
      - "kubernetes/apps/ai/agent-router-catalog/**"
      - "kubernetes/apps/ai/agentgateway-pilot/app/httproute.yaml"
      - "services/agent-router/**"
      - ".github/workflows/contract-checks.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=pyyaml
  PYYAML_VERSION: "6.0.3"

jobs:
  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml==${{ env.PYYAML_VERSION }}

      # STORY-035-12: verify-stamp-cases.sh builds agent-stamp-validate from
      # services/agent-router before running it against fixtures.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version-file: services/agent-router/go.mod
          cache-dependency-path: services/agent-router/go.sum

      - name: verify-digests
        run: ./contracts/agent-router/verify-digests.sh

      - name: verify-placement-cases
        run: ./contracts/agent-router/verify-placement-cases.sh

      - name: verify-ade-boundary
        run: ./contracts/agent-router/verify-ade-boundary.sh

      - name: verify-stamp-cases
        run: ./contracts/agent-router/verify-stamp-cases.sh
