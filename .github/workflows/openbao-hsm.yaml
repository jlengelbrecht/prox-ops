name: OpenBao HSM image

on:
  pull_request:
    paths:
      - services/openbao-hsm/**
      - .github/workflows/openbao-hsm.yaml
  push:
    branches: [main]
    paths:
      - services/openbao-hsm/**
      - .github/workflows/openbao-hsm.yaml
  workflow_dispatch:
  # Weekly verify-only run: the exact Debian pins fail the build once trixie
  # replaces them, and that failure is the alert. Scheduled runs never publish.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  SMOKE_TEST: |
    bao version | grep -q "^OpenBao v"
    [ "$(id -u):$(id -g)" = "100:1000" ]
    sum=$(sha256sum /usr/lib/openbao/plugins/openbao-plugin-kms-pkcs11 | cut -d' ' -f1)
    grep -qx "  sha256sum = \"$sum\"" /etc/openbao/plugin-kms.hcl
    test -f /usr/lib/x86_64-linux-gnu/pkcs11/yubihsm_pkcs11.so
    test -f /usr/lib/x86_64-linux-gnu/libyubihsm_http.so.2
    if ldd /usr/lib/openbao/plugins/openbao-plugin-kms-pkcs11 | grep "not found"; then exit 1; fi
    if ldd /usr/lib/x86_64-linux-gnu/pkcs11/yubihsm_pkcs11.so | grep "not found"; then exit 1; fi
    /usr/local/bin/docker-entrypoint.sh bao version >/dev/null
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" -t openbao-hsm:verification services/openbao-hsm
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm openbao-hsm:verification sh -ec "$SMOKE_TEST"
      - name: Stop test (the chart's exact start command and preStop)
        run: |
          set -euo pipefail
          # The OpenBao chart 0.30.6 starts the server with this /bin/sh -ec
          # script and stops it with this preStop. bao must end up as PID 1 and
          # exit cleanly on the preStop's SIGTERM, not wait for SIGKILL.
          trap 'docker rm -f bao-stop-test >/dev/null 2>&1 || true' EXIT
          cfg=$(mktemp -d)
          printf '%s\n' 'listener "tcp" {' '  address = "127.0.0.1:8200"' '  tls_disable = true' '}' 'storage "inmem" {}' > "$cfg/extraconfig-from-values.hcl"
          chmod -R a+rX "$cfg"
          docker run -d --name bao-stop-test --read-only --tmpfs /tmp -v "$cfg:/openbao/config:ro" \
            openbao-hsm:verification /bin/sh -ec '
            cp /openbao/config/extraconfig-from-values.hcl /tmp/storageconfig.hcl;
            [ -n "${HOST_IP}" ] && sed -Ei "s|HOST_IP|${HOST_IP?}|g" /tmp/storageconfig.hcl;
            [ -n "${POD_IP}" ] && sed -Ei "s|POD_IP|${POD_IP?}|g" /tmp/storageconfig.hcl;
            /usr/local/bin/docker-entrypoint.sh bao server -config=/tmp/storageconfig.hcl'
          for _ in $(seq 1 30); do
            docker exec bao-stop-test sh -c 'BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1; [ $? -ne 1 ]' && break
            sleep 1
          done
          [ "$(docker exec bao-stop-test cat /proc/1/comm)" = "bao" ]
          docker exec bao-stop-test /bin/sh -c "sleep 1 && kill -SIGTERM \$(pidof bao)"
          rc=$(timeout 20 docker wait bao-stop-test)
          docker logs bao-stop-test 2>&1 | tail -n 5
          [ "$rc" = "0" ]

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: openbao-hsm-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.24.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --build-arg VCS_REF="${GITHUB_SHA}" \
            --provenance=false --sbom=false --metadata-file /tmp/openbao-hsm-image.json \
            --tag "ghcr.io/jlengelbrecht/openbao-hsm:sha-${GITHUB_SHA}" \
            --push services/openbao-hsm
      - name: Smoke test the pushed digest, then move main
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.digest"' /tmp/openbao-hsm-image.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # This build is separate from the verify job, so test what was pushed.
          docker run --rm "ghcr.io/jlengelbrecht/openbao-hsm@${digest}" sh -ec "$SMOKE_TEST"
          echo "Published ghcr.io/jlengelbrecht/openbao-hsm:sha-${GITHUB_SHA}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          # Move :main only to the tested digest, and only while the image's
          # files on main still match this commit, so an older run finishing
          # late can't win. Unrelated commits on main don't block it.
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- services/openbao-hsm .github/workflows/openbao-hsm.yaml; then
            echo "A newer change to the image is on main; leaving :main to its run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false --tag ghcr.io/jlengelbrecht/openbao-hsm:main \
            "ghcr.io/jlengelbrecht/openbao-hsm@${digest}"
          echo "Moved :main to ${digest}" >> "$GITHUB_STEP_SUMMARY"
