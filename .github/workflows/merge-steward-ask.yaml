---
# /ask: the repository owner asks a question about a PR in a comment, and the review model
# answers in a comment from the steward app. There is no webhook receiver: this is an
# ordinary issue_comment workflow, so it and the steward code come from the default branch.
#
# The comment text, the PR and the model's answer are all untrusted. The question is never
# put in a command: it is read from the event file by default-branch code. The job on the
# steward runner has a read-only token and the model key only; it checks out no PR code and
# can write nothing to GitHub. The answer leaves it as a filtered file, and the last job
# posts it with the steward app's token. Nothing here touches the merge-steward check or any
# verdict, and a refused comment simply skips the later jobs.
#
# Kept apart from merge-steward.yaml so a comment never creates a run of the verdict
# workflow. Reviews and asks share the one runner; an ask never cancels a review because it
# uses its own concurrency group, one per comment so that no question is dropped.
name: "Merge Steward Ask"

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  # renovate: datasource=pypi depName=pyyaml
  PYYAML_VERSION: "6.0.3"

jobs:
  # Decides, on a GitHub-hosted runner with no secret, whether this comment may reach the
  # steward runner at all. The job conditions are the cheap first cut; ask_job.py gate
  # repeats them from the event file and adds what needs the API (open, same repository,
  # not a fork, inside the review policy). The comment of a bot, including the steward's
  # own answer, never passes: author_association is OWNER only for the owner's own account.
  gate:
    name: merge-steward ask gate
    if: >-
      vars.MERGE_STEWARD_AI == 'true' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '/ask')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      comment: ${{ steps.gate.outputs.comment }}
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/merge-steward
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"
      - name: Check the comment and the PR
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/merge-steward/ask_job.py gate

  ask:
    name: merge-steward ask
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: gha-prox-ops-steward
    timeout-minutes: 20
    # The model key lives here, as for reviews, and not in merge-steward with the app key.
    environment: merge-steward-review
    concurrency:
      group: merge-steward-ask-${{ github.event.comment.id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-steward
            .github/actions/merge-steward-ask
      - uses: ./.github/actions/merge-steward-ask
        with:
          llm-key: ${{ secrets.MERGE_STEWARD_LLM_KEY }}

  publish:
    name: merge-steward ask answer
    needs: [gate, ask]
    if: needs.ask.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: merge-steward
    permissions:
      contents: read
      pull-requests: read  # the workflow token only reads; the app writes
    steps:
      - name: Checkout steward code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/merge-steward
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.STEWARD_APP_ID }}
          private-key: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Download the filtered answer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-steward-ask
          path: ${{ runner.temp }}/ask
      - name: Post the answer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/merge-steward/ask_job.py publish --out "$RUNNER_TEMP/ask"
