---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Flux Local Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
      workflow_changed: ${{ steps.workflow-changed.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

      # Only the flate trial reads this, so a change to this file can be tried
      # on its own pull request.
      - name: Get Workflow Changes
        id: workflow-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: .github/workflows/flux-local.yaml

  nyctr-release-match:
    name: Nyctr Release Match
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Detect Nyctr release changes
        id: nyctr-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            kubernetes/apps/security/nyctr/app/helmrelease.yaml
            kubernetes/apps/security/nyctr/app/ocirepository.yaml
            scripts/check_nyctr_release.py
            tests/nyctr/**
            .github/workflows/flux-local.yaml
      - name: Test the release guard
        run: python -m unittest discover -s tests/nyctr -p 'test*.py'
      - name: Check chart and pinned image release
        run: python scripts/check_nyctr_release.py
      - name: Verify published image digest
        if: ${{ steps.nyctr-changes.outputs.any_changed == 'true' }}
        run: python scripts/check_nyctr_release.py --verify-digest

  test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          # homelab-identity is a private repo, so its Kustomizations build
          # against empty stubs here. Listing sources drops any Git source
          # that isn't named, so flagger-pilot (this repo) is listed too.
          args: >-
            test --enable-helm --all-namespaces
            --sources "flux-system,flagger-pilot,homelab-identity=tests/flux-local/homelab-identity"
            --path /github/workspace/kubernetes/flux/cluster -v

  diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Run flux-local diff
        # continue-on-error due to flux-local bug #986 with spec.template string fields
        continue-on-error: true
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system,homelab-identity=tests/flux-local/homelab-identity"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          if [ -f diff.patch ]; then
            cat diff.patch;
            {
                echo 'diff<<EOF'
                cat diff.patch
                echo EOF
            } >> "$GITHUB_OUTPUT";
            {
                echo "### Diff"
                echo '```diff'
                cat diff.patch
                echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No diff.patch generated (flux-local may have encountered an error)"
            echo "### Diff" >> "$GITHUB_STEP_SUMMARY"
            echo "No diff generated - see workflow logs for details" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate GitHub App Token
        if: ${{ steps.diff.outputs.diff != '' }}
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          repo-token: ${{ steps.generate-token.outputs.token }}
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  # flux-local is deprecated upstream in favour of flate. This job runs flate next to
  # it so the two can be compared on real pull requests before anything is swapped.
  # It is informational: Flux Local Success does not depend on it, and a flate
  # failure is reported in the job summary without failing the job.
  flate-trial:
    name: Flate Trial
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    if: ${{ needs.pre-job.outputs.any_changed == 'true' || needs.pre-job.outputs.workflow_changed == 'true' }}
    env:
      # renovate: datasource=docker depName=ghcr.io/home-operations/flate
      FLATE_VERSION: "0.7.3@sha256:a68959461e12234f030adf3a8c51b50af419326dd4ca35ad35048ad01005fedd"
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container gets no token, a read-only checkout and no capabilities.
      # The private homelab-identity source has no credentials here, so
      # --allow-missing-kinds lets flate skip it and say so in its warnings.
      - name: Run flate test and diff
        run: |
          set -u
          out="$RUNNER_TEMP/flate"
          mkdir -p "$out"
          flate() {
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
              --tmpfs /tmp:exec,mode=1777 \
              -v "$PWD:/github/workspace:ro" -w /github/workspace \
              "ghcr.io/home-operations/flate:${FLATE_VERSION}" "$@"
          }
          common=(--path kubernetes/flux/cluster --no-progress
            --allow-missing-kinds Secret,CustomResourceDefinition)

          start=$SECONDS
          test_rc=0
          flate test "${common[@]}" > "$out/test.out" 2> "$out/test.err" || test_rc=$?
          test_secs=$((SECONDS - start))

          start=$SECONDS
          diff_rc=0
          flate diff "${common[@]}" --base "origin/${BASE_REF}" -o github \
            > "$out/diff.out" 2> "$out/diff.err" || diff_rc=$?
          diff_secs=$((SECONDS - start))

          fence='```'
          {
            echo "## Flate trial"
            echo
            echo "| Command | Exit code | Seconds |"
            echo "| --- | --- | --- |"
            echo "| flate test | $test_rc | $test_secs |"
            echo "| flate diff | $diff_rc | $diff_secs |"
            for name in test diff; do
              echo
              echo "### flate $name: output (last 150 lines)"
              echo
              echo "$fence"
              tail -n 150 "$out/$name.out" | cut -c1-400
              echo "$fence"
              echo
              echo "### flate $name: messages (last 80 lines)"
              echo
              echo "$fence"
              tail -n 80 "$out/$name.err" | cut -c1-400
              echo "$fence"
            done
          } > "$out/summary.md" || true
          head -c 900000 "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "flate test exit $test_rc in ${test_secs}s, flate diff exit $diff_rc in ${diff_secs}s"

  flux-local-status:
    name: Flux Local Success
    needs: ["pre-job", "test", "diff", "nyctr-release-match"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      # This aggregate is already required by the main-branch ruleset.
      # Missing, skipped or cancelled release checks must never count as green.
      - name: Required release guard passed?
        if: ${{ needs.nyctr-release-match.result != 'success' || needs.pre-job.result != 'success' }}
        run: exit 1

      # Check the test job - diff jobs are informational
      - name: Required Flux test passed?
        if: ${{ needs.test.result == 'failure' || (needs.pre-job.outputs.any_changed == 'true' && needs.test.result != 'success') }}
        run: exit 1

      - name: All critical jobs passed or intentionally skipped?
        run: echo "All jobs passed or skipped" && echo "test=${{ needs.test.result }}, diff=${{ needs.diff.result }}"
