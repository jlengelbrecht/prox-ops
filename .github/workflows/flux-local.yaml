---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Flux Local Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            kubernetes/**
            .github/workflows/flux-local.yaml
            scripts/ci/**
            tests/ci/**

  test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install YAML parser
        run: python3 -m pip install --user PyYAML==6.0.3

      - name: Test release download helper
        run: python3 -m unittest discover -s tests/ci -p 'test_release_download*.py' -q

      - name: Materialize pinned release manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_download.py flux --root .

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          # homelab-identity is a private repo, so its Kustomizations build
          # against empty stubs here. Listing sources drops any Git source
          # that isn't named, so flagger-pilot (this repo) is listed too.
          args: >-
            test --enable-helm --all-namespaces
            --sources "flux-system,flagger-pilot,homelab-identity=tests/flux-local/homelab-identity"
            --path /github/workspace/kubernetes/flux/cluster -v

  diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Install YAML parser
        run: python3 -m pip install --user PyYAML==6.0.3

      - name: Materialize pinned release manifests in both trees
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 pull/scripts/ci/release_download.py flux --root pull
          python3 pull/scripts/ci/release_download.py flux --root default

      - name: Run flux-local diff
        # continue-on-error due to flux-local bug #986 with spec.template string fields
        continue-on-error: true
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system,homelab-identity=tests/flux-local/homelab-identity"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          if [ -f diff.patch ]; then
            cat diff.patch;
            {
                echo 'diff<<EOF'
                cat diff.patch
                echo EOF
            } >> "$GITHUB_OUTPUT";
            {
                echo "### Diff"
                echo '```diff'
                cat diff.patch
                echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No diff.patch generated (flux-local may have encountered an error)"
            echo "### Diff" >> "$GITHUB_STEP_SUMMARY"
            echo "No diff generated - see workflow logs for details" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate GitHub App Token
        if: ${{ steps.diff.outputs.diff != '' }}
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          repo-token: ${{ steps.generate-token.outputs.token }}
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flux-local-status:
    name: Flux Local Success
    needs: ["pre-job", "test", "diff"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      # The diff job is informational. Only a successful pre-job may skip test
      # when changed-files explicitly reports no relevant changes.
      - name: Require expected test outcome
        env:
          PRE_JOB_RESULT: ${{ needs.pre-job.result }}
          ANY_CHANGED: ${{ needs.pre-job.outputs.any_changed }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$PRE_JOB_RESULT" = success || exit 1
          case "$ANY_CHANGED" in
            true) test "$TEST_RESULT" = success ;;
            false) test "$TEST_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
