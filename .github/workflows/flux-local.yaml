---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  # flate renders the cluster for the test and diff jobs. It replaced flux-local,
  # which is deprecated upstream.
  # renovate: datasource=docker depName=ghcr.io/home-operations/flate
  FLATE_VERSION: "0.7.3@sha256:a68959461e12234f030adf3a8c51b50af419326dd4ca35ad35048ad01005fedd"

jobs:
  pre-job:
    name: Flux Local Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The render also reruns when its own inputs change: this workflow and the
      # reference objects handed to flate.
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            kubernetes/**
            tests/flate/**
            .github/workflows/flux-local.yaml

  nyctr-release-match:
    name: Nyctr Release Match
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Detect Nyctr release changes
        id: nyctr-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            kubernetes/apps/security/nyctr/app/helmrelease.yaml
            kubernetes/apps/security/nyctr/app/ocirepository.yaml
            scripts/check_nyctr_release.py
            tests/nyctr/**
            .github/workflows/flux-local.yaml
      - name: Test the release guard
        run: python -m unittest discover -s tests/nyctr -p 'test*.py'
      - name: Check chart and pinned image release
        run: python scripts/check_nyctr_release.py
      - name: Verify published image digest
        if: ${{ steps.nyctr-changes.outputs.any_changed == 'true' }}
        run: python scripts/check_nyctr_release.py --verify-digest

  test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The container gets no token, a read-only checkout and no capabilities.
      # Sources that need credentials (the private homelab-identity repository and
      # the agent-router-base chart) are skipped and listed as skipped.
      # tests/flate/supply.yaml stands in for objects that only exist in the cluster.
      - name: Run flate test
        run: |
          set -u
          out="$RUNNER_TEMP/flate"
          mkdir -p "$out"
          rc=0
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
            --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD:/github/workspace:ro" -w /github/workspace \
            "ghcr.io/home-operations/flate:${FLATE_VERSION}" \
            test --path kubernetes/flux/cluster --no-progress \
            --supply tests/flate/supply.yaml \
            --allow-missing-kinds Secret,CustomResourceDefinition \
            > "$out/test.out" 2> "$out/test.err" || rc=$?

          # The output is built from pull request content, so print it with
          # workflow commands switched off.
          stop="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::$stop"
          cat "$out/test.out"
          tail -n 200 "$out/test.err"
          echo "::$stop::"

          fence='```'
          {
            echo "## flate test (exit $rc)"
            echo
            echo "$fence"
            grep -v '✓' "$out/test.out" | tail -n 150 | cut -c1-400
            echo "$fence"
            echo
            echo "### Messages (last 80 lines)"
            echo
            echo "$fence"
            tail -n 80 "$out/test.err" | cut -c1-400
            echo "$fence"
          } > "$out/summary.md" || true
          head -c 900000 "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The diff is given the cluster entry directory, the same path the test uses.
      # Given the whole kubernetes tree or the repository root, flate reads the app
      # Kustomizations without the namespace their parent assigns, and reports
      # dependencies in other namespaces as missing.
      # flate diff renders only what it decides a change reaches. With this path it
      # can show nothing for a change to a Flux Kustomization object alone, so an
      # empty diff is not proof that nothing changed. The job is informational: a
      # render problem is reported in the comment and the summary, and the test job
      # is what fails the check.
      - name: Run flate diff
        id: diff
        run: |
          set -u
          out="$RUNNER_TEMP/flate"
          mkdir -p "$out"
          rc=0
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
            --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD:/github/workspace:ro" -w /github/workspace \
            "ghcr.io/home-operations/flate:${FLATE_VERSION}" \
            diff --path kubernetes/flux/cluster --base "origin/${BASE_REF}" -o github --no-progress \
            --supply tests/flate/supply.yaml \
            --allow-missing-kinds Secret,CustomResourceDefinition \
            > "$out/diff.out" 2> "$out/diff.err" || rc=$?
          echo "flate diff exit $rc, $(wc -c < "$out/diff.out") bytes"

          # A pull request comment holds 65536 characters.
          limit=55000
          head -c "$limit" "$out/diff.out" > "$out/comment.diff"
          if [ "$(wc -c < "$out/diff.out")" -gt "$limit" ]; then
            printf '\n\n! Diff cut at %s bytes. The job summary has more.\n' "$limit" >> "$out/comment.diff"
          fi
          if [ "$rc" -ne 0 ]; then
            {
              echo
              echo "! flate diff exited $rc. Its messages:"
              grep -E '✗|DiffSuppressed' "$out/diff.err" | head -n 20 | cut -c1-300 | sed 's/^/! /'
            } >> "$out/comment.diff"
          fi

          if [ -s "$out/comment.diff" ]; then
            delim="diff_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            {
              echo "diff<<$delim"
              cat "$out/comment.diff"
              echo
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          fi

          fence='```'
          {
            echo "## flate diff (exit $rc)"
            echo
            if [ -s "$out/diff.out" ]; then
              echo "${fence}diff"
              head -c 800000 "$out/diff.out"
              echo
              echo "$fence"
            else
              echo "No rendered changes."
            fi
            echo
            echo "### Messages (last 80 lines)"
            echo
            echo "$fence"
            tail -n 80 "$out/diff.err" | cut -c1-400
            echo "$fence"
          } > "$out/summary.md" || true
          head -c 900000 "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub App Token
        if: ${{ steps.diff.outputs.diff != '' }}
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          repo-token: ${{ steps.generate-token.outputs.token }}
          message-id: "${{ github.event.pull_request.number }}/kubernetes/flate"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flux-local-status:
    name: Flux Local Success
    needs: ["pre-job", "test", "diff", "nyctr-release-match"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      # This aggregate is already required by the main-branch ruleset.
      # Missing, skipped or cancelled release checks must never count as green.
      - name: Required release guard passed?
        if: ${{ needs.nyctr-release-match.result != 'success' || needs.pre-job.result != 'success' }}
        run: exit 1

      # Check the test job - diff jobs are informational
      - name: Required Flux test passed?
        if: ${{ needs.test.result == 'failure' || (needs.pre-job.outputs.any_changed == 'true' && needs.test.result != 'success') }}
        run: exit 1

      - name: All critical jobs passed or intentionally skipped?
        run: echo "All jobs passed or skipped" && echo "test=${{ needs.test.result }}, diff=${{ needs.diff.result }}"
