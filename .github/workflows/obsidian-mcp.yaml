name: Obsidian MCP image

on:
  pull_request:
    paths:
      - services/obsidian-mcp/**
      - .github/workflows/obsidian-mcp.yaml
  push:
    branches: [main]
    paths:
      - services/obsidian-mcp/**
      - .github/workflows/obsidian-mcp.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test HTTP contract
        run: python3 services/obsidian-mcp/tests/verify_requirements.py
      - name: Build packaged runtime
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" -t obsidian-mcp:verification services/obsidian-mcp
      - name: Smoke test authenticated packaged runtime
        run: python3 services/obsidian-mcp/tests/verify_requirements.py --image obsidian-mcp:verification

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: obsidian-mcp-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.24.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build digest-only candidate and verify publication policy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/jlengelbrecht/obsidian-mcp"
          docker buildx build --platform linux/amd64 --build-arg VCS_REF="${GITHUB_SHA}" \
            --provenance=false --sbom=false --metadata-file /tmp/obsidian-mcp-image.json \
            --output "type=image,name=${image},push=true,push-by-digest=true,name-canonical=true" \
            services/obsidian-mcp
          python services/obsidian-mcp/publish_image.py \
            --metadata /tmp/obsidian-mcp-image.json --image "$image"
