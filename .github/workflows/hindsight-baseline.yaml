name: Hindsight baseline fixture
on:
  pull_request:
    branches: [main]
    paths:
      - tests/hindsight-observability/check_postgres_newest.py
      - .github/workflows/hindsight-baseline.yaml
      - scripts/hindsight-timing-baseline.py
      - tests/hindsight-observability/test_timing_baseline.py
      - scripts/hindsight-queue-backlog.py
      - tests/hindsight-observability/test_queue_backlog.py
      - tests/hindsight-observability/check_postgres_queue_backlog.py
      - scripts/hindsight-backlog-function.py
      - kubernetes/apps/database/hindsight-backlog/app/runnable-backlog.sql
      - tests/hindsight-observability/test_backlog_function.py
      - tests/hindsight-observability/check_postgres_backlog_function.py
      - kubernetes/apps/database/hindsight-backlog/db-acl/db-acl.sql
      - tests/hindsight-observability/test_backlog_db_acl.py
      - tests/hindsight-observability/check_postgres_backlog_hardening.py
      - kubernetes/apps/database/hindsight-backlog/ks.yaml
      - kubernetes/apps/database/hindsight-backlog/db-acl/kustomization.yaml
      - kubernetes/apps/database/hindsight-backlog/db-acl/job.yaml
      - kubernetes/apps/database/hindsight-backlog/db-acl/networkpolicy.yaml
      - kubernetes/apps/database/hindsight-backlog/role-limits/role-limits.sql
      - kubernetes/apps/database/hindsight-backlog/role-limits/kustomization.yaml
      - kubernetes/apps/database/hindsight-backlog/role-limits/job.yaml
      - kubernetes/apps/database/hindsight-backlog/role-limits/networkpolicy.yaml
      - tests/hindsight-observability/test_backlog_role_limits.py
      - tests/hindsight-observability/check_postgres_backlog_role_limits.py
      - kubernetes/apps/database/hindsight-backlog/app/kustomization.yaml
      - kubernetes/apps/database/hindsight-backlog/app/job.yaml
      - kubernetes/apps/database/hindsight-backlog/app/networkpolicy.yaml
      - tests/hindsight-observability/test_backlog_function_activation.py
      - tests/hindsight-observability/check_postgres_backlog_function_activation.py
      - kubernetes/apps/database/hindsight-backlog/collector/collector.py
      - kubernetes/apps/database/hindsight-backlog/collector/runtime.py
      - tests/hindsight-observability/test_backlog_collector.py
      - tests/hindsight-observability/test_backlog_collector_runtime.py
      - kubernetes/apps/database/hindsight-backlog/kustomization.yaml
      - kubernetes/apps/database/hindsight-backlog/collector.ks.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-qualification/kustomization.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-qualification/job.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-qualification/networkpolicy.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-runtime/kustomization.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-runtime/deployment.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-runtime/service.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-runtime/servicemonitor.yaml
      - kubernetes/apps/database/hindsight-backlog/collector-runtime/networkpolicy.yaml
      - tests/hindsight-observability/test_backlog_collector_deployment.py
      - kubernetes/apps/database/kustomization.yaml
      # The revoke's role roster and the Job's egress are checked against these.
      - kubernetes/apps/database/cluster/app/helmrelease.yaml
      - kubernetes/apps/database/cluster/app/networkpolicy.yaml
      # The function is qualified for this pinned API image; a bump must re-run --check.
      - kubernetes/apps/ai/hermes-hindsight/app/hindsight.yaml
      # The CODEX_HOME placement Job, checked against the release and claim above and below.
      - kubernetes/apps/ai/hermes-hindsight/storage/pvc.yaml
      - kubernetes/apps/ai/kustomization.yaml
      - kubernetes/apps/ai/hermes-hindsight/auth-placement.ks.yaml
      - kubernetes/apps/ai/hermes-hindsight/auth-placement/kustomization.yaml
      - kubernetes/apps/ai/hermes-hindsight/auth-placement/job.yaml
      - kubernetes/apps/ai/hermes-hindsight/auth-placement/networkpolicy.yaml
      - tests/hindsight-observability/test_auth_placement.py
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # test_backlog_db_acl.py parses the kustomize render of the activation tree.
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests/hindsight-observability -p test_timing_baseline.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_queue_backlog.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_function.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_db_acl.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_role_limits.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_function_activation.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_collector.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_collector_runtime.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_backlog_collector_deployment.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_auth_placement.py -v
      # The collector's own interpreter: Python 3.9 in the pinned CloudNativePG image, offline, read-only and as
      # UID 26, with only the two sources and their two test files mounted. Zero tests or any skip fails the step.
      - name: Native Python 3.9 collector tests
        if: matrix.python-version == '3.12'
        timeout-minutes: 6
        env:
          IMAGE: ghcr.io/cloudnative-pg/postgresql@sha256:368c1a13935ff8850d76cfb427d5c29877a74de0531e198a7a683d4cfb97260b
          NAME: hindsight-collector-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/collector-native.log"' EXIT
          docker pull -q "$IMAGE" >/dev/null
          src=kubernetes/apps/database/hindsight-backlog/collector
          tests=tests/hindsight-observability
          log="$RUNNER_TEMP/collector-native.log"
          for suite in test_backlog_collector.py test_backlog_collector_runtime.py; do
            timeout 120 docker run --rm --name "$NAME" --network none --user 26:26 --read-only \
              --tmpfs /tmp:rw,size=16m --entrypoint python3 \
              -v "$PWD/$src/collector.py:/src/$src/collector.py:ro" \
              -v "$PWD/$src/runtime.py:/src/$src/runtime.py:ro" \
              -v "$PWD/$tests/test_backlog_collector.py:/src/$tests/test_backlog_collector.py:ro" \
              -v "$PWD/$tests/test_backlog_collector_runtime.py:/src/$tests/test_backlog_collector_runtime.py:ro" \
              "$IMAGE" -I -S -m unittest discover -s "/src/$tests" -p "$suite" -v >"$log" 2>&1 \
              || { tail -n 30 "$log"; exit 1; }
            tail -n 3 "$log"
            grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log"
            if grep -q 'skipped=' "$log"; then exit 1; fi
          done
      - run: python scripts/hindsight-backlog-function.py --check kubernetes/apps/database/hindsight-backlog/app/runnable-backlog.sql
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python tests/hindsight-observability/check_postgres_newest.py
      - run: python tests/hindsight-observability/check_postgres_queue_backlog.py
      - run: python tests/hindsight-observability/check_postgres_backlog_function.py
        env:
          HINDSIGHT_BACKLOG_FIXTURE: '1'
      # Service containers take no server flags, and turning ssl on in the shared
      # service would move the checkers above to TLS, so the TLS proof gets its own
      # throwaway server. The key and certificate are generated here, live one day
      # and are never committed or printed.
      - name: Start TLS PostgreSQL fixture
        run: |
          tls="$RUNNER_TEMP/hindsight-tls"
          mkdir -m 700 "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$tls/server.key" -out "$tls/server.crt"
          chmod 600 "$tls/server.key"
          # The server refuses a key not owned by its user; 999 is postgres in the official image.
          sudo chown -R 999:999 "$tls"
          docker run -d --name hindsight-tls-fixture -p 127.0.0.1:5433:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -v "$tls:/tls:ro" \
            postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36 \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          # The image's init server listens only on its Unix socket, so probing TCP
          # inside the container answers only once the final TLS server is up.
          for _ in $(seq 30); do
            docker exec hindsight-tls-fixture pg_isready -q -h 127.0.0.1 -p 5432 -U postgres && exit 0
            sleep 2
          done
          docker logs --tail 20 hindsight-tls-fixture
          exit 1
      - run: python tests/hindsight-observability/check_postgres_backlog_hardening.py
        env:
          HINDSIGHT_BACKLOG_FIXTURE: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5433'
      - run: python tests/hindsight-observability/check_postgres_backlog_role_limits.py
        env:
          HINDSIGHT_BACKLOG_FIXTURE: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5433'
      # The function apply is proven over verify-full, so the runner needs the
      # fixture's public certificate; its key stays in the fixture directory.
      - run: |
          docker exec hindsight-tls-fixture cat /tls/server.crt > "$PGSSLROOTCERT"
          python tests/hindsight-observability/check_postgres_backlog_function_activation.py
        env:
          HINDSIGHT_BACKLOG_FIXTURE: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5433'
          PGSSLROOTCERT: ${{ runner.temp }}/hindsight-fixture-ca.crt
      - name: Remove TLS PostgreSQL fixture
        if: always()
        run: |
          docker rm -f -v hindsight-tls-fixture || true
          sudo rm -rf "$RUNNER_TEMP/hindsight-tls"
