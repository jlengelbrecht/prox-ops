name: Hindsight protected evidence fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/hindsight-source-counts.py
      - tests/hindsight-observability/test_source_counts.py
      - .github/workflows/hindsight-evidence.yaml
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/hindsight-observability -p test_source_counts.py -v
