---
# netboot.xyz contract tests, with the Renovate managers run through the pinned
# engine (NETBOOT_REQUIRE_RENOVATE=1: a missing engine fails, never skips).
# Path-filtered, so not required; the required talos-version-drift.yaml check
# enforces the PXE Talos version copy.
name: "Netboot Tests"

on:
  pull_request:
    paths:
      - kubernetes/apps/network/netbootxyz/**
      - scripts/netboot/**
      - scripts/check-talos-versions.sh
      - tests/netboot/**
      - talos/topf.yaml
      - .github/renovate.json5
      - .github/renovate/**
      - .github/workflows/netboot-tests.yaml

permissions: {}

env:
  # renovate: datasource=pypi depName=pyyaml
  PYYAML_VERSION: "6.0.3"
  # Must equal RENOVATE_VERSION in tests/netboot/test_renovate.py.
  RENOVATE_VERSION: "44.154.0"

jobs:
  test:
    name: netboot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: python -m pip install "PyYAML==${PYYAML_VERSION}"
      - name: Pinned Renovate engine
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          npm install --prefix "$work" --no-save --ignore-scripts --package-lock=false "renovate@${RENOVATE_VERSION}"
          echo "RENOVATE_MODULE_DIR=$work/node_modules/renovate" >> "$GITHUB_ENV"
      - name: Netboot tests
        env:
          NETBOOT_REQUIRE_RENOVATE: "1"
        run: python -m unittest discover -s tests/netboot -p 'test_*.py' -v
