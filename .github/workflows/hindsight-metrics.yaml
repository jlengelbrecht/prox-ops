name: Hindsight metrics fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/hindsight-metrics-ci-assets.py
      - .github/workflows/hindsight-metrics.yaml
      - tests/hindsight-observability/test_manifests.py
      - tests/hindsight-observability/run_promtool_fixtures.py
      - tests/hindsight-observability/test_promtool_assets.py
      - .github/renovate/customManagers.json5
      - kubernetes/apps/ai/hermes-hindsight/app/**
      - kubernetes/apps/observability/kube-prometheus-stack/app/alerts/kustomization.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/helmrelease.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/dashboards/kustomization.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/alerts/hindsight-alerts.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/dashboards/hindsight-dashboard.yaml
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      # Renovate updates the version and archive digest as one pair.
      # renovate: datasource=github-release-attachments depName=prometheus/prometheus
      PROMETHEUS_VERSION: "v3.15.0"
      PROMETHEUS_ARCHIVE_SHA256: "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Pinned native tools and chart
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          mkdir -m 700 "$work/bin"
          curl -fsSL -o "$work/helm.tar.gz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          [[ "$PROMETHEUS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl -fsSL -o "$work/prometheus.tar.gz" "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION#v}.linux-amd64.tar.gz"
          HINDSIGHT_HELM="$work/bin/helm" # chart pull happens after archive verification
          # Verify tool archives first, then fetch and verify the pinned chart.
          python scripts/hindsight-metrics-ci-assets.py "$work/helm.tar.gz" "$work/prometheus.tar.gz" "$work/bin" \
            "$PROMETHEUS_VERSION" "$PROMETHEUS_ARCHIVE_SHA256"
          "$HINDSIGHT_HELM" pull oci://ghcr.io/vectorize-io/charts/hindsight --version 0.9.2 --destination "$work"
          echo "c8a7eb0a27bcc38463a144bea9716897c1cce281ba98d49838f449e75098e257  $work/hindsight-0.9.2.tgz" | sha256sum -c
          echo "HINDSIGHT_HELM=$work/bin/helm" >> "$GITHUB_ENV"
          echo "HINDSIGHT_CHART=$work/hindsight-0.9.2.tgz" >> "$GITHUB_ENV"
          echo "PROMTOOL_BIN=$work/bin/promtool" >> "$GITHUB_ENV"
          echo "PROMETHEUS_ARCHIVE=$work/prometheus.tar.gz" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests/hindsight-observability -p test_manifests.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_promtool_assets.py -v
      - run: python tests/hindsight-observability/run_promtool_fixtures.py
