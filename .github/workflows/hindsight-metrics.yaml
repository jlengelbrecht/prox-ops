name: Hindsight metrics fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/hindsight-metrics-ci-assets.py
      - .github/workflows/hindsight-metrics.yaml
      - tests/hindsight-observability/test_manifests.py
      - tests/hindsight-observability/test_worker_topology.py
      - tests/hindsight-observability/run_promtool_fixtures.py
      - tests/hindsight-observability/test_promtool_assets.py
      - tests/hindsight/qualify-renovate.mjs
      - .github/renovate.json5
      - .github/renovate/customManagers.json5
      - .github/renovate/**
      - kubernetes/apps/ai/hermes-hindsight/app/**
      - kubernetes/apps/observability/kube-prometheus-stack/app/alerts/kustomization.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/helmrelease.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/dashboards/kustomization.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/alerts/hindsight-alerts.yaml
      - kubernetes/apps/observability/kube-prometheus-stack/app/dashboards/hindsight-dashboard.yaml
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      # Renovate updates the version and archive digest as one pair.
      # renovate: datasource=github-release-attachments depName=prometheus/prometheus
      PROMETHEUS_VERSION: "v3.15.1"
      PROMETHEUS_ARCHIVE_SHA256: "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - run: python -m pip install PyYAML==6.0.3
      - name: Pinned native tools and OCI chart
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          mkdir -m 700 "$work/bin"
          curl -fsSL -o "$work/helm.tar.gz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSL -o "$work/kustomize.tar.gz" https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          echo "ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8  $work/kustomize.tar.gz" | sha256sum -c
          tar -xzf "$work/kustomize.tar.gz" -C "$work/bin" kustomize
          [[ "$PROMETHEUS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl -fsSL -o "$work/prometheus.tar.gz" "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION#v}.linux-amd64.tar.gz"
          # Verify tool archives first, then fetch and verify the pinned chart.
          python scripts/hindsight-metrics-ci-assets.py "$work/helm.tar.gz" "$work/prometheus.tar.gz" "$work/bin" \
            "$PROMETHEUS_VERSION" "$PROMETHEUS_ARCHIVE_SHA256"
          CHART_VERSION=$(python -c 'import pathlib, yaml; release=next(yaml.safe_load_all(pathlib.Path("kubernetes/apps/ai/hermes-hindsight/app/hindsight.yaml").read_text())); print(release["spec"]["chart"]["spec"]["version"])')
          [[ "$CHART_VERSION" == "1.2.1" ]] # A version bump needs a reviewed archive checksum and render qualification.
          CHART_REPO=$(python -c 'import pathlib, yaml; app=pathlib.Path("kubernetes/apps/ai/hermes-hindsight/app"); release=next(yaml.safe_load_all((app/"hindsight.yaml").read_text())); ref=release["spec"]["chart"]["spec"]["sourceRef"]; matches=[s for s in yaml.safe_load_all((app/"sources.yaml").read_text()) if s and s.get("kind")==ref["kind"] and s["metadata"]["name"]==ref["name"] and s["metadata"]["namespace"]==ref["namespace"]]; assert len(matches)==1 and matches[0]["spec"]["type"]=="oci"; print(matches[0]["spec"]["url"])')
          [[ "$CHART_REPO" == "oci://ghcr.io/vectorize-io/charts" ]]
          "$work/bin/helm" pull "$CHART_REPO/hindsight" --version "$CHART_VERSION" --destination "$work"
          echo "967438cfbc5e3737da176cb33d52840268add6c84c2039c12513f3597748ecca  $work/hindsight-$CHART_VERSION.tgz" | sha256sum -c
          "$work/bin/helm" show chart "$work/hindsight-$CHART_VERSION.tgz" | python -c 'import sys, yaml; chart=yaml.safe_load(sys.stdin); assert (chart["name"], chart["version"]) == ("hindsight", sys.argv[1])' "$CHART_VERSION"
          echo "$work/bin" >> "$GITHUB_PATH"
          echo "HINDSIGHT_HELM=$work/bin/helm" >> "$GITHUB_ENV"
          echo "HINDSIGHT_CHART=$work/hindsight-$CHART_VERSION.tgz" >> "$GITHUB_ENV"
          echo "PROMTOOL_BIN=$work/bin/promtool" >> "$GITHUB_ENV"
          echo "PROMETHEUS_ARCHIVE=$work/prometheus.tar.gz" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests/hindsight-observability -p test_manifests.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_worker_topology.py -v
      - run: python -m unittest discover -s tests/hindsight-observability -p test_promtool_assets.py -v
      - run: python tests/hindsight-observability/run_promtool_fixtures.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Flux Renovate grouping qualification
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          npm install --prefix "$work" --no-save --ignore-scripts --package-lock=false renovate@44.199.0
          HINDSIGHT_RENOVATE_ROOT="$work/node_modules/renovate" node tests/hindsight/qualify-renovate.mjs
