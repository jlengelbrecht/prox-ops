# Seeded fixture: base.yaml with ONE edit.
#   placements.thor-5090  declared, status: planned, but SELECTABLE: TRUE
# Expected: neutral in both directions - forward the entry is added, in reverse
# the very same entry is removed, and neither moves authority.
#
# This is the case that pins `status` as a gate on the ENTRY rule, not only on
# the leaf rule. declaration-only-new.yaml declares an entry that is refused by
# two gates at once (status: planned AND selectable: false), so it would still
# come back neutral even if the entry rule looked at `selectable` alone. Here
# `selectable: true` says yes and `status: planned` says no, and the entry is
# non-admitting because an entry admits only when EVERY gate it declares says
# yes. A gate that counts only when the other gates already agree with it is
# not a gate, and `status` is documented as one.
#
# The shape is a real one: hardware is named and wired into the catalog with
# `selectable` already set the way it will be run, gated behind a status the
# operator flips when the box is actually up. The flip is the atom that carries
# the authority (status-withdraw-new.yaml pins it, in both directions); naming
# the placement carries none. Nothing else in the document references thor-5090
# - no model is placed on it, no policy prefers it - so the entry atom is the
# only atom this fixture produces.
version: "1.3.0"
schema_version: 1
updated: "2026-08-21"
consumers: []

defaults:
  placement_policy: prefer-warm-local

harnesses:
  claude:
    description: Claude Code sessions on the operator's own subscription.
    supported: true
    selectable: true

placements:
  kserve-a5000:
    description: KServe InferenceServices on the cluster's RTX A5000 node.
    status: available
    selectable: true
    kind: kserve
    gpu:
      vendor: nvidia
      model: RTX A5000
    capacity:
      vram_gb: 24
      vram_gb_nameplate: 24
      source: measured
    preemptible: false
    cold_start_s_estimate: 150
  cachyos-7900xtx:
    description: LAN edge worker on the operator's CachyOS workstation.
    status: available
    selectable: true
    kind: edge
    capacity:
      vram_gb: null
      vram_gb_nameplate: 24
      source: unmeasured
    preemptible: true
    cold_start_s_estimate: 6
  thor-5090:
    description: Planned KServe node on Thor; the card is on order.
    status: planned
    selectable: true
    kind: kserve
    gpu:
      vendor: nvidia
      model: RTX 5090
    capacity:
      vram_gb: null
      vram_gb_nameplate: 32
      source: unmeasured
    preemptible: false
    cold_start_s_estimate: null
    blocked_by:
      - hardware installed and measured against the placement contract

models:
  qwen36-27b:
    description: Qwen3.6-27B, the reference local model for EPIC-035.
    hosting: local
    upstream_model_id: qwen3.6-27b
    placements: [kserve-a5000, cachyos-7900xtx]
    capabilities: [chat, tools]
    max_context: 65536
    alignment: standard

entitlement_pools:
  anthropic-max:
    description: The operator's own Anthropic Max subscription.
    provider: anthropic
    cost_class: subscription
    credential_class: subscription-session
    spillover: none

profiles:
  local-code-standard:
    description: The default local coding profile.
    cost_class: free
    hosting: local
    selectable: true
    capabilities: [chat, tools]
    min_context: 65536
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: null
        cost_class: free
    physical:
      - model_id: qwen36-27b
        placement: cachyos-7900xtx
  local-unrestricted:
    description: Local model with no refusal training - an alignment property.
    cost_class: free
    hosting: local
    selectable: false
    capabilities: []
    min_context: null
    alignment: unrestricted
    forbidden_for:
      - security
      - iam
      - secrets
    entitlements:
      - pool: null
        cost_class: free
    physical: []
    blocked_by:
      - a post-MVP catalog PR selects and validates a replacement model

policies:
  placement_policy:
    prefer-warm-local:
      description: Default. Take whatever is warm; otherwise prefer the edge.
      prefer_order:
        - cachyos-7900xtx
        - kserve-a5000
      warm_preference: strict
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
    cluster-only:
      description: Never leave the cluster.
      prefer_order:
        - kserve-a5000
      warm_preference: ignored
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
