# Seeded fixture: base.yaml with ONE edit, plus the prose that goes with it.
#   entitlement_pools.anthropic-max.cost_class: subscription -> metered
#   entitlement_pools.anthropic-max.description: reworded to match, so the
#     document does not say "subscription" in prose while the data says
#     metered. `description` is documentary, so it contributes a neutral atom
#     and cannot decide this case either way.
# Expected: narrowing forward, expanding in reverse.
# `cost_class` is the other RANKED LATTICE - metered < subscription < free -
# and it is ranked by REACHABILITY, not by risk. A metered pool needs budget to
# exist before anything can run against it, so it admits fewer attempts than a
# flat subscription, and free needs least of all. The direction reads backwards
# if you read the lattice as "how much money is at stake"; that axis belongs to
# `spillover`, which is a closed value with its own rule and its own fixture.
# Two things are deliberately NOT edited:
#   - the pool KEY. Names are stable identifiers, so renaming a pool is a
#     removal plus an addition (expanding) - a different case entirely.
#   - `credential_class`. Cost class and credential shape are independent axes
#     in this catalog and neither implies the other, so a metered entitlement
#     reached through a signed-in session is a legal document rather than a
#     slip. It is also unrecognized surface to the classifier, so editing it
#     would add an expanding atom and drown the lattice atom this case exists
#     to pin.
version: "1.3.0"
schema_version: 1
updated: "2026-08-21"
consumers: []

defaults:
  placement_policy: prefer-warm-local

harnesses:
  claude:
    description: Claude Code sessions on the operator's own subscription.
    supported: true
    selectable: true

placements:
  kserve-a5000:
    description: KServe InferenceServices on the cluster's RTX A5000 node.
    status: available
    selectable: true
    kind: kserve
    gpu:
      vendor: nvidia
      model: RTX A5000
    capacity:
      vram_gb: 24
      vram_gb_nameplate: 24
      source: measured
    preemptible: false
    cold_start_s_estimate: 150
  cachyos-7900xtx:
    description: LAN edge worker on the operator's CachyOS workstation.
    status: available
    selectable: true
    kind: edge
    capacity:
      vram_gb: null
      vram_gb_nameplate: 24
      source: unmeasured
    preemptible: true
    cold_start_s_estimate: 6

models:
  qwen36-27b:
    description: Qwen3.6-27B, the reference local model for EPIC-035.
    hosting: local
    upstream_model_id: qwen3.6-27b
    placements: [kserve-a5000, cachyos-7900xtx]
    capabilities: [chat, tools]
    max_context: 65536
    alignment: standard

entitlement_pools:
  anthropic-max:
    description: >-
      The operator's own Anthropic entitlement, billed per token rather than
      as a flat plan.
    provider: anthropic
    cost_class: metered
    credential_class: subscription-session
    spillover: none

profiles:
  local-code-standard:
    description: The default local coding profile.
    cost_class: free
    hosting: local
    selectable: true
    capabilities: [chat, tools]
    min_context: 65536
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: null
        cost_class: free
    physical:
      - model_id: qwen36-27b
        placement: cachyos-7900xtx
  local-unrestricted:
    description: Local model with no refusal training - an alignment property.
    cost_class: free
    hosting: local
    selectable: false
    capabilities: []
    min_context: null
    alignment: unrestricted
    forbidden_for:
      - security
      - iam
      - secrets
    entitlements:
      - pool: null
        cost_class: free
    physical: []
    blocked_by:
      - a post-MVP catalog PR selects and validates a replacement model

policies:
  placement_policy:
    prefer-warm-local:
      description: Default. Take whatever is warm; otherwise prefer the edge.
      prefer_order:
        - cachyos-7900xtx
        - kserve-a5000
      warm_preference: strict
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
    cluster-only:
      description: Never leave the cluster.
      prefer_order:
        - kserve-a5000
      warm_preference: ignored
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
