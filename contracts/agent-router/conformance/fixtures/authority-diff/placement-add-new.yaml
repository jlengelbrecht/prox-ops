# Seeded fixture: base.yaml with THREE related edits.
#   placements.laptop-rtx5000                added, status available/selectable
#   models.qwen36-27b.placements             gains it, so the model can run there
#   policies.placement_policy.prefer-warm-local.prefer_order  gains it, last
# Expected: expanding forward, narrowing in reverse.
# All three atoms point the same way, which is the ordinary shape of a
# placement addition: the placement is declared, a model is declared to run on
# it, AND a policy is taught to reach it. The middle edit is what makes the
# fixture internally consistent - a prefer_order naming a placement no model
# declares is a catalog nobody would ship, and this suite's fixtures have to be
# documents a reviewer could believe in even though the classifier itself does
# no referential-integrity checking (see AUTHORITY-DIFF.md, "what this
# deliberately does not do").
# A placement name is a public identifier - it appears verbatim as an
# agentgateway provider name and as the x-placement header value - so this is
# authority arriving, not a rename.
version: "1.3.0"
schema_version: 1
updated: "2026-08-21"
consumers: []

defaults:
  placement_policy: prefer-warm-local

harnesses:
  claude:
    description: Claude Code sessions on the operator's own subscription.
    supported: true
    selectable: true

placements:
  kserve-a5000:
    description: KServe InferenceServices on the cluster's RTX A5000 node.
    status: available
    selectable: true
    kind: kserve
    gpu:
      vendor: nvidia
      model: RTX A5000
    capacity:
      vram_gb: 24
      vram_gb_nameplate: 24
      source: measured
    preemptible: false
    cold_start_s_estimate: 150
  cachyos-7900xtx:
    description: LAN edge worker on the operator's CachyOS workstation.
    status: available
    selectable: true
    kind: edge
    capacity:
      vram_gb: null
      vram_gb_nameplate: 24
      source: unmeasured
    preemptible: true
    cold_start_s_estimate: 6
  laptop-rtx5000:
    description: Edge worker on the operator's laptop, brought up and measured.
    status: available
    selectable: true
    kind: edge
    capacity:
      vram_gb: 16
      vram_gb_nameplate: 16
      source: measured
    preemptible: true
    cold_start_s_estimate: 9

models:
  qwen36-27b:
    description: Qwen3.6-27B, the reference local model for EPIC-035.
    hosting: local
    upstream_model_id: qwen3.6-27b
    placements: [kserve-a5000, cachyos-7900xtx, laptop-rtx5000]
    capabilities: [chat, tools]
    max_context: 65536
    alignment: standard

entitlement_pools:
  anthropic-max:
    description: The operator's own Anthropic Max subscription.
    provider: anthropic
    cost_class: subscription
    credential_class: subscription-session
    spillover: none

profiles:
  local-code-standard:
    description: The default local coding profile.
    cost_class: free
    hosting: local
    selectable: true
    capabilities: [chat, tools]
    min_context: 65536
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: null
        cost_class: free
    physical:
      - model_id: qwen36-27b
        placement: cachyos-7900xtx
  local-unrestricted:
    description: Local model with no refusal training - an alignment property.
    cost_class: free
    hosting: local
    selectable: false
    capabilities: []
    min_context: null
    alignment: unrestricted
    forbidden_for:
      - security
      - iam
      - secrets
    entitlements:
      - pool: null
        cost_class: free
    physical: []
    blocked_by:
      - a post-MVP catalog PR selects and validates a replacement model

policies:
  placement_policy:
    prefer-warm-local:
      description: Default. Take whatever is warm; otherwise prefer the edge.
      prefer_order:
        - cachyos-7900xtx
        - kserve-a5000
        - laptop-rtx5000
      warm_preference: strict
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
    cluster-only:
      description: Never leave the cluster.
      prefer_order:
        - kserve-a5000
      warm_preference: ignored
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
