---
# Seeded fixture: a catalog document still inside the ConfigMap that ships it,
# the way the live copy is committed. Its pair, envelope-plain.yaml, is the
# same catalog handed over bare.
#
# Expected against that pair: neutral in both directions. The envelope is not
# catalog data - a reviewer will paste whichever form is to hand, and a
# classifier that reported the ConfigMap's own metadata as an authority change
# would be unusable against the file the change actually arrives in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-router-catalog
  namespace: ai
  labels:
    app.kubernetes.io/name: agent-router-catalog
data:
  catalog.yaml: |
    version: "1.3.0"
    schema_version: 1
    profiles:
      local-code-standard:
        description: The default local coding profile.
        selectable: true
        capabilities: [chat, tools]
        min_context: 65536
        forbidden_for: []
        physical:
          - model_id: qwen36-27b
            placement: kserve-a5000
