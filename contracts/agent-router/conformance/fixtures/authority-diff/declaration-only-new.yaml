# Seeded fixture: base.yaml with ONE edit.
#   placements.bazzite-5090  declared, status: planned, selectable: false,
#                            nothing measured, nothing referencing it
# Expected: neutral in both directions.
# The deliberate asymmetry in this taxonomy, and the one most likely to be
# argued with. Declaring an entry that cannot be selected grants nothing: no
# policy prefers it, no model is placed on it, and a router that emitted it
# would be wrong. The real catalog carries exactly such entries - planned
# placements and a declared-but-not-selectable profile - so that a name can be
# frozen before it works instead of opening a drift window between the catalog
# and the contract that enumerates it.
# Authority moves when the flip happens: status-withdraw-new.yaml and
# selectable-enable-new.yaml are that flip, and both come back non-neutral.
version: "1.3.0"
schema_version: 1
updated: "2026-08-21"
consumers: []

defaults:
  placement_policy: prefer-warm-local

harnesses:
  claude:
    description: Claude Code sessions on the operator's own subscription.
    supported: true
    selectable: true

placements:
  kserve-a5000:
    description: KServe InferenceServices on the cluster's RTX A5000 node.
    status: available
    selectable: true
    kind: kserve
    gpu:
      vendor: nvidia
      model: RTX A5000
    capacity:
      vram_gb: 24
      vram_gb_nameplate: 24
      source: measured
    preemptible: false
    cold_start_s_estimate: 150
  cachyos-7900xtx:
    description: LAN edge worker on the operator's CachyOS workstation.
    status: available
    selectable: true
    kind: edge
    capacity:
      vram_gb: null
      vram_gb_nameplate: 24
      source: unmeasured
    preemptible: true
    cold_start_s_estimate: 6
  bazzite-5090:
    description: Planned LAN edge worker; nothing about it has been measured.
    status: planned
    selectable: false
    kind: edge
    capacity:
      vram_gb: null
      vram_gb_nameplate: 32
      source: unmeasured
    preemptible: true
    cold_start_s_estimate: null
    blocked_by:
      - hardware brought up and measured against the edge worker contract

models:
  qwen36-27b:
    description: Qwen3.6-27B, the reference local model for EPIC-035.
    hosting: local
    upstream_model_id: qwen3.6-27b
    placements: [kserve-a5000, cachyos-7900xtx]
    capabilities: [chat, tools]
    max_context: 65536
    alignment: standard

entitlement_pools:
  anthropic-max:
    description: The operator's own Anthropic Max subscription.
    provider: anthropic
    cost_class: subscription
    credential_class: subscription-session
    spillover: none

profiles:
  local-code-standard:
    description: The default local coding profile.
    cost_class: free
    hosting: local
    selectable: true
    capabilities: [chat, tools]
    min_context: 65536
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: null
        cost_class: free
    physical:
      - model_id: qwen36-27b
        placement: cachyos-7900xtx
  local-unrestricted:
    description: Local model with no refusal training - an alignment property.
    cost_class: free
    hosting: local
    selectable: false
    capabilities: []
    min_context: null
    alignment: unrestricted
    forbidden_for:
      - security
      - iam
      - secrets
    entitlements:
      - pool: null
        cost_class: free
    physical: []
    blocked_by:
      - a post-MVP catalog PR selects and validates a replacement model

policies:
  placement_policy:
    prefer-warm-local:
      description: Default. Take whatever is warm; otherwise prefer the edge.
      prefer_order:
        - cachyos-7900xtx
        - kserve-a5000
      warm_preference: strict
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
    cluster-only:
      description: Never leave the cluster.
      prefer_order:
        - kserve-a5000
      warm_preference: ignored
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
