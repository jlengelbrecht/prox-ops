---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./resourceset.yaml
  - ./ghcr-pull-secret.yaml
# job-started-guard.test.sh is a local self-test and is deliberately not listed.
configMapGenerator:
  # Shared by every scale set in resourceset.yaml, which references it by its
  # literal name; kustomize cannot rewrite names inside the ResourceSet template,
  # so the suffix hash stays off. Runner pods are ephemeral (one per job) and
  # pick up a changed script on their next start.
  - name: gha-runner-job-guard
    files:
      - job-started-guard.sh=./job-started-guard.sh
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: repo-runner-sets
