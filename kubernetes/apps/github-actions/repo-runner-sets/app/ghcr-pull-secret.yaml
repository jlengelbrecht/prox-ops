---
# GHCR pull secret for scale sets that run a private runner image (entries
# with `runnerImage` set in resourceset.yaml reference it by its literal name).
#
# A classic PAT, not the runner GitHub App: GHCR does not accept GitHub App
# installation tokens for container pulls. The PAT is scoped to read:packages
# only and lives in the 1Password item `GHCR Runner Images Pull` (fields
# `username` and `token`); rotate it there and ESO re-renders within an hour.
# Runner pods are ephemeral, so the next job pod pulls with the new credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-runner-images
  namespace: github-actions
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghcr-runner-images
    creationPolicy: Owner
    template:
      # v2 provides the sprig `toJson` / `b64enc` pipes used below.
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # `toJson` quotes and escapes the values, so a credential with special
        # characters still yields valid JSON; `auth` is base64 and needs none.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":{{ .username | toJson }},"password":{{ .token | toJson }},"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: GHCR Runner Images Pull
        property: username
    - secretKey: token
      remoteRef:
        key: GHCR Runner Images Pull
        property: token
