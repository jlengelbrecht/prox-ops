---
# STORY-034-10: production gateway API keys, minted 2026-08-02.
#
# Measured from LiteLLM's Postgres (WI-034-7 Task 6 / EPIC-034-TRACKING.md):
# 36 keys exist, only 3 ever made a call, and the live consumer set is
# exactly TWO - Claude Code and Open WebUI. moltbot and the unattributed
# key are dead (not re-minted); homelab-general-access and external-ai-mcp
# are zero-call garbage (not re-minted). Do not add more keys here without
# re-measuring - see WI-034-9-10 Step 1.
#
# DEVIATION (documented per PM instruction, so the next story doesn't read
# this as an inconsistency and "fix" it): repo convention elsewhere
# (litellm, searxng) uses a descriptive UPPER_SNAKE property name matching
# the secret's purpose (OPENAI_API_KEY, SEARXNG_SECRET_KEY) on a Login/
# API-Credential-shaped 1Password item. These two items are Password-
# category with the built-in `password` field instead, one item per
# consumer (agw-claude-code, agw-open-webui) rather than one item with
# multiple named properties. Chosen deliberately: each of these is a
# single opaque bearer credential with no sibling fields to disambiguate
# (unlike litellm's item, which bundles several distinct API keys under
# one service's item), so a dedicated Password item per consumer is the
# better fit than inventing a property name on a shared item. Field val
# was generated with `openssl rand -hex 32` in Josh's own shell per the
# Automation-vault write-access constraint (WI-034-9-10 Step 1) - never
# printed to, or generated by, this session.
#
# No AgentgatewayPolicy/route attachment in this story: the only
# production-shaped route today (agentgateway-pilot) fronts a dormant
# cloud backend, and the real enforcement point for these keys is the
# local-model routes Story 34.11 builds - which is BLOCKED BY this story,
# so this story cannot itself depend on 34.11's routes existing yet.
# Attaching now would also risk colliding with the still-active 34.3/34.4
# spike policies on the same HTTPRoute/Gateway. Also carried from 34.3's
# live Q3 Layer-3 close (WI-034-3-auth-matrix.md, 2026-08-10): CEL model
# scoping on an AI-typed backend must use the body-parsing fallback
# (`json(request.body).model`) - `llm.requestModel` measured NOT
# available/matching in authorization CEL at this pinned version, so
# 34.11's scoping policy for these keys should use that form, not
# `llm.requestModel`.
#
# Minting + wiring the Secret pipeline now (so cutover in Phase 3 is a
# consumer-side config change, not a new-key scramble) satisfies this
# story's AC: each key
# authenticates only its intended consumer (dedicated Secret per
# consumer, no shared credential), ExternalSecrets reach SecretSynced,
# no plaintext key material anywhere in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-claude-code
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-claude-code
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: agw-claude-code
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-open-webui
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-open-webui
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: agw-open-webui
        property: password
