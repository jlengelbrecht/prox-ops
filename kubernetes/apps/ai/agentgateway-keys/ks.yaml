---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-keys
  namespace: flux-system
spec:
  dependsOn:
    - name: agentgateway-config
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/ai/agentgateway-keys/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  # No decryption block: no SOPS files in this Kustomization (ExternalSecret
  # manifests carry no key material - see externalsecret.yaml). Matches
  # agentgateway-wake-gate/ks.yaml's reasoning for the same omission.
