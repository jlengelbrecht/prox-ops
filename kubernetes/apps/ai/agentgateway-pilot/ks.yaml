---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-pilot
  namespace: flux-system
spec:
  dependsOn:
    - name: agentgateway-config
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/ai/agentgateway-pilot/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
