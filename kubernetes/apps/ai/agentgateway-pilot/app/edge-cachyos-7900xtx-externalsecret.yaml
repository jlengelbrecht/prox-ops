---
# STORY-035-8: bearer credential agentgateway presents to the CachyOS edge
# worker (cachyos-7900xtx.homelab0.org:8443). Reuses the SAME 1Password item
# the edge host's own daemons already read (edge/cachyos/README.md "Seed the
# bearer credential" / "Install the host-side daemons") - this story does not
# mint a new credential or redesign edge authentication, it wires the
# gateway up as a second reader of the identity material 35.6 already
# provisioned.
#
# Target Secret key is "Authorization" (not "credential"), matching the
# existing agentgateway-pilot-openai pattern in externalsecret.yaml:
# AgentgatewayBackend policies.auth.secretRef requires the raw key under
# that exact key name - the gateway prefixes it with "Bearer " itself
# (default auth.location).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-pilot-edge-cachyos-7900xtx
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-pilot-edge-cachyos-7900xtx
    creationPolicy: Owner
  data:
    - secretKey: Authorization
      remoteRef:
        key: edge-cachyos-7900xtx
        property: credential
