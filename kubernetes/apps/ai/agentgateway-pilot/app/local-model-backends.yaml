---
# STORY-034-11: five local chat-model backends, production shape.
#
# Byte-for-byte reuse of the 34.4 KILL GATE's proven, gate-passed shape
# (WI-034-4 sec 8, "V1" - the only variant ever exercised, first attempt,
# no escalation needed): AI-typed AgentgatewayBackend, provider.openai.model
# set to the exact upstream model identifier, host-form host/port pointed
# straight at the Knative predictor hostname, NO URLRewrite, NO
# hostRewrite policy, NO health policy, NO auth on the backend itself
# (every upstream llama-server/vLLM instance runs without an API key,
# matching LiteLLM's "dummy" api_key for all 11 local models -
# configmap.yaml). Timeouts/retries live on the HTTPRoute rule
# (httproute.yaml), not here, matching 34.4's split.
#
# `provider.openai.model` is a MODEL-NAME OVERRIDE (confirmed live via the
# installed v1.3.1 CRD doc-string: "If unset, the model name is taken from
# the request" - i.e. when SET, as here, it always wins over whatever the
# client declared in its request body). This is what makes true LiteLLM
# alias parity possible: clients declare LiteLLM's public alias
# (qwen36-27b, qwen-coder, ...) in the body for authorization purposes
# (see local-model-policies.yaml), while the ACTUAL upstream call always
# carries the correct internal identifier below, regardless.
#
# Upstream identifier, qwen36-27b only - the sole surviving backend as of
# STORY-035-8c (see retirement note below):
#   qwen36-27b:     openai/qwen3.6-27b   (llama-server --alias)
#
# STORY-035-8: qwen36-27b becomes a GROUPED backend - the 35.5-proven
# `spec.ai.groups` shape (b): a passive safety net beneath proactive
# agent-router placement, never the placement mechanism itself). Two
# AgentgatewayBackend objects below, not one, because `x-placement` has to
# realize an EDGE-preferred order as well as a KServe-preferred one
# (httproute.yaml picks between them on that header) - each retains the
# other placement as its own R6 fallback group, so a header-pinned rule
# never terminates in a single-provider backend (measured 3/3 503s
# otherwise). This is the R6 atomic unit: grouped backend + passive health
# (local-model-policies.yaml) + route retry (httproute.yaml) ship together.
#
# `qwen36-27b` keeps its name and is the FROZEN SAFE GROUPED DEFAULT:
# kserve-a5000 first, cachyos-7900xtx as fallback. Every existing caller
# that sends no `x-placement` (Claude Code's zero-config path included)
# keeps landing here unchanged - production traffic never gets silently
# redirected onto a human's desktop by an absent header. It also answers
# `x-placement: kserve-a5000`.
#
# `qwen36-27b-edge-preferred` is new and answers
# `x-placement: cachyos-7900xtx`:
# cachyos-7900xtx first, kserve-a5000 as fallback.
#
# qwen-coder, dolphin-chat, hermes-jarvis, and qwen-omni were explicitly
# OUT OF SCOPE for 35.8 (R6 names qwen36-27b only) and, as of STORY-035-8c,
# have been retired outright - see kserve/app/kustomization.yaml.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: qwen36-27b
  namespace: ai
spec:
  ai:
    groups:
      - providers:
          - name: kserve-a5000
            openai:
              model: qwen3.6-27b
            host: qwen36-27b-predictor.ai.svc.cluster.local
            port: 80
      - providers:
          # Edge transport per R4/35.4: HTTPS, a dedicated CA (never the
          # cluster wildcard), a hostname SAN, bearer auth via secretRef -
          # no TLS verification bypass, no wildcard SAN, no plaintext
          # fallback. Reuses the 35.6/35.6a identity material; nothing here
          # mints a new credential or a new CA.
          - name: cachyos-7900xtx
            openai:
              model: qwen3.6-27b
            host: cachyos-7900xtx.homelab0.org
            port: 8443
            policies:
              tls:
                caCertificateRefs:
                  - name: edge-cachyos-7900xtx-ca
                sni: cachyos-7900xtx.homelab0.org
                verifySubjectAltNames:
                  - cachyos-7900xtx.homelab0.org
              auth:
                secretRef:
                  name: agentgateway-pilot-edge-cachyos-7900xtx
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: qwen36-27b-edge-preferred
  namespace: ai
spec:
  ai:
    groups:
      - providers:
          - name: cachyos-7900xtx
            openai:
              model: qwen3.6-27b
            host: cachyos-7900xtx.homelab0.org
            port: 8443
            policies:
              tls:
                caCertificateRefs:
                  - name: edge-cachyos-7900xtx-ca
                sni: cachyos-7900xtx.homelab0.org
                verifySubjectAltNames:
                  - cachyos-7900xtx.homelab0.org
              auth:
                secretRef:
                  name: agentgateway-pilot-edge-cachyos-7900xtx
      - providers:
          - name: kserve-a5000
            openai:
              model: qwen3.6-27b
            host: qwen36-27b-predictor.ai.svc.cluster.local
            port: 80
