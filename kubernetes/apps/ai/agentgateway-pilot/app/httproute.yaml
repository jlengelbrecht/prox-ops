---
# STORY-034-2: pilot cloud route. Hostname is provisional-but-expected-final
# (covered by the wildcard cert); no DNS record is published (Story 34.19) -
# LAN tests use `curl --resolve`.
#
# DATAPATH CONFORMANCE (2026-09-07): this route no longer answers
# /v1/models. The exact-match stub rule that used to answer it, and the
# directResponse policy that supplied the list (policy.yaml), are both
# gone: a gateway must not answer a discovery request from a literal list
# written into gateway configuration, because such a list drifts from what
# the rules actually serve and teaches callers a model no rule serves
# (GATEWAY-REALIZATION.md §4, §7). Discovery is derived from the catalog
# agent-router publishes or it is not answered at all, and nothing
# publishes a menu today - so GET /v1/models now gets the gateway's own
# 404.
#
# The `PathPrefix: /` catch-all is gone with it. Every rule below is an
# Exact path match with a method, which is the same shape the auth-matrix
# route adopted deliberately and what §4 requires of any rule that can
# reach an accelerator. It also retires 34.9's own carried finding, which
# was recorded here and never fixed: an authenticated bodyless GET on any
# OTHER path (e.g. /api/hello) fell through to the catch-all, reached the
# AI-typed backend's body parser and 503'd on "EOF while parsing a value"
# (34.4's finding F3 in miniature). Unmatched paths now get a 404 from the
# gateway instead.
#
# STORY-034-9 (2026-08-02) verified the retired stub live: unauthenticated
# GET /v1/models -> 401, authenticated -> 200 with the stub list, zero pods
# created in ns ai across all probes. The wake-avoidance half of that
# result survives its removal - the cloud rules below have no KServe
# backend behind them, so there is still no GPU for a probe to wake, and
# the route-scoped API key policy (policy.yaml) is untouched.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-pilot
  namespace: ai
spec:
  parentRefs:
    - name: ai-gateway
      namespace: network
  hostnames:
    - ai-gateway.homelab0.org
  rules:
    # -----------------------------------------------------------------
    # STORY-034-11: originally five local chat models (see history for the
    # `x-model` dispatch mechanism); STORY-035-8c retired the four non-
    # qwen36-27b models and their rules, so qwen36-27b's `x-placement`
    # rules below are what remains. Every rule below is an Exact
    # path match on one of the two canonical AI paths agentgateway
    # recognises (/v1/chat/completions, /v1/messages) - finding F3 (no
    # PathPrefix "/" catch-all fronting a GPU). The real, unmodified
    # request path is preserved in every case (no URLRewrite anywhere in
    # this file), which is deliberate: it is the one dimension every
    # proven G1/G2 test in WI-034-4 shared, and changing it for
    # per-model dispatch would be re-deriving unproven behaviour instead
    # of reusing it.
    #
    # DISPATCH MECHANISM: Gateway API cannot select a backendRef by
    # request-body content (that needs a `phase: PreRouting`
    # AgentgatewayPolicy, which the installed v1.3.1 CRD requires to
    # target a Gateway or Listener - confirmed live via
    # `kubectl get crd agentgatewaypolicies.agentgateway.dev -o json`,
    # spec.traffic.phase doc-string: "If the phase is PreRouting, the
    # targetRef must be a Gateway or a Listener"). A Gateway-scoped
    # policy would run body-parsing on every request through EVERY route
    # on ai-gateway (pilot, wake-gate, auth-matrix, MCP federation) for
    # the sake of five rules on one route - out of proportion for this
    # story and not requested by the handoff. So dispatch here uses the
    # `x-model` request header instead, exactly reusing WI-034-4's
    # already-proven mechanism (Gateway API ranks a header-matched rule
    # above an otherwise-identical rule with no header condition) rather
    # than inventing a new one.
    #
    # qwen36-27b is the one exception: it is headerless (the default),
    # because it is 34.4's already-proven reference implementation AND
    # the only model claude-code-qwen36 style scoping allows Claude Code
    # to reach (local-model-policies.yaml) - so Claude Code's existing
    # zero-config usage (ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN, no
    # custom headers, exactly as G2-c proved) keeps working unchanged.
    # The other four were reached by setting `x-model: <alias>`, which
    # Open WebUI's per-connection custom-header support could do natively;
    # documented as a carried finding in the completion report since it
    # was a real (if minor) UX divergence from LiteLLM's single implicit
    # endpoint. Those four models and their `x-model` rules were retired
    # in STORY-035-8c; the header dispatch mechanism itself lives on below
    # for qwen36-27b's `x-placement` rules.
    #
    # AUTHORIZATION (which key may reach which model) is a SEPARATE
    # concern from this dispatch header - see local-model-policies.yaml.
    # It is NOT derived from this header (an early draft did that via a
    # single shared CEL expression and security-guardian caught the
    # bypass: header-driven routing + body-driven authorization are two
    # independent client-controlled signals, so a restricted key could
    # set `x-model` to an unauthorized model while keeping the body's
    # declared model at whatever its own permission list allows).
    # local-model-policies.yaml instead attaches one authorization policy
    # PER MODEL with a hardcoded expected-model string per section - not
    # derived from the header or any other client input - so whichever
    # rule a request actually lands on, that rule's fixed truth is what
    # gets checked against the requesting key's `apiKey.models`.
    # STORY-035-8: x-placement dispatch for qwen36-27b ONLY (R6 names this
    # model alone). Same mechanism as x-model above - Gateway API ranks a
    # header-matched rule above the headerless one below it, so
    # `x-placement: cachyos-7900xtx` picks a dedicated rule and anything
    # else (missing, unknown, or a stale name) falls through to the
    # headerless default. The values are the placement names verbatim,
    # because that is what the router hands the caller to copy - an
    # abbreviation here would match nothing.
    #
    # Access control is unaffected. The qwen36-27b authz CEL defined
    # alongside the other model policies is copied onto these same section
    # names verbatim: x-placement never touches authorization.
    - name: qwen36-27b-chat-edge
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
          method: POST
          headers:
            - name: x-placement
              value: cachyos-7900xtx
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen36-27b-edge-preferred
      timeouts:
        request: 240s
      retry:
        attempts: 1
        backoff: 50ms
        codes: [503]
    # DATAPATH CONFORMANCE (2026-09-07): the `x-placement: kserve-a5000`
    # rules that used to sit here and below (qwen36-27b-chat-kserve,
    # qwen36-27b-messages-kserve) are removed. A request carrying that
    # header now falls through to the headerless rule further down, which
    # terminates on kserve-a5000 anyway - so the identity the caller asked
    # for is still honoured, by the default rather than by a rule of its
    # own. They cannot be kept in any form: §2 forbids a pinned rule whose
    # backend terminates in a single provider, and the only other member
    # that backend could carry is cachyos-7900xtx, which §1 forbids any
    # non-cachyos rule from reaching (local-model-backends.yaml).
    # EPIC-035 (bazzite bring-up): `x-placement: bazzite-5090` dispatch,
    # additive alongside the 35.8 placement rule above. Reachable only
    # via the explicit header, which agent-router only emits once the
    # catalog makes bazzite-5090 selectable; the headerless default below
    # is untouched.
    - name: qwen36-27b-chat-bazzite
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
          method: POST
          headers:
            - name: x-placement
              value: bazzite-5090
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen36-27b-bazzite-preferred
      timeouts:
        request: 240s
      retry:
        attempts: 1
        backoff: 50ms
        codes: [503]
    # Frozen safe grouped default: headerless, so missing/unknown/stale
    # `x-placement` lands here, and so does `x-placement: kserve-a5000`
    # now that it has no rule of its own. The backend behind it holds one
    # provider, kserve-a5000, and no human-owned host at all - production
    # traffic (Claude Code's zero-config path included) cannot be
    # redirected onto a human's desktop by an absent header, and when the
    # predictor is down the request fails here instead of landing on one.
    - name: qwen36-27b-chat
      matches:
        - path:
            type: Exact
            value: /v1/chat/completions
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen36-27b
      timeouts:
        request: 240s
      retry:
        attempts: 1
        backoff: 50ms
        codes: [503]
    - name: qwen36-27b-messages-edge
      matches:
        - path:
            type: Exact
            value: /v1/messages
          method: POST
          headers:
            - name: x-placement
              value: cachyos-7900xtx
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen36-27b-edge-preferred
      timeouts:
        request: 240s
      retry:
        attempts: 1
        backoff: 50ms
        codes: [503]
    # EPIC-035 (bazzite bring-up): same dispatch as qwen36-27b-chat-bazzite,
    # for the /v1/messages surface.
    - name: qwen36-27b-messages-bazzite
      matches:
        - path:
            type: Exact
            value: /v1/messages
          method: POST
          headers:
            - name: x-placement
              value: bazzite-5090
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen36-27b-bazzite-preferred
      timeouts:
        request: 240s
      retry:
        attempts: 1
        backoff: 50ms
        codes: [503]
    - name: qwen36-27b-messages
      matches:
        - path:
            type: Exact
            value: /v1/messages
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen36-27b
      timeouts:
        request: 240s
      retry:
        attempts: 1
        backoff: 50ms
        codes: [503]
    # -----------------------------------------------------------------
    # DATAPATH CONFORMANCE (2026-09-07): the cloud surface, which used to
    # be the `pilot` rule matching `PathPrefix: /`. It is now two Exact
    # rules for the two OpenAI paths this dormant backend could actually
    # serve (backend.yaml: gpt-4o-mini, cloud descoped by 34.9 Decision 7,
    # the key behind it has no credits).
    #
    # /v1/chat/completions and /v1/messages are deliberately NOT listed
    # here even though the cloud provider speaks the first of them: both
    # are already served by the local rules above, and a second headerless
    # rule on the same path and method would make which backend answers a
    # matter of rule order rather than a declared choice - which is
    # exactly the emergent safe default §1 forbids. The local rules own
    # those two paths.
    #
    # /v1/models is not listed either: see the file header.
    - name: pilot-responses
      matches:
        - path:
            type: Exact
            value: /v1/responses
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agentgateway-pilot-openai
    - name: pilot-embeddings
      matches:
        - path:
            type: Exact
            value: /v1/embeddings
          method: POST
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agentgateway-pilot-openai
