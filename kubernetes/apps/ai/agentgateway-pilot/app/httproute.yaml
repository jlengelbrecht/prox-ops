---
# STORY-034-2: pilot cloud route. Hostname is provisional-but-expected-final
# (covered by the wildcard cert); no DNS record is published (Story 34.19) -
# LAN tests use `curl --resolve`.
#
# Rule order: the exact-match /v1/models stub is listed first and pinned via
# an AgentgatewayPolicy directResponse (see policy.yaml) so a future
# catch-all PathPrefix "/" route never shadows it (scale-to-zero hazard
# control carried forward from Story 34.9's requirement). Gateway API's own
# specificity rules (exact beats prefix) already favor this rule regardless
# of list order; the directResponse policy is what actually answers it.
# The rule keeps a backendRef only to satisfy HTTPRoute's schema - the
# directResponse policy is expected to short-circuit before the backend is
# ever reached.
#
# STORY-034-9 (2026-08-02): re-verified live as this story's own AC,
# independent of 34.2's original Phase-2 proof. Unauthenticated GET
# /v1/models -> 401; authenticated -> 200 with the stub list; zero pods
# created in ns ai across all probes (kubectl get pod -n ai stays
# empty - this route has no KServe backend at all, so there is no GPU
# to wake). Bonus finding while re-verifying: an authenticated
# bodyless GET on any OTHER path (e.g. /api/hello) still falls through
# to the `pilot` catch-all rule below and reaches the AI-typed
# backend's body parser, which 503s on "EOF while parsing a value" -
# this is 34.4's finding F3 in miniature. It fails safely here only
# because the backend is a dormant cloud model with no upstream to
# actually contact; the recommendation carried to 34.11 stands
# unchanged: production local-model routes must use explicit path
# matches, not PathPrefix "/".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-pilot
  namespace: ai
spec:
  parentRefs:
    - name: ai-gateway
      namespace: network
  hostnames:
    - ai-gateway.homelab0.org
  rules:
    - name: models-stub
      matches:
        - path:
            type: Exact
            value: /v1/models
          method: GET
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agentgateway-pilot-openai
    - name: pilot
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agentgateway-pilot-openai
