---
# STORY-035-8: the CachyOS edge worker's dedicated PKI trust anchor
# (edge/cachyos/README.md "Issue the PKI" - scripts/issue-edge-pki.sh,
# CN "homelab0 edge CA"). Public trust material, not a credential: this is
# the CA certificate itself, never a private key, so it is committed to Git
# like any other ConfigMap - contrast with the bearer credential in
# edge-cachyos-7900xtx-externalsecret.yaml, which never is.
#
# Provenance (verified 2026-08-21 on the edge host itself): read from the
# `edge-pki` Docker volume the edge server serves from, and confirmed to be
# the real anchor by validating the LIVE leaf -
#   openssl s_client -connect cachyos-7900xtx.homelab0.org:8443 \
#     -servername cachyos-7900xtx.homelab0.org -CAfile edge-ca.crt
#     -> Verification: OK, Verify return code: 0
# Self-signed root, CA:TRUE pathlen:0, expires 2036-08-17, no private key.
#
# Rotation: reissuing the edge PKI invalidates this ConfigMap. A stale CA
# here fails CLOSED (TLS handshake error, curl rc=60 - proven by 35.8pre's
# wrong-CA test), never silently, so rotation surfaces as a hard 5xx rather
# than as an unverified connection.
