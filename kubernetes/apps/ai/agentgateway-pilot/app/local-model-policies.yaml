---
# STORY-034-11: auth + authorization for the local chat-model rules added
# to the agentgateway-pilot route in httproute.yaml. Originally five
# models/ten rules; STORY-035-8c retired four of the five models, leaving
# qwen36-27b's six sections below (see git history for the retired
# per-model authz policies that used to follow this one).
#
# Two objects, one concern each - same reasoning as 34.3's auth-matrix
# split (auth-matrix-policies.yaml): apiKeyAuthentication carries no CEL
# and so can never fail to compile, keeping every one of these GPU-fronting
# rules reachable-only-with-a-key even if the CEL in the second object were
# ever rejected by the controller.
#
# These are Route-Rule-scoped (sectionName per targetRef), which is MORE
# PRECISE than agentgateway-pilot-apikey's whole-route policy (policy.yaml)
# and so wins on the `apiKeyAuthentication` field for exactly these
# sections (v1.3.1 CRD doc-string: "Precedence is given to more precise
# policies: Gateway < Listener < Route < Route Rule"), while leaving the
# spike key policy fully in force on models-stub and the pilot catch-all,
# both untouched by this story.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-pilot-local-models-apikey
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-chat
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-messages
    # STORY-035-8: the four x-placement-scoped rules are additional
    # sections on the SAME two paths, not new models - same key
    # requirement as the two above.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-chat-edge
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-chat-kserve
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-messages-edge
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-messages-kserve
  traffic:
    apiKeyAuthentication:
      mode: Strict
      # secretSelector (not secretRef) because 34.10 shipped the two
      # production keys as SEPARATE Secrets, one per consumer
      # (agentgateway-keys/app/externalsecret.yaml, deliberately - see
      # that file's comment). secretRef only takes one Secret name;
      # secretSelector combines both by label without renaming or
      # merging either 34.10 object, so both already-SecretSynced
      # Secrets are left exactly as shipped.
      secretSelector:
        matchLabels:
          agentgateway.dev/credential-set: agentgateway-pilot-local-models
---
# STORY-034-11's answer to 34.10's deferred AC: "each key authenticates
# only its intended consumer."
#
# SECURITY FIX (security-guardian review, this PR): the first draft of
# this file used ONE shared CEL expression identical across all ten
# sections - `apiKey.models == 'any' || apiKey.models.split(',').exists(m,
# m == json(request.body).model)` (34.3's proven scope-body shape,
# verbatim). That is broken for a MULTI-BACKEND route: backend SELECTION
# is driven by the `x-model` request header (httproute.yaml), but that
# expression's authorization decision is driven ENTIRELY by the request
# BODY's declared model - two independent, both client-controlled
# signals with nothing tying them together. A restricted key (e.g.
# claude-code-qwen36, models: "qwen36-27b") could set
# `x-model: qwen-coder` to ROUTE to the qwen-coder backend while keeping
# `{"model":"qwen36-27b",...}` in the body to satisfy the (identical,
# per-section) authorization check - full bypass of the scoping this
# story exists to add.
#
# FIX: one policy PER MODEL, each with a STATIC, hardcoded expected-model
# string - not derived from ANY client-controlled value. The comparison
# target (`'qwen36-27b'`, `'qwen-coder'`, ...) is fixed at write-time to
# match exactly what THIS section's backend actually is (local-model-
# backends.yaml), so there is no second signal for a client to
# desynchronize from routing: whichever rule/section a request lands on
# (determined solely by Gateway API path+header matching, upstream of any
# CEL), that section's hardcoded string IS the truth about what model it
# serves. A key's `apiKey.models` list is checked against that fixed
# truth, never against anything the client sent.
#
#   apiKey.models == 'any'                                          -> unrestricted permission (Open WebUI)
#   apiKey.models.split(',').exists(m, m == '<this-section's-model>') -> scoped permission (Claude Code: qwen36-27b only)
#
# CORRECTNESS FIX (Josh's review, this PR): the first cut of this
# expression was `permission || (in-list && body-matches)` - i.e.
# `apiKey.models == 'any' || (...)`. CEL's `||` short-circuits, so an
# unrestricted ('any') key never reached the body-consistency check at
# all. Concretely: Open WebUI's key hitting the DEFAULT (headerless)
# qwen36-27b-chat rule with `{"model":"qwen-coder"}` in the body and no
# `x-model` header would pass authorization on the `'any'` branch alone
# and get silently answered BY qwen36-27b while believing it reached
# qwen-coder - a wrong-model-no-error bug, not a security bypass (an
# unrestricted key is still only ever reachable via a rule it was
# already allowed on), but exactly the kind of silent-wrong-answer this
# epic's own findings (F1, F3) exist to keep out.
#
# FIX: restructured to `(permission) && (body-matches)`, so the body
# check applies to EVERY key, 'any' included - no branch of the
# expression can rely on routing (the header, or its absence) and body
# agreeing without saying so:
#
#   (apiKey.models == 'any' || apiKey.models.split(',').exists(m, m == '<model>'))
#     && json(request.body).model == '<model>'
#
# `json(request.body).model == '<model>'` uses the body-parsing fallback
# the handoff mandates (`llm.requestModel` measured NOT working in
# authorization CEL at this pinned version, 34.9/34.10 - see
# agentgateway-keys/app/externalsecret.yaml). It is now mandatory for
# every key on every section: a client (of any key) that declares a
# model inconsistent with the rule/header it actually hit gets 403, not
# a silently-substituted answer.
# FOLLOW-UP (post-34.11 live verification, PM decision: alias not pin):
# Claude Code's zero-config /v1/messages path sends its OWN configured
# default in the body - "model":"claude-sonnet-5" - not "qwen36-27b".
# That failed the mandatory body-consistency check above (403, matching
# 34.11's own LEAD ITEM finding). Widening the two match expressions
# below to accept either string does NOT weaken the property that
# check exists to protect: which backend serves a request is still
# fixed entirely by which section/targetRef this policy is attached to
# (qwen36-27b-chat / qwen36-27b-messages, set at write-time, never
# derived from the request), so accepting the alias only widens WHO is
# authorized to use it, never WHERE the request can go. Keeping each
# model's authz as its own hardcoded-literal section (not collapsed,
# not derived from client input) is unchanged.
#
# MAINTENANCE NOTE: "claude-sonnet-5" is Claude Code's own default model
# string, set by Anthropic and independent of this repo - it has already
# changed across CLI releases and will again. Re-capture the live value
# (see WI-034-11-LIVE-VERIFICATION.md's capture-server method) if the
# zero-config path starts 403ing again after a Claude Code upgrade.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-pilot-qwen36-27b-authz
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-chat
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-messages
    # STORY-035-8: same model, same authorization rule, on the four
    # x-placement-scoped sections. Per ruling R5, x-placement is
    # scheduling metadata only and must never touch this decision - so
    # this CEL is copied verbatim onto the new sections, not derived from
    # the header in any way.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-chat-edge
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-chat-kserve
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-messages-edge
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: qwen36-27b-messages-kserve
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - (apiKey.models == 'any' || apiKey.models.split(',').exists(m, m == 'qwen36-27b')) && json(request.body).model in ['qwen36-27b', 'claude-sonnet-5']
---
# STORY-035-8: R6 passive health, the second third of the atomic unit
# (grouped backend in local-model-backends.yaml + this + route retry in
# httproute.yaml). Backend-scoped `spec.backend.health` (not
# `spec.traffic`), targeting the GROUP-0 provider of each of qwen36-27b's
# two backend variants by `sectionName` - kserve-a5000 in the default/
# KServe-preferred backend, cachyos-7900xtx in the edge-preferred one. One
# policy, two targetRefs, since the frozen values (duration: 30s,
# consecutiveFailures: 1) are identical either way.
#
# Passive only: this reacts to real request outcomes on the provider it
# targets. It is not an active probe and cannot be one - `health.eviction`
# has no polling/interval field, only `duration` (the backoff once a
# provider is marked unhealthy) and `consecutiveFailures` (the trigger).
# Case 14 holds: nothing here can wake the scale-to-zero KServe backend,
# because eviction only ever observes a response to a request agent-router
# or a caller already sent.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: qwen36-27b-passive-health
  namespace: ai
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: qwen36-27b
      sectionName: kserve-a5000
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: qwen36-27b-edge-preferred
      sectionName: cachyos-7900xtx
  backend:
    health:
      eviction:
        duration: 30s
        consecutiveFailures: 1
