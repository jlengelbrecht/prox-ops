---
# STORY-034-2: same 1Password item LiteLLM's OPENAI_API_KEY comes from
# (litellm-secrets/OPENAI_API_KEY, per inv-secrets.md sec 2.1) - does NOT
# touch litellm's own ExternalSecret (litellm-openai).
#
# Target Secret key is "Authorization" (not "api-key"): AgentgatewayBackend
# policies.auth.secretRef requires the raw key under that exact key name -
# the gateway prefixes it with "Bearer " itself (default auth.location).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-pilot-openai
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-pilot-openai
    creationPolicy: Owner
  data:
    - secretKey: Authorization
      remoteRef:
        key: litellm-secrets
        property: OPENAI_API_KEY
