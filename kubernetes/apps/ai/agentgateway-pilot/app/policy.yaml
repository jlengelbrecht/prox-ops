---
# STORY-034-2: inbound auth + the /v1/models stub, both scoped to this
# pilot route only (AgentgatewayPolicy targetRefs supports Route per the
# installed v1.3.1 CRD - broader than the Gateway-only scoping
# res-agentgateway-core.md's doc survey described; verified via
# `kubectl explain agentgatewaypolicy.spec.traffic`).
#
# DEVIATION (see completion report): the installed v1.3.1
# AgentgatewayPolicy CRD's apiKeyAuthentication.secretRef only documents a
# plaintext `key` (optionally with `metadata`) value - no `keyHash`/
# `sha256:` field exists in the v1.3.1 CRD schema or in the v1.3.1-tagged
# controller source (confirmed against
# github.com/agentgateway/agentgateway at tag v1.3.1: neither
# agentgateway_policy_types.go's doc comment nor
# controller/pkg/agentgateway/plugins/traffic_plugin.go, which defines
# `keyHash`/`sha256:` validation on main, exist at that tag). SHA-256
# virtual keys are a 1.4.x-era feature, not present at the pinned version.
# Closest v1.3.1 shape: the raw spike key lives in a SOPS-encrypted Secret
# (spike-key.sops.yaml) instead of a plaintext-in-Git ConfigMap hash -
# ciphertext-at-rest in Git, ONE throwaway key, never in 1Password
# (production keys + real hashing, if 1.4.x lands by then, are Story
# 34.10's job).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-pilot-apikey
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: agentgateway-pilot-spike-key
---
# FOLLOW-UP (post-34.11 live verification): /v1/models is how every real
# consumer discovers models, but it inherited auth from the route-level
# policy above, which only recognises the 34.2 throwaway spike key - both
# production keys (34.10: agentgateway-claude-code, agentgateway-open-webui)
# got 401 here even though they work fine on the actual chat/messages
# routes. Section-scoped policy wins over the route-level default (same
# precedence rule local-model-policies.yaml relies on), so this narrowly
# swaps auth for JUST the models-stub section to secretSelector on the
# label 34.10 already put on both production Secrets - no changes to
# those Secrets, and the spike key keeps working everywhere else on this
# route (route-level policy is untouched).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-pilot-models-stub-apikey
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: models-stub
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          agentgateway.dev/credential-set: agentgateway-pilot-local-models
---
# STORY-034-11: appended the 5 local chat-model aliases for LiteLLM
# parity - the exact `model_name` strings from litellm/app/configmap.yaml,
# which is also what local-model-policies.yaml's authorization CEL expects
# in the request body (`json(request.body).model`); local-model-
# backends.yaml's `provider.openai.model` override makes an echoed id
# resolve correctly regardless of the differing internal upstream
# identifier (see that file's comment). gpt-4o-mini stays first,
# unchanged - cloud remains descoped (34.9 decision 7) but the dormant
# entry is additive-only, not this story's to remove.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-pilot-models-stub
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-pilot
      sectionName: models-stub
  traffic:
    directResponse:
      status: 200
      headers:
        - name: content-type
          value: application/json
      body: |
        {"object":"list","data":[{"id":"gpt-4o-mini","object":"model","owned_by":"openai"},{"id":"qwen36-27b","object":"model","owned_by":"kserve"},{"id":"qwen-coder","object":"model","owned_by":"kserve"},{"id":"dolphin-chat","object":"model","owned_by":"kserve"},{"id":"hermes-jarvis","object":"model","owned_by":"kserve"},{"id":"qwen-omni","object":"model","owned_by":"kserve"}]}
