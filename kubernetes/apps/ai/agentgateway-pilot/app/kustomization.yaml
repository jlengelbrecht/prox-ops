---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # STORY-034-2: cloud pilot route
  - externalsecret.yaml
  - spike-key.sops.yaml
  - backend.yaml
  - httproute.yaml
  - policy.yaml
  # STORY-034-11: five local chat-model backends + auth/authz policies
  - local-model-backends.yaml
  - local-model-policies.yaml
  # STORY-035-8: CachyOS edge placement - trust anchor + bearer credential
  # for the cachyos-7900xtx provider in local-model-backends.yaml
  - edge-cachyos-7900xtx-ca.yaml
  - edge-cachyos-7900xtx-externalsecret.yaml
  # EPIC-035 (bazzite bring-up): Bazzite edge placement - trust anchor +
  # bearer credential for the bazzite-5090 provider in
  # local-model-backends.yaml. The ExternalSecret requires the 1Password
  # item edge-bazzite-5090 (vault Automation) to exist first - see the
  # ordering note in that file.
  - edge-bazzite-5090-ca.yaml
  - edge-bazzite-5090-externalsecret.yaml
  # STORY-034-3's auth-mechanics spike (its own HTTPRoute, hostname,
  # backends, policies and Secret) is retired - the questions it was built
  # to answer were answered in 34.3 and its findings live on in the route
  # files above. Its two backends named no placement identity (a static
  # backend and a single-provider one, neither of which has a name field),
  # and a host a gateway cannot name cannot be judged human-owned or not
  # (GATEWAY-REALIZATION.md §5). Nothing outside the spike referenced it.
  # `decryption: {provider: sops}` stays on this app's Kustomization
  # (../ks.yaml): spike-key.sops.yaml above is still SOPS-encrypted.
