---
# EPIC-035 (bazzite bring-up): bearer credential agentgateway presents to the
# Bazzite edge worker (bazzite-5090.homelab0.org:8443). Reuses the SAME
# 1Password item the edge host's own daemons read (edge/bazzite/README.md
# "Bring-up" step 3) - this wires the gateway up as a second reader of the
# node's identity material; nothing here mints a credential.
#
# ORDERING: the 1Password item (vault Automation, item edge-bazzite-5090,
# field `credential`) must exist BEFORE this manifest is applied, or the
# ExternalSecret sits in SecretSyncedError and the backend referencing it
# never becomes routable. Creating that item is an owner action recorded in
# the bazzite acceptance evidence.
#
# Target Secret key is "Authorization" (not "credential"), matching the
# existing agentgateway-pilot-edge-cachyos-7900xtx pattern:
# AgentgatewayBackend policies.auth.secretRef requires the raw key under
# that exact key name - the gateway prefixes it with "Bearer " itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-pilot-edge-bazzite-5090
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-pilot-edge-bazzite-5090
    creationPolicy: Owner
  data:
    - secretKey: Authorization
      remoteRef:
        key: edge-bazzite-5090
        property: credential
