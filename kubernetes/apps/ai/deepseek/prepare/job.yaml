---
# Runs the image's normal start (entrypoint run) against deepseek-data on the
# A5000: it downloads the engine and ~257 GB of model files (resumable: a retry
# continues where it stopped), builds the pack, loads the model and answers a
# test question. When the image's own health check passes, the server is
# stopped cleanly and the Job ends. Same container settings as the Knative
# Service, so the first wake reads exactly what this run prepared.
apiVersion: batch/v1
kind: Job
metadata:
  name: deepseek-prepare
  labels:
    app.kubernetes.io/name: deepseek
    app.kubernetes.io/component: prepare
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepseek
        app.kubernetes.io/component: prepare
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 150
      enableServiceLinks: false
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        gpu.nvidia.com/model: rtx-a5000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  serving.kserve.io/inferenceservice: qwen36-27b
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: voicestudio
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: deepseek
                  app.kubernetes.io/component: server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: strata
          image: ghcr.io/niko1221/strata:0.2.12-cuda13@sha256:c3a853420670f4c0f5a948c2d9e9904af4cedf52b11bc8cf167602dc5c578bcc
          command: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
          args:
            - |
              # A throwaway key for this run: the real key is never present while
              # the pod downloads from the internet. Each start writes its own key.
              head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /tmp/prepare-key
              /opt/strata/entrypoint.sh run &
              pid=$!
              while ! /opt/strata/healthcheck.sh 2>/dev/null; do
                kill -0 "$pid" 2>/dev/null || { wait "$pid"; echo "prepare: the start ended before the model was ready"; exit 1; }
                sleep 30
              done
              echo "prepare: model loaded and answering; stopping the server"
              kill -TERM "$pid"
              wait "$pid"
              echo "prepare: done"
          env:
            - name: FAMILY
              value: deepseek41
            - name: MODEL
              value: ist-das-2.00bpw
            - name: CONTEXT
              value: 128k
            - name: PARALLEL
              value: "1"
            - name: PORT
              value: "8080"
            - name: API_KEY_FILE
              value: /tmp/prepare-key
          securityContext:
            allowPrivilegeEscalation: false
            # Root is the image's user; it keeps only IPC_LOCK (memory pinning).
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: "64"
              memory: 272Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "64"
              memory: 272Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepseek-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
