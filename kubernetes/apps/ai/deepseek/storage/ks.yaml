---
# Model storage for the DeepSeek V4.1 Flash pilot. prune: false, like the other
# model volumes, so a Flux change can never delete ~260 GB of downloaded files.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deepseek-storage
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/deepseek/storage
  prune: false  # NEVER prune storage
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
