---
# DeepSeek V4.1 Flash (ISTA-DAS 2.00 bpw) served by Strata on the RTX A5000
# (k8s-work-7), as a cluster-local scale-to-zero Knative Service.
#
# Files: the one-off prepare Job downloaded the engine (strata-dsv41 0.1.58) and
# model into the deepseek-data volume and checked one load (about 105 s from
# CephFS) before this Service existed. A wake only loads; it never downloads,
# and the server's egress is DNS only.
#
# Key: read from the mounted Secret. The image copies the key it is given to
# STRATA_KEY_FILE and into its saved launch preset; both point at a
# memory-backed volume here, so the real key never lands on deepseek-data.
#
# GPU: nvidia.com/gpu: 1 is one of the A5000's three time-slice shares and gives
# no VRAM isolation, while DeepSeek needs the whole card. Required pod
# anti-affinity keeps it off the node while a qwen36-27b or VoiceStudio pod runs
# there, and keeps those (and the prepare Job) off while it runs, because the
# scheduler checks required anti-affinity both ways. A wake while either is warm
# waits until it scales to zero.
#
# Memory: requests equal limits, sized to fit beside what already runs on
# k8s-work-7, so nothing is evicted. The engine's memory guard reads the cgroup
# limit, and its RAM store sizes itself (at most 48 GB). Model pages beyond that
# stay in the page cache, which the limit also bounds. IPC_LOCK lets the engine
# pin memory (the Docker image's --ulimit memlock=-1); it runs as root, as the
# image requires.
#
# One request at a time (PARALLEL=1, containerConcurrency 1), 128K context.
# Cold start reads ~250 GB from CephFS, so the progress deadline and request
# timeouts are long. After 10 idle minutes the pod is retained 10 more, then
# the GPU is freed.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: deepseek
  labels:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepseek
        app.kubernetes.io/component: server
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "1"
        autoscaling.knative.dev/initial-scale: "0"
        autoscaling.knative.dev/window: "10m"
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "10m"
        serving.knative.dev/progress-deadline: "60m"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      responseStartTimeoutSeconds: 3600
      idleTimeoutSeconds: 3600
      enableServiceLinks: false
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        gpu.nvidia.com/model: rtx-a5000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  serving.kserve.io/inferenceservice: qwen36-27b
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: voicestudio
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: deepseek
                  app.kubernetes.io/component: prepare
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: strata
          image: ghcr.io/niko1221/strata:0.2.12-cuda13@sha256:c3a853420670f4c0f5a948c2d9e9904af4cedf52b11bc8cf167602dc5c578bcc
          ports:
            - name: http1
              containerPort: 8080
              protocol: TCP
          env:
            - name: FAMILY
              value: deepseek41
            - name: MODEL
              value: ist-das-2.00bpw
            - name: CONTEXT
              value: 128k
            - name: PARALLEL
              value: "1"
            # Copy the experts the A5000 cannot hold (~116 GB) into RAM at load instead
            # of reading them in place from the model files on CephFS. The first
            # benchmark (2026-11-09) decoded at ~15 tok/s short and 9.7 tok/s on a
            # 700-token answer with the experts read in place. This trades a longer
            # wake (about 2 more minutes of reading at ~1 GB/s) for steadier decode.
            # The pod's 272Gi limit holds them with room to spare.
            - name: STRATA_SET
              value: "mmap-experts=off"
            - name: API_KEY_FILE
              value: /run/secrets/deepseek/API_KEY
            - name: STRATA_KEY_FILE
              value: /run/strata/api-key
            - name: STRATA_LAUNCH_PRESET_DIR
              value: /run/strata/launch-presets
          # Ready only once the model answers GET /v1/models with the key
          # (the image's own health check), not merely when the port opens.
          readinessProbe:
            exec:
              command: ["/opt/strata/healthcheck.sh"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # Root is the image's user; it keeps only IPC_LOCK (memory pinning).
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: "64"
              memory: 272Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "64"
              memory: 272Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: api-key
              mountPath: /run/secrets/deepseek
              readOnly: true
            - name: strata-run
              mountPath: /run/strata
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepseek-data
        - name: api-key
          secret:
            secretName: deepseek-api
            defaultMode: 0400
        - name: strata-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
