---
# Strata API key (every request except GET /health needs Authorization: Bearer).
# 1Password item: deepseek-strata (vault Automation, Secure Note), field API_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deepseek-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: deepseek-api
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: deepseek-strata
        property: API_KEY
