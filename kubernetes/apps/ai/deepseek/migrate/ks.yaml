---
# One-off copy of the DeepSeek volume from CephFS to the host-local volume on
# k8s-work-7. Remove this Kustomization once the Service reads the local volume.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deepseek-migrate
  namespace: flux-system
spec:
  targetNamespace: ai
  dependsOn:
    - name: deepseek-storage
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/deepseek/migrate
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
