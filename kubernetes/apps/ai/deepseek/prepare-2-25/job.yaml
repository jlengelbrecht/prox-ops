---
# One-off download of the 2.25 bpw set of DeepSeek V4.1 Flash onto the host-local
# volume, beside the 2.00 set the Service runs, so the two can be compared.
# It runs the image's normal start (entrypoint run) with MODEL=ist-das-2.25bpw:
# about 155 GB of model files are downloaded (resumable: a retry continues where
# it stopped); the Engram table, the drafter and the engine are already on the
# volume and are reused. It then builds the pack, loads the model and answers a
# test question. When the image's own health check passes, the server is stopped
# and the Job ends. The Service keeps MODEL=ist-das-2.00bpw and is not changed.
# Remove this Kustomization once the Job has completed.
apiVersion: batch/v1
kind: Job
metadata:
  name: deepseek-prepare-2-25
  labels:
    app.kubernetes.io/name: deepseek
    app.kubernetes.io/component: prepare
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepseek
        app.kubernetes.io/component: prepare
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 150
      enableServiceLinks: false
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        gpu.nvidia.com/model: rtx-a5000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  serving.kserve.io/inferenceservice: qwen36-27b
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: voicestudio
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: deepseek
                  app.kubernetes.io/component: server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: strata
          image: ghcr.io/niko1221/strata:0.2.12-cuda13@sha256:c3a853420670f4c0f5a948c2d9e9904af4cedf52b11bc8cf167602dc5c578bcc
          command: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
          args:
            - |
              # A throwaway key for this run: the real key is never present while
              # the pod downloads from the internet. Each start writes its own key.
              # The image copies the key it is given onto /data (state/api-key, the
              # saved preset and run configs). Clear those copies before this pod
              # reaches the internet (a server may have run on this volume) and again
              # at the end (this run's throwaway key), so the volume keeps no key.
              scrub() {
                rm -f /data/state/api-key
                for c in /data/config/strata/launch-presets/*.json /data/state/strata/launch/*.json; do
                  [ -f "$c" ] && sed -i 's/"api_key"[[:space:]]*:[[:space:]]*"[^"]*"/"api_key": ""/' "$c"
                done
              }
              scrub
              ( umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /tmp/prepare-key )
              /opt/strata/entrypoint.sh run &
              pid=$!
              while ! /opt/strata/healthcheck.sh 2>/dev/null; do
                kill -0 "$pid" 2>/dev/null || { wait "$pid"; echo "prepare: the start ended before the model was ready"; exit 1; }
                sleep 30
              done
              echo "prepare: model loaded and answering; stopping the server"
              kill -TERM "$pid"
              wait "$pid"
              scrub
              echo "prepare: done"
          env:
            - name: FAMILY
              value: deepseek41
            - name: MODEL
              value: ist-das-2.25bpw
            - name: CONTEXT
              value: 256k
            - name: PARALLEL
              value: "1"
            - name: PORT
              value: "8080"
            - name: API_KEY_FILE
              value: /tmp/prepare-key
          securityContext:
            allowPrivilegeEscalation: false
            # Root is the image's user; it keeps only IPC_LOCK (memory pinning).
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: "64"
              memory: 272Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "64"
              memory: 272Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepseek-local
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
