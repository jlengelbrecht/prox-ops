---
# Every 4 hours: take one VolumeSnapshot of agent-router-journal with the
# ceph-block-snapshot class, wait for it to be ReadyToUse, then keep the 12
# newest ready snapshots this job made (two days) and delete the rest.
#
# Only snapshots carrying the managed-by label below are ever pruned. A
# snapshot taken by hand before an upgrade has no such label and is never
# touched by this job.
#
# Pruning runs only after the new snapshot is ready, so a broken snapshot path
# fails the Job (visible in failedJobsHistory) and leaves the existing ready
# snapshots alone instead of rotating them out.
#
# Each snapshot is stamped with the router's live image and version, read
# from the agent-router Deployment right before the snapshot is created (see
# the narrow get/deployments rule in rbac.yaml). A rollback needs the
# snapshot taken under the release being returned to, and scheduled runs have
# no operator standing by to label one by hand. If either read fails, the run
# still takes the snapshot - annotated prox-ops.io/router-image: unknown -
# and logs why; a lookup failure must never cost us a snapshot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-router-snapshots
spec:
  schedule: "0 */4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-router-snapshots
        spec:
          serviceAccountName: agent-router-snapshots
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.34.11@sha256:0382123ab8ae17d8da5d43cc299242933eb012cfbe56787b43731c942c3eed80
              command:
                - /bin/sh
                - -c
                - |
                  set -eu -o pipefail
                  ns=ai
                  pvc=agent-router-journal
                  class=ceph-block-snapshot
                  keep=12
                  sel=app.kubernetes.io/managed-by=agent-router-snapshots
                  name="$pvc-$(date -u +%Y%m%d-%H%M%S)"

                  # Read the router's live image and version before creating
                  # the snapshot. Either read failing (RBAC hiccup, apiserver
                  # blip, the Deployment briefly gone) falls back to "unknown"
                  # and is logged - it never stops the snapshot itself.
                  router_image=unknown
                  if out=$(kubectl -n "$ns" get deploy agent-router \
                      -o jsonpath='{.spec.template.spec.containers[?(@.name=="agent-router")].image}' 2>&1) \
                      && [ -n "$out" ]; then
                    router_image="$out"
                  else
                    echo "WARN: could not read agent-router image, annotating unknown: ${out:-empty response}" >&2
                  fi

                  router_version=unknown
                  if out=$(kubectl -n "$ns" get deploy agent-router \
                      -o jsonpath="{.metadata.labels['app\.kubernetes\.io/version']}" 2>&1) \
                      && [ -n "$out" ]; then
                    router_version="$out"
                  else
                    echo "WARN: could not read agent-router version label, annotating unknown: ${out:-empty response}" >&2
                  fi

                  echo "creating $ns/$name from $pvc (router-image=$router_image router-version=$router_version)"
                  kubectl create -f - <<EOF
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: $name
                    namespace: $ns
                    labels:
                      app.kubernetes.io/name: agent-router
                      app.kubernetes.io/component: journal
                      app.kubernetes.io/managed-by: agent-router-snapshots
                    annotations:
                      prox-ops.io/router-image: "$router_image"
                      prox-ops.io/router-version: "$router_version"
                  spec:
                    volumeSnapshotClassName: $class
                    source:
                      persistentVolumeClaimName: $pvc
                  EOF

                  # list + field selector instead of get/watch (see rbac.yaml);
                  # a transient API error just counts as not ready yet
                  ready=""
                  i=0
                  while [ "$i" -lt 60 ]; do
                    ready=$(kubectl -n "$ns" get volumesnapshots --field-selector "metadata.name=$name" \
                      -o jsonpath='{.items[0].status.readyToUse}' || true)
                    [ "$ready" = true ] && break
                    i=$((i + 1))
                    sleep 10
                  done

                  if [ "$ready" != true ]; then
                    err=$(kubectl -n "$ns" get volumesnapshots --field-selector "metadata.name=$name" \
                      -o jsonpath='{.items[0].status.error.message}' || true)
                    echo "FAIL: $name not ReadyToUse after 10m: ${err:-no error reported}" >&2
                    kubectl -n "$ns" delete volumesnapshots --field-selector "metadata.name=$name" --wait=false
                    exit 1
                  fi
                  echo "ready: $name"

                  # Leftovers from runs that were killed before they could clean
                  # up, then everything past the newest $keep ready snapshots.
                  kubectl -n "$ns" get volumesnapshots -l "$sel" -o json \
                    | jq -r --arg cur "$name" --argjson keep "$keep" '
                        (.items | map(select(.status.readyToUse != true and .metadata.name != $cur)) | .[].metadata.name),
                        (.items | map(select(.status.readyToUse == true))
                                | sort_by(.metadata.creationTimestamp) | reverse | .[$keep:] | .[].metadata.name)' \
                    | while read -r old; do
                        [ -n "$old" ] || continue
                        echo "pruning $old"
                        kubectl -n "$ns" delete volumesnapshots --field-selector "metadata.name=$old" --wait=false
                      done
                  echo "done"
              env:
                # kubectl writes its discovery cache under $HOME
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
