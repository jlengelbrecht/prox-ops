---
# EPIC-047: VoiceStudio voice pipeline (AI dubbing, TTS, transcription)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app voicestudio
  namespace: flux-system
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-operator
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/ai/voicestudio/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
