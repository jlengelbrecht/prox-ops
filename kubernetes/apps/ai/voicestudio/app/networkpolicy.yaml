---
# VoiceStudio network policy.
# - Ingress: VoiceStudio is a Knative Service, so every request reaches the
#   pod through the Knative data path: the Kourier internal gateway (envoy
#   gateway and in-cluster callers both arrive via kourier-internal) and the
#   activator (requests while scaled to zero, and while it is on the path),
#   both to the queue-proxy on 8012; plus the autoscaler scraping queue-proxy
#   metrics on 9090. The app port 3900 is only reached from queue-proxy in
#   the same pod, so it is not opened.
# - Egress: DNS, LiteLLM (OpenAI-compatible translation), HTTPS to the
#   internet for Hugging Face model downloads and web translation engines.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: voicestudio
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: voicestudio
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kourier-system
            app: 3scale-kourier-gateway
        - matchLabels:
            io.kubernetes.pod.namespace: knative-serving
            app: activator
      toPorts:
        - ports:
            - port: "8012"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: knative-serving
            app: autoscaler
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # Hugging Face (models, incl. its CDN) and web translation engines.
    # toEntities:world rather than toFQDNs: the Cilium DNS proxy redirect is
    # not applied to endpoints with external-envoy-proxy + transparent DNS mode.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
