---
# VoiceStudio on the internal gateway only (no envoy-external route, no
# Cloudflare record).
#   /                       -> UI + API, gated by Authentik forward auth
#                              (securitypolicy.yaml), then VoiceStudio's own
#                              API-key login
#   /outpost.goauthentik.io -> Authentik login/callback flow
# VoiceStudio is a scale-to-zero Knative Service (ksvc.yaml). The route
# targets kourier-internal and rewrites the Host to the ksvc hostname, which
# is how Kourier picks the service. The Knative activator stays on the path
# at zero replicas, so a request here wakes the GPU pod. The rewrite happens
# after the Authentik check, which still sees the public host. In-cluster
# callers use http://voicestudio.ai.svc.cluster.local (port 80) with a Bearer
# key; that name also goes through Kourier.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voicestudio
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: voicestudio.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - voicestudio.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: voicestudio.ai.svc.cluster.local
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              # SAMEORIGIN, not DENY: the UI previews media in same-origin frames.
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        # ReferenceGrant: kubernetes/apps/kube-system/knative-serving/app/
        # referencegrant-voicestudio.yaml
        - name: kourier-internal
          namespace: kourier-system
          port: 80
---
# Authentik outpost route for the VoiceStudio host (forward-auth login/callback
# flow). No SecurityPolicy here (it would loop); the cross-namespace
# backendRef is allowed by ReferenceGrant allow-ai-namespace-extauth
# (kubernetes/apps/security/authentik/app/referencegrant-ai.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voicestudio-outpost
  namespace: ai
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - voicestudio.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
