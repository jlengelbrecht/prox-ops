---
# Authentik forward auth (Envoy ext_authz) for the voicestudio route only,
# same shape as paperclip/app/securitypolicy.yaml. The outpost route is not
# targeted (it would loop).
# failOpen: false: if Authentik is unreachable, or the VoiceStudio provider is
# not assigned to the embedded outpost, the UI is unreachable rather than
# open. Who may pass is the VoiceStudio application's group binding in the
# Authentik blueprints. The provider has intercept_header_auth off, so the
# Authorization header still reaches VoiceStudio's own key check.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: voicestudio-auth
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: voicestudio
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
      - x-forwarded-uri
      - x-forwarded-method
    failOpen: false
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
