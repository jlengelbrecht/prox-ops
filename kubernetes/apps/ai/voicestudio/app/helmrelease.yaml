---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: voicestudio
  namespace: ai
spec:
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: ai
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      voicestudio:
        strategy: Recreate
        annotations:
          # Roll the pod when the voicestudio-api key rotates in 1Password.
          reloader.stakater.com/auto: "true"
        pod:
          # No Kubernetes API access needed.
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/debpalash/voicestudio
              tag: "0.5.7"
            env:
              # Headless server mode: the admin API key gates every
              # non-loopback request (UI login + Bearer for scripts).
              OMNIVOICE_SERVER_MODE: "1"
              OMNIVOICE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: voicestudio-api
                    key: OMNIVOICE_API_KEY
              OMNIVOICE_DATA_DIR: /app/omnivoice_data
              HF_HOME: /app/omnivoice_data/huggingface
              PYTHONPATH: /app/backend
              PYTHONUNBUFFERED: "1"
              OMNIVOICE_ANALYTICS_DISABLED: "1"
              # CPU phase of EPIC-047. The GPU move pins cuda here.
              OMNIVOICE_DEVICE: cpu
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 3900
                  # First start downloads ~2.4-4 GB of models.
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            # The image has no USER and writes under /app as root. Keep root
            # with no privilege escalation; a non-root run (and dropping ALL
            # capabilities, which may need CHOWN/DAC_OVERRIDE) is a follow-up.
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
                ephemeral-storage: 20Gi
              limits:
                memory: 24Gi
    service:
      app:
        controller: voicestudio
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: voicestudio-data
        globalMounts:
          - path: /app/omnivoice_data
