---
# VoiceStudio admin API key (Bearer token for every non-loopback API call).
# 1Password item: voicestudio (vault Automation, Secure Note)
# Properties:
#   - OMNIVOICE_API_KEY: 64-char alphanumeric key
# A new Secret name (not the old SOPS voicestudio-secret) so Flux pruning the
# old Secret never races ESO creating this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voicestudio-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: voicestudio-api
    creationPolicy: Owner
  data:
    - secretKey: OMNIVOICE_API_KEY
      remoteRef:
        key: voicestudio
        property: OMNIVOICE_API_KEY
