---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# The router itself, from the release artifact. This Flux Kustomization is
# applied by the `agent-router` Kustomization in ../ks.yaml as one of that
# directory's objects, exactly the way flagger-system/pilot-app/app/ks.yaml is
# applied by its wrapper, and for the same reason: cluster-apps patches every
# Kustomization it renders with a spec.patches list of its own, and kustomize
# replaces a list that has no merge key instead of merging it, so a
# spec.patches written on a direct child of cluster-apps is dropped before it
# is applied. The seven patches below are the whole reason this object exists -
# without them the release's placeholder hostname and Gateway would ship, so
# would its portable NetworkPolicy, the pod would carry no credential for a
# private image, it would carry no name for its own plane, every catalog
# export would restart it, its rollout strategy and catalog source would be
# whatever a later base defaults to, and the journal's claim would land on
# whatever the cluster's default storage class is - so it is rendered one
# level down, where nothing rewrites it. ../ks.yaml is untouched by the
# cutover.
#
# The object lives in `ai` because ../ks.yaml sets targetNamespace: ai on
# everything in this directory; the namespace is written out here as well, as
# the sibling files do, so this file reads the same whether it is built by the
# controller or by `flux build kustomization --namespace ai`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-router-base
  namespace: ai
spec:
  dependsOn:
    # The same two things ../ks.yaml waits for: the ExternalSecrets need their
    # operator before the Deployment can mount what they produce, and the
    # catalog is the ConfigMap the router mounts. NOT agent-router: that object
    # applies this one and, with wait: true, waits for it to become Ready, so a
    # dependency on it would wait on itself. The OCIRepository this reads is
    # applied alongside this object and needs no dependsOn - the controller
    # requeues until the artifact is there.
    - name: external-secrets-operator
      namespace: flux-system
    - name: agent-router-catalog
      namespace: ai
  interval: 1h
  # The artifact holds the release's deploy/base at its root.
  path: ./
  # No `components:`. Up to v0.2.4 the kernel audit journal was the release's
  # opt-in component, ./components/journal. From v0.7.0 the base carries it
  # itself - the claim agent-router-journal, its mount and the journal setting
  # - together with the router's store, which lives on the same claim and
  # holds the catalog the console activates. Listing the component as well
  # would only add the same objects a second time.
  #
  # The journal and the store have exactly one writer: the router holds an
  # exclusive lock for as long as it runs, and a second router refuses to
  # start. A RollingUpdate would start the new pod while the old one still
  # holds that lock, so the rollout could never finish. The Deployment has to
  # stay `strategy: Recreate`, which stops the old pod first and costs a short
  # outage on every rollout - an image bump, or a credential rotation the
  # reloader rolls. The base renders Recreate today; the strategy patch below
  # restates it, so a later base cannot change it quietly.
  #
  # A catalog commit does not roll the router. In store mode the mounted
  # catalog is only a first-boot seed, and the reload patch below removes the
  # release's ConfigMap reload annotation, so committing an exported
  # distribution copy changes the ConfigMap and leaves the pod running.
  #
  # Going back to v0.2.4 puts `- ./components/journal` back here, in the same
  # change that re-pins the old release in ocirepository.yaml, after the cold
  # pre-upgrade snapshot of the claim has been restored. The same change
  # removes the reload patch and the strategy and catalog-source patch: v0.2.4
  # reads the mounted catalog as its only catalog, so a catalog commit has to
  # roll it again, and it has no catalog-source setting at all.
  # ocirepository.yaml has the rest of that procedure.
  prune: true
  sourceRef:
    kind: OCIRepository
    name: agent-router-base
    namespace: ai
  targetNamespace: ai
  wait: true
  retryInterval: 1m
  timeout: 5m
  # All seven patches name their object outright instead of through a `target:`
  # selector, on purpose: kustomize treats a selector that matches nothing as
  # nothing to do, and treats a named object that is not there as an error. A
  # release that renames or drops the HTTPRoute, the NetworkPolicy, the
  # Deployment or the journal's claim therefore stops this Kustomization from
  # building, and the objects already in the cluster stay as they are, instead
  # of a Renovate bump quietly shipping the placeholder hostname, an
  # unexpected policy, a pod with no pull credential or a claim on the wrong
  # storage. .github/scripts/spektr-upgrade-check.sh renders these patches
  # against a release before it is merged (step 5); failing closed is what
  # turns a renamed object into a red check there instead of a quiet pass.
  patches:
    # The HTTPRoute's deployment values: the hostname external-dns publishes
    # and the Gateway listener it attaches to. The release ships conspicuous
    # placeholders; these are this cluster's. The lists are replaced whole,
    # which is the intent - one hostname, one parent.
    - patch: |-
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: agent-router
          annotations:
            external-dns.alpha.kubernetes.io/hostname: agent-router.homelab0.org
        spec:
          hostnames:
            - agent-router.homelab0.org
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
    # The release's portable networking.k8s.io NetworkPolicy is removed from
    # the render entirely, and the CiliumNetworkPolicy in this directory - the
    # one this cluster already enforces - is kept verbatim.
    #
    # This is not a preference. Cilium runs here in its default mode and
    # evaluates both policy kinds as a UNION of allow rules, so shipping the
    # portable policy alongside the CNP would only ever widen ingress: patching
    # its placeholder namespace to `network` would admit every pod in that
    # namespace, where the CNP admits only pods owned by the envoy-internal
    # gateway. Leaving it unpatched would ship a REPLACE-ME selector into
    # production instead. The cutover is a change of where the manifests come
    # from; it is not a change to the network posture, and this patch is what
    # makes that true.
    - patch: |-
        $patch: delete
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: agent-router
    # The pull credential for the router image. The base is generic and names
    # no registry secret - a pull secret is a deployment's, not the product's -
    # so the reference is added here, from the Secret externalsecret.yaml
    # renders. The image package is public today; with this in place, making it
    # private is a package setting rather than another change to this
    # directory, which is the point. Nothing is replaced: the base's pod spec
    # carries no imagePullSecrets at all, and an unused pull secret costs a
    # public pull nothing.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: agent-router
        spec:
          template:
            spec:
              imagePullSecrets:
                - name: agent-router-ghcr
    # The plane's name. The base ships the placeholder `unnamed-plane`; v0.2.2+
    # refuses to start without a real value here. `/v1/whoami` and the console
    # answer with this name, so a client confirming the plane before a
    # destructive act confirms something real, not the placeholder. Named
    # outright rather than through a `target:` selector, so it fails closed the
    # same way the others do: a release that drops or renames this
    # container stops the build instead of quietly shipping `unnamed-plane`.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: agent-router
        spec:
          template:
            spec:
              containers:
                - name: agent-router
                  env:
                    - name: AGENT_ROUTER_PLANE_NAME
                      value: homelab
    # No restart for a catalog commit. The release's pod template asks the
    # reloader to roll the router whenever the agent-router-catalog ConfigMap
    # changes, which is right for file mode, where the mounted catalog is the
    # catalog. This deployment runs store mode: the router imports the mounted
    # file only on the first boot of an empty store and afterwards only
    # compares it (release docs/operations/catalog.md, sections 2 and 3). A
    # distribution-copy commit would otherwise cost a Recreate outage and
    # reset the in-memory usage signals for nothing. The release asks overlays
    # to keep its reload annotations; this one is dropped on purpose, and only
    # this one - the null removes the ConfigMap key, and the secret annotation
    # stays, so credential rotations still roll the pod.
    #
    # Switching to AGENT_ROUTER_CATALOG_SOURCE=file (break-glass) must remove
    # this patch in the same change. Without it a catalog edit in file mode
    # would not take effect until the pod next happened to restart.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: agent-router
        spec:
          template:
            metadata:
              annotations:
                configmap.reloader.stakater.com/reload: null
    # The two settings the rest of this file depends on: one writer means
    # Recreate, and the console's authority means the store is the catalog
    # source. Both equal what v0.7.0's base already renders through its
    # journal component. They are restated so that this repository, not a
    # later base default, decides them. A base that switched the strategy with
    # a rollingUpdate block would make the apply fail visibly rather than
    # stall a rollout on the journal's lock. The journal path and its volume
    # stay the base's; nothing here restates them.
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: agent-router
        spec:
          strategy:
            type: Recreate
          template:
            spec:
              containers:
                - name: agent-router
                  env:
                    - name: AGENT_ROUTER_CATALOG_SOURCE
                      value: store
    # The journal's claim, which also holds the store from v0.7.0. It comes
    # from the release, which cannot know this cluster's storage; this pins it
    # to ceph-block, which is
    # block storage attached to one node at a time - what the journal's lock
    # needs. Never a shared filesystem class such as ceph-filesystem: a lock
    # that is not seen by every client would let two routers each believe they
    # are the only writer. ReadWriteOncePod goes further than the lock and has
    # the API server refuse a second pod on the claim outright; ceph-block was
    # checked to provision and bind it before it was written here.
    #
    # Both fields are fixed for the life of the claim: the API server refuses
    # a change to either once it exists, so changing storage means a new claim
    # and a restore. The size is the one thing that can change, and only by
    # adding spec.resources.requests.storage to this patch - never kubectl,
    # because Flux would reapply the release's size and the API server refuses
    # a shrink.
    #
    # The release's claim already carries the prune annotation. It is repeated
    # here so it does not depend on what a later base carries: whatever takes
    # the claim out of this Kustomization's inventory, Flux leaves the claim
    # and the store on it in place. Deleting them is a separate, deliberate
    # act.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: agent-router-journal
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
        spec:
          storageClassName: ceph-block
          accessModes:
            - ReadWriteOncePod
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: agent-router
        spec:
          template:
            spec:
              containers:
                - name: agent-router
                  env:
                    - name: HOOK_PLANE_URL
                      value: https://agent-router.homelab0.org
