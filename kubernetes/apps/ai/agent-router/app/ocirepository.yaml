---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
#
# Where the deployment gets the router's manifests. Each release of
# ai-control-plane pushes deploy/base at its tag as an OCI artifact, and this
# object is the only thing in the cluster that names it. ks.yaml beside it is
# what consumes it.
#
# The package is private by design - the repository and everything it publishes
# stay private until the owner says otherwise - so source-controller pulls the
# artifact with a registry credential rather than anonymously. `secretRef`
# below names the dockerconfigjson Secret externalsecret.yaml renders from
# 1Password; without it the pull fails and nothing here reconciles.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-router-base
  namespace: ai
spec:
  interval: 1h
  url: oci://ghcr.io/jlengelbrecht/agent-router-base
  secretRef:
    name: agent-router-ghcr
  # THE RELEASE THIS DEPLOYMENT CONSUMES. One line, one version number: the
  # cutover commit sets it to the release being adopted, a rollback sets it
  # back. The artifact pins the container image by digest, so nothing else in
  # this directory names a version. Bumping it moves the Deployment, the
  # Service and the HTTPRoute in one step, which is why the packageRules entry
  # in .github/renovate/autoMerge.json5 (the entry this cutover added) keeps
  # Renovate from merging a bump on its
  # own. The comment above `ref` is the shape every OCIRepository in this tree
  # carries; Renovate's flux manager reads the tag on its own.
  # renovate: datasource=docker depName=ghcr.io/jlengelbrecht/agent-router-base
  ref:
    tag: v0.1.0
    # The immutable reference: the digest the release published for this base
    # artifact, printed in the Release body and checked against the tag there
    # (VERSIONING.md §2, AD-11: consume by digest, never a mutable tag). Flux
    # pulls the digest when both are set; the tag stays for people and for
    # Renovate, which bumps the pair together. The cutover bumps both.
    digest: sha256:2bce4ad68cdf8fc471c4b927afeae5dca4781b9923edfba6a0dd3db3cb70e602
