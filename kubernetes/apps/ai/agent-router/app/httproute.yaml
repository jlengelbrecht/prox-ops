---
# TLS-terminated path the contract mandates for the off-cluster edge
# heartbeat (contracts/agent-router/openapi.yaml `servers[1]`). LAN-internal
# only - no route on the external/cloudflare path. Standard ai-app pattern,
# matching litellm and open-webui.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-router
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: agent-router.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - agent-router.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agent-router
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Frame-Options
                value: "DENY"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
