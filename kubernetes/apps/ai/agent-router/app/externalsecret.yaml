---
# Two ExternalSecrets, two distinct authorities (STORY-035-9b) - deliberately
# not merged into one Secret:
#
#   agent-router-caller-token authenticates GET /v1/status callers.
#
#   agent-router-node-credentials authenticates the cachyos-7900xtx edge
#   worker's heartbeat identity. It reads a NEW 1Password property,
#   `router-credential`, on the existing item `edge-cachyos-7900xtx` -
#   deliberately NOT the `credential` property that agentgateway-pilot's
#   edge-cachyos-7900xtx-externalsecret.yaml already reads. That property
#   authenticates inference requests INTO the edge (llama-swap validates it);
#   this one lets the edge ASSERT capacity state TO the router. Two different
#   authorities, two different secrets - a compromise of one must not grant
#   the other.
#
# The target Secret key for the node credential is the literal node id,
# `cachyos-7900xtx` - deployment.yaml mounts this Secret as a directory with
# no `items:` override, so the key becomes the filename, and the filename IS
# the node binding the 35.9a loader maps into AGENT_ROUTER_NODE_CREDENTIALS_DIR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router-caller-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-router-caller-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-router
        property: caller-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router-node-credentials
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-router-node-credentials
    creationPolicy: Owner
  data:
    - secretKey: cachyos-7900xtx
      remoteRef:
        key: edge-cachyos-7900xtx
        property: router-credential
