---
# Two ExternalSecrets, two distinct authorities (STORY-035-9b) - deliberately
# not merged into one Secret:
#
#   agent-router-caller-token authenticates GET /v1/status callers.
#
#   agent-router-node-credentials authenticates the cachyos-7900xtx edge
#   worker's heartbeat identity. It reads a NEW 1Password property,
#   `router-credential`, on the CachyOS edge worker item -
#   deliberately NOT the `credential` property that agentgateway-pilot's
#   edge-cachyos-7900xtx-externalsecret.yaml already reads. That property
#   authenticates inference requests INTO the edge (llama-swap validates it);
#   this one lets the edge ASSERT capacity state TO the router. Two different
#   authorities, two different secrets - a compromise of one must not grant
#   the other.
#
# The target Secret keys are literal node ids. The release mounts this Secret
# as a directory with no `items:` override, so each key becomes the filename
# used as the node binding in AGENT_ROUTER_NODE_CREDENTIALS_DIR. Internal ESO
# aliases below are deliberately distinct from those published filenames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router-caller-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-router-caller-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-router
        property: caller-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router-node-credentials
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-router-node-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Only these two node-id filenames reach the mounted Secret. The source
      # aliases are inputs to the template, never extra Secret keys.
      mergePolicy: Replace
      data:
        cachyos-7900xtx: "{{ .cachyosNode }}"
        bazzite-5090: "{{ .bazziteNode }}"
  data:
    - secretKey: cachyosNode
      remoteRef:
        key: CachyOS edge worker
        property: router-credential
    # EPIC-035 (bazzite bring-up): same shape, same split, for the Bazzite
    # edge worker. The filename IS the node binding, so the key is the
    # literal placement name. ORDERING: the 1Password item edge-bazzite-5090
    # (vault Automation) with property `router-credential` must exist BEFORE
    # this lands, or the WHOLE node-credentials Secret stops refreshing
    # (one ExternalSecret, one sync) - which would also block cachyos token
    # rotation until fixed.
    - secretKey: bazziteNode
      remoteRef:
        key: edge-bazzite-5090
        property: router-credential
---
# THE THIRD ONE IS NEW WITH THE CUTOVER, and it is the only object in this file
# the product asks for: a GHCR pull secret rendered from a classic PAT in
# 1Password, the same shape tools/glycemicgpt-bot already uses for its private
# image. The template packages `username:password` into a dockerconfigjson
# blob, and two readers take it - source-controller pulls the
# agent-router-base artifact with it (ocirepository.yaml's `secretRef`) and the
# kubelet pulls the router image with it (the imagePullSecrets patch in
# ks.yaml). The packages are private by design and stay that way until the
# owner says otherwise.
#
# ORDERING: the 1Password item `agent-router-ghcr` (properties `username` and
# `password`, a classic PAT with read:packages) must exist BEFORE this lands,
# or the Secret never renders and the artifact pull fails.
#
# Rotate by updating the PAT in 1Password - the next refresh re-renders the
# Secret, and nothing has to restart: a pull secret is read at pull time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router-ghcr
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-router-ghcr
    creationPolicy: Owner
    template:
      # Pin the template engine - v2 is required for the sprig `b64enc` /
      # `toJson` pipes below. The ESO default was flipped from v1 to v2 in
      # 0.9.x; pin so upgrades cannot silently regress the auth blob.
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # `toJson` wraps its output in double quotes AND JSON-escapes any
        # special chars in the PAT (quotes, backslashes, newlines). A
        # credential containing one of those rotates cleanly without producing
        # an invalid dockerconfigjson - an ImagePullBackOff that reads like a
        # permissions problem. The `auth` field is base64 bytes, so no escaping
        # is needed there.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":{{ .username | toJson }},"password":{{ .password | toJson }},"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: agent-router-ghcr
        property: username
    - secretKey: password
      remoteRef:
        key: agent-router-ghcr
        property: password
---
# THE FOURTH ONE COMES WITH v0.7.0: the operator credential. From v0.7.0 the
# router keeps its catalog in its own store and changes it only through the
# console's operator API, which authenticates an operator by this credential.
# It is a third authority beside the two at the top of this file: a caller
# token asks for routes, a node credential reports capacity, and only an
# operator credential changes what the plane routes. No value is shared with a
# caller or node credential - the release checks that the sets are disjoint at
# startup and refuses to start if they are not.
#
# The target key is the operator's identity, `josh`, the one operator today. A
# second operator is a second key here, backed by its own 1Password property.
#
# Its own ExternalSecret rather than a second key on agent-router-caller-token,
# for the reason the node-credentials comment gives: one ExternalSecret is one
# sync, so a missing operator property must stop only this Secret, never
# caller-token rotation.
#
# ORDERING: the property `operator-token` on the existing 1Password item
# `agent-router` (vault Automation, read by the cluster's onepassword-connect
# store) is a proposed mapping, not one already seen from here. This lands on
# its own, before the base moves to v0.7.0, and ESO reporting it Ready is the
# proof the property exists. v0.2.4 mounts nothing by this name, so until the
# version bump it is an inert Secret; if it does not sync, the bump waits.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-router-operator-credentials
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-router-operator-credentials
    creationPolicy: Owner
  data:
    - secretKey: josh
      remoteRef:
        key: agent-router
        property: operator-token
