---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: langfuse-secrets
        property: NEXTAUTH_SECRET
    - secretKey: SALT
      remoteRef:
        key: langfuse-secrets
        property: SALT
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: langfuse-secrets
        property: ENCRYPTION_KEY
    - secretKey: POSTGRES_USER
      remoteRef:
        key: langfuse-secrets
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: langfuse-secrets
        property: POSTGRES_PASSWORD
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: langfuse-secrets
        property: CLICKHOUSE_PASSWORD
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: langfuse-secrets
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: langfuse-secrets
        property: S3_SECRET_KEY
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: langfuse-secrets
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: langfuse-secrets
        property: OIDC_CLIENT_SECRET
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse-secrets
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse-secrets
        property: LANGFUSE_SECRET_KEY
---
# Valkey mounts its users Secret as files, so it gets a Secret holding only
# its own password: `password` for the clients, `default` for the ACL user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-valkey
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: langfuse-valkey
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: langfuse-secrets
        property: VALKEY_PASSWORD
    - secretKey: default
      remoteRef:
        key: langfuse-secrets
        property: VALKEY_PASSWORD
