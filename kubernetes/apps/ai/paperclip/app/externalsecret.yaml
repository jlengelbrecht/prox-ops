---
# Paperclip runtime secrets from the 1Password item `paperclip-secrets`,
# injected with envFrom. PAPERCLIP_SECRETS_MASTER_KEY is set explicitly so the
# key that encrypts stored agent secrets lives (and is backed up) in
# 1Password instead of being generated onto the PVC. Upstream accepts 64 hex
# characters or base64 that decodes to exactly 32 bytes and refuses to start
# on anything else (server/src/secrets/local-encrypted-provider.ts).
# Rotating a field rolls the pod via the Reloader annotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperclip-secrets
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef: {key: paperclip-secrets, property: BETTER_AUTH_SECRET}
    - secretKey: PAPERCLIP_SECRETS_MASTER_KEY
      remoteRef: {key: paperclip-secrets, property: PAPERCLIP_SECRETS_MASTER_KEY}
    - secretKey: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
      remoteRef: {key: paperclip-secrets, property: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
---
# DATABASE_URL for the `paperclip` role on the shared CloudNativePG cluster,
# read from the same 1Password fields the cluster uses to manage the role
# (no cross-namespace Secret reads). Without DATABASE_URL Paperclip silently
# starts an embedded Postgres on the PVC, so this Secret is mandatory.
# Credentials are URL-encoded so a rotated password containing reserved
# characters cannot corrupt the URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-db
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperclip-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/paperclip"
  data:
    - secretKey: username
      remoteRef: {key: postgres-cluster, property: PAPERCLIP_USER}
    - secretKey: password
      remoteRef: {key: postgres-cluster, property: PAPERCLIP_PASSWORD}
