---
# Paperclip runs agent code in-pod, so this policy is the main containment
# boundary (EPIC-036 §4).
# - Ingress: the envoy-internal gateway pods on 3100, and the Hermes pod on
#   3100 for its agent callbacks (paperclipApiUrl, authenticated with the
#   per-run key Paperclip injects). Nothing else in the ai namespace may
#   reach Paperclip.
# - Egress: kube-dns, the shared CloudNativePG cluster on 5432, the gateway
#   pods on 443/10443 for the Hermes API over TLS (hermes-api.homelab0.org)
#   and the Hermes gateway API server on 8642 (hermes_gateway adapter,
#   Bearer API_SERVER_KEY), nothing else. The Hermes lanes are mirrored in
#   Hermes' own policy (hermes-hindsight/app/networkpolicy.yaml). With
#   telemetry and announcements off, Paperclip needs no internet egress.
#   In-pod agent egress (LLM APIs, git forges, npm) arrives with its
#   enrollment as an explicit toFQDNs allow-list, with dnsConfig ndots:1 on
#   the pod so FQDN matching sees the names the pod actually resolves.
#   Never a blanket world:443 rule.
# The pod selector is the label app-template renders from the release name.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperclip
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Hermes agent callbacks (chart labels of the hermes release, the same
    # selector the Hermes policy uses).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes-agent
            app.kubernetes.io/instance: hermes
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Shared CloudNativePG cluster (postgres-rw); its own policy already
    # admits ingress from the ai namespace on 5432.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Hermes API over TLS (apiBaseUrl https://hermes-api.homelab0.org, the
    # hermes-api route in hermes-hindsight/app/access.yaml). Same shape as
    # the Hermes OIDC rule: in-cluster DNS can answer a homelab0.org name
    # with either gateway VIP, so both gateway workloads are admitted, on
    # the LoadBalancer port 443 and the pods' 10443 behind it. L3/L4 by pod
    # identity, no hostname or SNI check: Paperclip may reach every host
    # routed on either gateway, not only hermes-api.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # Hermes gateway API server directly
    # (http://hermes.ai.svc.cluster.local:8642): run start, SSE events and
    # the /health check of the hermes_gateway adapter.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes-agent
            app.kubernetes.io/instance: hermes
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
