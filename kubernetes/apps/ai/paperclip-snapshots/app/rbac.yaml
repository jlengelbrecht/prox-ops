---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-snapshots
---
# VolumeSnapshots in this namespace, create/list/delete only. No get or watch:
# the job reads through list with a metadata.name field selector and deletes
# with --wait=false, so neither is needed. No access to PVCs, Secrets or
# anything outside the namespace.
#
# One narrow addition: get on the paperclip Deployment by name only, so
# the job can stamp each snapshot with the image it was taken under. Nothing else in the ai namespace is readable through this Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperclip-snapshots
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["paperclip"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-snapshots
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperclip-snapshots
subjects:
  - kind: ServiceAccount
    name: paperclip-snapshots
    namespace: ai
