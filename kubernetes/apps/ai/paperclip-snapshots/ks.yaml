---
# Scheduled crash-consistent snapshots of the Paperclip data claim
# (paperclip-data: uploads, agent workspaces, CLI logins, config). The
# database lives on the shared CNPG cluster and is NOT covered here.
# Snapshots sit on the same Ceph cluster: point-in-time recovery, not an
# off-cluster backup (EPIC-036 follow-up F3).
#
# dependsOn namespace: the class Kustomization is declared in
# kubernetes/apps/kube-system/snapshot-controller/ks.yaml, and that tree's
# `namespace: kube-system` transform puts its CR in kube-system. This file's
# own CR lands in ai (the ai tree's transform), which is not the value to
# name here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperclip-snapshots
  namespace: flux-system
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: snapshot-controller-class
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/ai/paperclip-snapshots/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
