---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

resources:
  - ./namespace.yaml
  # EPIC-022: Local AI Platform
  # Architecture validated: 2025-12-10
  # See: .claude/.ai-docs/epics/EPIC-022-local-ai-platform.md
  #
  # Phase 1: Core Platform
  - ./open-webui/storage/ks.yaml  # Storage with prune: false - MUST come before open-webui
  - ./open-webui/ks.yaml          # STORY-081: Chat UI
  #
  # Phase 2: API Layer
  - ./litellm-postgres/storage/ks.yaml  # PostgreSQL storage with prune: false
  - ./litellm-postgres/ks.yaml          # PostgreSQL for LiteLLM virtual keys
  - ./litellm/storage/ks.yaml  # Storage with prune: false - MUST come before litellm
  - ./litellm/ks.yaml          # STORY-075: OpenAI-compatible API gateway
  #
  # Phase 3: Web Search (STORY-085)
  - ./searxng/ks.yaml           # SearXNG meta-search engine
  # Note: Firecrawl self-hosted removed (STORY-062) - using Firecrawl.dev cloud API via LiteLLM
  #
  #
  # Phase 5: KServe ML Inference Platform (EPIC-028)
  # Scalable serverless AI inference with Knative + vLLM
  # See: .claude/.ai-docs/epics/EPIC-028-scalable-ai-inference-platform.md
  - ./model-cache/ks.yaml         # STORY-137: Shared model cache (500Gi CephFS RWX)
  - ./kserve/ks.yaml              # STORY-136: KServe controller + CRDs
  #
  # Phase 6: retained Moltbot storage (EPIC-029); the gateway runtime was removed
  - ./moltbot/storage/ks.yaml    # Storage with prune: false - MUST come before moltbot
  #
  # Phase 7: Voice Calling (EPIC-031)
  - ./voicestudio/ks.yaml        # EPIC-047: VoiceStudio voice pipeline
  - ./deepseek/storage/ks.yaml   # DeepSeek V4.1 Flash pilot: model volume (prune: false)
  - ./deepseek/ks.yaml           # DeepSeek V4.1 Flash on the A5000 via Strata (scale to zero)
  #
  # EPIC-035: Unified Agent Control Plane
  - ./agent-router-catalog/ks.yaml  # STORY-035-1: model/capability catalog (inert, no consumer)
  - ./agent-router/ks.yaml          # STORY-035-9b: agent-router deployment, pinned to the 35.9a digest
  - ./spektr/ks.yaml                # STORY-035-9g: internal FQDN for the Spektr operator console
  - ./agent-router-snapshots/ks.yaml  # STORY-035-9j: scheduled journal snapshots (ceph-block-snapshot)
  #
  # Hermes agent + dashboard (Hindsight memory follows). Storage Kustomization
  # (prune: false) and app Kustomization are both declared in this file.
  - ./hermes-hindsight/ks.yaml
  - ./hermes-hindsight/auth-placement.ks.yaml  # one-shot CODEX_HOME placement proof
  #
  # EPIC-036: Paperclip agent-orchestration control plane
  - ./paperclip/storage/ks.yaml  # Storage with prune: false - MUST come before paperclip
  - ./paperclip/ks.yaml          # STORY-036-3: app, routes, forward auth, network policy
  - ./paperclip-snapshots/ks.yaml  # STORY-036-4: scheduled paperclip-data snapshots (ceph-block-snapshot)
