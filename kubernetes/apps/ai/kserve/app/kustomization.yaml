---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # The kserve namespace. kserve.yaml stopped shipping it in 0.17, so it is declared
  # here; without it Flux would prune the namespace and everything in it.
  - ./namespace.yaml
  # renovate: datasource=github-releases depName=kserve/kserve
  # KServe CRDs and core components (controller, webhook)
  # Upgraded one minor at a time; KServe 0.17 to 0.21 are tested with Knative 1.21.
  # Note: Installing in serverless mode with Knative Serving integration
  - https://github.com/kserve/kserve/releases/download/v0.17.0/kserve.yaml
  # renovate: datasource=github-releases depName=kserve/kserve
  # KServe cluster resources (ClusterServingRuntimes for various frameworks)
  - https://github.com/kserve/kserve/releases/download/v0.17.0/kserve-cluster-resources.yaml
  # Production InferenceServices
  - ./qwen36-27b-inferenceservice.yaml  # Qwen3.6-27B via llama.cpp with MTP speculative decoding
  - ./qwen36-27b-networkpolicy.yaml  # Zero-trust network segmentation
  - ./qwen3-4b-dub-inferenceservice.yaml  # Qwen3-4B-Instruct on the RTX A2000 (dub line rewriting)
  - ./qwen3-4b-dub-networkpolicy.yaml

# Note: KServe controller installs in kserve namespace by default
# InferenceServices can be created in any namespace (e.g., ai)

# Disable hash suffix for ConfigMaps so KServe can find them by name
generatorOptions:
  disableNameSuffixHash: true

# Configure KServe for serverless (Knative) mode
configMapGenerator:
  - name: inferenceservice-config
    namespace: kserve
    behavior: merge
    literals:
      # Enable serverless deployment mode (uses Knative)
      - deploy={"defaultDeploymentMode":"Serverless"}
      # renovate: datasource=docker depName=kserve/storage-initializer
      # Configure storage initializer for model downloads
      # The storage-initializer stays on v0.21.0 while the controller catches up to it:
      # releases before 0.17.0 have a path-traversal flaw in tar extraction, and v0.21.0
      # has run cleanly against the 0.13 to 0.16 controllers.
      # This literal replaces the whole value, so it must carry every key the controller
      # parses: from 0.16 the controller fails every reconcile if cpuModelcar or
      # memoryModelcar is missing. Values are upstream's defaults for this release.
      - storageInitializer={"image":"kserve/storage-initializer:v0.21.0","memoryRequest":"100Mi","memoryLimit":"1Gi","cpuRequest":"100m","cpuLimit":"1","caBundleConfigMapName":"","caBundleVolumeMountPath":"/etc/ssl/custom-certs","enableModelcar":true,"cpuModelcar":"10m","memoryModelcar":"15Mi","uidModelcar":1010}
      # Configure ingress (uses Kourier from Knative, not Istio)
      # Note: ingressGateway is required by KServe validation even with disableIstioVirtualHost=true.
      # It points at Kourier but isn't used when disableIstioVirtualHost is enabled. (ingressService
      # was dropped from the config in KServe 0.14.)
      - ingress={"ingressClassName":"kourier.ingress.networking.knative.dev","ingressDomain":"svc.cluster.local","domainTemplate":"{{.Name}}.{{.Namespace}}.svc.cluster.local","urlScheme":"http","disableIstioVirtualHost":true,"ingressGateway":"knative-serving/knative-ingress-gateway"}

patches:
  # Add resource limits to controller manager
  - target:
      kind: Deployment
      name: kserve-controller-manager
      namespace: kserve
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

  # The LLMInferenceService controller (llmisvc, added in KServe 0.16) is bound to
  # a ClusterRole with create/delete/update on Secrets, ServiceAccounts, Services
  # and RBAC across the cluster. Nothing here uses LLMInferenceService, so keep it
  # inert: no cluster binding, no replicas, and no webhooks pointing at a service
  # with no pods (they would block Flux from applying the default configs).
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: llmisvc-manager-rolebinding
  - patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: llminferenceservice.serving.kserve.io
  - patch: |-
      $patch: delete
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: llminferenceserviceconfig.serving.kserve.io
  - target:
      kind: Deployment
      name: llmisvc-controller-manager
      namespace: kserve
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # ClusterStorageContainer is cluster-scoped, but kserve.yaml 0.17 gives the default
  # one a namespace. Flux tracks objects by namespace and name, so leaving it would
  # make the existing object look stale and get pruned. Drop the namespace so it stays
  # the same object.
  - target:
      kind: ClusterStorageContainer
      name: default
    patch: |-
      - op: remove
        path: /metadata/namespace

  # From 0.17 the LLMInferenceService CRDs serve v1alpha1 and v1alpha2 and convert
  # between them through a webhook run by the llmisvc controller. That controller is
  # kept at zero replicas, so any read of an object stored at the other version fails
  # and Flux cannot apply the default configs. Nothing here uses these objects, so
  # switch the conversion to None (the API server only rewrites apiVersion). Restore
  # the webhook if the llmisvc controller is ever turned on.
  - target:
      kind: CustomResourceDefinition
      name: llminferenceserviceconfigs.serving.kserve.io
    patch: |-
      - op: replace
        path: /spec/conversion
        value:
          strategy: None
      - op: remove
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
  - target:
      kind: CustomResourceDefinition
      name: llminferenceservices.serving.kserve.io
    patch: |-
      - op: replace
        path: /spec/conversion
        value:
          strategy: None
      - op: remove
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
