---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - configmap.yaml
  - externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: litellm-copilot-session-guard
    namespace: ai
    files:
      - copilot_session_guard.py=callbacks/copilot_session_guard.py
generatorOptions:
  disableNameSuffixHash: true
