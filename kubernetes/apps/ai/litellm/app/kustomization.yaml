---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - configmap.yaml
  - externalsecret.yaml
  - httproute.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: litellm-copilot-session-guard
    namespace: ai
    files:
      - copilot_session_guard.py=callbacks/copilot_session_guard.py
      - project_router_guard.py=callbacks/project_router_guard.py
      - project_grok_native.py=callbacks/project_grok_native.py
      - grok_response_filter.py=callbacks/grok_response_filter.py
      - local_model_content_logging.py=callbacks/local_model_content_logging.py
generatorOptions:
  disableNameSuffixHash: true
