---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    # LiteLLM Proxy Configuration
    # Provides OpenAI-compatible API gateway for OpenAI and KServe models
    #
    # AUTHENTICATION: Required via LITELLM_MASTER_KEY environment variable
    # All API requests must include: Authorization: Bearer <master-key>
    # Master key stored in 1Password and injected via ExternalSecret
    #
    # Reference: https://docs.litellm.ai/docs/routing

    model_list:
      # =====================================================
      # OpenAI Models
      # Proxied via LiteLLM for unified API access
      # =====================================================
      - model_name: "gpt-4"
        litellm_params:
          model: "gpt-4o-mini"
          api_key: "os.environ/OPENAI_API_KEY"
        model_info:
          description: "OpenAI GPT-4o-mini"

      - model_name: "gpt-3.5-turbo"
        litellm_params:
          model: "gpt-4o-mini"
          api_key: "os.environ/OPENAI_API_KEY"
        model_info:
          description: "OpenAI GPT-4o-mini (gpt-3.5-turbo compat)"

      # =====================================================
      # Anthropic passthrough, for real Claude Code clients only
      # No api_key here on purpose, and none in the pod environment. A client
      # that forwards its own Claude Code login (Authorization: Bearer
      # sk-ant-oat...) is passed through; a request without one fails with
      # "Missing Anthropic API Key" and no stored credential is ever used.
      # Never store a Claude subscription token in LiteLLM, and only give this
      # model to virtual keys held by Claude Code users. Header forwarding is
      # scoped to this model group in litellm_settings.model_group_settings.
      # Reference: https://docs.litellm.ai/docs/tutorials/claude_code_max_subscription
      # =====================================================
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"

      # =====================================================
      # ChatGPT Pro subscription (chatgpt/ provider)
      # One OAuth login for the whole proxy, stored in auth.json under
      # CHATGPT_TOKEN_DIR (PVC litellm-data, see helmrelease.yaml). Spend is
      # recorded as $0, so only rpm/tpm and key limits bound usage.
      # Chat completions are bridged to the Codex Responses backend; sampling
      # and token-limit parameters are dropped by the bridge.
      # =====================================================

      # Merge steward PR review. Pinned, no fallbacks, not on the smart router.
      # If the login or the model is unavailable the request fails and the
      # steward reports needs-human. Keep this name out of any fallbacks list.
      - model_name: "merge-steward-review"
        litellm_params:
          model: "chatgpt/gpt-6.1-sol"
          reasoning_effort: "high"
          timeout: 300
          max_retries: 0
        model_info:
          description: "Merge steward review on ChatGPT Pro. Pinned, no fallbacks."

      - model_name: "chatgpt-gpt-6-luna"
        litellm_params:
          model: "chatgpt/gpt-6-luna"
          timeout: 180
        model_info:
          description: "ChatGPT Pro gpt-6-luna (smart-router MEDIUM tier)"

      - model_name: "chatgpt-gpt-6-sol"
        litellm_params:
          model: "chatgpt/gpt-6-sol"
          timeout: 300
        model_info:
          description: "ChatGPT Pro gpt-6-sol (smart-router COMPLEX tier)"

      - model_name: "chatgpt-gpt-6.1-sol"
        litellm_params:
          model: "chatgpt/gpt-6.1-sol"
          reasoning_effort: "high"
          timeout: 300
        model_info:
          description: "ChatGPT Pro gpt-6.1-sol (smart-router REASONING tier)"

      # =====================================================
      # smart-router: complexity-based routing for callers that want it.
      # Heuristic scorer (no classifier model call), one model per tier, no
      # pools and no adaptive selection. Tiers resolve to the model names in
      # this list. SIMPLE and MEDIUM share a subscription model: a deterministic
      # routing choice, not a benchmark result.
      # Reference: https://docs.litellm.ai/docs/proxy/auto_routing
      # =====================================================
      - model_name: "smart-router"
        litellm_params:
          model: "auto_router/complexity_router"
          complexity_router_config:
            classifier_type: heuristic
            adaptive: false
            tiers:
              SIMPLE: "chatgpt-gpt-6-luna"
              MEDIUM: "chatgpt-gpt-6-luna"
              COMPLEX: "chatgpt-gpt-6-sol"
              REASONING: "chatgpt-gpt-6.1-sol"
        model_info:
          description: "Complexity router: ChatGPT Pro models by tier"

      # =====================================================
      # STORY-150: Timeout optimization for cold starts
      # Extended per-model timeouts to accommodate cold start delays
      # Retries disabled globally via router_settings.num_retries: 0
      # Actual cold start measured: ~100-420s depending on model
      # =====================================================

      # =====================================================
      # Qwen3-4B-Instruct on the RTX A2000 (k8s-work-4, 6GB, shared with Plex)
      # Short English rewriting for dub line fitting; JA->EN subtitle translation
      # =====================================================
      - model_name: "dub-text"
        litellm_params:
          model: "openai/qwen3-4b-instruct"
          api_base: "http://qwen3-4b-dub-predictor.ai.svc.cluster.local/v1"
          api_key: "dummy"
          timeout: 180        # Cold start (~30-60s) plus generation
        model_info:
          description: "KServe Qwen3-4B-Instruct on A2000 (~3GB VRAM, scale-to-zero, ~30-60s cold start)"

    router_settings:
      # STORY-150: Disable retries to prevent retry storms during KServe cold starts
      # Per-model num_retries in litellm_params is NOT supported - only router_settings applies
      # With 100-420s cold starts, retries would cascade into multiple concurrent requests
      num_retries: 0
      # Timeout for routing decisions (not per-request timeout)
      timeout: 120

    # =====================================================
    # EPIC-022: Guardrails Configuration
    # Guardrails are managed via UI/database for on-the-fly changes
    # Config here serves as bootstrap/fallback definition
    # Primary management: LiteLLM UI > Guardrails page
    # Reference: https://docs.litellm.ai/docs/proxy/guardrails/quick_start
    #
    # STORY: Local KServe models / Claude Code must bypass guardrails
    # ------------------------------------------------------------------
    # Both guardrails were previously `default_on: true`, meaning they ran
    # on EVERY request (pre_call/during_call) with no way to exempt local
    # KServe models. When the OpenAI account backing "openai-mod" hit its
    # rate limit, the pre_call moderation check 429'd on every single
    # request - including calls to fully self-hosted models (qwen36-27b,
    # qwen-coder, dolphin-chat, etc.) and Claude Code - because pre_call
    # guardrails run BEFORE routing decides which model to call.
    #
    # Per LiteLLM docs (https://docs.litellm.ai/docs/proxy/guardrails/quick_start):
    #   "default_on: true ... will run even if user specifies a different
    #    guardrail or empty guardrails array" - i.e. default_on guardrails
    #   CANNOT be excluded per-request, per-model, or per-key while
    #   default_on remains true.
    #
    # The only per-model (`model_list[].litellm_params.guardrails`) and
    # per-virtual-key (`/key/generate` `guardrails` field) scoping
    # mechanisms are Enterprise-only features (confirmed in the same doc
    # under "Model-level Guardrails" and "Control Guardrails per API Key" -
    # both flagged "Enterprise only feature"). We run the OSS
    # litellm-database image with no LiteLLM Enterprise license, so those
    # mechanisms are not available to us.
    #
    # Chosen fix: flip both guardrails to `default_on: false`. They stay
    # fully defined/enabled (API keys, mode, provider all intact) and can
    # still be enforced by ANY caller - local or external - by explicitly
    # requesting them per-call, which IS a base OSS feature:
    #
    #   curl http://litellm.../v1/chat/completions \
    #     -d '{"model": "gpt-4", "messages": [...], \
    #          "guardrails": ["openai-mod", "lakera-guard"]}'
    #
    # KServe local models and Claude Code never set this field, so they
    # bypass both guardrails entirely (no OpenAI moderation call, no
    # Lakera call). Any future public-facing / external-model route can
    # opt back in by adding the "guardrails" field to its requests.
    # =====================================================
    guardrails:
      # Lakera AI - Prompt injection detection
      # Uses lakera_v2 API (not lakera_prompt_injection)
      # default_on: false - no longer runs automatically on every request.
      # Opt in per-request with "guardrails": ["lakera-guard"].
      # Reference: https://docs.litellm.ai/docs/proxy/guardrails/lakera_ai
      - guardrail_name: "lakera-guard"
        litellm_params:
          guardrail: lakera_v2
          mode: "during_call"
          default_on: false
          api_key: os.environ/LAKERA_API_KEY
          api_base: "https://api.lakera.ai"

      # OpenAI Moderation - Content policy compliance (free)
      # default_on: false - no longer runs automatically on every request.
      # This was the guardrail 429'ing on every call once the OpenAI
      # account hit its moderation rate limit, blocking ALL completions
      # (including local KServe models) before routing. Opt in per-request
      # with "guardrails": ["openai-mod"] for public/external model usage.
      # Reference: https://docs.litellm.ai/docs/proxy/guardrails/openai_moderation
      - guardrail_name: "openai-mod"
        litellm_params:
          guardrail: openai_moderation
          mode: "pre_call"
          default_on: false
          api_key: os.environ/OPENAI_API_KEY

    general_settings:
      # Stop the 5-minute upstream /v1/models discovery (router.arefresh_model_info).
      # It counts as traffic for the scale-to-zero KServe models, so qwen36-27b never unloads.
      disable_model_info_refresh: true
      # Client headers are NOT forwarded globally. Only the anthropic/* model group
      # forwards them (litellm_settings.model_group_settings), so a Claude Code
      # login reaches Anthropic and nothing else sees client headers.
      # Rate limiting
      max_parallel_requests: 50
      # STORY-150: Request timeout must accommodate the longest model cold start
      # Per-model timeouts take precedence, but this is the fallback default
      request_timeout: 420
      # STORY-059: Allow setting api_base for search tools via admin API
      # Required to configure self-hosted SearXNG endpoint
      allow_client_side_credentials: true
      # SSO (Authentik) is configured via GENERIC_* env vars. Turn off the
      # username/password login form so empty or env credentials cannot log in.
      disable_password_login_when_sso_enabled: true

    litellm_settings:
      # Drop unsupported params instead of erroring
      drop_params: true
      # Forward client headers (the Claude Code login) to the anthropic/* models only
      model_group_settings:
        forward_client_headers_to_llm_api:
          - "anthropic/*"
      # Enable logging for audit
      set_verbose: false
      # Note: Custom callback removed - using direct api_key in model config instead

      # =====================================================
      # STORY-060: Caching - Valkey (Redis-compatible) Integration
      # Caches LLM responses to reduce API costs and latency
      # Also enables rate limiting across LiteLLM instances
      # Reference: https://docs.litellm.ai/docs/proxy/caching
      # Known issue: https://github.com/BerriAI/litellm/issues/11243
      # =====================================================
      # Connection via env vars: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
      # (os.environ/ syntax doesn't work in cache_params)
      cache: true
      cache_params:
        type: redis
        # Cache key namespace prefix (prevents key collision, best practice)
        namespace: litellm
        # Cache TTL in seconds (1 hour default)
        ttl: 3600

    # =====================================================
    # STORY-059: Search Tools - Firecrawl & SearXNG
    # NOTE: LiteLLM v1.81.0 loads search tools from DATABASE only, not config
    # Tools must be added via UI (Search Tools page) or API:
    #   POST /search_tools with search_tool.litellm_params.search_provider
    # Reference: https://docs.litellm.ai/docs/search/searxng
    # Reference: https://docs.litellm.ai/docs/search/firecrawl
    #
    # Configured tools (add via UI):
    #   - searxng-search: provider=searxng, api_base=http://searxng.ai.svc.cluster.local:8080
    #   - firecrawl-search: provider=firecrawl (uses Firecrawl.dev cloud via FIRECRAWL_API_KEY)
    # =====================================================

    # MCP Server Configuration
    # n8n-mcp serves Streamable HTTP itself (mcp/mcp-servers) and requires its
    # AUTH_TOKEN as a bearer token. unifi-mcp is deliberately not listed.
    # Reference: https://docs.litellm.ai/docs/mcp
    mcp_servers:
      n8n:
        url: "http://n8n-mcp.mcp.svc.cluster.local:3000/mcp"
        transport: "http"
        auth_type: "bearer_token"
        authentication_token: "os.environ/N8N_MCP_TOKEN"
        description: "n8n workflow automation tools"
