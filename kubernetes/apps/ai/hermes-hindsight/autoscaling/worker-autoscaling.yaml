---
# The adapter reports guarded replica slot demand. A missing metric holds the
# current count; known zero can scale down after the stabilization window.
# Runtime load, task recovery, APIService and controller behavior must be
# qualified before production activation.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hindsight-worker
  namespace: ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: hindsight-worker
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: External
      external:
        metric:
          name: hindsight_worker_slot_demand
        target:
          type: AverageValue
          averageValue: "1"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
