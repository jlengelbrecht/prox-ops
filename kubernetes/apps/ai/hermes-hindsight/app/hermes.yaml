---
# Managed-scope pins. Mounted read-only at /etc/hermes/config.yaml; the pinned
# Hermes release overlays these leaf keys on top of the home config.yaml, .env
# and the shell, and `hermes config set` / the dashboard refuse to change them
# (upstream hermes_cli/managed_scope.py). Everything NOT listed here is
# UI-owned after the first boot. `hermes doctor` reports
# "Managed scope active: N config key(s)".
#
# This is a management boundary, not a sandbox: real authority is the network
# policy, the token scope and Kubernetes access, not this file. subPath mounts
# never refresh in place: an edit here restarts the pod through the Reloader
# annotation on the Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-managed
  namespace: ai
data:
  config.yaml: |
    # Deployment-owned Hermes settings, pinned by the administrator.
    # Memory provider selection is UI-owned: the owner picks and connects a
    # provider (e.g. Hindsight) from the dashboard/TUI and it persists on the
    # PVC across restarts; nothing here pins or resets it.
    terminal:
      backend: local
    dashboard:
      # Peers allowed to supply X-Forwarded-Proto/-For (controls the Secure
      # cookie flag): the pod CIDR the envoy-internal gateway pods live in.
      # Hermes rejects 0.0.0.0/0 and silently ignores malformed entries.
      trusted_proxies:
        - "10.42.0.0/16"
    secrets:
      onepassword:
        # Native 1Password task references stay OFF until the dedicated
        # read-only task vault and its Connect token exist (later change).
        # Pinned so the dashboard cannot switch it on without that scope.
        enabled: false
        binary_path: /opt/onepassword/op
        cache_ttl_seconds: 0
        override_existing: true
---
# Hermes gateway + web dashboard. Community chart jyje/hermes-agent 1.14.0
# running the official nousresearch/hermes-agent image with the upstream
# entrypoint and s6 supervisor intact. Site-specific needs are expressed
# through documented chart values; the one exception is the post-render patch
# below (chart 1.14.0 has no dnsConfig value).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: ai
spec:
  chart:
    spec:
      chart: hermes-agent
      # renovate: datasource=helm registryUrl=oci://ghcr.io/jyje/hermes-agent-helm
      version: 1.14.0
      sourceRef:
        kind: HelmRepository
        name: hermes-agent-helm
        namespace: ai
  interval: 1h
  # The provider egress rules in networkpolicy.yaml are toFQDNs, which only
  # enforce correctly when the pod asks cluster DNS for the exact policed
  # name; the default ndots:5 search path would try <name>.ai.svc.cluster.local
  # first and the connection would be dropped (see the project note on Cilium
  # FQDN policy vs pod ndots). Drop when the chart grows a dnsConfig value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hermes
            patch: |
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
  values:
    # Release "hermes" + chart "hermes-agent" would otherwise name everything
    # hermes-hermes-agent.
    fullnameOverride: hermes

    image:
      repository: docker.io/nousresearch/hermes-agent
      # The chart prints repository:tag verbatim, so tag@digest is the pin
      # (linux/amd64 manifest digest).
      #
      # COUPLED: web-dist-patch.py (the web-dist-patch init container below)
      # carries byte-level pins of this digest's dashboard bundle. A bump
      # must either re-pin that file against the new bundle or delete the
      # overlay (init container, web-dist volume, HERMES_WEB_DIST) once an
      # upstream release fixes issue #96691. An unmatched pin is not an
      # outage: the init container serves the new bundle unchanged and logs a
      # WARNING, and the Hindsight Local External save defect returns.
      # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
      tag: "v2026.9.7@sha256:b3190406963c6b51ac955397ecef45346efaae9563ee305108f8eef0a77e267b"
      pullPolicy: IfNotPresent

    # Keep the image entrypoint (entrypoint-dispatch.sh -> s6-overlay /init).
    command: []
    # `gateway run` = the non-interactive gateway service; the dashboard is a
    # supervised s6 sibling started by HERMES_DASHBOARD=1 below.
    args: ["gateway", "run"]

    controller:
      # Deployment + persistence => the chart forces strategy Recreate, so a
      # rollout never has two writers on the RWO home.
      type: deployment
    replicaCount: 1

    serviceAccount:
      create: true
      automountServiceAccountToken: false

    # Seed configuration. Copied into /opt/data/config.yaml by the chart's
    # seed-config init container ONLY when the file does not exist yet
    # (bootstrap.overwrite=false). After the first boot the PVC copy owns these
    # settings and the UI / `hermes config set` may change them; a later edit
    # here restarts the pod (checksum) but does NOT change the persisted file.
    # Keys that must stay deployment-owned are pinned in hermes-managed above.
    config:
      # Schema version of the pinned release (hermes_cli DEFAULT_CONFIG, v41);
      # without it a fresh home is reported as outdated by `hermes doctor`.
      # Bump it with the image.
      _config_version: 41
      # No model/provider seeded: Josh connects one of his native AI
      # subscriptions through Hermes's own dashboard/TUI after deployment,
      # persisted in the Hermes home. The chart's values.yaml seeds
      # `model: {provider: openai-api, default: gpt-4o-mini}`; Helm keeps a
      # chart default unless the release value is null, so both leaves are
      # nulled and the seed carries an empty `model: {}` (nulling the whole
      # map breaks the chart's NOTES.txt). With no inference key in the
      # environment nothing is called.
      model:
        default: null
        provider: null
      terminal:
        backend: local
      memory:
        provider: ""
      agent:
        gateway_timeout: 1800
      secrets:
        onepassword:
          enabled: false
          binary_path: /opt/onepassword/op
          cache_ttl_seconds: 0
          override_existing: true
          # Task reference map: ENV_VAR -> op://<task vault>/<item>/<field>.
          # Empty until a task credential is approved and the task vault exists.
          env: {}

    soul:
      text: ""

    bootstrap:
      enabled: true
      overwrite: false

    # Environment Git-owned on every start. Every entry is a plain value
    # except the browser endpoint and the API server key, which are Secret
    # references.
    extraEnv:
      - name: HERMES_DASHBOARD
        value: "1"
      # External origin of the dashboard: OIDC callback <url>/auth/callback and
      # the exact Host/Origin the dashboard trusts behind Envoy.
      - name: HERMES_DASHBOARD_PUBLIC_URL
        value: "https://hermes.homelab0.org"
      # Native self-hosted OIDC provider against Authentik: PUBLIC client with
      # PKCE (no client secret anywhere), discovery from
      # <issuer>/.well-known/openid-configuration, ID token verified against
      # the JWKS. Env wins over config.yaml for these keys, so the auth
      # boundary stays outside the writable home. Without a provider the
      # dashboard fails closed (port 9119 never opens). The client id is a
      # public identifier, not a credential; it is declared once in the
      # Authentik blueprint (kubernetes/apps/security/authentik) and once here.
      - name: HERMES_DASHBOARD_OIDC_ISSUER
        value: "https://authentik.homelab0.org/application/o/hermes/"
      - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
        value: "hermes-dashboard"
      - name: HERMES_DASHBOARD_OIDC_SCOPES
        value: "openid profile email"
      - name: HERMES_TIMEZONE
        value: "America/New_York"
      # Native web_search backend endpoint (search only; page content comes
      # from the browser pod). Non-secret in-cluster Service URL, kept
      # absolute by the ndots:1 patch above. The provider reads this key via
      # hermes_cli/config.py get_env_value: process env first, then the home
      # .env, so this Git-owned value wins and a SEARXNG_URL entered in the
      # dashboard or .env is silently ignored. The backend choice itself
      # (web.backend) stays UI-owned on the PVC and is not pinned here.
      # Reachability is the matching Hermes -> SearXNG rule in
      # networkpolicy.yaml.
      - name: SEARXNG_URL
        value: "http://searxng.ai.svc.cluster.local:8080"
      # Serve the dashboard bundle prepared by the web-dist-patch init
      # container (image-supported caller-managed dist; the image's own
      # default is /opt/hermes/hermes_cli/web_dist). Static assets only: the
      # API, auth and routes are the image's code. Remove together with the
      # init container and the web-dist volume.
      - name: HERMES_WEB_DIST
        value: "/opt/web-dist/dist"
      # Browser tool: drive the dedicated browser pod (browser.yaml) over CDP
      # instead of launching Chromium here, which the pod restrictions block.
      # The value is the direct WebSocket root plus the pod's API token,
      # composed by the generated Secret (externalsecrets.yaml): Hermes
      # passes a ws:// URL with a path through unchanged (BU_CDP_WS) and
      # redacts the token in its logs, whereas an http:// root would be
      # resolved via /json/version, which cannot carry the token in this
      # release. Env wins over browser.cdp_url; a missing Secret keeps the
      # pod from starting rather than falling back to a local browser.
      - name: BROWSER_CDP_URL
        valueFrom:
          secretKeyRef:
            name: hermes-browser-token
            key: BROWSER_CDP_URL
      # Gateway API server (OpenAI-compatible runs API): Paperclip's
      # hermes_gateway adapter wakes this Hermes with POST /v1/runs and
      # follows the run over SSE, Bearer-authenticated with API_SERVER_KEY.
      # Configured through the gateway's own API_SERVER_* environment
      # overrides rather than the chart's apiServer block (left disabled
      # below): the env contract is the image's, so the enable flag, bind
      # address and key cannot drift with a chart release, and the chart
      # renders no second Service port or key Secret next to these. Bound on
      # the pod IP because the caller is another pod; the bind is admitted
      # only for the Paperclip pod and the envoy-internal gateway
      # (hermes-api.homelab0.org, pod-CIDR only; networkpolicy.yaml,
      # access.yaml) and the key is required on every request.
      # PRECEDENCE: Hermes resolves API_SERVER_KEY with _get_scoped_secret,
      # which prefers /opt/data/.env on the PVC over this env. A stale
      # .env entry silently overrides the 1Password key (the first-boot
      # entry was removed 2026-09-24). If API auth breaks, check .env first.
      # The key is a Secret reference from
      # 1Password (externalsecrets.yaml); a missing item keeps the pod from
      # starting rather than serving the API without a key.
      - name: API_SERVER_ENABLED
        value: "true"
      - name: API_SERVER_HOST
        value: "0.0.0.0"
      - name: API_SERVER_PORT
        value: "8642"
      - name: API_SERVER_KEY
        valueFrom:
          secretKeyRef:
            name: hermes-api-server
            key: API_SERVER_KEY
      # Paperclip identity for this agent (Jarvis). With hermes_gateway,
      # Paperclip only sends work here and passes no Paperclip key; the
      # agent calls back with Authorization: Bearer $PAPERCLIP_API_KEY
      # (upstream hermes adapter README, Runtime API guidance). The URL is
      # the TLS internal hostname (/api is not Authentik-gated; reached via
      # the existing envoy-internal 443/10443 egress in networkpolicy.yaml),
      # never the plain-HTTP Service.
      - name: PAPERCLIP_API_URL
        value: "https://paperclip.homelab0.org"
      - name: PAPERCLIP_API_KEY
        valueFrom:
          secretKeyRef:
            name: paperclip-agent-jarvis
            key: PAPERCLIP_API_KEY

    # The only 1Password-backed value Hermes reads is the API server key
    # above; the other Secret is the app-generated browser token. Both are
    # single secretKeyRef entries in extraEnv. The chart's own env Secret is
    # kept empty by nulling its example key, so `OPENAI_API_KEY:
    # sk-REPLACE_ME` never renders, and the chart's externalSecret stays off:
    # the ExternalSecrets are authored in externalsecrets.yaml.
    env:
      OPENAI_API_KEY: null
    externalSecret:
      enabled: false

    auth:
      deviceFlow:
        enabled: false

    persistence:
      enabled: true
      existingClaim: hermes-data
      mountPath: /opt/data

    # Disabled on purpose: the API server is switched on through the
    # API_SERVER_* environment in extraEnv above, and its Service port is the
    # `api` entry below.
    apiServer:
      enabled: false
    webhook:
      enabled: false

    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: dashboard
          port: 9119
          targetPort: 9119
        # Gateway API server for Paperclip (hermes.ai.svc.cluster.local:8642).
        - name: api
          port: 8642
          targetPort: 8642

    # Routing and network policy are authored in Git (access.yaml,
    # networkpolicy.yaml): the chart's HTTPRoute drops filters and its
    # NetworkPolicy is not the repository's CiliumNetworkPolicy convention.
    ingress:
      enabled: false
    httpRoute:
      enabled: false
    networkPolicy:
      enabled: false

    # Least startup privilege, from the chart's values-hardened.yaml and
    # re-verified on this digest: s6-overlay starts cleanly as the image's own
    # hermes user (10000) with a read-only rootfs once /run (memory-backed
    # tmpfs) and /tmp (disk-backed emptyDir, below) are writable. The same
    # context also applies to the seed-config init.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
      fsGroup: 10000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    extraVolumes:
      - name: run-tmpfs
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      # /tmp is node-disk-backed, not tmpfs: the chart's 64Mi memory-backed
      # default is sized for s6 scratch, but Hermes stages its managed uv
      # bootstrap here (tarball + extracted binaries ~66Mi before cleanup) and
      # the browser tooling keeps profiles and downloads in /tmp. A disk
      # emptyDir keeps that out of the container's memory limit; sizeLimit is
      # a kubelet eviction threshold, not a filesystem quota. The volume name
      # is kept so the mount below stays unchanged.
      - name: tmp-tmpfs
        emptyDir:
          sizeLimit: 1Gi
      # Shared ephemeral volume: the init container below copies the official
      # op binary here; Hermes mounts it read-only.
      - name: onepassword-cli
        emptyDir:
          sizeLimit: 128Mi
      - name: hermes-managed
        configMap:
          name: hermes-managed
          defaultMode: 0444
      # Corrected dashboard bundle, produced by the web-dist-patch init
      # container from the image's own web_dist (3.2 MiB) and served
      # read-only through HERMES_WEB_DIST. The generated ConfigMap is the
      # overlay script (kustomization.yaml).
      - name: web-dist
        emptyDir:
          sizeLimit: 32Mi
      - name: hermes-web-dist-patch
        configMap:
          name: hermes-web-dist-patch
          defaultMode: 0444
    extraVolumeMounts:
      - name: run-tmpfs
        mountPath: /run
      - name: tmp-tmpfs
        mountPath: /tmp
      - name: onepassword-cli
        mountPath: /opt/onepassword
        readOnly: true
      # Single-file mount: /etc/hermes already exists in the image; never
      # mount over the directory.
      - name: hermes-managed
        mountPath: /etc/hermes/config.yaml
        subPath: config.yaml
        readOnly: true
      - name: web-dist
        mountPath: /opt/web-dist
        readOnly: true

    # Official 1Password CLI image, unmodified, copies its binary into the
    # shared volume so the native task-reference feature only needs a config
    # flip once the scoped token exists. Appended after the chart's
    # seed-config init.
    extraInitContainers:
      - name: onepassword-cli
        # renovate: datasource=docker depName=docker.io/1password/op
        image: docker.io/1password/op:2.38.1@sha256:9c1824aac2a52c0b2a1cbc50049db9f122f51535f8f34d7847f0fca66be53c49
        command:
          - sh
          - -c
          - |
            set -eu
            cp /usr/local/bin/op /target/op
            chmod 0555 /target/op
            /target/op --version
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
          - name: onepassword-cli
            mountPath: /target
      # Checksum-bound overlay of the dashboard bundle (web-dist-patch.py):
      # the pinned release drops the Hindsight API URL and key from the
      # Plugins-page save in Local External mode (upstream #96691, unfixed in
      # any release). Runs the same image digest as the dashboard, stdlib
      # Python only, no network: copies the image's web_dist into the
      # web-dist emptyDir and, only when every pinned hash and occurrence
      # count matches, applies the one-token correction and renames the
      # touched chunks so browsers holding the year-long immutable cache
      # fetch the corrected copy on an ordinary reload. On any mismatch it
      # serves the bundle unchanged, logs a WARNING and records the reason in
      # /opt/web-dist/status.json (outside the served directory). The
      # container never touches the Hermes home, config or secrets.
      - name: web-dist-patch
        # Same pin as image.tag above; the two move together.
        # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
        image: docker.io/nousresearch/hermes-agent:v2026.9.7@sha256:b3190406963c6b51ac955397ecef45346efaae9563ee305108f8eef0a77e267b
        command:
          - python3
          - -B
          - /opt/web-dist-patch/web-dist-patch.py
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
          - name: hermes-web-dist-patch
            mountPath: /opt/web-dist-patch
            readOnly: true
          - name: web-dist
            mountPath: /opt/web-dist

    # A dashboard that fails closed (no auth provider) never opens 9119, which
    # makes the pod NotReady - the wanted signal. The gateway is not probed:
    # `hermes gateway run` registers the gateway as a supervised s6 longrun and
    # s6 restarts a crashed gateway within seconds without the container
    # exiting, so a gateway that is down while the dashboard answers is only
    # visible in `hermes doctor` / the dashboard. Deliberately no liveness.
    # The API server on 8642 is part of the gateway process and is likewise
    # not probed; Paperclip's adapter test (GET /health) is its check.
    probes:
      startup:
        tcpSocket:
          port: 9119
        periodSeconds: 5
        failureThreshold: 60
      readiness:
        tcpSocket:
          port: 9119
        initialDelaySeconds: 20
        periodSeconds: 10
      liveness: {}

    # Reloader replaces the pod when the managed ConfigMap changes (subPath
    # mounts never refresh in place), when the overlay script changes (an
    # init container only runs at pod start), when the browser token Secret
    # is recreated, in step with the browser Deployment (browser.yaml), or
    # when the API server key is rotated in 1Password.
    deploymentAnnotations:
      configmap.reloader.stakater.com/reload: "hermes-managed,hermes-web-dist-patch"
      secret.reloader.stakater.com/reload: "hermes-browser-token,hermes-api-server,paperclip-agent-jarvis"

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    # No Helm test Job (it would run `hermes doctor` with the real env).
    tests:
      enabled: false
