---
# Explicit network authorization for the three workloads: DNS, the OIDC
# issuer, the shared database, the memory API and toFQDNs allowlists for the
# subscription-backed calls and the public model-catalog metadata Hermes
# reads before any provider is chosen. Hermes additionally holds one general
# public-web rule (toCIDRSet below: TCP80/443 to public IPv4 addresses, with
# private and other special-purpose ranges carved out); Hindsight has no
# general internet rule. The Hermes image does not categorically disable lazy
# installs; a separate toFQDNs rule below names the setup tool download hosts
# (uv, PyPI, GitHub, npm) on TCP443 — see that rule's own comment for what it
# does and does not enforce. The Hermes toFQDNs rules remain the documented
# per-feature host intent, but for public IPv4 on TCP443 they are subsumed by
# the public-web rule; for Hindsight, changing its LLM endpoint is still
# coupled to its toFQDNs rule. toFQDNs rules only enforce when the pod queries
# DNS for the exact policed name (ndots:1 is patched onto both affected pods
# in hermes.yaml and hindsight.yaml).
#
# Cilium matches pod labels; the selectors below are what each chart renders.
# Hermes may reach the Hindsight API on 8888: memory provider selection is
# UI-owned (hermes.yaml), so the network path is admitted ahead of the owner
# choosing and saving it in the dashboard.
#
# Hermes (chart labels: app.kubernetes.io/name=hermes-agent, instance=hermes)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes
  ingress:
    # Dashboard from the internal gateway only.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS visibility: the toFQDNs rule below only learns addresses
          # from answers that pass through Cilium's DNS proxy, which this
          # rule enables (same shape as the repository's other FQDN policies).
          rules:
            dns:
              - matchPattern: "*"
    # Setup tool downloads: uv's installer and the Python package index
    # (Astral, PyPI), GitHub and its release-asset CDN for installer/tool
    # releases, and the npm registry for a conditional package fetch.
    # Enforcement here is DNS-derived L3/L4 only: Cilium admits the
    # addresses learned for these seven exact names on TCP443, with no
    # TLS/SNI, HTTP Host header, URL path, method, or content check, and no
    # way to distinguish another service reached on an admitted IP.
    # Reachability alone does not run or prove installation, or enable
    # browser/desktop capability.
    - toFQDNs:
        - matchName: astral.sh
        - matchName: releases.astral.sh
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Public web: HTTP/HTTPS to any public IPv4 address on TCP80/443, so
    # ordinary websites open without a hostname entry (WebSocket upgrades
    # ride the same TCP connections). Enforcement is L3/L4 by destination
    # address only: no hostname, SNI, URL path or content check, and every
    # process in the shared Hermes pod (agent, tools, browser, lazily
    # installed binaries) gets the same reach under one pod identity. The
    # except list carves out the private, shared/CGNAT, loopback, link-local,
    # protocol-assignment, documentation, benchmarking, deprecated 6to4
    # relay, multicast and reserved blocks: a conservative special-purpose
    # set, not an exact public-address classifier. A DNS name that resolves
    # into a carved-out block gains nothing here. CIDR rules never select
    # cluster pods or nodes (policy-cidr-match-mode is unset), so in-cluster
    # reach stays governed by the explicit toEndpoints rules in this policy.
    # IPv6 is disabled on this cluster, so there is no ::/0 counterpart;
    # other ports and UDP stay closed. The toFQDNs, OIDC and Hindsight rules
    # in this policy are unchanged by this rule.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.88.99.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Native AI subscription lanes (owner-led setup after deployment): Hermes
    # seeds no model/provider, so this allows every sanctioned lane Josh may
    # choose in the dashboard/TUI without a follow-up network-policy change -
    # opening the egress is not itself a provider choice. Claude (inference +
    # in-process OAuth refresh + one-time interactive authorize), ChatGPT/Codex
    # OAuth subscription (inference + OAuth refresh), MiniMax (OAuth portal +
    # inference, one host for both paths).
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: console.anthropic.com
        - matchName: platform.claude.com
        - matchName: claude.ai
        - matchName: auth.openai.com
        - matchName: chatgpt.com
        - matchName: api.minimax.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Model catalog metadata: the intended calls are unauthenticated JSON
    # GETs, no inference. The provider picker in the dashboard and TUI blocks
    # on a cold fetch of these registries (image v2026.9.7, hermes_cli
    # 0.21.1: agent/models_dev.py MODELS_DEV_URL and
    # hermes_cli/model_catalog.py DEFAULT_CATALOG_URL +
    # DEFAULT_CATALOG_FALLBACK_URLS); with the hosts denied, each address
    # times out and the picker sits on "loading" for about a minute before
    # listing any provider. models.dev is the provider/model registry;
    # hermes-agent.nousresearch.com serves the Hermes manifest but currently
    # 301s to nousresearch.github.io, which urllib follows, so that redirect
    # target is listed too; raw.githubusercontent.com is the upstream
    # fallback copy of the same manifest (NousResearch/hermes-agent/main/...,
    # not commit-pinned). Enforcement here is DNS-derived L3/L4 only: Cilium
    # admits the addresses learned for the four exact names on TCP443 with no URL path, method,
    # or credential/content restriction.
    - toFQDNs:
        - matchName: models.dev
        - matchName: hermes-agent.nousresearch.com
        - matchName: nousresearch.github.io
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Telegram Bot API: polling/webhook client and file transfer, all served
    # from api.telegram.org. Enforcement here is DNS-derived L3/L4 only:
    # Cilium admits the addresses learned for this exact name on TCP443, no
    # URL path, method or credential/content restriction.
    - toFQDNs:
        - matchName: api.telegram.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Discord: REST API, initial Gateway websocket, native media/CDN
    # (attachments, stickers) and Gateway reconnects. Discord returns a
    # resume URL for reconnects. This bounded pattern covers matching
    # hosts; verify the actual returned hostname after READY. Same
    # DNS-derived L3/L4 enforcement as above, TCP443 only.
    - toFQDNs:
        - matchName: discord.com
        - matchName: gateway.discord.gg
        - matchPattern: "gateway-*.discord.gg"
        - matchName: cdn.discordapp.com
        - matchName: media.discordapp.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Dashboard OIDC: discovery, token exchange and JWKS calls go to the
    # Authentik issuer hostname. Authentik has an HTTPRoute on both gateways,
    # so in-cluster DNS (CoreDNS forwarding to k8s-gateway) answers the name
    # with both VIPs, external 10.20.67.23 and internal 10.20.67.22, in no
    # fixed order; the LAN resolver returns only the internal VIP. With only
    # the internal gateway admitted, a call that tried the external VIP first
    # sat through a ~10s socket timeout before falling back, so both gateway
    # workloads are admitted (the gateway pods listen on 10443 behind each
    # LoadBalancer's 443). This is L3/L4 by pod identity, no hostname or SNI
    # check: Hermes processes may now reach every host routed on either
    # gateway, not only the issuer. The DNS answer itself is unchanged.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # Hindsight API, same namespace: the memory provider the owner may select
    # and save in the dashboard.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hindsight
            app.kubernetes.io/instance: hindsight
            app.kubernetes.io/component: api
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
# Hindsight API (chart labels: name=hindsight, instance=hindsight, component=api)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-api
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/instance: hindsight
      app.kubernetes.io/component: api
  ingress:
    # Approved consumers only, no gateway ingress: the Hindsight UI's
    # server-side dataplane client, and Hermes as a possible memory client
    # once the owner selects and saves it in the dashboard.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hindsight
            app.kubernetes.io/instance: hindsight
            app.kubernetes.io/component: control-plane
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes-agent
            app.kubernetes.io/instance: hermes
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS visibility so the toFQDNs rule below learns addresses.
          rules:
            dns:
              - matchPattern: "*"
    # Memory-reasoning LLM: the one host in HINDSIGHT_API_LLM_BASE_URL.
    - toFQDNs:
        - matchName: api.minimax.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Shared CloudNativePG cluster in the database namespace (postgres-rw);
    # its own policy already admits ingress from this namespace on 5432.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Hindsight UI / control plane (component=control-plane). No database access:
# it only talks to the API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-control-plane
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/instance: hindsight
      app.kubernetes.io/component: control-plane
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hindsight
            app.kubernetes.io/instance: hindsight
            app.kubernetes.io/component: api
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
