---
# Publish this resource first while Hindsight still uses direct Codex.
# 1Password Connect reads Automation only. The owner creates the dedicated
# alias-scoped Secure Note out of band; no key value belongs in Git.
# Observe Ready=True, a fresh successful sync, and a scoped gateway canary
# before publishing the separate consumer switch.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-litellm
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hindsight-litellm
    creationPolicy: Owner
  data:
    - secretKey: credential
      remoteRef:
        key: hindsight-litellm
        property: credential
