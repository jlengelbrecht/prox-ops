apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hindsight-api
  namespace: ai
  labels:
    prometheus: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [ai]
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
      app.kubernetes.io/instance: hindsight
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
