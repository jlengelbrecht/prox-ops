---
# Hindsight secrets come from 1Password through the existing
# `onepassword-connect` ClusterSecretStore (vault: Automation). The item and
# property names below are the interface; a missing one leaves the target
# Secret unrendered and the workload Pending, it never weakens a boundary.
#   hindsight-secrets           api-tenant-key (generated private-service key)
#   postgres-cluster            HINDSIGHT_PASSWORD (alphanumeric only: the
#                               chart interpolates it unescaped into a URL)
#   minimax-max-token-plan-key  credential (MiniMax Subscription Key,
#                               rollback only)
# Hermes has no 1Password-backed ExternalSecret here: its memory provider
# stays pinned off (hermes.yaml) until this backend is live and validated.
# The browser token at the end of this file is the one object not sourced
# from 1Password: it is generated in-cluster (see its own comment).
#
# Every key of hindsight-secrets is injected via envFrom into BOTH the API and
# the control-plane containers (chart 0.9.2 `existingSecret`); the two run as
# one single-owner trust domain, so the UI container can also see the
# database password. `postgres-password` is the chart's required key for the
# external-database path (read by secretKeyRef into POSTGRES_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hindsight-secrets
    creationPolicy: Owner
  data:
    # Same 1Password field the shared cluster's role credential pulls
    # (database/hindsight-db-credentials, kubernetes/apps/database/cluster/
    # app/externalsecret-hindsight.yaml): one source of truth for the
    # `hindsight` role password, no cross-namespace Secret reads. Rotation:
    # change the field, then force-sync database/hindsight-db-credentials
    # first (CNPG applies the new role password) and this ExternalSecret
    # second (Reloader restarts the Hindsight pods). Left to the two
    # independent 1h refreshes, the two sides can disagree for up to an hour
    # and the API fails authentication until both have synced.
    - secretKey: postgres-password
      remoteRef:
        key: postgres-cluster
        property: HINDSIGHT_PASSWORD
    # MiniMax Subscription Key, kept for a rollback of the memory-reasoning
    # LLM to the `minimax` provider: the active `openai-codex` provider
    # (hindsight.yaml) authenticates from its CODEX_HOME volume and never
    # reads this key. Drop it once the MiniMax lane is retired for good.
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef:
        key: minimax-max-token-plan-key
        property: credential
    # One field, two consumers today (API tenant bearer key, control plane's
    # server-side client key); the Hermes memory client joins later. Rotate once.
    - secretKey: HINDSIGHT_API_TENANT_API_KEY
      remoteRef:
        key: hindsight-secrets
        property: api-tenant-key
    - secretKey: HINDSIGHT_CP_DATAPLANE_API_KEY
      remoteRef:
        key: hindsight-secrets
        property: api-tenant-key
---
# Browserless API token for the dedicated browser pod (browser.yaml). Not a
# 1Password item and never a literal in Git: the ESO Password generator below
# produces one 48-character alphanumeric value in-cluster (symbols: 0 so it
# is safe in a URL query and cannot trip Hermes's ws://host:port test). No
# secretStoreRef: the generator is the source. Scope is the browser service
# only; it is not an owner, provider or dashboard credential and nothing
# else consumes it.
#
# Two consumers read the one Secret: the browser pod as TOKEN (Browserless
# authenticates every non-static route with it, so a script on a visited
# page cannot open factory or management sockets on pod loopback) and Hermes
# as the composed WebSocket URL. CreatedOnce keeps the value stable: the
# generator returns a new value on every invocation, so any other policy
# would rotate it on each refresh. Rotation/revocation is an operator
# action (delete the Secret; ESO recreates it with a fresh value and the
# Reloader annotations on both Deployments restart the two pods, which is a
# short interruption of browser sessions). Not validated here: how promptly
# ESO recreates a deleted CreatedOnce target. A missing Secret keeps both
# pods in CreateContainerConfigError; neither can start token-less.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-browser-token
  namespace: ai
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-browser-token
  namespace: ai
spec:
  refreshPolicy: CreatedOnce
  target:
    name: hermes-browser-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Replace: only these two keys land in the Secret, the raw generator
      # output key does not.
      mergePolicy: Replace
      data:
        TOKEN: "{{ .password }}"
        # Direct WebSocket root plus the token. Hermes passes a ws:// URL
        # with a path through unchanged (BU_CDP_WS); an http:// root would
        # be resolved via /json/version, which cannot carry the token in
        # the pinned release.
        BROWSER_CDP_URL: "ws://hermes-browser.ai.svc.cluster.local:3000/?token={{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-browser-token
