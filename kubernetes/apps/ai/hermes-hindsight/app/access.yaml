---
# Private access to the Hermes dashboard through the internal Envoy gateway
# (envoy-internal / https listener in namespace network, wildcard
# homelab0.org certificate). The record hermes.homelab0.org is created from
# this route by the existing DNS automation (k8s-gateway, unifi external-dns).
#
# ONE gate: the dashboard's own OIDC provider against Authentik (hermes.yaml
# extraEnv). No SecurityPolicy on this route on purpose: the native gate
# covers every path including the /api/ws and /api/pty WebSockets, and a
# second forward-auth layer would be a second consumer of the Authorization
# header. Who may log in is decided by the Authentik application's group
# binding (kubernetes/apps/security/authentik blueprints).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hermes.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hermes.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes
          port: 9119
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
---
# Hermes gateway API server (port 8642) over TLS for Paperclip's
# hermes_gateway adapter, which refuses plain http:// to any non-loopback
# host because API_SERVER_KEY travels as a bearer token, and pod-to-pod
# traffic is not encrypted in this cluster. Same internal gateway and
# wildcard homelab0.org certificate as the dashboard route above (the
# homelab0-org-production-tls Secret on the envoy-internal https listener).
# No Authentik forward auth: the bearer key is the auth, and a login
# redirect would break a machine client. The hermes-api-clients
# SecurityPolicy below limits the route to cluster pods.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-api
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hermes-api.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hermes-api.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes
          port: 8642
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Frame-Options
                value: "DENY"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
---
# Hindsight UI (control plane, port 3000) on the same internal gateway, gated
# by Authentik forward auth (SecurityPolicy below; who may log in is the
# application's group binding in the Authentik blueprints). The UI calls the
# API server-side with the tenant key. The API has its own machine route
# on a separate hostname (hindsight-api, further down); this UI host serves
# no API path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hindsight.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hindsight.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hindsight-control-plane
          port: 3000
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Frame-Options
                value: "DENY"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
---
# Authentik outpost route for the Hindsight host (forward-auth login/callback
# flow). No SecurityPolicy here (it would loop); the cross-namespace
# backendRef is allowed by ReferenceGrant allow-ai-namespace-extauth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-outpost
  namespace: ai
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hindsight.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
---
# Hindsight API (port 8888) for coding clients outside the cluster, on its
# own hostname through the same internal gateway (LAN only: unifi-dns
# publishes the record for envoy-internal routes, cloudflare-dns ignores
# them). No SecurityPolicy on purpose: the API's own tenant extension
# (hindsight.yaml, HINDSIGHT_API_TENANT_EXTENSION) rejects every bank
# data operation that does not carry the shared tenant key as a bearer
# (a validation-only import dry run and deprecated 410 paths answer
# before that check and touch no bank data), and a
# forward-auth layer would redirect machine clients to a browser login.
#
# Only two surfaces are routed. The bank prefix carries every data-plane
# call of the coding-agents client (memories, recall, reflect, operations,
# config, import, documents, knowledge-base) and is bearer-gated on the
# server per operation. GET /version is the client's one unauthenticated
# probe (version string and feature flags) for idempotent-retain
# negotiation. Everything else the API serves without a key (health with
# pool details, metrics, docs, schema) and the disabled MCP path stay off
# the gateway: an unmatched path gets Envoy's own 404. No catch-all rule
# and no auth-header rewriting. Hermes keeps using the in-cluster service,
# not this hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-api
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hindsight-api.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hindsight-api.homelab0.org
  rules:
    # One rule, matches ORed: the bank prefix once per method the API
    # serves, and the exact /version path for GET only.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/default/banks
          method: GET
        - path:
            type: PathPrefix
            value: /v1/default/banks
          method: POST
        - path:
            type: PathPrefix
            value: /v1/default/banks
          method: PUT
        - path:
            type: PathPrefix
            value: /v1/default/banks
          method: PATCH
        - path:
            type: PathPrefix
            value: /v1/default/banks
          method: DELETE
        - path:
            type: Exact
            value: /version
          method: GET
      backendRefs:
        - name: hindsight-api
          port: 8888
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Frame-Options
                value: "DENY"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
---
# Authentik forward auth (Envoy ext_authz) for the Hindsight UI route, same
# shape as glycemicgpt/app/securitypolicy.yaml. failOpen: false: if Authentik
# is unreachable, or the Hindsight provider is not yet assigned to the
# embedded outpost, the UI is unreachable rather than open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hindsight-auth
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hindsight
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
      - x-forwarded-uri
      - x-forwarded-method
    failOpen: false
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
---
# Client restriction for the hermes-api route: deny by default, allow only
# the pod CIDR (clusterPodNets in talos/talconfig.yaml). Anything else,
# including LAN clients on 10.20.x, gets Envoy's 403 before the request
# reaches Hermes.
#
# Envoy matches clientCIDRs against the client address it detects, not
# the raw TCP peer. Two things decide that address here:
# - The TCP peer is the real source. Cilium socket LB turns a pod's connect
#   to the gateway VIP into a direct connect to an Envoy pod, so the pod IP
#   is kept. LAN traffic reaches the VIP through DSR load balancing
#   (loadBalancer.mode dsr), so the LAN address is kept too.
# - The gateway-wide ClientTrafficPolicy (network/envoy-gateway-config)
#   sets xForwardedFor numTrustedHops: 1, so Envoy takes the client from
#   X-Forwarded-For when the request carries one. A LAN client that sends
#   a forged pod-range X-Forwarded-For passes this rule. Treat it as
#   defense in depth: API_SERVER_KEY is still required on every request.
#   Closing that gap takes a listener-scoped ClientTrafficPolicy on the
#   envoy-internal https listener, which lives outside this app.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hermes-api-clients
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hermes-api
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-cluster-pods
        action: Allow
        principal:
          clientCIDRs:
            - 10.42.0.0/16
