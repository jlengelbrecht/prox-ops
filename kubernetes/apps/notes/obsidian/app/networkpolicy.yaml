              - matchName: "sync-14.obsidian.md"
              - matchName: "sync-15.obsidian.md"
              - matchName: "sync-16.obsidian.md"
              - matchName: "sync-17.obsidian.md"
              - matchName: "sync-18.obsidian.md"
