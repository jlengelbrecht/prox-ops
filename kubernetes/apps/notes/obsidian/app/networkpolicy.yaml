              - matchName: "sync-100.obsidian.md"
    # Obsidian account and Sync (HTTPS and the Sync WebSocket).
    - toFQDNs:
        - matchName: obsidian.md
        - matchPattern: "*.obsidian.md"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Official community catalog/manifests/stats are served from raw GitHub;
    # plugin release assets redirect from github.com to this exact CDN host.
    # This admits HTTPS by learned IP, not by URL or plugin identity.
    - toFQDNs:
        - matchName: raw.githubusercontent.com
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # hindsight-api.homelab0.org uses the envoy-internal HTTPS listener:
    # LoadBalancer 443 reaches gateway pods on 10443. Include 443 as in the
    # existing Hermes gateway lane for either gateway addressing mode. Never
    # send the plugin's bearer credential to the plaintext API service on 8888.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
