---
# The pod runs a full desktop with the Electron sandbox off, so this policy
# is its containment boundary.
# - Ingress: the envoy-internal gateway pods on 3000 only. Nothing else in the
#   cluster can open the desktop stream directly, so every session goes
#   through the Authentik gate on the route.
# - Egress: exact DNS queries for account/Sync, community-plugin downloads,
#   and the Hindsight API; TCP 443 to the Obsidian and GitHub download hosts;
#   and HTTPS through the internal gateway to the Hindsight API route. No
#   Kubernetes API (the pod also has no service-account token) or general
#   internet. The owner enables and configures plugins inside Obsidian.
# Enforcement is DNS-derived L3/L4: Cilium admits the addresses learned for
# the matched public names on TCP 443, with no TLS/SNI or URL check. The
# gateway pod selector likewise admits any route on that gateway; the API
# route and tenant bearer check provide the narrower HTTP boundary. ndots:1
# on the pod (helmrelease.yaml) keeps the queried names exact.
# The pod selector is the label app-template renders from the release name.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: obsidian
  namespace: notes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: obsidian
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Permit the apex, account API, documented Sync server range (01-100),
          # plugin download hosts and internal API route as exact names. A DNS
          # wildcard could carry vault content in arbitrary queries.
          rules:
            dns:
              - matchName: obsidian.md
              - matchName: api.obsidian.md
              - matchName: raw.githubusercontent.com
              - matchName: github.com
              - matchName: release-assets.githubusercontent.com
              - matchName: hindsight-api.homelab0.org
              - matchName: "sync-01.obsidian.md"
              - matchName: "sync-02.obsidian.md"
              - matchName: "sync-03.obsidian.md"
              - matchName: "sync-04.obsidian.md"
              - matchName: "sync-05.obsidian.md"
              - matchName: "sync-06.obsidian.md"
              - matchName: "sync-07.obsidian.md"
