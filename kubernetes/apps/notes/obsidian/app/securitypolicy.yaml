---
# Authentik forward auth (Envoy ext_authz) for the obsidian route, same shape
# as paperclip/app/securitypolicy.yaml. That route carries every path of the
# web client, including the streaming WebSocket upgrade, so there is no
# ungated way into the desktop. obsidian-outpost is deliberately not targeted
# (httproute.yaml).
# failOpen: false: if Authentik is unreachable, or the Obsidian provider is
# not assigned to the embedded outpost, the desktop is unreachable rather
# than open. Who may pass is the Obsidian application's group binding in the
# Authentik blueprints (authentik Admins only).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: obsidian-auth
  namespace: notes
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: obsidian
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
      - x-forwarded-uri
      - x-forwarded-method
    failOpen: false
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
