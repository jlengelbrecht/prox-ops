apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-mcp
  namespace: notes
  annotations:
    external-dns.alpha.kubernetes.io/hostname: obsidian-mcp.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - obsidian-mcp.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: obsidian
          port: 8000
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-authentik-uid, X-authentik-groups, X-authentik-username, X-authentik-email, X-authentik-name]
---
# The existing Obsidian Authentik provider and admin group bind to this host.
# A fresh internal outpost cookie check in the gateway authenticates every
# owner GET/POST; browser identity headers are stripped and are never proof.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-mcp-owner
  namespace: notes
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - obsidian.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /owner/
      backendRefs:
        - name: obsidian
          port: 8000
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-authentik-uid, X-authentik-groups, X-authentik-username, X-authentik-email, X-authentik-name]
---
# Byte-exact attachment transfer for MCP clients (export and import). The single-use
# credential travels in the X-Obsidian-Transfer request header, never in the path,
# so access logs (which record the path) do not contain it. This route has its own
# traffic policy: uploads stream up to 50 MB, beyond the MCP route's 1 MiB buffer.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-mcp-transfer
  namespace: notes
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - obsidian-mcp.homelab0.org
  rules:
    - matches:
        - path:
            type: Exact
            value: /transfer
      backendRefs:
        - name: obsidian
          port: 8000
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-authentik-uid, X-authentik-groups, X-authentik-username, X-authentik-email, X-authentik-name]
