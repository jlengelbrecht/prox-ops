---
# Obsidian desktop app (LinuxServer image, Selkies web streaming). One
# personal desktop session for the owner, not a multi-user service: anyone
# who passes the Authentik gate drives the same desktop. The internal nginx
# serves the web client and its WebSocket stream on 3000; TLS terminates at
# the envoy-internal gateway.
#
# Single instance on an RWO Ceph volume: replicas 1 with Recreate. The whole
# home (/config) is the existing claim from the obsidian-storage Kustomization,
# enrolled roots are /config/IAM Team and /config/Homelab. Sync runs inside this app;
# there is deliberately no headless Sync container beside it, because two
# Sync clients must not share one vault. Signing in to the Obsidian account
# and unlocking an encrypted remote vault are done by hand in the app. No
# account credential is supplied by Git; the signed-in state persists on the
# protected /config volume. The deployment bootstrap installs and enables only
# the pinned private bridge plugin; all other plugin data and Sync stay owner-owned.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian
  namespace: notes
spec:
  chartRef:
    kind: OCIRepository
    name: obsidian
  interval: 1h
  values:
    controllers:
      obsidian:
        replicas: 1
        # RWO Ceph RBD volume: RollingUpdate would deadlock on
        # Multi-Attach when the new pod lands on another node.
        strategy: Recreate
        annotations:
          # Roll the pod when the MCP client tokens or vault registry change;
          # the gateway reads both only at startup.
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          hostNetwork: false
          # The FQDN egress rules in networkpolicy.yaml only match when the
          # pod asks cluster DNS for the exact name; with the default ndots:5
          # the search path is tried first and the connection is dropped.
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            # s6-overlay init runs as root, sets up the session and then
            # runs the desktop and Obsidian as the abc user (PUID/PGID).
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/obsidian
              # renovate: datasource=docker depName=lscr.io/linuxserver/obsidian
              tag: v1.13.7-ls146@sha256:0ae1b2ffe772a0b4b2107f24e3462d22fa6067706d5b2f8a7cde964f855db863
            env:
              TZ: America/New_York
              PUID: "1000"
              PGID: "1000"
              # Selkies hardening: disables sudo, the terminal emulators and
              # xdg-open/exo-open inside the desktop, turns off the web
              # client's command channel and file transfers, and hides its
              # files and apps panels. This controls the Selkies desktop
              # wrapper, not Obsidian's built-in community-plugin browser;
              # the owner can install plugins through that browser.
              HARDEN_DESKTOP: "true"
              # No view-only or collaborative sharing links to this session.
              SELKIES_ENABLE_SHARING: "false"
              OBSIDIAN_BRIDGE_INSTANCE: kubernetes-obsidian
              OBSIDIAN_BRIDGE_DIR: /run/obsidian-bridge
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                <<: *probes
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  # First boot sets ownership on the volume and builds the
                  # desktop profile; allow up to ten minutes.
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              # No privilege escalation through setuid binaries (sudo is
              # removed by HARDEN_DESKTOP anyway). The root init keeps only
              # what it needs: CHOWN/FOWNER/DAC_OVERRIDE to prepare files the
              # abc user owns, SETUID/SETGID to drop to abc, and KILL so the
              # supervisor can stop those processes on shutdown. All six are
              # in the baseline set; the root filesystem stays writable for
              # s6-overlay.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - KILL
                  - SETGID
                  - SETUID
            # Electron renders on the CPU (no GPU in this pod) and Selkies
            # encodes the stream on the CPU. The memory-backed /dev/shm
            # counts against the memory limit.
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 4000m
                memory: 4Gi
          mcp:
            image: &mcp-image
              repository: ghcr.io/jlengelbrecht/obsidian-mcp
              # Replace only after the main image publication receipt names its immutable digest.
              # renovate: datasource=docker depName=ghcr.io/jlengelbrecht/obsidian-mcp
              tag: main@sha256:bb6fb924df1a230d51d541d3bb58915e47cb1dae456932fa30b280a2d0b38363
            command: ["python", "/app/gateway.py"]
            env:
              OBSIDIAN_GATEWAY_REGISTRY: /etc/obsidian-mcp/registry.json
              OBSIDIAN_MCP_TOKEN_CODEX:
                valueFrom:
                  secretKeyRef: {name: obsidian-mcp-secret, key: CLIENT_CODEX}
              OBSIDIAN_MCP_TOKEN_CLAUDE:
                valueFrom:
                  secretKeyRef: {name: obsidian-mcp-secret, key: CLIENT_CLAUDE_CODE}
              OBSIDIAN_MCP_TOKEN_OPENCODE:
                valueFrom:
                  secretKeyRef: {name: obsidian-mcp-secret, key: CLIENT_OPENCODE}
              OBSIDIAN_MCP_TOKEN_ANTIGRAVITY:
                valueFrom:
                  secretKeyRef: {name: obsidian-mcp-secret, key: CLIENT_ANTIGRAVITY}
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: 8000}
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: 8000}
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: 8000}
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
              seccompProfile: {type: RuntimeDefault}
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {cpu: 1000m, memory: 1Gi}
        initContainers:
          prepare-mcp-runtime:
            image: *mcp-image
            command: ["python", "-c"]
            args:
              - |
                import json, os, re, secrets, stat, tempfile
                from pathlib import Path

                uid = gid = 1000
                runtime = Path('/run/obsidian-bridge')
                cfg = json.loads(Path('/etc/obsidian-mcp/registry.json').read_text())
                bundle = Path('/opt/obsidian-mcp/bridge-plugin')
                plugin_id = 'obsidian-private-bridge'
                if (set(cfg) != {'vaults', 'clients', 'owner'} or not isinstance(cfg['vaults'], dict)
                        or not 1 <= len(cfg['vaults']) <= 8):
                    raise RuntimeError('Invalid central enrollment')

                def private_dir(path):
                    if path.is_symlink() or (path.exists() and not path.is_dir()):
                        raise RuntimeError('Unsafe runtime directory')
                    path.mkdir(mode=0o700, exist_ok=True)
                    os.chown(path, uid, gid)
                    os.chmod(path, 0o700)

                def atomic_bytes(path, content, mode):
                    fd, tmp = tempfile.mkstemp(dir=path.parent)
                    try:
                        os.fchmod(fd, mode)
                        os.fchown(fd, uid, gid)
                        with os.fdopen(fd, 'wb') as out:
                            out.write(content)
                            out.flush()
                            os.fsync(out.fileno())
                        os.replace(tmp, path)
                    finally:
                        if os.path.exists(tmp):
                            os.unlink(tmp)

                reviewed_plugin_files = {'main.js', 'manifest.json'}

                def verify_installed_plugin(target):
                    try:
                        directory_fd = os.open(target, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                    except FileNotFoundError:
                        return False
                    except OSError as exc:
                        raise RuntimeError('Unknown plugin installation') from exc
                    try:
                        with os.scandir(directory_fd) as entries:
                            names = set()
                            for entry in entries:
                                if (entry.name not in reviewed_plugin_files
                                        or not entry.is_file(follow_symlinks=False)):
                                    raise RuntimeError('Unknown plugin drift; owner review required')
                                names.add(entry.name)
                        if names != reviewed_plugin_files:
                            raise RuntimeError('Unknown plugin drift; owner review required')
                        current = True
                        for name in reviewed_plugin_files:
                            fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                         dir_fd=directory_fd)
                            with os.fdopen(fd, 'rb') as installed:
                                if not stat.S_ISREG(os.fstat(installed.fileno()).st_mode):
                                    raise RuntimeError('Unknown plugin drift; owner review required')
                                if installed.read() != (bundle / name).read_bytes():
                                    current = False
                    finally:
                        os.close(directory_fd)
                    # 'stale': exactly the two managed regular files with other bytes,
                    # e.g. a previous image's bundle. They are replaced with this image's copy.
                    return True if current else 'stale'

                # Validate every existing managed plugin before enabling it in any vault.
                for entry in cfg['vaults'].values():
                    root = Path(entry['app_root'])
                    if (root.parent != Path('/config') or root.name != entry['app_name']
                            or root.is_symlink() or (root.exists() and not root.is_dir())):
                        raise RuntimeError('Unsafe enrolled vault root')
                    if not root.is_dir():
                        continue
                    settings = root / '.obsidian'
                    if settings.is_symlink() or (settings.exists() and not settings.is_dir()):
                        raise RuntimeError('Unsafe vault settings directory')
                    if not settings.is_dir():
                        continue
                    plugins = settings / 'plugins'
                    if plugins.is_symlink() or (plugins.exists() and not plugins.is_dir()):
                        raise RuntimeError('Unsafe plugin parent')
                    if plugins.is_dir():
                        verify_installed_plugin(plugins / plugin_id)

                private_dir(runtime)
                endpoints = []
                issued = set()
                for vault_id, entry in cfg['vaults'].items():
                    if not re.fullmatch(r'[a-z][a-z0-9_-]{0,63}', vault_id):
                        raise RuntimeError('Invalid vault ID')
                    root = Path(entry['app_root'])
                    if (root.parent != Path('/config') or root.name != entry['app_name']
                            or root.is_symlink() or (root.exists() and not root.is_dir())):
                        raise RuntimeError('Unsafe enrolled vault root')
                    directory = runtime / vault_id
                    if (entry['socket_path'] != str(directory / (vault_id + '.sock'))
                            or entry['credential_file'] != str(directory / 'credential')):
                        raise RuntimeError('Unsafe bridge endpoint')
                    private_dir(directory)
                    credential = directory / 'credential'
                    if credential.is_symlink():
                        raise RuntimeError('Unsafe credential path')
                    token = secrets.token_urlsafe(32)
                    while token in issued:
                        token = secrets.token_urlsafe(32)
                    issued.add(token)
                    atomic_bytes(credential, token.encode(), 0o600)
                    endpoints.append({'vault_id': vault_id, 'app_name': entry['app_name'],
                                      'app_root': str(root), 'socket': entry['socket_path'],
                                      'credential_file': str(credential)})

                    # A future enrolled but absent/closed vault cannot disable
                    # another; never create or initialize a missing vault.
                    if not root.is_dir():
                        continue

                    settings = root / '.obsidian'
                    if settings.is_symlink() or (settings.exists() and not settings.is_dir()):
                        raise RuntimeError('Unsafe vault settings directory')
                    if not settings.is_dir():
                        continue
                    plugins = settings / 'plugins'
                    if plugins.is_symlink() or (plugins.exists() and not plugins.is_dir()):
                        raise RuntimeError('Unsafe plugin parent')
                    plugins.mkdir(mode=0o755, exist_ok=True)
                    target = plugins / plugin_id
                    installed = verify_installed_plugin(target)
                    if installed == 'stale':
                        if target.is_symlink() or not target.is_dir():
                            raise RuntimeError('Unknown plugin drift; owner review required')
                        print(f'refreshing managed bridge plugin in {vault_id}', flush=True)
                        for name in ('main.js', 'manifest.json'):
                            atomic_bytes(target / name, (bundle / name).read_bytes(), 0o644)
                    elif not installed:
                        staging = Path(tempfile.mkdtemp(prefix='.bridge-bootstrap-', dir=plugins))
                        try:
                            for name in ('main.js', 'manifest.json'):
                                atomic_bytes(staging / name, (bundle / name).read_bytes(), 0o644)
                            os.chown(staging, uid, gid)
                            os.replace(staging, target)
                        finally:
                            if staging.exists():
                                for item in staging.iterdir():
                                    item.unlink()
                                staging.rmdir()
                    for path in (settings, plugins, target):
                        os.chown(path, uid, gid)

                    enabled = root / '.obsidian' / 'community-plugins.json'
                    if enabled.is_symlink():
                        raise RuntimeError('Unsafe community plugin list')
                    if enabled.exists():
                        if not stat.S_ISREG(enabled.stat().st_mode):
                            raise RuntimeError('Invalid community plugin list')
                        current = json.loads(enabled.read_text())
                        if not isinstance(current, list) or any(not isinstance(x, str) for x in current):
                            raise RuntimeError('Invalid community plugin list')
                    else:
                        current = []
                    if plugin_id not in current:
                        current.append(plugin_id)
                        atomic_bytes(enabled, (json.dumps(current, indent=2) + chr(10)).encode(), 0o644)

                registry = {'version': 1, 'instance': 'kubernetes-obsidian', 'endpoints': endpoints}
                atomic_bytes(runtime / 'registry.json', json.dumps(registry).encode(), 0o600)
            env: {PYTHONDONTWRITEBYTECODE: "1"}
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
              seccompProfile: {type: RuntimeDefault}
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 100m, memory: 128Mi}
    # LinuxServer images run every file in /custom-cont-init.d as root at the
    # end of init, before the desktop starts. The mount is root-owned and
    # read-only, which the image requires before it runs custom scripts.
    configMaps:
      init:
        enabled: true
        data:
          obsidian-defaults.sh: |
            #!/bin/bash
            set -euo pipefail

            app_dir=/config/.config/obsidian
            cfg="${app_dir}/obsidian.json"

            mkdir -p /config/vaults "${app_dir}"

            # Image updates are the only update path. Turn off the in-app
            # updater (Settings > General > Automatic updates) and remove any
            # release it downloaded earlier: Obsidian prefers a downloaded
            # app.asar while it is newer than the copy in the image, which
            # would mask later image updates.
            if [ ! -s "${cfg}" ]; then
              printf '{"updateDisabled":true}\n' > "${cfg}"
            elif grep -Eq '"updateDisabled"[[:space:]]*:' "${cfg}"; then
              sed -i -E 's/"updateDisabled"[[:space:]]*:[[:space:]]*(true|false)/"updateDisabled":true/g' "${cfg}"
            elif grep -Eq '^[[:space:]]*\{[[:space:]]*\}[[:space:]]*$' "${cfg}"; then
              printf '{"updateDisabled":true}\n' > "${cfg}"
            elif grep -Eq '^[[:space:]]*\{' "${cfg}"; then
              sed -i '0,/{/s/{/{"updateDisabled":true,/' "${cfg}"
            fi
            if ! grep -Eq '"updateDisabled"[[:space:]]*:[[:space:]]*true([[:space:],}]|$)' "${cfg}"; then
              echo "obsidian-defaults: cannot disable automatic updates" >&2
              exit 1
            fi
            rm -f "${app_dir}"/obsidian-*.asar

            chown abc:abc /config/vaults /config/.config "${app_dir}" "${cfg}"
    service:
      app:
        controller: obsidian
        ports:
          http:
            port: *port
          mcp:
            port: 8000
    persistence:
      config:
        enabled: true
        existingClaim: obsidian-config
        advancedMounts:
          obsidian:
            app:
              - path: /config
              - path: /config/IAM Team
                subPath: IAM Team
              - path: /config/Homelab
                subPath: Homelab
            prepare-mcp-runtime:
              - path: /config
              - path: /config/IAM Team
                subPath: IAM Team
              - path: /config/Homelab
                subPath: Homelab
            mcp:
              - path: /config/IAM Team
                subPath: IAM Team
                readOnly: true
              - path: /config/Homelab
                subPath: Homelab
                readOnly: true
      mcp-registry:
        type: configMap
        name: obsidian-mcp-registry-v1
        defaultMode: 292  # 0444; projected ConfigMap symlinks are expected.
        advancedMounts:
          obsidian:
            prepare-mcp-runtime:
              - path: /etc/obsidian-mcp
                readOnly: true
            mcp:
              - path: /etc/obsidian-mcp
                readOnly: true
      mcp-runtime:
        type: emptyDir
        sizeLimit: 16Mi
        advancedMounts:
          obsidian:
            app:
              - path: /run/obsidian-bridge
            prepare-mcp-runtime:
              - path: /run/obsidian-bridge
            mcp:
              - path: /run/obsidian-bridge
      # Electron and the Selkies capture need a larger /dev/shm than the
      # 64Mi runtime default.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          obsidian:
            app:
              - path: /dev/shm
      custom-init:
        type: configMap
        identifier: init
        # LinuxServer ignores /custom-cont-init.d files without execute bits.
        defaultMode: 493  # 0755
        advancedMounts:
          obsidian:
            app:
              - path: /custom-cont-init.d
                readOnly: true
