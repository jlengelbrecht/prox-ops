apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-mcp-registry-v1
  namespace: notes
immutable: true
data:
  registry.json: |
    {
      "vaults": {
        "iam": {
          "app_name": "IAM Team",
          "app_root": "/config/IAM Team",
          "socket_path": "/run/obsidian-bridge/iam/iam.sock",
          "credential_file": "/run/obsidian-bridge/iam/credential",
          "owner_ids": ["cf7f9af450fffb506f4098538e8db2fe53a58c2960ab923fda9c8dff002ddbc7"]
        },
        "homelab": {
          "app_name": "Homelab",
          "app_root": "/config/Homelab",
          "socket_path": "/run/obsidian-bridge/homelab/homelab.sock",
          "credential_file": "/run/obsidian-bridge/homelab/credential",
          "owner_ids": ["cf7f9af450fffb506f4098538e8db2fe53a58c2960ab923fda9c8dff002ddbc7"]
        }
      },
      "clients": {
        "codex": {"iam": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"], "homelab": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"]},
        "claude": {"iam": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"], "homelab": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"]},
        "opencode": {"iam": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"], "homelab": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"]},
        "antigravity": {"iam": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"], "homelab": ["list_notes", "read_note", "search", "create_note", "append_note", "read_media"]}
      },
      "owner": {
        "check_url": "http://authentik-server.security.svc.cluster.local/outpost.goauthentik.io/auth/nginx",
        "origin": "https://obsidian.homelab0.org",
        "owner_ids": ["cf7f9af450fffb506f4098538e8db2fe53a58c2960ab923fda9c8dff002ddbc7"]
      }
    }
