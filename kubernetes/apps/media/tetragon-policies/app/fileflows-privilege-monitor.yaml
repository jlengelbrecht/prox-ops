---
# FileFlows Privilege Escalation Monitoring
# Monitors sudo usage and DockerMods directory writes
# LOGGING ONLY - Alerts on suspicious activity
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: fileflows-privilege-monitor
  namespace: media
spec:
  # A namespaced policy only applies to pods in its own namespace, so no
  # namespace selector is needed (matchNamespaces selects Linux namespaces).
  # Monitor sudo executions (should only happen during DockerMods)
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchBinaries:
            - operator: "In"
              values:
                - "/usr/bin/sudo"
                - "/bin/su"
          matchActions:
            - action: Post  # LOGGING ONLY - alerts to Tetragon logs
