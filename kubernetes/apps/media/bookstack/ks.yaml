---
# BookStack - Documentation Wiki
# Migrated from VM 101 (docker-sandbox2)
# Authentication: Authentik OIDC with role-based access
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookstack
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: bookstack
  dependsOn:
    - name: bookstack-storage  # Wait for protected storage PVCs
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: cluster-secret-store  # Need 1Password ClusterSecretStore
      namespace: flux-system
  path: ./kubernetes/apps/media/bookstack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
# Inputs of kubernetes/components/db-dump-mariadb.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookstack-dump
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/bookstack/dump
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: bookstack
    - name: cluster-secret-store
      namespace: flux-system
  postBuild:
    substitute:
      APP: bookstack-mariadb
      APP_NS: media
      DB_HOST: bookstack-mariadb-standalone
      DB_NAME: bookstackapp
      DB_USER: root
      DB_SECRET: bookstack-mariadb-standalone
      DB_SECRET_KEY: MARIADB_ROOT_PASSWORD
      DB_SELECTOR_KEY: app.kubernetes.io/instance
      DB_SELECTOR_VALUE: bookstack-mariadb-standalone
      DUMP_SCHEDULE: "57 7 * * *"
