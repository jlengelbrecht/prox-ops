apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-media-unas
spec:
  capacity:
    storage: 50Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
  nfs:
    server: 10.20.66.109
    path: /var/nfs/shared/media
  claimRef:
    name: arr-media
    namespace: media
