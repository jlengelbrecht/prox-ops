---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-identity-deploy-key
  namespace: identity-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-identity
  target:
    name: homelab-identity-deploy-key
    creationPolicy: Owner
  data:
    - secretKey: identity
      remoteRef:
        key: homelab-identity-deploy-key
        property: identity
    - secretKey: identity.pub
      remoteRef:
        key: homelab-identity-deploy-key
        property: identity.pub
    - secretKey: known_hosts
      remoteRef:
        key: homelab-identity-deploy-key
        property: known_hosts
