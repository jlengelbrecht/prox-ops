---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-tenants
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/identity-system/tenants/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    - name: crossplane-guards
      namespace: flux-system
    - name: provider-azuread
      namespace: flux-system
    - name: identity-secret-store
      namespace: flux-system
