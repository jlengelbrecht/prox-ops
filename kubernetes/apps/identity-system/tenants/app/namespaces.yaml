---
# These three namespaces hold Crossplane-managed Entra resources and one
# ProviderConfig each: invitations/groups in identity-people, applications/
# service principals in identity-apps, conditional-access policies in
# identity-ca. Nothing else runs here - no credential Secrets, since the
# provider authenticates with the HSM-signed assertion file its own sidecar
# writes, not a per-namespace credential.
#
# Prune is disabled on all three: deleting a namespace would delete every
# managed resource in it, and each managed resource's finalizer blocks that
# delete until its Entra object is handled too - orphaning the Entra object
# from Crossplane's management rather than cleanly removing it.
apiVersion: v1
kind: Namespace
metadata:
  name: identity-people
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    toolkit.fluxcd.io/tenant: sre-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity-apps
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    toolkit.fluxcd.io/tenant: sre-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity-ca
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    toolkit.fluxcd.io/tenant: sre-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
