---
# Same substitution requirement as identity-guard-params, plus a dependsOn so
# V5 can see its ConfigMap parameters before the first ProviderConfig is
# applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-providerconfigs
  namespace: identity-system
spec:
  interval: 10m
  path: ./kubernetes/apps/identity-system/tenants/providerconfigs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: identity-guard-params
      namespace: identity-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: identity-provider-ids
