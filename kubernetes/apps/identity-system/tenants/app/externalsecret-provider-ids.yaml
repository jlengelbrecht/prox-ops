---
# Identifiers, not credentials: a tenant ID and three client IDs target a
# specific Entra tenant and app registration, but they authenticate nothing
# on their own - the provider authenticates with the HSM-signed assertion
# file. They stay out of the public repo anyway, and Flux substitutes them
# only into the two Kustomizations below, never into any object that is
# itself committed to Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-provider-ids
  namespace: identity-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-identity
  target:
    name: identity-provider-ids
    creationPolicy: Owner
  data:
    - secretKey: IDENTITY_TENANT_ID
      remoteRef:
        key: xp-identity-people
        property: tenantId
    - secretKey: IDENTITY_CLIENT_ID_PEOPLE
      remoteRef:
        key: xp-identity-people
        property: clientId
    - secretKey: IDENTITY_CLIENT_ID_APPS
      remoteRef:
        key: xp-identity-apps
        property: clientId
    - secretKey: IDENTITY_CLIENT_ID_CA
      remoteRef:
        key: xp-identity-ca
        property: clientId
    - secretKey: IDENTITY_BREAKGLASS_GROUP_ID
      remoteRef:
        key: identity-guard-params
        property: breakglass-group-id
