---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-secret-store
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/identity-system/secret-store/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    - name: identity-1password-connect
