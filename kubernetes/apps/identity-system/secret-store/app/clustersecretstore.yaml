---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-identity
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.identity-system.svc.cluster.local:8080
      vaults:
        Identity-Automation: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect
            namespace: identity-system
            key: token
  conditions:
    # Only namespaces that exist may be listed: a name listed ahead of its
    # namespace could be claimed by whoever creates that namespace first.
    #
    # Any ExternalSecret in a listed namespace can read any item in the
    # Identity-Automation vault, so a namespace is listed only if nothing
    # there but cluster admins can create ExternalSecrets. identity-system
    # holds the provider IDs; crossplane-system holds the provider's signer
    # credential (xp-assertion-signer). The identity namespaces are left off
    # on purpose: no credential Secret lives there.
    - namespaces:
        - identity-system
        - crossplane-system
