---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-identity
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.identity-system.svc.cluster.local:8080
      vaults:
        Identity-Automation: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect
            namespace: identity-system
            key: token
  conditions:
    # Only namespaces that exist may be listed: a name listed ahead of its
    # namespace could be claimed by whoever creates that namespace first. The
    # change that creates identity-people, identity-apps and identity-ca adds
    # them here.
    - namespaces:
        - identity-system
