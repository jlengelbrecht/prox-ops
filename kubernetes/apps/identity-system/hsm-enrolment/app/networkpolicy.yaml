---
# The HSM is on USB, so the pod needs no network at all, not even DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yubihsm-enrolment-deny-all
  namespace: identity-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yubihsm-enrolment
  policyTypes:
    - Ingress
    - Egress
