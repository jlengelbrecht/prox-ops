---
# A short-lived pod for setting up the YubiHSM 2 by hand: kubectl exec -it in,
# then run yubihsm-shell to replace the factory credential, create keys and
# print certificates. Passwords are typed at the yubihsm-shell prompt and are
# never stored here. Expires after 4 hours (activeDeadlineSeconds). Remove it
# afterwards through Git so Flux prunes it: a `kubectl delete` alone makes Flux
# recreate it with a fresh 4 hours. The pod spec is immutable; to change it,
# delete and re-create.
apiVersion: v1
kind: Pod
metadata:
  name: yubihsm-enrolment
  namespace: identity-system
  labels:
    app.kubernetes.io/name: yubihsm-enrolment
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 14400
  terminationGracePeriodSeconds: 5
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: tools
      image: ghcr.io/jlengelbrecht/yubihsm-tools:sha-9d32380cd6ef9a5e2aa045589717139fd4fb1e9c@sha256:c3fd1849625bda1c0a8957a717bdb86c79cb869b60a97bbca0c2c2cc6a44d06f
      # Explicit, so an image rebuild can't change how long the pod lives.
      command: ["sleep", "14400"]
      stdin: false
      tty: false
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
          devic.es/yubihsm2: 1
        limits:
          memory: 128Mi
          devic.es/yubihsm2: 1
      env:
        - name: HOME
          value: /tmp
      volumeMounts:
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: scratch
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
