apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: groschen-postgres-ca-reader
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/apps/database/groschen-ca-reader/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 15m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: groschen-postgres-ca-public
      namespace: database
