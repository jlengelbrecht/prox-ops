---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: groschen-postgres-ca-source-reader
  namespace: database
automountServiceAccountToken: false
---
# This identity remains in database. Kubernetes authorizes the entire source
# Secret on GET, so it must never be bound to a Groschen workload.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: groschen-postgres-ca-source-reader
  namespace: database
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: groschen-postgres-ca-source-reader
  namespace: database
subjects:
  - kind: ServiceAccount
    name: groschen-postgres-ca-source-reader
    namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: groschen-postgres-ca-source-reader
