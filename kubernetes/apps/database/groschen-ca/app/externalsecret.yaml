---
# A distinct target name avoids adopting or replacing the CNPG source Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: groschen-postgres-ca-public
  namespace: database
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: groschen-postgres-ca-source
  target:
    name: groschen-postgres-ca-public
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        ca.crt: "{{ .publicCA }}"
  data:
    - secretKey: publicCA
      remoteRef:
        key: postgres-ca
        property: ca.crt
