---
# Credentials for the hindsight_backlog_metrics role. Not a 1Password item and
# never a literal in Git: the ESO Password generator below produces one
# 48-character alphanumeric value in-cluster. No secretStoreRef: the generator
# is the source. The Secret stays in this namespace; the backlog collector
# (not deployed yet) must run here and read it directly, so nothing copies
# it elsewhere.
#
# CreatedOnce keeps the password stable: the generator returns a new value on
# every invocation, so any other policy would rotate the role password on each
# refresh. It survives workload updates; it does not survive a deliberate
# Secret delete (ESO recreates it with a fresh value and CNPG applies that as
# the new role password) and has no off-cluster backup.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hindsight-backlog-metrics-password
  namespace: database
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Kubernetes basic-auth type so CNPG's declarative role management picks up
# the password; the username must equal the managed role name. The
# cnpg.io/reload label makes the operator reconcile the role when the Secret
# changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-backlog-metrics-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: hindsight-backlog-metrics-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      # Replace: only these two keys land in the Secret, the raw generator
      # output key does not.
      mergePolicy: Replace
      data:
        username: hindsight_backlog_metrics
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hindsight-backlog-metrics-password
