---
# OpenBao's login for the database engine (see the openbao role in
# helmrelease.yaml). scripts/openbao-configure.sh gives OpenBao the same
# password from 1Password; it stays there so OpenBao never bootstraps Postgres.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openbao-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: openbao
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-cluster
        property: OPENBAO_PASSWORD
