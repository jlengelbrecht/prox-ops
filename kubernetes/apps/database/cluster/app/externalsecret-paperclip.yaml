---
# Credentials for the paperclip role. Kubernetes basic-auth type so CNPG's
# declarative role management picks up the password. PAPERCLIP_USER must be
# literally `paperclip` (CNPG requires the Secret's username to equal the
# managed role name).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperclip-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cluster
        property: PAPERCLIP_USER
    - secretKey: password
      remoteRef:
        key: postgres-cluster
        property: PAPERCLIP_PASSWORD
