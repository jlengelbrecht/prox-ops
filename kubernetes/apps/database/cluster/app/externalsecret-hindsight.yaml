---
# Credentials for the hindsight role. Kubernetes basic-auth type so CNPG's
# declarative role management picks up the password. Same 1Password key the
# Hindsight-side ExternalSecret (ai/hindsight-secrets) pulls from — single
# source of truth. HINDSIGHT_USER must be literally `hindsight` (CNPG
# requires the Secret's username to equal the managed role name) and
# HINDSIGHT_PASSWORD must be alphanumeric only: the Hindsight chart
# interpolates it unescaped into a database URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hindsight-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cluster
        property: HINDSIGHT_USER
    - secretKey: password
      remoteRef:
        key: postgres-cluster
        property: HINDSIGHT_PASSWORD
