---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-db-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: agentgateway
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: agentgateway-platform-secrets, property: POSTGRES_PASSWORD}
