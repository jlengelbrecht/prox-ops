---
# ToolHive's registry database, retired with ToolHive. ensure: absent makes
# CloudNative-PG drop it; remove this file once the database is gone.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: toolhive
  namespace: database
spec:
  name: toolhive
  owner: toolhive
  cluster:
    name: postgres
  ensure: absent
