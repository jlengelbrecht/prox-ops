---
# CNPG basic-auth credentials for the langfuse managed role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: langfuse-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: langfuse-secrets
        property: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: langfuse-secrets
        property: POSTGRES_PASSWORD
