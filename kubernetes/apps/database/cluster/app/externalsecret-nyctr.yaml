---
# Credentials for the nyctr role. Kubernetes basic-auth type so CNPG's
# declarative role management picks up the password. NYCTR_USER must be
# literally `nyctr` (CNPG requires the Secret's username to equal the managed
# role name). The Nyctr app reads the same two 1Password fields
# (security/nyctr/app/externalsecret.yaml), so both ends hold the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cluster
        property: NYCTR_USER
    - secretKey: password
      remoteRef:
        key: postgres-cluster
        property: NYCTR_PASSWORD
