---
# Both CNPG and the Groschen app read the same 1Password fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: groschen-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: groschen-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-cluster
        property: GROSCHEN_USER
    - secretKey: password
      remoteRef:
        key: postgres-cluster
        property: GROSCHEN_PASSWORD
