---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: database
spec:
  chartRef:
    kind: OCIRepository
    name: clickhouse-operator
  interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    crd:
      enabled: true
      keep: true
    manager:
      image:
        repository: ghcr.io/clickhouse/clickhouse-operator
        # renovate: datasource=docker depName=ghcr.io/clickhouse/clickhouse-operator
        tag: v0.0.8
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
