---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./job.yaml
# A fixed name: the Job's own name already changes with the file's hash.
configMapGenerator:
  - name: hindsight-backlog-role-limits
    files:
      - role-limits.sql
generatorOptions:
  disableNameSuffixHash: true
