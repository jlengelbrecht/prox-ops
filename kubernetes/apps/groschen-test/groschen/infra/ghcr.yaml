apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: groschen-ghcr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: groschen-ghcr
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":{{ .username | toJson }},"password":{{ .password | toJson }},"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: {key: agent-router-ghcr, property: username}
    - secretKey: password
      remoteRef: {key: agent-router-ghcr, property: password}
