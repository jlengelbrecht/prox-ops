apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-key-trigger}
spec: {length: 32, symbols: 0, allowRepeat: true}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-owner-password}
spec: {length: 32, symbols: 0, allowRepeat: true}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-member-password}
spec: {length: 32, symbols: 0, allowRepeat: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-db-credentials}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: groschen-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        groschen_db_pgpass: 'postgres-rw.database.svc.cluster.local:5432:groschen:{{ .username }}:{{ .password }}'
  data:
    - secretKey: username
      remoteRef: {key: postgres-cluster, property: GROSCHEN_USER}
    - secretKey: password
      remoteRef: {key: postgres-cluster, property: GROSCHEN_PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-key}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-key
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        # Sprig randBytes uses crypto/rand and returns base64 of exactly 32 bytes.
        groschen_secret_key: '{{ randBytes 32 }}'
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-key-trigger}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-owner-credentials}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-owner-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data: {password: '{{ .password }}'}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-owner-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-member-credentials}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-member-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data: {password: '{{ .password }}'}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-member-password}
