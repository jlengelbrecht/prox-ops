# Each target is immutable and orphaned: a Flux/ESO object recreation cannot
# rotate a credential while the disposable database volume is retained.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-db-password}
spec: {length: 32, symbols: 0, allowRepeat: true, encoding: hex}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-bootstrap-password}
spec: {length: 32, symbols: 0, allowRepeat: true, encoding: hex}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-key-trigger}
spec: {length: 32, symbols: 0, allowRepeat: true}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-owner-password}
spec: {length: 32, symbols: 0, allowRepeat: true}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: groschen-member-password}
spec: {length: 32, symbols: 0, allowRepeat: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-db-credentials}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-db-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        groschen_db_pgpass: 'db:5432:groschen:groschen:{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-db-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-bootstrap-credentials}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-bootstrap-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        postgres_superuser_password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-bootstrap-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-key}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-key
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        # Sprig randBytes uses crypto/rand and returns base64 of exactly 32 bytes.
        groschen_secret_key: '{{ randBytes 32 }}'
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-key-trigger}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-owner-credentials}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-owner-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data: {password: '{{ .password }}'}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-owner-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-member-credentials}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: groschen-member-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data: {password: '{{ .password }}'}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: groschen-member-password}
