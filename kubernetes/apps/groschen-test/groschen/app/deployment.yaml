apiVersion: apps/v1
kind: Deployment
metadata:
  name: groschen-api
  annotations:
    secret.reloader.stakater.com/reload: groschen-db-credentials
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: groschen-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: groschen-api}
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      # CoreDNS autopath can resolve the search-suffixed Plaid name first; query its exact FQDN first.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      imagePullSecrets: [{name: groschen-ghcr}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-secrets
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [/bin/sh, -ec]
          args:
            - |
              cp /source/groschen_db_pgpass /ready/groschen_db_pgpass
              cp /source/groschen_secret_key /ready/groschen_secret_key
              chmod 0600 /ready/*
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: projected, mountPath: /source, readOnly: true}
            - {name: ready, mountPath: /ready}
      containers:
        - name: api
          image: ghcr.io/jlengelbrecht/groschen:main@sha256:ef71d858c9a1c3b2ab1b412d352bbfd5b1a74eea7dc2be87a9c885e2d5e07fee
          imagePullPolicy: IfNotPresent
          command: [/app/api]
          env:
            - {name: DATABASE_URL, value: "host=postgres-rw.database.svc.cluster.local port=5432 user=groschen dbname=groschen sslmode=disable pool_max_conns=4"}
            - {name: PGPASSFILE, value: /run/secrets/groschen_db_pgpass}
            - {name: GROSCHEN_SECRET_KEY_FILE, value: /run/secrets/groschen_secret_key}
            - {name: APP_ORIGIN, value: "https://groshen.homelab0.org"}
            - {name: COOKIE_SECURE, value: "true"}
            - {name: GROSCHEN_TIMEZONE, value: America/New_York}
            # Ready envoy-internal pod IPs verified by PM; refresh before publication.
            - {name: GROSCHEN_TRUSTED_PROXIES, value: "10.42.10.214/32,10.42.7.77/32,10.42.9.235/32,10.42.2.132/32"}
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: STATIC_DIR, value: /app/public}
            - {name: SMTP_HOST, value: ""}
            - {name: SMTP_USERNAME, value: ""}
            - {name: SMTP_PASSWORD, value: ""}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ready, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: projected
          projected:
            defaultMode: 0444
            sources:
              - secret: {name: groschen-db-credentials, items: [{key: groschen_db_pgpass, path: groschen_db_pgpass}]}
              - secret: {name: groschen-key, items: [{key: groschen_secret_key, path: groschen_secret_key}]}
        - name: ready
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
