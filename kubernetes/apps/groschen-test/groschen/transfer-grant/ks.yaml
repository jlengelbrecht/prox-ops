apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: groschen-source-transfer-grant
  namespace: flux-system
spec:
  dependsOn:
    - name: groschen-infra
      namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/groschen-test/groschen/transfer-grant
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: groschen-test
  wait: true
