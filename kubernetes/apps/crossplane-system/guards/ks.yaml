---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-guards
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/crossplane-system/guards/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
