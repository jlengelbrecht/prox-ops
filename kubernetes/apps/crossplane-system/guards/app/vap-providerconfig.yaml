---
# V1: no ClusterProviderConfig and no legacy cluster-scoped ProviderConfig, ever.
# A ClusterProviderConfig is looked up cluster-wide and its secretRef may name
# any namespace, so one object would let an MR in any namespace act as that
# identity. Every policy here carries prune: disabled, so removing it from Git
# does not remove it from the cluster; breaking glass means deleting the live
# policy and binding by hand, then removing them in a reviewed PR.
#
# While an object is being deleted, a finalizer or other metadata-only change
# is still allowed so it can always be removed. A spec change is not: it is
# denied like any other update, even while deleting.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: crossplane-azuread-v1-no-cluster-providerconfig
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["azuread.m.upbound.io"]
        apiVersions: ["*"]
        resources: ["clusterproviderconfigs"]
        operations: ["CREATE", "UPDATE"]
      - apiGroups: ["azuread.upbound.io"]
        apiVersions: ["*"]
        resources: ["providerconfigs"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: not-a-metadata-only-update-while-deleting
      expression: >-
        request.operation == 'CREATE' ||
        !has(object.metadata.deletionTimestamp) ||
        object.spec != oldObject.spec
  validations:
    - expression: "false"
      message: >-
        ClusterProviderConfig and legacy azuread.upbound.io ProviderConfig are
        not allowed. Use a namespaced ProviderConfig (azuread.m.upbound.io) in
        the identity namespace.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: crossplane-azuread-v1-no-cluster-providerconfig
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: crossplane-azuread-v1-no-cluster-providerconfig
  validationActions: ["Deny"]
---
# V5: a namespaced ProviderConfig may only point at the assertion file the
# provider's own sidecar writes for its namespace's identity, with the client
# ID and tenant that go with that identity. All three identities' assertion
# files sit in one pod (/var/run/xp-assertion/{people,apps,ca}.jwt), so the
# path and client ID are the only things left tying a namespace to an
# identity; a Secret, Environment or Filesystem credential, or a mismatched
# path or client ID, would let one namespace's ProviderConfig authenticate as
# another's identity. The tenant ID and the per-namespace client IDs come
# from the identity-guard-params ConfigMap (1Password-sourced), never from
# Git, and this policy denies everything while that ConfigMap is missing.
# With all three assertions reachable from one pod, V1 (no
# ClusterProviderConfig, ever) matters more than before: a cluster-scoped
# config could still name any namespace's path from anywhere.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: crossplane-azuread-v5-providerconfig
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["azuread.m.upbound.io"]
        apiVersions: ["*"]
        resources: ["providerconfigs"]
        operations: ["CREATE", "UPDATE"]
  # A metadata-only update (a finalizer, a label) is not re-checked, deleting or
  # not, so a finalizer can always be removed. Any spec change is checked, also
  # while the object is being deleted.
  matchConditions:
    - name: spec-changed
      expression: >-
        request.operation == 'CREATE' ||
        object.spec != oldObject.spec
  variables:
    - name: tokenPaths
      expression: >-
        {'identity-people': '/var/run/xp-assertion/people.jwt',
        'identity-apps': '/var/run/xp-assertion/apps.jwt',
        'identity-ca': '/var/run/xp-assertion/ca.jwt'}
    - name: clientKey
      expression: "'client-id.' + request.namespace"
  validations:
    - expression: >-
        request.namespace in variables.tokenPaths
      message: "A ProviderConfig may exist only in identity-people, identity-apps or identity-ca."
    # Allowlist, so a field a later provider version adds is denied until it is
    # reviewed here. reconciliationPolicy does not affect authentication.
    - expression: >-
        object.spec.all(k, k in ['credentials', 'oidcTokenFilePath', 'tenantID', 'clientID', 'reconciliationPolicy']) &&
        (!has(object.spec.credentials) || object.spec.credentials.all(k, k == 'source'))
      message: "Only credentials.source, oidcTokenFilePath, tenantID, clientID and reconciliationPolicy may be set."
    - expression: >-
        has(object.spec.credentials) &&
        has(object.spec.credentials.source) &&
        object.spec.credentials.source == 'OIDCTokenFile' &&
        !has(object.spec.credentials.secretRef) &&
        !has(object.spec.credentials.env) &&
        !has(object.spec.credentials.fs)
      message: "credentials.source must be OIDCTokenFile, with no secretRef, env or fs block."
    - expression: >-
        request.namespace in variables.tokenPaths &&
        has(object.spec.oidcTokenFilePath) &&
        object.spec.oidcTokenFilePath == variables.tokenPaths[request.namespace]
      message: "oidcTokenFilePath must be this namespace's own assertion file."
    - expression: >-
        has(params.data) &&
        'tenant-id' in params.data &&
        params.data['tenant-id'].size() > 0 &&
        has(object.spec.tenantID) &&
        object.spec.tenantID == params.data['tenant-id']
      message: "tenantID must equal identity-guard-params' tenant-id."
    - expression: >-
        has(params.data) &&
        variables.clientKey in params.data &&
        params.data[variables.clientKey].size() > 0 &&
        has(object.spec.clientID) &&
        object.spec.clientID == params.data[variables.clientKey]
      message: "clientID must equal identity-guard-params' client-id for this namespace."
    - expression: >-
        !has(object.spec.msiEndpoint) && !has(object.spec.environment)
      message: "msiEndpoint and environment must not be set."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: crossplane-azuread-v5-providerconfig
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: crossplane-azuread-v5-providerconfig
  validationActions: ["Deny"]
  paramRef:
    name: identity-guard-params
    namespace: identity-system
    parameterNotFoundAction: Deny
