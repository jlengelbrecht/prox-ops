---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: provider-azuread
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/crossplane-system/provider-azuread/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    # The Provider, DeploymentRuntimeConfig and activation policy CRDs come
    # from the Crossplane chart.
    - name: crossplane
      namespace: flux-system
    # The admission policies must exist before the managed resource kinds are
    # served, including on a fresh cluster or a rebuild.
    - name: crossplane-guards
      namespace: flux-system
    # The signer's ExternalSecret (xp-assertion-signer) needs the identity
    # ClusterSecretStore to exist first.
    - name: identity-secret-store
      namespace: flux-system
