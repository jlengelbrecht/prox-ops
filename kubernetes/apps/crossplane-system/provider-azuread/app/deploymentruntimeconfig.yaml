---
# Runtime for the provider pod. Written from scratch, never from the upstream
# example, which turns debug logging on (debug output would ship reconcile
# detail to Loki).
#
# - Fixed ServiceAccount name, so rbac.yaml can bind it.
# - Secret cache off: the provider reads its credential Secrets with direct GETs
#   and needs no cluster-wide list/watch on Secrets.
# - No env vars. The Terraform provider reads ARM_* variables as auth defaults,
#   so anyone who could add env here could steer authentication.
# - ndots 1: Cilium FQDN policy drops a name resolved through the search path.
# - Restricted security context; /tmp is the only writable path.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azuread
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-azuread
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: provider-azuread
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          containers:
            - name: package-runtime
              args:
                - --no-enable-secret-cache  # kingpin bool: "=false" is rejected
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
