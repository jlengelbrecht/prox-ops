---
# Runtime for the provider pod. Written from scratch, never from the upstream
# example, which turns debug logging on (debug output would ship reconcile
# detail to Loki).
#
# - Fixed ServiceAccount name, so rbac.yaml can bind it.
# - Secret cache off: the provider reads its credential Secrets with direct GETs
#   and needs no cluster-wide list/watch on Secrets.
# - No env vars. The Terraform provider reads ARM_* variables as auth defaults,
#   so anyone who could add env here could steer authentication.
# - ndots 1: Cilium FQDN policy drops a name resolved through the search path.
# - Restricted security context; /tmp is the only writable path.
# - assertion-signer runs as a native sidecar (initContainers entry with
#   restartPolicy: Always) and signs the three OIDCTokenFile client assertions
#   the provider's ProviderConfigs read from /var/run/xp-assertion. The
#   signing key never leaves the attached YubiHSM 2, and the signer's HSM
#   credential (the xp-signer Secret) is mounted only into the signer, never
#   into package-runtime.
# - The signer does not hold the HSM. It reaches the YubiHSM 2 through the
#   yubihsm-connector Service in hsm-system (the `connector` key of the
#   xp-assertion-signer Secret, see externalsecret-signer.yaml), so the pod is
#   no longer pinned to the node that has the USB device. The signing session
#   is still opened by yubihsm-shell with the signer's own auth key; the
#   connector only carries it.
# - strategy: maxSurge 0 / maxUnavailable 1 stops the old pod before the new one
#   is created. No longer needed for the device, but kept: Crossplane applies the
#   Deployment as a merge patch, which cannot drop the defaulted rollingUpdate
#   block, so switching to type Recreate would be rejected by the API server.
# - assertion and signer-tmp are memory-backed emptyDirs: the signed
#   assertions and the signer's temp files never touch disk.
# - package-runtime mounts only the assertion directory, read-only: it never
#   sees the signer Secret (xp-signer) or the HSM device.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azuread
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-azuread
  deploymentTemplate:
    spec:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: provider-azuread
        spec:
          # Not shareProcessNamespace: true. The signer passes the HSM auth
          # key password to yubihsm-shell on its own command line; separate
          # PID namespaces keep package-runtime from ever seeing it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          initContainers:
            - name: assertion-signer
              restartPolicy: Always  # native sidecar: starts before package-runtime, keeps running
              image: ghcr.io/jlengelbrecht/yubihsm-tools:REPLACE_WITH_SHA_TAG@sha256:REPLACE_WITH_DIGEST
              command: ["xp-assertion-signer", "run"]
              startupProbe:
                exec:
                  command: ["xp-assertion-signer", "check", "--max-age", "300"]
                periodSeconds: 2
                failureThreshold: 60
              livenessProbe:
                exec:
                  command: ["xp-assertion-signer", "check", "--max-age", "360"]
                periodSeconds: 30
                failureThreshold: 3
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: assertion
                  mountPath: /var/run/xp-assertion
                - name: xp-signer
                  mountPath: /etc/xp-signer
                  readOnly: true
                - name: signer-tmp
                  mountPath: /tmp
          containers:
            - name: package-runtime
              args:
                - --no-enable-secret-cache  # kingpin bool: "=false" is rejected
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: assertion
                  mountPath: /var/run/xp-assertion
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: assertion
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            - name: signer-tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
            - name: xp-signer
              secret:
                secretName: xp-assertion-signer
                defaultMode: 0440  # group-readable; pod's fsGroup: 65532 lets the signer read it
