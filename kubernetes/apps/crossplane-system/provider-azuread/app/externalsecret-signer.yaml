---
# The assertion-signer sidecar's config directory, mounted read-only at
# /etc/xp-signer. password is the signer's HSM auth key password: that key
# can only sign with the three identity keys (no key generation, no
# deletion, no export). The certificates are public. The tenant and client
# IDs are kept out of the public repo, so they come from 1Password rather
# than being written here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xp-assertion-signer
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-identity
  target:
    name: xp-assertion-signer
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        identities: "people apps ca"
  data:
    - secretKey: auth-key-id
      remoteRef: {key: yubihsm-signer, property: auth-key-id}
    - secretKey: password
      remoteRef: {key: yubihsm-signer, property: password}
    - secretKey: people.key-id
      remoteRef: {key: yubihsm-signer, property: key-id-people}
    - secretKey: apps.key-id
      remoteRef: {key: yubihsm-signer, property: key-id-apps}
    - secretKey: ca.key-id
      remoteRef: {key: yubihsm-signer, property: key-id-ca}
    - secretKey: people.crt
      remoteRef:
        key: yubihsm-signer
        property: cert-people
        decodingStrategy: Base64
    - secretKey: apps.crt
      remoteRef:
        key: yubihsm-signer
        property: cert-apps
        decodingStrategy: Base64
    - secretKey: ca.crt
      remoteRef:
        key: yubihsm-signer
        property: cert-ca
        decodingStrategy: Base64
    - secretKey: tenant-id
      remoteRef: {key: xp-identity-people, property: tenantId}
    - secretKey: people.client-id
      remoteRef: {key: xp-identity-people, property: clientId}
    - secretKey: apps.client-id
      remoteRef: {key: xp-identity-apps, property: clientId}
    - secretKey: ca.client-id
      remoteRef: {key: xp-identity-ca, property: clientId}
