# A container with a request above a default limit and no explicit limit is
# rejected; workloads here set both requests and limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: factory-poc
  namespace: factory-poc
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 2Gi
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 10Gi
