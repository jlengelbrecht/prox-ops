---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: factory-poc
  namespace: factory-poc
spec:
  hard:
    pods: "10"
    persistentvolumeclaims: "5"
    requests.storage: 200Gi
    requests.nvidia.com/gpu: "0"
    requests.cpu: "4"
    requests.memory: 16Gi
    limits.cpu: "8"
    limits.memory: 24Gi
    requests.ephemeral-storage: 40Gi
    limits.ephemeral-storage: 60Gi
