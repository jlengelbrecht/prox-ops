---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-connector
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-operator
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/mcp/open-connector/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: mcp
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-connector-ai-access-route
  namespace: flux-system
spec:
  dependsOn:
    - name: onepassword-connect-ai-access
    - name: open-connector
    - name: agentgateway
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/mcp/open-connector/ai-access-route
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: mcp
  wait: true
