---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-connector
  annotations:
    secret.reloader.stakater.com/reload: open-connector-secrets,onepassword-connect-ai-access-tls
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-connector
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-connector
          image: ghcr.io/oomol-lab/open-connector:v1.10.1@sha256:a7426893e3f873c11e8a4450faac23ccc8668aaddb99a0c5bbd104a35d388e6f
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: OOMOL_CONNECT_DATA_DIR, value: /app/data}
            - {name: OOMOL_CONNECT_ORIGIN, value: "https://open-connector.homelab0.org"}
            - {name: OOMOL_CONNECT_ALLOWED_ACTIONS, value: hackernews.get_top_stories}
            - {name: OOMOL_CONNECT_ALLOWED_PROXIES, value: one_password}
            # Mixed mode requires runtime authentication even with an empty token
            # store. The gateway publishes neither the OAuth issuer nor registration.
            - {name: OOMOL_CONNECT_OAUTH_ENABLED, value: "true"}
            - {name: OOMOL_CONNECT_OAUTH_AUTH_MODE, value: mixed}
            - {name: OOMOL_CONNECT_OAUTH_ALLOW_DCR, value: "false"}
            - {name: OOMOL_CONNECT_OAUTH_ALLOW_CIMD, value: "false"}
            # The native provider rejects .local URLs. The pod DNS search path resolves the short Service name.
            - {name: OOMOL_CONNECT_EGRESS_TRUSTED_HOSTS, value: onepassword-connect}
            - {name: NODE_EXTRA_CA_CERTS, value: /run/onepassword-connect/tls.crt}
            - name: OOMOL_CONNECT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: open-connector-secrets, key: OOMOL_CONNECT_ENCRYPTION_KEY}
            - name: OOMOL_CONNECT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: open-connector-secrets, key: OOMOL_CONNECT_ADMIN_TOKEN}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: temp, mountPath: /tmp}
            - {name: onepassword-connect-ca, mountPath: /run/onepassword-connect, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-connector-data
        - name: temp
          emptyDir: {}
        - name: onepassword-connect-ca
          secret:
            secretName: onepassword-connect-ai-access-tls
            optional: true
            items:
              - {key: tls.crt, path: tls.crt}
