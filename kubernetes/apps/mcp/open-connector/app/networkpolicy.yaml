---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: open-connector
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: open-connector
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
    # The internal Envoy listener serves the OIDC-protected dashboard paths.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules:
            dns:
              - matchName: hacker-news.firebaseio.com
              - matchName: onepassword-connect.mcp.svc.cluster.local
    - toFQDNs:
        - matchName: hacker-news.firebaseio.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            homelab0.org/connect: ai-access
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
