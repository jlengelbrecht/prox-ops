---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-connector-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-connector-secrets
    creationPolicy: Owner
  data:
    - secretKey: OOMOL_CONNECT_ENCRYPTION_KEY
      remoteRef: {key: open-connector-secrets, property: ENCRYPTION_KEY}
    - secretKey: OOMOL_CONNECT_ADMIN_TOKEN
      remoteRef: {key: open-connector-secrets, property: ADMIN_TOKEN}
    - secretKey: OOMOL_CONNECT_RUNTIME_TOKEN
      remoteRef: {key: open-connector-secrets, property: RUNTIME_TOKEN}
