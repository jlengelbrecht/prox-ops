---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-connector-dashboard-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-connector-dashboard-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: open-connector-dashboard-oidc, property: OIDC_CLIENT_SECRET}
