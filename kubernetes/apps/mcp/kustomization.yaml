---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # MCP servers as plain HTTP Deployments (replacing the ToolHive runtime)
  - ./mcp-servers/ks.yaml
  - ./toolhive/ks.yaml
  - ./toolhive-gateway/ks.yaml
  # n8n-mcp is managed by ToolHive via an MCPServer CRD
  # See toolhive-gateway/app/mcpserver-n8n.yaml
  # Registry Server (MCP discovery) - must be in same namespace as MCPServers
  - ./toolhive-registry/ks.yaml
  # STORY-034-6 (EPIC-034 Phase 0): agentgateway MCP federation spike.
  # Additive and parallel to vmcp - reverting removes it entirely.
  - ./agentgateway-mcp-federation/ks.yaml
