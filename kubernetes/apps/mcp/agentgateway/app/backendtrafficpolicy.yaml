---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: agentgateway-mcp
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-mcp
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 600
            unit: Minute
  requestBuffer:
    limit: 1Mi
