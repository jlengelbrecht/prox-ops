---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .sessionKey }}"
        MCP_CLIENT_KEY: "{{ .mcpClientKey }}"
        LANGFUSE_AUTH_HEADER: '{{ printf "%s:%s" .langfusePublicKey .langfuseSecretKey | b64enc }}'
  data:
    - secretKey: sessionKey
      remoteRef: {key: agentgateway-mcp-secrets, property: SESSION_KEY}
    - secretKey: mcpClientKey
      remoteRef: {key: agentgateway-mcp-secrets, property: MCP_CLIENT_KEY}
    - secretKey: langfusePublicKey
      remoteRef: {key: agentgateway-mcp-secrets, property: LANGFUSE_PUBLIC_KEY}
    - secretKey: langfuseSecretKey
      remoteRef: {key: agentgateway-mcp-secrets, property: LANGFUSE_SECRET_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-upstreams
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-upstreams
    creationPolicy: Owner
  data:
    - secretKey: N8N_MCP_TOKEN
      remoteRef: {key: n8n-mcp-secrets, property: AUTH_TOKEN}
    - secretKey: OPEN_CONNECTOR_RUNTIME_TOKEN
      remoteRef: {key: open-connector-secrets, property: RUNTIME_TOKEN}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-platform
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: agentgateway-platform-secrets, property: POSTGRES_PASSWORD}
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: agentgateway-platform-secrets, property: OIDC_CLIENT_SECRET}
    - secretKey: OIDC_COOKIE_SECRET
      remoteRef: {key: agentgateway-platform-secrets, property: OIDC_COOKIE_SECRET}
