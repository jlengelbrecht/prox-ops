---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mcp.homelab0.org
spec:
  parentRefs:
    - {name: envoy-internal, namespace: network, sectionName: https}
  hostnames: [mcp.homelab0.org]
  rules:
    - matches:
        - path: {type: Exact, value: /mcp}
      backendRefs:
        - {name: agentgateway, port: 4000}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-ui
  annotations:
    external-dns.alpha.kubernetes.io/hostname: agentgateway.homelab0.org
spec:
  parentRefs:
    - {name: envoy-internal, namespace: network, sectionName: https}
  hostnames: [agentgateway.homelab0.org]
  rules:
    # The UI enables LLMs on its own listener by default. Publish only the
    # console paths so a UI edit cannot also publish an inference endpoint.
    - matches:
        - path: {type: Exact, value: /}
        - path: {type: PathPrefix, value: /ui}
        - path: {type: PathPrefix, value: /api}
        - path: {type: Exact, value: /oauth/callback}
      backendRefs:
        - {name: agentgateway, port: 4001}
