---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-operator
    - name: postgres-cluster
      namespace: database
    - name: authentik
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/apps/mcp/agentgateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: mcp
  wait: true
