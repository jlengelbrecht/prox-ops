---
# n8n-mcp: the n8n API key it calls n8n with, and the bearer token callers
# must present. LiteLLM reads the same AUTH_TOKEN (ai/litellm-n8n-mcp).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-mcp-http
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: n8n-mcp-http
    creationPolicy: Owner
  data:
    - secretKey: N8N_API_KEY
      remoteRef:
        key: n8n-mcp-secrets
        property: N8N_API_KEY
    - secretKey: AUTH_TOKEN
      remoteRef:
        key: n8n-mcp-secrets
        property: AUTH_TOKEN
---
# unifi-mcp: UniFi controller credentials (1Password item unifi-mcp).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp-http
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-mcp-http
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UNIFI_USERNAME: "{{ .username }}"
        UNIFI_PASSWORD: "{{ .credential }}"
        UNIFI_HOST: "{{ .unifiHost }}"
        UNIFI_PORT: "{{ .unifiPort }}"
        UNIFI_SITE: "{{ .unifiSite }}"
        UNIFI_VERIFY_SSL: "{{ .unifiVerifySsl }}"
  data:
    - secretKey: username
      remoteRef: {key: unifi-mcp, property: username}
    - secretKey: credential
      remoteRef: {key: unifi-mcp, property: credential}
    - secretKey: unifiHost
      remoteRef: {key: unifi-mcp, property: unifi_host}
    - secretKey: unifiPort
      remoteRef: {key: unifi-mcp, property: unifi_port}
    - secretKey: unifiSite
      remoteRef: {key: unifi-mcp, property: unifi_site}
    - secretKey: unifiVerifySsl
      remoteRef: {key: unifi-mcp, property: unifi_verify_ssl}
