---
# UniFi Network MCP server on its own Streamable HTTP transport, guarded by a
# bearer token. It holds admin credentials for the UniFi controller, so it is
# reachable only from the namespaces its network policy names (none yet) and
# every request needs UNIFI_MCP_HTTP_AUTH_TOKEN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-mcp
  namespace: mcp
  labels: {app.kubernetes.io/name: unifi-mcp, app.kubernetes.io/component: mcp-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: unifi-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: unifi-mcp, app.kubernetes.io/component: mcp-server}
      annotations:
        secret.reloader.stakater.com/reload: unifi-mcp-http,unifi-mcp-token
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: unifi-mcp
          image: ghcr.io/sirkirby/unifi-network-mcp:0.43.2
          env:
            - {name: UNIFI_MCP_HTTP_ENABLED, value: "true"}
            - {name: UNIFI_MCP_HTTP_FORCE, value: "true"}
            - {name: UNIFI_MCP_HOST, value: "0.0.0.0"}
            - {name: UNIFI_MCP_PORT, value: "3000"}
            # DNS-rebinding protection: the in-cluster Service names callers use.
            - {name: UNIFI_MCP_ALLOWED_HOSTS, value: "localhost,127.0.0.1,unifi-mcp,unifi-mcp.mcp.svc,unifi-mcp.mcp.svc.cluster.local"}
            - {name: HOME, value: /tmp}
          envFrom:
            - secretRef: {name: unifi-mcp-http}
            - secretRef: {name: unifi-mcp-token}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-mcp
  namespace: mcp
  labels: {app.kubernetes.io/name: unifi-mcp}
spec:
  selector: {app.kubernetes.io/name: unifi-mcp}
  ports:
    - {name: http, port: 3000, targetPort: http}
