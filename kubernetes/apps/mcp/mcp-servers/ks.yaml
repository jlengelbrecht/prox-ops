---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# MCP servers run as plain Deployments on their own Streamable HTTP transport,
# each behind a bearer token. No MCP runtime or gateway sits in front of them;
# LiteLLM's MCP gateway calls n8n directly until Spektr takes MCP over.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  targetNamespace: mcp
  path: ./kubernetes/apps/mcp/mcp-servers/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
