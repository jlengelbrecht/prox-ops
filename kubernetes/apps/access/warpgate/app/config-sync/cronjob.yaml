---
# Applies state.json to Warpgate's admin API and checks the agent write path.
# Changes to Warpgate go through Git here, so agents need no admin rights.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: warpgate-config-sync
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # A retry would pass after a repair and hide the tampering. The next run
      # is the retry.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: warpgate-config-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
              command: ["python", "-I", "/config/sync.py"]
              env:
                - name: WARPGATE_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: warpgate-admin-token
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: warpgate-config-sync
---
# Only Warpgate's HTTPS listener, plus DNS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: warpgate-config-sync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: warpgate-config-sync
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: warpgate
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
