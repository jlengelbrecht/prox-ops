---
# Warpgate secrets from the 1Password item `warpgate` (Automation vault):
#   admin-password      password of the local `admin` account, used to bootstrap
#                       and as break-glass; only applied while the database is
#                       empty, later changes do not rotate the account
#   oidc-client-secret  client secret of the Authentik "Warpgate" provider; the
#                       same field feeds authentik/authentik-warpgate. Letters
#                       and digits only: it is substituted into warpgate.yaml
#   encryption-key      base64 of exactly 32 random bytes; encrypts target
#                       credentials at rest. Losing it makes stored target
#                       credentials unrecoverable, so it lives only here
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warpgate-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: warpgate-secret
    creationPolicy: Owner
  data:
    - secretKey: adminPassword
      remoteRef: {key: warpgate, property: admin-password}
    - secretKey: oidcClientSecret
      remoteRef: {key: warpgate, property: oidc-client-secret}
    - secretKey: encryptionKey
      remoteRef: {key: warpgate, property: encryption-key}
