---
# Warpgate's Kubernetes target k8s-read, for coding agents checking their own
# rollouts, with no approval step. No pod runs as this account: its
# token is issued by OpenBao and rotated by kubernetes/apps/openbao/warpgate-tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warpgate-k8s-read
  namespace: access
automountServiceAccountToken: false
---
# Read workloads, their status, events and logs. No Secrets or ConfigMaps, no
# exec, attach or port-forward. Warpgate records responses, and pod logs can
# hold sensitive values, which is why agents reach this role only through it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-read
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - persistentvolumeclaims
      - pods
      - pods/log
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flagger.app"]
    resources: ["canaries"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: warpgate-k8s-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-read
subjects:
  - kind: ServiceAccount
    name: warpgate-k8s-read
    namespace: access
---
# OpenBao's Kubernetes secrets engine issues this account's token, for the
# rotation job, which holds no Kubernetes rights itself. A RoleBinding here, so
# with resourceNames OpenBao can mint a token for this one account and nothing
# else. It lives in this tree because the openbao tree's targetNamespace would
# move it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-warpgate-token-issuer
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["warpgate-k8s-read"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-warpgate-token-issuer
  namespace: access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-warpgate-token-issuer
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
