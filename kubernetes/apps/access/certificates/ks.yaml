---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app access-certificates
  namespace: flux-system
spec:
  targetNamespace: access
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cert-manager-config
      namespace: cert-manager
  interval: 1h
  path: ./kubernetes/apps/access/certificates/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
