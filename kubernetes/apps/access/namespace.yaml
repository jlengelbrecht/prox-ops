---
# Brokered access (Warpgate): the single entry point for SSH, Kubernetes and
# desktop sessions. Its LoadBalancer address is 10.20.67.27.
apiVersion: v1
kind: Namespace
metadata:
  name: access
  labels:
    kubernetes.io/metadata.name: access
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
