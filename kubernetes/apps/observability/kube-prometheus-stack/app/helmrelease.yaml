---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts
      version: 80.4.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
    # Grafana 13 migrates its database in place and cannot be downgraded. The
    # cluster-wide HelmRelease defaults roll a failed upgrade back, so a slow
    # Grafana 13 pod (readiness wait) or a failed post-upgrade hook (the
    # admission webhook patch Job) would start Grafana 12 on the migrated
    # database. With neither the wait nor the hooks, the upgrade fails only on
    # an apply error, so a broken Grafana 13 stays put for a reviewed fix or a
    # restore. The chart version is unchanged, so skipping the webhook patch
    # hook leaves the existing webhook certificate in place. Remove both once
    # Grafana 13 has been accepted.
    disableWait: true
    disableHooks: true
  values:
    # Prometheus configuration
    prometheus:
      enabled: true
      prometheusSpec:
        # Data retention
        retention: 30d
        # Below the 85% PVCNearlyFull threshold of the 100Gi claim (about 98G
        # usable), with room for the WAL and compaction headroom.
        retentionSize: "75GB"

        # Resource limits
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

        # Startup probe - allow extended time for WAL replay after downtime
        # WAL replay can take up to 40 minutes with 548 segments
        # Chart default periodSeconds is 15s, so 240 failures = 60 minutes max startup
        startupProbe:
          failureThreshold: 240  # 240 * 15s (chart default) = 60 min max startup

        # Storage configuration
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi

        # Service monitors
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

        # Additional alert rules from ConfigMaps
        additionalPrometheusRulesSelector:
          matchLabels:
            prometheus: kube-prometheus-stack
            role: alert-rules

        # Enable remote write receiver (for future use)
        enableRemoteWriteReceiver: false

        # Enable feature flags
        enableFeatures: []

        # Scrape configs
        additionalScrapeConfigs: []

        # Pod configuration
        podMetadata:
          labels:
            app: prometheus

        # Replicas (for homelab, single replica is sufficient)
        replicas: 1

        # WAL compression
        walCompression: true

    # Grafana configuration
    grafana:
      enabled: true

      # The exact build the upgrade rehearsal migrated a clone of this volume
      # with. The distroless image runs the grafana binary directly (no shell,
      # no run.sh).
      image:
        tag: 13.3.0-distroless
        sha: 540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df

      # Recreate stops the Grafana 12 pod before this one starts, so the copy
      # is taken with the database closed. The first run writes the marker
      # last; later runs only verify the copy and never replace it with a
      # migrated database. A partial or damaged copy stops the pod for a human
      # to look at. Same script as the rehearsal's pre-13-backup init.
      extraInitContainers:
        - name: pre-13-backup
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              src="$GRAFANA_DATA"
              dst="$GRAFANA_DATA/pre-13-backup"
              marker="$dst/COMPLETE"
              files="grafana.db grafana.db-wal grafana.db-shm grafana.db-journal"
              fail() { echo "pre-13-backup: $1" >&2; exit 1; }
              digest() { sha256sum "$1" | cut -d' ' -f1; }
              if [ -e "$marker" ]; then
                [ "$(sed -n 1p "$marker")" = "$BACKUP_TAG" ] || fail "marker is for another backup"
                [ "$(sed -n 2p "$marker")" = "$(digest "$dst/SHA256SUMS")" ] || fail "checksum list changed"
                grep -q '  grafana.db$' "$dst/SHA256SUMS" || fail "checksum list has no grafana.db"
                (cd "$dst" && sha256sum -c SHA256SUMS >/dev/null) || fail "copy does not match its checksums"
                echo "pre-13-backup: verified existing copy"
                exit 0
              fi
              [ ! -e "$dst" ] || fail "incomplete copy found; refusing to overwrite it"
              [ -f "$src/grafana.db" ] || fail "no grafana.db to copy"
              mkdir "$dst"
              for f in $files; do
                if [ -e "$src/$f" ]; then cp -p "$src/$f" "$dst/$f"; fi
              done
              sync
              for f in $files; do
                if [ -e "$dst/$f" ]; then
                  sum="$(digest "$dst/$f")"
                  [ "$sum" = "$(digest "$src/$f")" ] || fail "copy of $f differs from the source"
                  echo "$sum  $f" >> "$dst/SHA256SUMS"
                fi
              done
              printf '%s\n%s\n' "$BACKUP_TAG" "$(digest "$dst/SHA256SUMS")" > "$dst/.COMPLETE.tmp"
              sync
              mv "$dst/.COMPLETE.tmp" "$marker"
              sync
              echo "pre-13-backup: copy complete"
          env:
            - {name: GRAFANA_DATA, value: /var/lib/grafana}
            - {name: BACKUP_TAG, value: grafana-12-before-13.3.0}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsGroup: 472
            runAsNonRoot: true
            runAsUser: 472
            seccompProfile: {type: RuntimeDefault}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}

      # Scratch space the Grafana 13 chart mounts: /tmp, and the unified-storage
      # search index, which is rebuilt on start and kept off the data volume.
      extraEmptyDirMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: search, mountPath: /var/lib/grafana-search}

      # Disable default datasource provisioning from chart
      forceDeployDatasources: false

      # Admin credentials from secret
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Persistence
      persistence:
        enabled: true
        type: pvc
        storageClassName: ceph-block
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        # Helm leaves the claim in place on uninstall or a failed-upgrade cleanup
        annotations:
          helm.sh/resource-policy: keep

      # Service configuration for LoadBalancer
      service:
        type: LoadBalancer
        port: 80
        targetPort: 3000
        annotations:
          io.cilium/lb-ipam-ips: "10.20.67.24"

      # Ingress disabled (using LoadBalancer)
      ingress:
        enabled: false

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Deployment strategy - use Recreate for RWO volumes
      deploymentStrategy:
        type: Recreate

      # Grafana configuration
      grafana.ini:
        server:
          domain: grafana.homelab0.org
          root_url: "http://grafana.homelab0.org"
        analytics:
          check_for_updates: false
          reporting_enabled: false
        log:
          mode: console
        paths:
          data: /var/lib/grafana/
          logs: /var/log/grafana
          plugins: /var/lib/grafana/plugins
          provisioning: /etc/grafana/provisioning
        unified_storage:
          index_path: /var/lib/grafana-search/bleve
        # Keep the plugins on the volume at the versions Grafana 12 used until
        # 13 is accepted, so a rollback from the database cold copy does not
        # meet plugins already updated for 13.
        plugins:
          preinstall_auto_update: false

      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC

      # Datasources - manually provision since we disabled chart defaults
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              access: proxy
              isDefault: true
              jsonData:
                timeInterval: 30s
            - name: Loki
              type: loki
              url: http://loki:3100
              access: proxy
              isDefault: false
              # Disable alert rule management - Loki is for logs, not Prometheus-style metrics
              editable: false
              jsonData:
                maxLines: 1000
                # Disable alerting UI - Loki uses LogQL, not PromQL for alerts
                manageAlerts: false
                derivedFields:
                  - datasourceUid: Prometheus
                    matcherRegex: "traceID=(\\w+)"
                    name: TraceID
                    url: "$${__value.raw}"
                # Loki runs multi-tenant; match the tenant Alloy pushes to
                httpHeaderName1: X-Scope-OrgID
              secureJsonData:
                httpHeaderValue1: "1"

      # Dashboard providers for external dashboards (gnetId)
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'unpoller'
              orgId: 1
              folder: 'UniFi'
              type: file
              # A file leaving this root must never delete its dashboard or its
              # version history; Grafana only unprovisions it.
              disableDeletion: true
              editable: true
              options:
                path: /var/lib/grafana/dashboards/unpoller

      # UnPoller dashboards from grafana.com
      dashboards:
        unpoller:
          unpoller-client-dpi:
            gnetId: 11310
            revision: 9
            datasource: Prometheus
          unpoller-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          unpoller-usw:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          unpoller-usg:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          unpoller-uap:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          unpoller-clients:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
          unpoller-network-sites:
            gnetId: 22143
            revision: 2
            datasource: Prometheus
          # PDU dashboard uses ConfigMap (dashboards/unpoller-pdu-dashboard.yaml)
          # due to datasource variable format incompatibility with gnetId provisioning

      # Sidecar for dashboard discovery
      sidecar:
        dashboards:
          enabled: true
          defaultFolderName: "General"
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: grafana_folder
          searchNamespace: ALL
          provider:
            foldersFromFilesStructure: true
            # A dashboard whose file disappears (ConfigMap removed or key renamed) is
            # kept as an unmanaged dashboard with its version history, not deleted
            disableDelete: true
        datasources:
          enabled: false

    # AlertManager configuration
    alertmanager:
      enabled: true
      alertmanagerSpec:
        # Resource limits
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        # Storage configuration
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

        # Replicas
        replicas: 1

        # Retention
        retention: 168h  # 7 days

        # Pod configuration
        podMetadata:
          labels:
            app: alertmanager

        # Routing and receivers live in the alertmanager-config Secret,
        # rendered from 1Password by alertmanager-externalsecret.yaml.
        useExistingSecret: true
        configSecret: alertmanager-config

    # Prometheus Operator configuration
    prometheusOperator:
      enabled: true

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Prometheus config reloader
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi

    # Kube State Metrics
    kubeStateMetrics:
      enabled: true

    # Node Exporter
    nodeExporter:
      enabled: true

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # Default rules
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: true
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubeControllerManager: true
        kubelet: true
        kubeProxy: false  # Disabled - Talos uses Cilium which replaces kube-proxy
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeSchedulerAlerting: true
        kubeSchedulerRecording: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true

    # Global configuration
    global:
      rbac:
        create: true
        createAggregateClusterRoles: true

    # etcd runs on the Talos controllers with plain-HTTP metrics on :2381
    # (listen-metrics-urls in talos/patches/controller/cluster.yaml). The
    # chart creates a selector-less Service with these endpoints.
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.20.67.1
        - 10.20.67.2
        - 10.20.67.3
