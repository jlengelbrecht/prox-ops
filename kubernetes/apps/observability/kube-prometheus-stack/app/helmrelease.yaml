---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
  annotations:
    # The cluster-wide HelmRelease defaults roll back failed upgrades and
    # replace CRDs; this release sets its own install, upgrade and rollback
    homelab0.org/helm-defaults: disabled
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts
      version: 91.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  interval: 1h
  # Covers the Grafana startupProbe budget below plus the rest of the rollout
  timeout: 40m
  # The prometheus-operator-crds release is the only owner of the CRDs
  install:
    remediation:
      retries: 3
    crds: Skip
    strategy:
      name: RetryOnFailure
  upgrade:
    cleanupOnFail: true
    # Grafana 13 migrates its database in place and the migration cannot be
    # undone. A rollback would start Grafana 12 on the migrated database, so a
    # failed upgrade stays failed until a reviewed fix or restore lands.
    remediation:
      retries: 0
      remediateLastFailure: false
    crds: Skip
    strategy:
      name: RemediateOnFailure
  rollback:
    cleanupOnFail: true
    recreate: true
  values:
    crds:
      enabled: false


    # Prometheus configuration
    prometheus:
      enabled: true
      prometheusSpec:
        # Data retention
        retention: 30d
        retentionSize: "90GB"

        # Resource limits
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

        # Startup probe - allow extended time for WAL replay after downtime
        # WAL replay can take up to 40 minutes with 548 segments
        # Chart default periodSeconds is 15s, so 240 failures = 60 minutes max startup
        startupProbe:
          failureThreshold: 240  # 240 * 15s (chart default) = 60 min max startup

        # Storage configuration
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi

        # Select every ServiceMonitor, PodMonitor and PrometheusRule instead of
        # only those carrying the release label
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

        # Additional alert rules from ConfigMaps
        additionalPrometheusRulesSelector:
          matchLabels:
            prometheus: kube-prometheus-stack
            role: alert-rules

        # Enable remote write receiver (for future use)
        enableRemoteWriteReceiver: false

        # Enable feature flags
        enableFeatures: []

        # Scrape configs
        additionalScrapeConfigs: []

        # Pod configuration
        podMetadata:
          labels:
            app: prometheus

        # Replicas (for homelab, single replica is sufficient)
        replicas: 1

        # WAL compression
        walCompression: true

    # Grafana configuration
    grafana:
      enabled: true

      # Disable default datasource provisioning from chart
      forceDeployDatasources: false

      # Admin credentials from secret
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Persistence
      persistence:
        enabled: true
        type: pvc
        storageClassName: ceph-block
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        # Helm leaves the claim in place on uninstall or a failed-upgrade cleanup
        annotations:
          helm.sh/resource-policy: keep

      # Service configuration for LoadBalancer
      service:
        type: LoadBalancer
        port: 80
        targetPort: 3000
        annotations:
          io.cilium/lb-ipam-ips: "10.20.67.24"

      # Ingress disabled (using LoadBalancer)
      ingress:
        enabled: false

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Deployment strategy - use Recreate for RWO volumes
      deploymentStrategy:
        type: Recreate

      # Recreate stops the old pod before this one starts, so this copy is
      # taken with the database closed, as the Grafana 13 upgrade guide asks.
      # The first run writes the marker last; later runs only verify the copy
      # and never replace it with a migrated database. Any partial or damaged
      # copy stops the pod for a human to look at.
      extraInitContainers:
        - name: pre-13-backup
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GRAFANA_DATA
              value: /var/lib/grafana
            - name: BACKUP_TAG
              value: grafana-12-before-13.2.3
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              src="$GRAFANA_DATA"
              dst="$GRAFANA_DATA/pre-13-backup"
              marker="$dst/COMPLETE"
              files="grafana.db grafana.db-wal grafana.db-shm grafana.db-journal"
              fail() { echo "pre-13-backup: $1" >&2; exit 1; }
              digest() { sha256sum "$1" | cut -d' ' -f1; }
              if [ -e "$marker" ]; then
                [ "$(sed -n 1p "$marker")" = "$BACKUP_TAG" ] || fail "marker is for another backup"
                [ "$(sed -n 2p "$marker")" = "$(digest "$dst/SHA256SUMS")" ] || fail "checksum list changed"
                grep -q '  grafana.db$' "$dst/SHA256SUMS" || fail "checksum list has no grafana.db"
                (cd "$dst" && sha256sum -c SHA256SUMS >/dev/null) || fail "copy does not match its checksums"
                echo "pre-13-backup: verified existing copy"
                exit 0
              fi
              [ ! -e "$dst" ] || fail "incomplete copy found; refusing to overwrite it"
              [ -f "$src/grafana.db" ] || fail "no grafana.db to copy"
              mkdir "$dst"
              for f in $files; do
                if [ -e "$src/$f" ]; then cp -p "$src/$f" "$dst/$f"; fi
              done
              sync
              for f in $files; do
                if [ -e "$dst/$f" ]; then
                  sum="$(digest "$dst/$f")"
                  [ "$sum" = "$(digest "$src/$f")" ] || fail "copy of $f differs from the source"
                  echo "$sum  $f" >> "$dst/SHA256SUMS"
                fi
              done
              printf '%s\n%s\n' "$BACKUP_TAG" "$(digest "$dst/SHA256SUMS")" > "$dst/.COMPLETE.tmp"
              sync
              mv "$dst/.COMPLETE.tmp" "$marker"
              sync
              echo "pre-13-backup: copy complete"
          securityContext:
            runAsUser: 472
            runAsGroup: 472
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana

      # The Grafana 13 database migration runs before /api/health answers;
      # 360 x 5s gives it 30 minutes before liveness can restart the pod
      startupProbe:
        httpGet:
          path: /api/health
          port: grafana
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 360

      # Grafana configuration
      grafana.ini:
        server:
          domain: grafana.homelab0.org
          root_url: "http://grafana.homelab0.org"
        analytics:
          check_for_updates: false
          reporting_enabled: false
        log:
          mode: console
        paths:
          data: /var/lib/grafana/
          logs: /var/log/grafana
          plugins: /var/lib/grafana/plugins
          provisioning: /etc/grafana/provisioning
        # Newer grafana charts dropped this default; keep the value Grafana ran with
        grafana_net:
          url: https://grafana.net

      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC

      # Datasources - manually provision since we disabled chart defaults
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              access: proxy
              isDefault: true
              jsonData:
                timeInterval: 30s
            - name: Loki
              type: loki
              url: http://loki:3100
              access: proxy
              isDefault: false
              # Disable alert rule management - Loki is for logs, not Prometheus-style metrics
              editable: false
              jsonData:
                maxLines: 1000
                # Disable alerting UI - Loki uses LogQL, not PromQL for alerts
                manageAlerts: false
                derivedFields:
                  - datasourceUid: Prometheus
                    matcherRegex: "traceID=(\\w+)"
                    name: TraceID
                    url: "$${__value.raw}"
                # Loki runs multi-tenant; match the tenant Promtail pushes to
                httpHeaderName1: X-Scope-OrgID
              secureJsonData:
                httpHeaderValue1: "1"

      # Dashboard providers for external dashboards (gnetId)
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'unpoller'
              orgId: 1
              folder: 'UniFi'
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/unpoller

      # UnPoller dashboards from grafana.com
      dashboards:
        unpoller:
          unpoller-client-dpi:
            gnetId: 11310
            revision: 9
            datasource: Prometheus
          unpoller-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          unpoller-usw:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          unpoller-usg:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          unpoller-uap:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          unpoller-clients:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
          unpoller-network-sites:
            gnetId: 22143
            revision: 2
            datasource: Prometheus
          # PDU dashboard uses ConfigMap (dashboards/unpoller-pdu-dashboard.yaml)
          # due to datasource variable format incompatibility with gnetId provisioning

      # Sidecar for dashboard discovery
      sidecar:
        dashboards:
          enabled: true
          defaultFolderName: "General"
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: grafana_folder
          searchNamespace: ALL
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: false

    # AlertManager configuration
    alertmanager:
      enabled: true
      alertmanagerSpec:
        # Resource limits
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        # Storage configuration
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

        # Replicas
        replicas: 1

        # Retention
        retention: 168h  # 7 days

        # Pod configuration
        podMetadata:
          labels:
            app: alertmanager

      # AlertManager routing configuration
      # Minimal config - configure receivers via AlertManager UI
      config:
        global:
          resolve_timeout: 5m

        route:
          receiver: 'null'
          group_by: ['alertname']
          group_wait: 10s
          group_interval: 10s
          repeat_interval: 1h

        receivers:
          - name: 'null'

    # Prometheus Operator configuration
    prometheusOperator:
      enabled: true

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Prometheus config reloader
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi

    # Kube State Metrics
    kubeStateMetrics:
      enabled: true

    # Node Exporter
    nodeExporter:
      enabled: true

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # Default rules
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: false  # Disabled - Talos runs etcd on host, metrics not exposed
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubeControllerManager: true
        kubelet: true
        kubeProxy: false  # Disabled - Talos uses Cilium which replaces kube-proxy
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeSchedulerAlerting: true
        kubeSchedulerRecording: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true

    # Global configuration
    global:
      rbac:
        create: true
        createAggregateClusterRoles: true

    # Disable etcd monitoring - Talos runs etcd on host, metrics not exposed to Kubernetes
    kubeEtcd:
      enabled: false
