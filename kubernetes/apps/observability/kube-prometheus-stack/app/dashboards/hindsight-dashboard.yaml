apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hindsight
  namespace: observability
  labels:
    grafana_dashboard: "1"
    grafana_folder: "Observability"
  annotations:
    grafana_folder: "Observability"
data:
  hindsight-ingestion.json: |-
    {
      "uid": "hindsight-ingestion",
      "title": "Hindsight ingestion: native status",
      "description": "Native 0.9.2 metrics. Pending includes deferred children; failed is historical status, not new failures. Worker completions are throughput, not terminal success. Bank labels grow with bank count.",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Retain children: pending by bank",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum by (bank_id) (hindsight_async_operations{namespace=\"ai\",operation_type=\"retain\",status=\"pending\"})",
              "legendFormat": "{{bank_id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Failed retain children by bank (historical status)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum by (bank_id) (hindsight_async_operations{namespace=\"ai\",operation_type=\"retain\",status=\"failed\"})",
              "legendFormat": "{{bank_id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Failed batch parents, separate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum by (bank_id) (hindsight_async_operations{namespace=\"ai\",operation_type=\"batch_retain\",status=\"failed\"})",
              "legendFormat": "{{bank_id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Worker retain completions per second",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum by (bank_id) (rate(hindsight_operation_operations_total{namespace=\"ai\",operation=\"retain\",source=\"worker\"}[5m]))",
              "legendFormat": "{{bank_id}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "LLM call rate by success and scope",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum by (scope,success) (rate(hindsight_llm_calls_total{namespace=\"ai\"}[5m]))",
              "legendFormat": "{{scope}} {{success}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "LLM request p95 seconds by scope",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le,scope) (rate(hindsight_llm_duration_seconds_bucket{namespace=\"ai\"}[5m])))",
              "legendFormat": "{{scope}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "API HTTP 429s (inbound, not provider)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(hindsight_http_requests_total{namespace=\"ai\",status_code=\"429\"}[5m]))",
              "legendFormat": "inbound 429",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Database pool waiting callers",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "hindsight_db_pool_waiting{namespace=\"ai\"}",
              "legendFormat": "waiting callers",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Database pool acquire p95 seconds",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(hindsight_db_pool_acquire_wait_seconds_bucket{namespace=\"ai\"}[5m])))",
              "legendFormat": "acquire p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Metrics scrape up",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "up{namespace=\"ai\",service=\"hindsight-api\"}",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
