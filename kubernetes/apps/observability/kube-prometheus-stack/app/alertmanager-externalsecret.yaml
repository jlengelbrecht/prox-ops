---
# Alertmanager config, rendered from 1Password so the webhook URL and
# Pushover keys never land in Git. The chart is told to use this Secret
# (alertmanagerSpec.useExistingSecret/configSecret in helmrelease.yaml).
#
# Routing:
#   - warning, high (Tetragon security rules) and critical go to Discord.
#   - Pushover only gets alerts labelled pager="true" (node down, a full
#     disk or PVC, a stale etcd backup). Severity alone is not enough: some
#     custom rules mark routine problems critical.
#   - info and the Watchdog heartbeat go nowhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m

          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
              equal:
                - namespace
                - alertname
            - source_matchers:
                - alertname = "NodeDown"
              target_matchers:
                - alertname =~ "Node.*"
                - alertname != "NodeDown"
              equal:
                - instance

          route:
            receiver: "null"
            group_by:
              - alertname
              - namespace
            group_wait: 1m
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - matchers:
                  - alertname =~ "Watchdog|InfoInhibitor"
                receiver: "null"
              # A request fails after about 10 minutes, so page at once and
              # keep paging. Later requests share this one alert.
              - matchers:
                  - alertname = "WarpgateApprovalPending"
                receiver: pushover
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 3m
              - matchers:
                  - pager = "true"
                receiver: pushover
                repeat_interval: 2h
                continue: true
              - matchers:
                  - severity =~ "critical|high"
                receiver: discord
                repeat_interval: 4h
              - matchers:
                  - severity = "warning"
                receiver: discord

          receivers:
            - name: "null"
            - name: discord
              discord_configs:
                - webhook_url: "{{ .discord_webhook_url }}"
                  send_resolved: true
                  # Plain wording: the default dumps every label and an
                  # in-cluster Prometheus link. The raw strings keep these
                  # for Alertmanager; rules can add an `action` annotation.
                  title: {{`'{{ if eq .Status "firing" }}Problem{{ else }}Cleared{{ end }}: {{ or (index .Alerts 0).Annotations.summary .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts }} alerts){{ end }}'`}}
                  message: {{`|-
                    {{ if eq .Status "firing" -}}
                    {{ range .Alerts -}}
                    {{ or .Annotations.description .Annotations.message .Annotations.summary .Labels.alertname }}
                    {{ with .Annotations.action }}What to do: {{ . }}
                    {{ end -}}
                    {{ with .Labels.namespace }}Where: {{ . }}
                    {{ end }}
                    {{ end -}}
                    {{- else -}}
                    Nothing to do.
                    {{- end }}`}}
            - name: pushover
              pushover_configs:
                - user_key: "{{ .pushover_user_key }}"
                  token: "{{ .pushover_token }}"
                  priority: "1"
                  send_resolved: true
                  # Same wording as Discord: the default lists every label.
                  title: {{`'{{ if eq .Status "firing" }}Problem{{ else }}Cleared{{ end }}: {{ or (index .Alerts 0).Annotations.summary .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts }} alerts){{ end }}'`}}
                  message: {{`|-
                    {{ if eq .Status "firing" -}}
                    {{ range .Alerts -}}
                    {{ or .Annotations.description .Annotations.message .Annotations.summary .Labels.alertname }}
                    {{ with .Annotations.action }}What to do: {{ . }}
                    {{ end -}}
                    {{ with .Labels.namespace }}Where: {{ . }}
                    {{ end }}
                    {{ end -}}
                    {{- else -}}
                    Nothing to do.
                    {{- end }}`}}
  data:
    - secretKey: discord_webhook_url
      remoteRef:
        key: Prometheus_Discord_Webhook
        property: discord_webhook_url
    - secretKey: pushover_user_key
      remoteRef:
        key: Pushover_Prometheus
        property: pushover_user_key
    - secretKey: pushover_token
      remoteRef:
        key: Pushover_Prometheus
        property: pushover_token
