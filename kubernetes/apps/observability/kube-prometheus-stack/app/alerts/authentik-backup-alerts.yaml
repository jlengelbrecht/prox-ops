---
# The security/authentik-backup CronJob runs daily. These page when no run has
# succeeded for over a day, because that dump is the only copy of Authentik's
# users, applications, flows and policies outside the cluster.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authentik-backup-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: authentik-backup-alerts
      rules:
        - alert: AuthentikBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="security",cronjob="authentik-backup"} > 26 * 3600
          for: 15m
          labels:
            severity: critical
            component: authentik
            pager: "true"
          annotations:
            summary: "No successful Authentik backup in over 26 hours"
            description: "The last successful security/authentik-backup run finished {{ $value | humanizeDuration }} ago. Check the job's logs, the UNAS NFS share and the authentik-postgresql pod."

        - alert: AuthentikBackupMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="security",cronjob="authentik-backup"})
          for: 2h
          labels:
            severity: warning
            component: authentik
          annotations:
            summary: "Authentik backup CronJob has no successful run on record"
            description: "kube-state-metrics reports no last successful time for security/authentik-backup. The CronJob may be missing, or it has not succeeded yet."
