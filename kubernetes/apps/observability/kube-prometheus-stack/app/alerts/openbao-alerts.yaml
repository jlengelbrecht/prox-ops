---
# OpenBao and the YubiHSM behind its seal. A sealed or crashed replica shows
# as not ready (its readiness probe needs it unsealed), so pod readiness is
# the signal for seal state: vault_core_unsealed and vault_core_active keep
# old series for the telemetry retention time, under more than one label set.
# OpenBao's own metrics cover Raft health. The HSM is reachable when
# yubihsm-connector is ready: its readiness checks for status=OK, which it
# reports only while the device is attached.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: openbao-alerts
      rules:
        # Two of three replicas keep Raft quorum. Below that OpenBao stops
        # serving.
        - alert: OpenBaoQuorumAtRisk
          # absent(): also fires when the pods are gone altogether.
          expr: |
            sum(kube_pod_status_ready{namespace="openbao",pod=~"openbao-[0-9]+",condition="true"}) < 2
            or absent(kube_pod_status_ready{namespace="openbao",pod=~"openbao-[0-9]+",condition="true"})
          for: 5m
          labels:
            severity: critical
            component: openbao
            pager: "true"
          annotations:
            summary: "Fewer than two OpenBao replicas are ready"
            description: "Fewer than two of the 3 OpenBao replicas are ready (unsealed), or none are reported at all. Raft needs two. Check the pods in the openbao namespace and whether yubihsm-connector is up: replicas can only unseal through the HSM."

        - alert: OpenBaoReplicaNotReady
          expr: kube_pod_status_ready{namespace="openbao",pod=~"openbao-[0-9]+",condition="true"} == 0
          for: 15m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "OpenBao replica {{ $labels.pod }} is not ready"
            description: "{{ $labels.pod }} has been not ready (sealed, crashed or not joined) for 15 minutes. The others keep serving; a restart only helps once the HSM is reachable."

        # Autopilot's own count of the voters Raft can lose, reported by the
        # leader. This also catches replicas that are ready but not healthy
        # voters, which pod readiness can't see.
        - alert: OpenBaoNoFailureTolerance
          expr: min(vault_autopilot_failure_tolerance) < 1
          for: 15m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "OpenBao can't lose another replica"
            description: "Raft autopilot reports no failure tolerance for 15 minutes: one more replica lost means no quorum. Check bao operator raft list-peers and bao operator raft autopilot state."

        # Each election raises the Raft term, which survives pod restarts, so
        # the rise over an hour counts them even between scrapes. A rolling
        # restart causes one or two.
        - alert: OpenBaoLeaderFlapping
          expr: max(vault_raft_storage_stats_term) - max(vault_raft_storage_stats_term offset 1h) > 3
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "OpenBao ran {{ $value }} Raft elections in an hour"
            description: "Repeated Raft elections usually mean slow storage or network trouble between replicas. Check the OpenBao logs and Ceph latency."

        # Scrapes go to each pod, so these work while a replica is sealed.
        # Without them the alerts above stop firing unnoticed.
        - alert: OpenBaoMetricsDown
          expr: |
            up{namespace="openbao",pod=~"openbao-[0-9]+"} == 0
            or absent(up{namespace="openbao",pod=~"openbao-[0-9]+"})
            or count(up{namespace="openbao",pod=~"openbao-[0-9]+"}) < count(kube_pod_info{namespace="openbao",pod=~"openbao-[0-9]+"})
          for: 15m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "Prometheus can't scrape OpenBao metrics"
            description: "Scrapes of the metrics listener (port 8220) have failed for 15 minutes, or a replica has no target. Check the PodMonitor openbao/openbao, the openbao-server network policy and the server certificate."

        # The HSM serves OpenBao's unseal and the Entra workload identity
        # signatures. Running OpenBao replicas keep working without it; any
        # restart can't unseal until it's back. A warning, not a page: Thor
        # powers off on the last day of each month for iDRAC updates and
        # k8s-work-12 reboots for Talos patches, and the urgent case (replicas
        # that can't unseal) already pages through OpenBaoQuorumAtRisk.
        - alert: YubiHSMUnavailable
          expr: |
            max(kube_deployment_status_replicas_available{namespace="hsm-system",deployment="yubihsm-connector"}) < 1
            or absent(kube_deployment_status_replicas_available{namespace="hsm-system",deployment="yubihsm-connector"})
          for: 20m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "The YubiHSM is not reachable"
            description: "yubihsm-connector has no ready pod, so the HSM is missing, unplugged or its node is down (k8s-work-12 on Thor). OpenBao replicas can't unseal after a restart, and Entra workload identity can't sign new assertions."

        # A real loss (failed or unplugged unit) rather than a planned Thor
        # shutdown: the monthly iDRAC power-off and Talos reboots end well
        # inside 6 hours.
        - alert: YubiHSMDownLong
          expr: |
            max(kube_deployment_status_replicas_available{namespace="hsm-system",deployment="yubihsm-connector"}) < 1
            or absent(kube_deployment_status_replicas_available{namespace="hsm-system",deployment="yubihsm-connector"})
          for: 6h
          labels:
            severity: critical
            component: openbao
            pager: "true"
          annotations:
            summary: "The YubiHSM has been unreachable for over 6 hours"
            description: "yubihsm-connector has had no ready pod for 6 hours, longer than any planned Thor or k8s-work-12 outage. Check the device on Thor. Until it's back, OpenBao replicas can't unseal after a restart and Entra workload identity can't sign."

        - alert: OpenBaoBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="openbao-snapshots"} > 26 * 3600
          for: 15m
          labels:
            severity: critical
            component: openbao
            pager: "true"
          annotations:
            summary: "No successful OpenBao snapshot in over 26 hours"
            description: "The last successful openbao/openbao-snapshots run finished {{ $value | humanizeDuration }} ago. Check the job logs in the openbao namespace."

        # A session gives up after about 10 minutes, so the window matches that:
        # the alert stays up while a request may still be waiting, and its route
        # repeats the page. The second half catches a counter's first sample,
        # which increase() can't see.
        - alert: WarpgateApprovalPending
          expr: |
            sum(increase(loki_process_custom_warpgate_approval_requests_total[10m])) > 0
            or
            sum(loki_process_custom_warpgate_approval_requests_total unless loki_process_custom_warpgate_approval_requests_total offset 10m) > 0
          labels:
            severity: warning
            component: warpgate
            pager: "true"
          annotations:
            summary: "An agent is waiting for approval in Warpgate"
            description: "Approve or deny the session in the Warpgate admin UI at https://access.homelab0.org. It fails by itself after about 10 minutes."

        # A gated request creates one audit response. The first-sample clause
        # catches a new counter series before increase() has two samples.
        - alert: PamApprovalPending
          expr: |
            sum(increase(loki_process_custom_pam_approval_requests_total[15m])) > 0
            or
            sum(loki_process_custom_pam_approval_requests_total unless loki_process_custom_pam_approval_requests_total offset 15m) > 0
          labels:
            severity: warning
            component: openbao
            pager: "true"
          annotations:
            summary: "An agent requested access in OpenBao"
            description: "Review and approve or deny the request at https://bao.homelab0.org/pam/"

        # Runs every 15 minutes. It also fails if the agent write path has been
        # weakened, so this is a security signal as well as a health one.
        - alert: WarpgateConfigSyncFailing
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="access",cronjob="warpgate-config-sync"} > 1800
            or
            kube_job_failed{namespace="access",job_name=~"warpgate-config-sync-.+",condition="true"} > 0
            or
            absent(kube_cronjob_status_last_successful_time{namespace="access",cronjob="warpgate-config-sync"})
          for: 2m
          labels:
            severity: critical
            component: warpgate
            pager: "true"
          annotations:
            summary: "Warpgate config-sync is failing"
            description: "Check the access/warpgate-config-sync job logs. A line starting 'refused:' means the k8s-admin approval path was changed."

        # Tokens last 4 hours and rotate hourly, so this leaves about an hour.
        - alert: OpenBaoWarpgateTokenStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="warpgate-tokens"} > 2.5 * 3600
          for: 5m
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "Warpgate's Kubernetes target token hasn't rotated in over 2.5 hours"
            description: "The last successful openbao/warpgate-tokens run finished {{ $value | humanizeDuration }} ago. The k8s-read target stops working when its 4-hour token expires. Check the job logs in the openbao namespace."

        - alert: OpenBaoWarpgateTokenMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="warpgate-tokens"})
          for: 2h
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "Warpgate's token job has no successful run on record"
            description: "kube-state-metrics reports no last successful time for openbao/warpgate-tokens. The CronJob may be missing, never succeeded, or the Kubernetes auth role warpgate-tokens is not set up (scripts/openbao-configure.sh)."

        - alert: OpenBaoBackupMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="openbao-snapshots"})
          for: 2h
          labels:
            severity: warning
            component: openbao
          annotations:
            summary: "OpenBao snapshot CronJob has no successful run on record"
            description: "kube-state-metrics reports no last successful time for openbao/openbao-snapshots. The CronJob may be missing, never succeeded, or the Kubernetes auth role openbao-snapshot is not set up (scripts/openbao-configure.sh)."
