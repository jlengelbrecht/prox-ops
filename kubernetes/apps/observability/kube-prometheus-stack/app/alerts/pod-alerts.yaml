---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: pod-alerts
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
          for: 5m
          labels:
            severity: critical
            component: pod
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value | humanize }} times in the last 15 minutes."

        # A journal write failure exits the sole router process. One restart
        # deserves an alert even if the pod recovers before a crash loop forms.
        - alert: AgentRouterRestarted
          expr: increase(kube_pod_container_status_restarts_total{namespace="ai",container="agent-router",pod=~"agent-router-.*"}[10m]) > 0
          labels:
            severity: critical
            component: agent-router
          annotations:
            summary: "Agent router restarted in ai"
            description: "The single-writer agent-router container restarted. Check journal write errors and the readiness history before routing resumes."

        # Warning, not critical: any failed Job pod matches this too.
        - alert: PodNotReady
          expr: sum by (namespace, pod, phase) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 15m
          labels:
            severity: warning
            component: pod
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready for 15+ minutes"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is in {{ $labels.phase }} phase."

        - alert: StatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
          for: 15m
          labels:
            severity: critical
            component: statefulset
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has replica mismatch"
            description: "StatefulSet has {{ $labels.replicas }} desired replicas but only {{ $value }} are ready."

