---
# Zabbix database connection secret - connects to shared CNPG cluster
# Credentials come from OpenBao's static role (openbao.yaml), formatted for the
# Zabbix Helm chart. After a rotation this picks up the new password and
# Reloader restarts Zabbix. While OpenBao is unreachable the Secret stays as it
# is, and nothing rotates, so Zabbix keeps working.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zabbix-db-secret
  namespace: observability
spec:
  refreshInterval: 5m
  target:
    name: zabbix-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Connection to shared CNPG PostgreSQL cluster
        host: "postgres-rw.database.svc.cluster.local"
        port: "5432"
        user: "{{ .username }}"
        password: "{{ .password }}"
        dbname: "zabbix"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: zabbix-db
