---
# Names carry the target chart version and date so each upgrade gets fresh
# snapshots instead of matching ones left behind by an earlier revision.
# A chart bump must rename all three to kps-pre-<version>-<yyyymmdd>-<volume>
# (CI fails until it does), and the new names must not already exist in the
# cluster when it merges, or Flux treats the old snapshots as ready.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: kps-pre-91-9-0-20261004-grafana
  namespace: observability
  labels:
    app.kubernetes.io/part-of: kps-pre-91-9-0-20261004
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  volumeSnapshotClassName: ceph-block-snapshot-retain
  source:
    persistentVolumeClaimName: kube-prometheus-stack-grafana
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: kps-pre-91-9-0-20261004-prometheus-db
  namespace: observability
  labels:
    app.kubernetes.io/part-of: kps-pre-91-9-0-20261004
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  volumeSnapshotClassName: ceph-block-snapshot-retain
  source:
    persistentVolumeClaimName: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: kps-pre-91-9-0-20261004-alertmanager-db
  namespace: observability
  labels:
    app.kubernetes.io/part-of: kps-pre-91-9-0-20261004
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  volumeSnapshotClassName: ceph-block-snapshot-retain
  source:
    persistentVolumeClaimName: alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0
