---
# Default-deny both ways; no ingress at all. Egress is cluster DNS and the
# API server. The pod dials the kubernetes Service on 443 and Cilium sees the
# post-DNAT 6443 listener, so both ports are listed and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-metrics-qualification
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hindsight-metrics-qualification
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
