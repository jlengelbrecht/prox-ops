---
# Official prometheus-community chart, prometheus-adapter 5.3.0 (app
# v0.12.0), pulled by manifest digest only: there is no tag for Flux or
# Renovate to follow while this release is inactive. A different chart means
# qualifying the new archive and pinning its digest here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-adapter
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:021eaa13e372ad42c59b50ebe4a0cd9cc3eaa5c21c2df2acb1b8bba44c1b1110
  url: oci://ghcr.io/prometheus-community/charts/prometheus-adapter
