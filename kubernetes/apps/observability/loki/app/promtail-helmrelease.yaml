---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: observability
spec:
  chart:
    spec:
      chart: promtail
      version: 6.17.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # DaemonSet configuration
    daemonset:
      enabled: true

    # Deployment disabled (using DaemonSet)
    deployment:
      enabled: false

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Promtail configuration
    config:
      # Loki endpoint
      clients:
        - url: http://loki:3100/loki/api/v1/push
          tenant_id: 1
          batchwait: 1s
          batchsize: 102400
          backoff_config:
            min_period: 500ms
            max_period: 5m
            max_retries: 10
          timeout: 10s

      # Server configuration
      server:
        log_level: info
        log_format: logfmt
        http_listen_port: 3101

      # Positions (where Promtail tracks which logs it has read)
      positions:
        filename: /run/promtail/positions.yaml

      # The chart's own kubernetes-pods scrape job stays intact. This
      # rules exclude the verified API pod and quarantine any same-prefix
      # metadata drift before the broad pipeline can forward free text.
      snippets:
        extraRelabelConfigs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_controller_kind, __meta_kubernetes_pod_controller_name, __meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_label_app_kubernetes_io_component]
            separator: ;
            action: drop
            regex: ai;hindsight-api-.+;ReplicaSet;hindsight-api-.+;hindsight;hindsight;api
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
            separator: ;
            action: drop
            regex: ai;hindsight-api-.+
          # Actions job output stays in GitHub. Only the ARC controller's
          # manager container is kept from github-actions; runner, listener
          # (job context) and workflow pods are dropped wherever they run.
          # Long generateName bases are truncated, so the pod name is loose.
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_controller_kind, __meta_kubernetes_pod_controller_name, __meta_kubernetes_pod_name, __meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_name]
            separator: ;
            action: replace
            regex: github-actions;ReplicaSet;gha-runner-scale-set-controller-gha-rs-controller-[bcdfghjklmnpqrstvwxz2456789]{1,10};gha-runner-scale-set-controller-gha-rs-controller-[bcdfghjklmnpqrstvwxz2456789-]+;gha-rs-controller;manager
            replacement: manager
            target_label: __tmp_gha_controller
          - source_labels: [__meta_kubernetes_namespace, __tmp_gha_controller]
            separator: ;
            action: drop
            regex: github-actions;
          - source_labels: [__meta_kubernetes_pod_controller_kind]
            action: drop
            regex: EphemeralRunner|AutoscalingListener
        extraScrapeConfigs: |-
          # Only a fixed, low-content operation event is centralized. Every
          # unknown, malformed, oversized, or free-form API line is dropped.
          - job_name: hindsight-api-safe
            pipeline_stages:
              - drop:
                  longer_than: 4096
                  drop_counter_reason: hindsight_oversized
              - docker: {}
              - cri: {}
              - json:
                  expressions:
                    message: message
                    logger: logger
              - regex:
                  source: logger
                  expression: '^(?P<worker_logger>hindsight_api[.]worker[.]poller)$'
              - regex:
                  source: message
                  expression: '^Task (?P<operation_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) (?P<event>scheduled for retry at|deferred until|timed out:|failed:) .*$'
              - labels:
                  event:
                  worker_logger:
              - match:
                  selector: '{event!~"scheduled for retry at|deferred until|timed out:|failed:"}'
                  action: drop
                  drop_counter_reason: hindsight_unrecognized
              - match:
                  selector: '{worker_logger!="hindsight_api.worker.poller"}'
                  action: drop
                  drop_counter_reason: hindsight_unrecognized
              - template:
                  source: safe_line
                  # Escape Promtail template placeholders through Helm's tpl.
                  template: '{"event":"{{ "{{ .event }}" }}","operation_id":"{{ "{{ .operation_id }}" }}"}'
              - output:
                  source: safe_line
              - labeldrop:
                  - event
                  - worker_logger
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Terminal targets remain eligible while Kubernetes and the
              # node retain their final log files; deletion cannot be healed.
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_controller_kind, __meta_kubernetes_pod_controller_name, __meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_label_app_kubernetes_io_component]
                separator: ;
                action: keep
                regex: ai;hindsight-api-.+;ReplicaSet;hindsight-api-.+;hindsight;hindsight;api
              - source_labels: [__meta_kubernetes_pod_container_name]
                action: keep
                regex: api
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - replacement: hindsight
                target_label: app
              - source_labels: [__meta_kubernetes_pod_container_name]
                target_label: container
              # One API replica plus bounded rollout overlap; review series growth.
              - source_labels: [__meta_kubernetes_pod_uid]
                target_label: pod_uid
              - source_labels:
                  - __meta_kubernetes_pod_uid
                  - __meta_kubernetes_pod_container_name
                separator: /
                target_label: __path__
                replacement: /var/log/pods/*$1/*.log

    # Service configuration
    service:
      enabled: true
      type: ClusterIP
      port: 3101
      targetPort: 3101
      labels:
        app: promtail

    # ServiceMonitor for Prometheus
    serviceMonitor:
      enabled: true
      labels:
        prometheus: kube-prometheus-stack
      interval: 30s
      scrapeTimeout: 10s

    # RBAC
    rbac:
      create: true
      pspEnabled: false

    # Service account
    serviceAccount:
      create: true
      name: promtail

    # Pod security context
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0

    # Container security context
    containerSecurityContext:
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      allowPrivilegeEscalation: false
      privileged: false

    # Node selector and tolerations
    nodeSelector: {}

    tolerations:
      - effect: NoSchedule
        operator: Exists

    # Update strategy
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1

    # Priority class
    priorityClassName: ""
