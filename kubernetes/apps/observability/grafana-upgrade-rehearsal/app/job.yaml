---
# Grafana 13 migrates the cloned 12 database once; the checker holds the pod
# open until the operator has run the postchecks and the finish command.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-upgrade-rehearsal
  namespace: observability
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-upgrade-rehearsal
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: precheck
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea # renovate: datasource=docker depName=python
          command: ["python3", "-B", "/opt/rehearsal/rehearsal.py", "precheck"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: checker, mountPath: /opt/rehearsal, readOnly: true}
            # Writes the stored dashboard providers, at the path Grafana reads them from.
            - {name: provisioning, mountPath: /etc/grafana/provisioning}
        # The production cold copy, verbatim from the kube-prometheus-stack 91.9.0 render, run on the
        # checkpointed clone so its image, user and read-only root are proven before production needs them.
        - &cold-copy
          name: pre-13-backup
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              src="$GRAFANA_DATA"
              dst="$GRAFANA_DATA/pre-13-backup"
              marker="$dst/COMPLETE"
              files="grafana.db grafana.db-wal grafana.db-shm grafana.db-journal"
              fail() { echo "pre-13-backup: $1" >&2; exit 1; }
              digest() { sha256sum "$1" | cut -d' ' -f1; }
              if [ -e "$marker" ]; then
                [ "$(sed -n 1p "$marker")" = "$BACKUP_TAG" ] || fail "marker is for another backup"
                [ "$(sed -n 2p "$marker")" = "$(digest "$dst/SHA256SUMS")" ] || fail "checksum list changed"
                grep -q '  grafana.db$' "$dst/SHA256SUMS" || fail "checksum list has no grafana.db"
                (cd "$dst" && sha256sum -c SHA256SUMS >/dev/null) || fail "copy does not match its checksums"
                echo "pre-13-backup: verified existing copy"
                exit 0
              fi
              [ ! -e "$dst" ] || fail "incomplete copy found; refusing to overwrite it"
              [ -f "$src/grafana.db" ] || fail "no grafana.db to copy"
              mkdir "$dst"
              for f in $files; do
                if [ -e "$src/$f" ]; then cp -p "$src/$f" "$dst/$f"; fi
              done
              sync
              for f in $files; do
                if [ -e "$dst/$f" ]; then
                  sum="$(digest "$dst/$f")"
                  [ "$sum" = "$(digest "$src/$f")" ] || fail "copy of $f differs from the source"
                  echo "$sum  $f" >> "$dst/SHA256SUMS"
                fi
              done
              printf '%s\n%s\n' "$BACKUP_TAG" "$(digest "$dst/SHA256SUMS")" > "$dst/.COMPLETE.tmp"
              sync
              mv "$dst/.COMPLETE.tmp" "$marker"
              sync
              echo "pre-13-backup: copy complete"
          env:
            - {name: GRAFANA_DATA, value: /var/lib/grafana}
            - {name: BACKUP_TAG, value: grafana-12-before-13.2.3}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsGroup: 472
            runAsNonRoot: true
            runAsUser: 472
            seccompProfile: {type: RuntimeDefault}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}
        # The same init again, as a pod retry would run it: it must verify the copy and leave it untouched.
        - <<: *cold-copy
          name: verify-pre-13-backup
        # Native sidecar: the checker starts only once Grafana's startup probe passes.
        - name: grafana
          image: docker.io/grafana/grafana:13.2.3-distroless@sha256:202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
          restartPolicy: Always
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: GF_PATHS_DATA, value: /var/lib/grafana/}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning}
            - {name: GF_LOG_MODE, value: console}
            - {name: GF_UNIFIED_STORAGE_INDEX_PATH, value: /var/lib/grafana-search/bleve}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_UNIFIED_ALERTING_EXECUTE_ALERTS, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 360
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts:
            # The distroless image needs a writable /tmp under a read-only root, as the chart mounts.
            - {name: tmp, mountPath: /tmp}
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: search, mountPath: /var/lib/grafana-search}
            # Dashboard providers only: with none, startup cleanup deletes every
            # provisioned dashboard. No datasource file may re-encrypt the stored
            # Loki secret, so its health check proves the migrated decrypt.
            - {name: provisioning, mountPath: /etc/grafana/provisioning}
      containers:
        - name: checker
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea # renovate: datasource=docker depName=python
          command: ["python3", "-B", "/opt/rehearsal/rehearsal.py", "wait"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: checker, mountPath: /opt/rehearsal, readOnly: true}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: grafana-upgrade-rehearsal}
        - {name: tmp, emptyDir: {}}
        - {name: search, emptyDir: {}}
        - {name: provisioning, emptyDir: {}}
        - name: checker
          configMap: {name: grafana-upgrade-rehearsal-checker, defaultMode: 0444}
