---
# Grafana 13 migrates the cloned 12 database once; the checker holds the pod
# open until the operator has run the postchecks and the finish command.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-upgrade-rehearsal
  namespace: observability
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-upgrade-rehearsal
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: precheck
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea # renovate: datasource=docker depName=python
          command: ["python3", "-B", "/opt/rehearsal/rehearsal.py", "precheck"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: checker, mountPath: /opt/rehearsal, readOnly: true}
        # Native sidecar: the checker starts only once Grafana's startup probe passes.
        - name: grafana
          image: docker.io/grafana/grafana:13.2.3-distroless@sha256:202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
          restartPolicy: Always
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: GF_PATHS_DATA, value: /var/lib/grafana/}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning}
            - {name: GF_LOG_MODE, value: console}
            - {name: GF_UNIFIED_STORAGE_INDEX_PATH, value: /var/lib/grafana-search/bleve}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_UNIFIED_ALERTING_EXECUTE_ALERTS, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 360
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts:
            # The distroless image needs a writable /tmp under a read-only root, as the chart mounts.
            - {name: tmp, mountPath: /tmp}
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: search, mountPath: /var/lib/grafana-search}
            # Empty on purpose: no datasource file may re-encrypt the stored
            # Loki secret, so its health check proves the migrated decrypt.
            - {name: provisioning, mountPath: /etc/grafana/provisioning}
      containers:
        - name: checker
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea # renovate: datasource=docker depName=python
          command: ["python3", "-B", "/opt/rehearsal/rehearsal.py", "wait"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: checker, mountPath: /opt/rehearsal, readOnly: true}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: grafana-upgrade-rehearsal}
        - {name: tmp, emptyDir: {}}
        - {name: search, emptyDir: {}}
        - {name: provisioning, emptyDir: {}}
        - name: checker
          configMap: {name: grafana-upgrade-rehearsal-checker, defaultMode: 0444}
