---
# prune off: removing the snapshot from Git must never delete the recovery point.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-upgrade-rehearsal-snapshot
  namespace: flux-system
spec:
  healthCheckExprs:
    - apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshot
      current: has(status.readyToUse) && status.readyToUse == true
      failed: has(status.error) && has(status.error.message)
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-upgrade-rehearsal/snapshot
  prune: false
  sourceRef: {kind: GitRepository, name: flux-system}
  targetNamespace: observability
  wait: true
  timeout: 15m
---
# Separate from kube-prometheus-stack so a failed or immutable Job never blocks it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-upgrade-rehearsal
  namespace: flux-system
spec:
  dependsOn:
    - {name: grafana-upgrade-rehearsal-snapshot, namespace: flux-system}
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-upgrade-rehearsal/app
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  targetNamespace: observability
  wait: false
