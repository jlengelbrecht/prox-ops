---
# iDRAC account for the fan controller (Login + Configure iDRAC only, no other
# privileges). 1Password item: idrac-fan-controller (vault Automation, Login item).
# Odin and Thor share one account, so both servers map to the same fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idrac-fan-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: idrac-fan-credentials
    creationPolicy: Owner
  data:
    - secretKey: odin-username
      remoteRef:
        key: idrac-fan-controller
        property: username
    - secretKey: odin-password
      remoteRef:
        key: idrac-fan-controller
        property: password
    - secretKey: thor-username
      remoteRef:
        key: idrac-fan-controller
        property: username
    - secretKey: thor-password
      remoteRef:
        key: idrac-fan-controller
        property: password
