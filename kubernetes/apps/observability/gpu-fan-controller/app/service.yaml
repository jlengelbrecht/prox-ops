---
apiVersion: v1
kind: Service
metadata:
  name: gpu-fan-controller
  labels:
    app.kubernetes.io/name: gpu-fan-controller
spec:
  selector:
    app.kubernetes.io/name: gpu-fan-controller
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpu-fan-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-fan-controller
  endpoints:
    - port: metrics
      interval: 30s
