---
# Discord webhook for the notifications.yaml blueprint. Same 1Password item as
# Alertmanager, so Authentik events land in the alerts channel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-discord
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-discord
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_DISCORD_WEBHOOK_URL
      remoteRef:
        key: Prometheus_Discord_Webhook
        property: discord_webhook_url
