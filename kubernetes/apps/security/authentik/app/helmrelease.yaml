---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: security
spec:
  chart:
    spec:
      chart: authentik
      # renovate: datasource=helm registryUrl=https://charts.goauthentik.io
      version: 2026.5.6
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: security
  interval: 1h
  values:
    global:
      env:
        # =============================================================
        # CORE AUTHENTIK SECRETS
        # =============================================================
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_BOOTSTRAP_PASSWORD
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_BOOTSTRAP_EMAIL
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: POSTGRES_PASSWORD
        - name: AUTHENTIK_AI_BROWSER_TEST_INITIAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_AI_BROWSER_TEST_INITIAL_PASSWORD

        # =============================================================
        # OAUTH2 PROVIDER CREDENTIALS (Direct OIDC)
        # =============================================================
        # Open WebUI
        - name: AUTHENTIK_OPENWEBUI_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_OPENWEBUI_CLIENT_ID
        - name: AUTHENTIK_OPENWEBUI_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_OPENWEBUI_CLIENT_SECRET
        # BookStack
        - name: AUTHENTIK_BOOKSTACK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_BOOKSTACK_CLIENT_ID
        - name: AUTHENTIK_BOOKSTACK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_BOOKSTACK_CLIENT_SECRET
        # LiteLLM
        - name: AUTHENTIK_LITELLM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_LITELLM_CLIENT_ID
        - name: AUTHENTIK_LITELLM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_LITELLM_CLIENT_SECRET
        # Grafana (client id is the literal "grafana" in the blueprint; the
        # secret comes from the 1Password item grafana-oidc)
        - name: AUTHENTIK_GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-oauth
              key: AUTHENTIK_GRAFANA_CLIENT_SECRET
        # Warpgate (client id is the literal "warpgate" in the blueprint; the
        # secret is 1Password-backed). optional: authentik must still start
        # when the item has not been created yet; only warpgate.yaml fails.
        - name: AUTHENTIK_WARPGATE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-warpgate
              key: AUTHENTIK_WARPGATE_CLIENT_SECRET
              optional: true
        # OpenBao (client id is the literal "openbao" in the blueprint; the
        # secret is 1Password-backed). optional, as for Warpgate: only
        # openbao.yaml fails while the item doesn't exist.
        - name: AUTHENTIK_OPENBAO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-openbao
              key: AUTHENTIK_OPENBAO_CLIENT_SECRET
              optional: true

        # =============================================================
        # SOURCE CREDENTIALS
        # =============================================================
        # Plex Source
        - name: AUTHENTIK_PLEX_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_PLEX_CLIENT_ID
        - name: AUTHENTIK_PLEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_PLEX_TOKEN
        - name: AUTHENTIK_PLEX_SERVER_ID
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_PLEX_SERVER_ID
        # Microsoft Entra ID Source (tenant homelab0org)
        - name: AUTHENTIK_ENTRA_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-entra
              key: AUTHENTIK_ENTRA_TENANT_ID
        - name: AUTHENTIK_ENTRA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-entra
              key: AUTHENTIK_ENTRA_CLIENT_ID
        - name: AUTHENTIK_ENTRA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-entra
              key: AUTHENTIK_ENTRA_CLIENT_SECRET

    authentik:
      error_reporting:
        enabled: false
      disable_startup_analytics: true

    # Mount blueprints from ConfigMap for GitOps-managed configuration
    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      replicas: 1
      podAnnotations:
        secret.reloader.stakater.com/reload: "authentik-secret,authentik-entra,authentik-warpgate,authentik-grafana-oauth,authentik-openbao"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      volumes:
        - name: custom-css
          configMap:
            name: authentik-custom-css
      volumeMounts:
        - name: custom-css
          mountPath: /web/dist/custom.css
          subPath: custom.css
          readOnly: true

    worker:
      replicas: 1
      podAnnotations:
        secret.reloader.stakater.com/reload: "authentik-secret,authentik-entra,authentik-warpgate,authentik-grafana-oauth,authentik-openbao"
        configmap.reloader.stakater.com/reload: "authentik-blueprints"
      # No CPU limit: startup blueprint and outpost work was throttled hard enough
      # under a 500m limit that `ak healthcheck` missed its 3s timeout and the
      # liveness probe kept killing the worker.
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          memory: 512Mi
      livenessProbe:
        timeoutSeconds: 10
      readinessProbe:
        timeoutSeconds: 10

    postgresql:
      enabled: true
      auth:
        existingSecret: authentik-secret
        secretKeys:
          adminPasswordKey: POSTGRES_PASSWORD
          userPasswordKey: POSTGRES_PASSWORD
      primary:
        persistence:
          enabled: true
          existingClaim: data-authentik-postgresql-0  # Use protected PVC

    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          existingClaim: redis-data-authentik-redis-master-0  # Use protected PVC
