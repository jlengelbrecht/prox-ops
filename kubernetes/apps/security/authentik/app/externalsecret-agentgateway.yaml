---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-agentgateway
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-agentgateway
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: agentgateway-platform-secrets, property: OIDC_CLIENT_SECRET}
