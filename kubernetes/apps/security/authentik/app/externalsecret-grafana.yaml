---
# Client secret of the Grafana OAuth2 provider. Same 1Password item and field
# as Grafana's own ExternalSecret (observability/grafana-oauth), so both ends
# always hold the same value. Kept separate from authentik-secret so a problem
# with this item can't stop Authentik's other secrets from syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-grafana-oauth
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_GRAFANA_CLIENT_SECRET
      remoteRef:
        key: grafana-oidc
        property: client_secret
