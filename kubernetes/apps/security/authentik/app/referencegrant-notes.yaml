---
# ReferenceGrant allows notes namespace resources to reference Authentik service:
# - SecurityPolicy: for forward auth (extAuth) validation
# - HTTPRoute: for /outpost.goauthentik.io/* paths (login/callback flow)
# Required by: Obsidian
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-notes-namespace-extauth
  namespace: security
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: notes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: notes
  to:
    - group: ""
      kind: Service
      name: authentik-server
