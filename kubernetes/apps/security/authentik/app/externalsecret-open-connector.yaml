---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-open-connector
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-open-connector
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: open-connector-dashboard-oidc, property: OIDC_CLIENT_SECRET}
