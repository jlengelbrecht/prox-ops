---
# Client secret of the Nyctr OAuth2 provider (blueprint nyctr.yaml). Same
# 1Password item and field as the Nyctr-side ExternalSecret
# (security/nyctr/app/externalsecret.yaml), so both ends always hold the same
# value. Kept separate from authentik-secret so a problem with this item can't
# stop Authentik's other secrets from syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-nyctr
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-nyctr
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_NYCTR_CLIENT_SECRET
      remoteRef:
        key: nyctr
        property: oidc-client-secret
