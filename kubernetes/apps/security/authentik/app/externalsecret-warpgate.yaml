---
# Client secret of the Warpgate OAuth2 provider (blueprint warpgate.yaml).
# Same 1Password item and field as the Warpgate-side ExternalSecret
# (access/warpgate-secret), so both ends always hold the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-warpgate
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-warpgate
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_WARPGATE_CLIENT_SECRET
      remoteRef:
        key: warpgate
        property: oidc-client-secret
