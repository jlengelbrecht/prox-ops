---
# Client secret of the OpenBao OAuth2 provider (blueprint openbao.yaml). The
# same 1Password item and field is written into OpenBao's OIDC auth config by
# scripts/openbao-configure.sh, so both ends hold the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-openbao
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-openbao
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_OPENBAO_CLIENT_SECRET
      remoteRef:
        key: openbao-oidc
        property: oidc-client-secret
