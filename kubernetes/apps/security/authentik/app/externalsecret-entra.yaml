---
# Entra source credentials from 1Password, read by the Authentik pods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-entra
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-entra
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_ENTRA_TENANT_ID
      remoteRef:
        key: authentik-entra
        property: AUTHENTIK_ENTRA_TENANT_ID
    - secretKey: AUTHENTIK_ENTRA_CLIENT_ID
      remoteRef:
        key: authentik-entra
        property: AUTHENTIK_ENTRA_CLIENT_ID
    - secretKey: AUTHENTIK_ENTRA_CLIENT_SECRET
      remoteRef:
        key: authentik-entra
        property: AUTHENTIK_ENTRA_CLIENT_SECRET
