---
# Entra source credentials from 1Password. The target name is temporary so
# the item can be proven before the SOPS Secret of the same purpose goes away.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-entra-op
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-entra-op
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_ENTRA_TENANT_ID
      remoteRef:
        key: authentik-entra
        property: AUTHENTIK_ENTRA_TENANT_ID
    - secretKey: AUTHENTIK_ENTRA_CLIENT_ID
      remoteRef:
        key: authentik-entra
        property: AUTHENTIK_ENTRA_CLIENT_ID
    - secretKey: AUTHENTIK_ENTRA_CLIENT_SECRET
      remoteRef:
        key: authentik-entra
        property: AUTHENTIK_ENTRA_CLIENT_SECRET
