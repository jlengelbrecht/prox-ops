---
# ConfigMap containing Authentik blueprints for GitOps-managed configuration
# These blueprints are auto-discovered and applied by Authentik
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: security
data:
  # =============================================================
  # GROUPS BLUEPRINT
  # Defines application-specific user groups
  # =============================================================
  groups.yaml: |
    version: 1
    metadata:
      name: Custom Groups
      labels:
        blueprints.goauthentik.io/description: "Application-specific user groups"
    entries:
      # BookStack Groups
      - model: authentik_core.group
        id: group-bookstack-admins
        identifiers:
          name: bookstack-admins
        attrs:
          name: bookstack-admins
          attributes: {}
      - model: authentik_core.group
        id: group-bookstack-uid-full-access
        identifiers:
          name: bookstack-uid-full-access
        attrs:
          name: bookstack-uid-full-access
          attributes: {}
      - model: authentik_core.group
        id: group-bookstack-extended-users
        identifiers:
          name: bookstack-extended-users
        attrs:
          name: bookstack-extended-users
          attributes: {}
      - model: authentik_core.group
        id: group-bookstack-plex-media-users
        identifiers:
          name: bookstack-plex-media-users
        attrs:
          name: bookstack-plex-media-users
          attributes: {}
      # OpenWebUI Groups
      - model: authentik_core.group
        id: group-openwebui-admins
        identifiers:
          name: openwebui-admins
        attrs:
          name: openwebui-admins
          attributes: {}
      - model: authentik_core.group
        id: group-openwebui-users
        identifiers:
          name: openwebui-users
        attrs:
          name: openwebui-users
          attributes: {}

  # =============================================================
  # CUSTOM SCOPE MAPPINGS BLUEPRINT
  # Custom OAuth2 scope mappings for group claims
  # =============================================================
  scope-mappings.yaml: |
    version: 1
    metadata:
      name: Custom Scope Mappings
      labels:
        blueprints.goauthentik.io/description: "Custom OAuth2 scope mappings for group claims"
    entries:
      - model: authentik_providers_oauth2.scopemapping
        id: scope-bookstack-groups
        identifiers:
          name: BookStack Groups
        attrs:
          name: BookStack Groups
          scope_name: groups
          description: "Returns BookStack access groups based on user authentication source"
          expression: |
            # BookStack Groups - assigns groups based on authentication source
            groups = []

            # Get user's linked source slugs
            source_slugs = []
            try:
                for conn in user.usersourceconnection_set.all():
                    source_slugs.append(conn.source.slug)
            except Exception:
                pass

            # Admins get full access
            if user.is_superuser:
                groups.append("bookstack-uid-full-access")
            # Plex users get media-only access (slug: media-server-access)
            elif "media-server-access" in source_slugs:
                groups.append("bookstack-plex-media-users")
            # UID users get full access
            elif "unifi-identity-enterprise" in source_slugs:
                groups.append("bookstack-uid-full-access")
            # Direct Authentik login users get extended access
            else:
                groups.append("bookstack-extended-users")

            return {"groups": groups}
      - model: authentik_providers_oauth2.scopemapping
        id: scope-openwebui-groups
        identifiers:
          name: Open WebUI Groups
        attrs:
          name: Open WebUI Groups
          scope_name: groups
          description: "Returns user's Authentik group memberships for Open WebUI access control"
          expression: |
            # Return user's Authentik group names for Open WebUI
            return {"groups": [group.name for group in user.groups.all()]}
      # MCP Gateway Audience - adds aud claim for ToolHive gateway token validation
      - model: authentik_providers_oauth2.scopemapping
        id: scope-mcp-audience
        identifiers:
          name: MCP Gateway Audience
        attrs:
          name: MCP Gateway Audience
          scope_name: mcp
          description: "Adds audience claim for ToolHive MCP Gateway token validation"
          expression: |
            # Return the expected audience for MCP Gateway
            return {"aud": "toolhive-mcp-gateway"}

  # =============================================================
  # OAUTH2 PROVIDERS BLUEPRINT
  # Direct OIDC providers for Open WebUI, BookStack, LiteLLM
  # =============================================================
  providers-oauth2.yaml: |
    version: 1
    metadata:
      name: OAuth2 Providers
      labels:
        blueprints.goauthentik.io/description: "OAuth2/OIDC providers for homelab applications"
    context:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      scope_email: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      scope_profile: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      scope_openid: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
      scope_offline: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      scope_openwebui_groups: !Find [authentik_providers_oauth2.scopemapping, [name, "Open WebUI Groups"]]
      scope_bookstack_groups: !Find [authentik_providers_oauth2.scopemapping, [name, "BookStack Groups"]]
      scope_mcp_audience: !Find [authentik_providers_oauth2.scopemapping, [name, "MCP Gateway Audience"]]
    entries:
      # Open WebUI - Direct OIDC
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-openwebui
        identifiers:
          name: Open WebUI
        attrs:
          name: Open WebUI
          client_id: !Env AUTHENTIK_OPENWEBUI_CLIENT_ID
          client_secret: !Env AUTHENTIK_OPENWEBUI_CLIENT_SECRET
          client_type: confidential
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          signing_key: !Context signing_key
          property_mappings:
            - !Context scope_openwebui_groups
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
          redirect_uris:
            - matching_mode: strict
              url: https://ai.homelab0.org/oauth/oidc/callback
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      # BookStack - Direct OIDC
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-bookstack
        identifiers:
          name: BookStack
        attrs:
          name: BookStack
          client_id: !Env AUTHENTIK_BOOKSTACK_CLIENT_ID
          client_secret: !Env AUTHENTIK_BOOKSTACK_CLIENT_SECRET
          client_type: confidential
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          signing_key: !Context signing_key
          property_mappings:
            - !Context scope_bookstack_groups
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
          redirect_uris:
            - matching_mode: strict
              url: https://guides.homelab0.org/oidc/callback
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      # LiteLLM - Direct OIDC (secret updated 2026-01-17)
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-litellm
        identifiers:
          name: LiteLLM
        attrs:
          name: LiteLLM
          client_id: !Env AUTHENTIK_LITELLM_CLIENT_ID
          client_secret: !Env AUTHENTIK_LITELLM_CLIENT_SECRET
          client_type: confidential
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          signing_key: !Context signing_key
          property_mappings:
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
          redirect_uris:
            - matching_mode: strict
              url: https://ai-api.homelab0.org/sso/callback
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      # ToolHive - Direct OIDC (MCP Platform UI)
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-toolhive
        identifiers:
          name: ToolHive
        attrs:
          name: ToolHive
          client_id: !Env AUTHENTIK_TOOLHIVE_CLIENT_ID
          client_secret: !Env AUTHENTIK_TOOLHIVE_CLIENT_SECRET
          client_type: confidential
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          signing_key: !Context signing_key
          property_mappings:
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
          redirect_uris:
            - matching_mode: strict
              url: https://mcp.homelab0.org/api/auth/oauth2/callback/authentik
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      # ToolHive MCP Gateway - Public OIDC for CLI/Desktop clients
      # Uses PKCE flow (no client secret required) for thv CLI, Claude Code, etc.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-toolhive-mcp-gateway
        identifiers:
          name: ToolHive MCP Gateway
        attrs:
          name: ToolHive MCP Gateway
          client_id: !Env AUTHENTIK_TOOLHIVE_MCP_GATEWAY_CLIENT_ID
          client_type: public
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          signing_key: !Context signing_key
          property_mappings:
            - !Context scope_mcp_audience
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_offline
          redirect_uris:
            # Local callbacks for CLI tools (thv, Claude Code, etc.)
            - matching_mode: regex
              url: http://localhost:[0-9]+/.*
            - matching_mode: regex
              url: http://127\.0\.0\.1:[0-9]+/.*
          access_code_validity: minutes=5
          access_token_validity: hours=1
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider

      # Hermes dashboard - native self-hosted OIDC gate, PUBLIC client with
      # PKCE (no client secret exists). The client id is a public identifier,
      # declared literally here and in kubernetes/apps/ai/hermes-hindsight.
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-hermes
        identifiers:
          name: Hermes
        attrs:
          name: Hermes
          client_id: hermes-dashboard
          client_type: public
          # authentik >= 2026.2 stores the allowed grants per provider and the
          # API/blueprint default is an EMPTY list (only the admin UI preselects
          # all of them; providers that existed before the upgrade were
          # backfilled). Without this the authorize endpoint rejects every
          # request with invalid_request before login. Hermes' self-hosted
          # dashboard login speaks exactly these two grants (PKCE code
          # exchange, refresh); nothing else is allowed.
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          signing_key: !Context signing_key
          property_mappings:
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
          redirect_uris:
            - matching_mode: strict
              url: https://hermes.homelab0.org/auth/callback
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider

  # =============================================================
  # PROXY PROVIDERS BLUEPRINT
  # Forward auth providers for n8n, Wizarr, GlycemicGPT, Hindsight, Paperclip,
  # Obsidian
  # =============================================================
  providers-proxy.yaml: |
    version: 1
    metadata:
      name: Proxy Providers
      labels:
        blueprints.goauthentik.io/description: "Forward auth proxy providers for embedded outpost"
    context:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      scope_proxy: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      scope_email: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      scope_profile: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      scope_openid: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
      scope_entitlements: !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
    entries:
      # n8n - Forward Auth
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-n8n
        identifiers:
          name: n8n
        attrs:
          name: n8n
          mode: forward_single
          external_host: https://n8n.homelab0.org
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          property_mappings:
            - !Context scope_proxy
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_entitlements
          access_token_validity: hours=24
          refresh_token_validity: days=30
          intercept_header_auth: true
          internal_host_ssl_validation: true
      # Wizarr - Forward Auth (with skip paths for public invite links)
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-wizarr
        identifiers:
          name: Wizarr
        attrs:
          name: Wizarr
          mode: forward_single
          external_host: https://wizarr.homelab0.org
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          property_mappings:
            - !Context scope_proxy
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_entitlements
          access_token_validity: hours=24
          refresh_token_validity: days=30
          intercept_header_auth: true
          internal_host_ssl_validation: true
          skip_path_regex: |
            ^/join($|/.*)
            ^/j($|/.*)
            ^/static($|/.*)
            ^/setup($|/.*)
            ^/wizard($|/.*)
            ^/image-proxy($|/.*)
            ^/cinema-posters($|/.*)
      # GlycemicGPT - Forward Auth (WebUI only, API uses native JWT)
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-glycemicgpt
        identifiers:
          name: GlycemicGPT
        attrs:
          name: GlycemicGPT
          mode: forward_single
          external_host: https://glycemicgpt.homelab0.org
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          property_mappings:
            - !Context scope_proxy
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_entitlements
          access_token_validity: hours=24
          refresh_token_validity: days=30
          intercept_header_auth: true
          internal_host_ssl_validation: true
      # Hindsight UI - Forward Auth. Bound to the embedded outpost by
      # outposts.yaml below, together with the other forward auth providers.
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-hindsight
        identifiers:
          name: Hindsight
        attrs:
          name: Hindsight
          mode: forward_single
          external_host: https://hindsight.homelab0.org
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          property_mappings:
            - !Context scope_proxy
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_entitlements
          access_token_validity: hours=24
          refresh_token_validity: days=30
          intercept_header_auth: true
          internal_host_ssl_validation: true
      # Paperclip UI - Forward Auth. Paperclip has no OIDC (email/password
      # login only), so authentik gates the UI and Paperclip's own login sits
      # behind it. Bound to the embedded outpost by outposts.yaml below.
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-paperclip
        identifiers:
          name: Paperclip
        attrs:
          name: Paperclip
          mode: forward_single
          external_host: https://paperclip.homelab0.org
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          property_mappings:
            - !Context scope_proxy
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_entitlements
          access_token_validity: hours=24
          refresh_token_validity: days=30
          intercept_header_auth: true
          internal_host_ssl_validation: true
      # Obsidian desktop - Forward Auth. The streamed desktop has no login of
      # its own, so authentik is the only gate. Bound to the embedded outpost
      # by outposts.yaml below.
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-obsidian
        identifiers:
          name: Obsidian
        attrs:
          name: Obsidian
          mode: forward_single
          external_host: https://obsidian.homelab0.org
          authorization_flow: !Context authorization_flow
          invalidation_flow: !Context invalidation_flow
          property_mappings:
            - !Context scope_proxy
            - !Context scope_email
            - !Context scope_profile
            - !Context scope_openid
            - !Context scope_entitlements
          access_token_validity: hours=24
          refresh_token_validity: days=30
          intercept_header_auth: true
          internal_host_ssl_validation: true

  # =============================================================
  # OUTPOSTS BLUEPRINT
  # Provider membership of the embedded outpost. An outpost entry replaces
  # the whole provider list on every apply, so every forward auth provider
  # that must stay on the outpost is listed here.
  # =============================================================
  outposts.yaml: |
    version: 1
    metadata:
      name: Outposts
      labels:
        blueprints.goauthentik.io/description: "Embedded outpost provider assignments"
    entries:
      # Apply the proxy providers first so the provider lookups below resolve
      # on a fresh restore, the same way the default blueprints order their
      # dependencies. On a running instance this is an idempotent re-apply.
      - model: authentik_blueprints.metaapplyblueprint
        id: apply-proxy-providers
        attrs:
          identifiers:
            name: Proxy Providers
          required: false
      # The embedded outpost is matched by its managed marker, never by name
      # or pk. Only type and providers are sent; name, config and the service
      # connection stay as authentik manages them. LightRAG is bound live but
      # has no Git entry, so it is kept only while its provider exists: when
      # its lookup returns nothing (a restore from Git) the list without it
      # is used, instead of failing the whole blueprint on a null reference.
      - model: authentik_outposts.outpost
        id: outpost-embedded
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          type: proxy
          providers: !If
            - !Find [authentik_providers_proxy.proxyprovider, [name, "LightRAG"]]
            - - !Find [authentik_providers_proxy.proxyprovider, [name, "n8n"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Wizarr"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "GlycemicGPT"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "LightRAG"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Hindsight"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Paperclip"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Obsidian"]]
            - - !Find [authentik_providers_proxy.proxyprovider, [name, "n8n"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Wizarr"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "GlycemicGPT"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Hindsight"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Paperclip"]]
              - !Find [authentik_providers_proxy.proxyprovider, [name, "Obsidian"]]

  # =============================================================
  # APPLICATIONS BLUEPRINT
  # Applications using managed providers
  # =============================================================
  applications.yaml: |
    # Force blueprint re-apply after provider fix (2026-01-21)
    version: 1
    metadata:
      name: Applications
      labels:
        blueprints.goauthentik.io/description: "Homelab applications with SSO"
    entries:
      # Every application except Paperclip requires the exclusion policy below;
      # !KeyOf resolves the account's actual PK after the user entry.
      # Direct OIDC Applications
      - model: authentik_core.application
        id: app-openwebui
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          slug: open-webui
          group: AI
          policy_engine_mode: all
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "Open WebUI"]]
      - model: authentik_core.application
        id: app-bookstack
        identifiers:
          slug: book-stack
        attrs:
          name: BookStack
          slug: book-stack
          group: Tools
          policy_engine_mode: all
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "BookStack"]]
      - model: authentik_core.application
        id: app-litellm
        identifiers:
          slug: lite-llm
        attrs:
          name: LiteLLM
          slug: lite-llm
          group: AI
          policy_engine_mode: all
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "LiteLLM"]]
      - model: authentik_core.application
        id: app-toolhive
        identifiers:
          slug: toolhive
        attrs:
          name: ToolHive
          slug: toolhive
          group: AI
          policy_engine_mode: all
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "ToolHive"]]
      - model: authentik_core.application
        id: app-toolhive-mcp-gateway
        identifiers:
          slug: toolhive-mcp-gateway
        attrs:
          name: ToolHive MCP Gateway
          slug: toolhive-mcp-gateway
          group: AI
          policy_engine_mode: all
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "ToolHive MCP Gateway"]]
      # Forward Auth Applications
      - model: authentik_core.application
        id: app-n8n
        identifiers:
          slug: n8n
        attrs:
          name: n8n
          slug: n8n
          group: Tools
          policy_engine_mode: all
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "n8n"]]
      - model: authentik_core.application
        id: app-wizarr
        identifiers:
          slug: wizarr
        attrs:
          name: Wizarr
          slug: wizarr
          group: Media
          policy_engine_mode: all
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Wizarr"]]
      - model: authentik_core.application
        id: app-glycemicgpt
        identifiers:
          slug: glycemicgpt
        attrs:
          name: GlycemicGPT
          slug: glycemicgpt
          group: Health
          policy_engine_mode: all
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "GlycemicGPT"]]
      # LightRAG exists only on the live instance. Update its mode in place;
      # skip both entries on a restore until that application exists.
      - model: authentik_core.application
        id: app-light-rag
        conditions: [!Find [authentik_core.application, [slug, light-rag]]]
        identifiers: {slug: light-rag}
        attrs:
          policy_engine_mode: all
      # Hermes dashboard: the application is bound to the built-in
      # "authentik Admins" group, so only owner/admin accounts can reach the
      # agent. Both the admin binding and mandatory exclusion must pass.
      - model: authentik_core.application
        id: app-hermes
        identifiers:
          slug: hermes
        attrs:
          name: Hermes
          slug: hermes
          group: AI
          policy_engine_mode: all
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "Hermes"]]
      - model: authentik_policies.policybinding
        id: binding-hermes-admins
        identifiers:
          target: !Find [authentik_core.application, [slug, hermes]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          enabled: true
      # Hindsight UI: same owner/admin-only binding as Hermes, enforced by the
      # forward-auth SecurityPolicy on its route.
      - model: authentik_core.application
        id: app-hindsight
        identifiers:
          slug: hindsight
        attrs:
          name: Hindsight
          slug: hindsight
          group: AI
          policy_engine_mode: all
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Hindsight"]]
      - model: authentik_policies.policybinding
        id: binding-hindsight-admins
        identifiers:
          target: !Find [authentik_core.application, [slug, hindsight]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          enabled: true
      # Browser-test identity. Keep this in applications.yaml so the user,
      # identity classification and Paperclip grant apply in file order.
      # state: created preserves admin rotation, deactivation and MFA changes.
      - model: authentik_core.user
        id: user-ai-browser-test
        state: created
        identifiers:
          path: agents/browser-test/ai-browser-test
        attrs:
          username: ai-browser-test
          name: AI Browser Test
          type: internal
          is_active: true
          groups: []
          attributes:
            goauthentik.io/user/can-change-username: false
            goauthentik.io/user/can-change-email: false
            prox-ops/agent-browser-identity: ABS-1
          password: !Env AUTHENTIK_AI_BROWSER_TEST_INITIAL_PASSWORD
      # This classification is intentionally separate from application grants.
      # A create-only group keeps its original member if the username changes;
      # a later blueprint run must not replace that member via username lookup.
      - model: authentik_core.group
        id: group-ai-browser-test-identity
        state: created
        identifiers:
          name: ai-browser-test-identity
        attrs:
          name: ai-browser-test-identity
          is_superuser: false
          parents: []
          roles: []
          users:
            - !KeyOf user-ai-browser-test
      - model: authentik_core.group
        id: group-ai-browser-test-paperclip
        identifiers:
          name: ai-browser-test-paperclip
        attrs:
          name: ai-browser-test-paperclip
          is_superuser: false
          parents: []
          roles: []
          users:
            - !KeyOf user-ai-browser-test

      # Match the database account, even if an administrator renames it or
      # removes its identity-group membership. The path locates that same
      # create-only account on later blueprint applications. Altering that
      # path is a privileged identity migration requiring a reviewed change.
      # An account attribute also keeps the old account restricted if its path
      # alone is altered before reconciliation. Username and identity group
      # cover a newly created but unqualified account until inventory audit.
      - model: authentik_policies_expression.expressionpolicy
        id: policy-deny-ungranted-ai-browser-test
        identifiers:
          name: deny-ungranted-ai-browser-test
        attrs:
          expression: !Format
            - |
              user = request.user
              return not (
                  user.pk == %s
                  or user.username == "ai-browser-test"
                  or user.attributes.get("prox-ops/agent-browser-identity") == "ABS-1"
                  or user.groups.filter(name="ai-browser-test-identity").exists()
              )
            - !KeyOf user-ai-browser-test

      # Direct local flow: deny after identification and before password;
      # policy errors fail closed. No source or enrollment is offered.
      - model: authentik_flows.flow
        id: flow-ai-browser-test
        identifiers:
          slug: ai-browser-test-authentication
        attrs:
          name: AI Browser Test Authentication
          title: AI Browser Test
          designation: authentication
          authentication: require_unauthenticated
          policy_engine_mode: all
      - model: authentik_stages_identification.identificationstage
        id: stage-ai-browser-test-identification
        identifiers:
          name: ai-browser-test-identification
        attrs:
          user_fields: [username]
          sources: []
          pretend_user_exists: true
      - model: authentik_stages_deny.denystage
        id: stage-ai-browser-test-deny
        identifiers:
          name: ai-browser-test-deny
      - model: authentik_policies_expression.expressionpolicy
        id: policy-ai-browser-test-deny-unapproved
        identifiers:
          name: ai-browser-test-deny-unapproved
        attrs:
          expression: |
            plan = request.context.get("flow_plan")
            user = plan.context.get("pending_user") if plan else None
            return not (
                user and user.pk and user.username == "ai-browser-test"
                and user.is_active and not user.is_superuser
                and user.groups.filter(name="ai-browser-test-identity").exists()
            )
      - model: authentik_stages_password.passwordstage
        id: stage-ai-browser-test-password
        identifiers:
          name: ai-browser-test-password
        attrs:
          backends:
            - authentik.core.auth.InbuiltBackend
          failed_attempts_before_cancel: 5
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: stage-ai-browser-test-totp
        identifiers:
          name: ai-browser-test-totp
        attrs:
          not_configured_action: deny
          device_classes: [totp]
          configuration_stages: []
          last_auth_threshold: seconds=0
      - model: authentik_stages_user_login.userloginstage
        id: stage-ai-browser-test-login
        identifiers:
          name: ai-browser-test-login
        attrs:
          session_duration: seconds=0
          remember_me_offset: seconds=0
          remember_device: seconds=0
          terminate_other_sessions: true
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf flow-ai-browser-test, stage: !KeyOf stage-ai-browser-test-identification, order: 10}
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-deny
        identifiers:
          target: !KeyOf flow-ai-browser-test
          stage: !KeyOf stage-ai-browser-test-deny
          order: 15
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-deny, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-deny-unapproved, failure_result: true}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf flow-ai-browser-test, stage: !KeyOf stage-ai-browser-test-password, order: 20}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf flow-ai-browser-test, stage: !KeyOf stage-ai-browser-test-totp, order: 30}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf flow-ai-browser-test, stage: !KeyOf stage-ai-browser-test-login, order: 100}

      # Default/Brand login is for humans. Even if its password stage is
      # skipped, deny the anchored identity at the live User Login binding.
      # The agent must first sign in through its dedicated local flow.
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-default-login
        identifiers: {target: !Find [authentik_flows.flow, [slug, default-authentication-flow]], stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]], order: 100}
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}

      # The same fail-closed User Login policy guards the default flow, both
      # built-in source flows, custom flows and initial setup. UID email_link
      # or another source link cannot mint a session for this identity.
      - model: authentik_policies_expression.expressionpolicy
        id: policy-ai-browser-test-source-login
        identifiers:
          name: ai-browser-test-source-login
        attrs:
          expression: !Format
            - |
              plan = request.context.get("flow_plan")
              user = plan.context.get("pending_user") if plan else None
              return bool(
                  user and user.pk and user.pk != %s
                  and user.username != "ai-browser-test"
                  and user.attributes.get("prox-ops/agent-browser-identity") != "ABS-1"
                  and not user.groups.filter(name="ai-browser-test-identity").exists()
              )
            - !KeyOf user-ai-browser-test
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-default-login, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-source-login, failure_result: false}
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-source-auth-login
        identifiers: {target: !Find [authentik_flows.flow, [slug, default-source-authentication]], stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-authentication-login]], order: 0}
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-source-auth-login, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-source-login, failure_result: false}
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-source-enroll-login
        identifiers: {target: !Find [authentik_flows.flow, [slug, default-source-enrollment]], stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-enrollment-login]], order: 2}
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-source-enroll-login, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-source-login, failure_result: false}

      # Deny the agent at both live custom flows' User Login stages.
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-bookstack-login
        identifiers: {target: !Find [authentik_flows.flow, [slug, bookstack-authentication]], stage: !Find [authentik_stages_user_login.userloginstage, [name, bookstack-user-login]], order: 10}
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-bookstack-login, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-source-login, failure_result: false}
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-glycemicgpt-login
        identifiers: {target: !Find [authentik_flows.flow, [slug, glycemicgpt-authentication-flow]], stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]], order: 30}
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-glycemicgpt-login, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-source-login, failure_result: false}
      # Initial setup is currently unreachable; guard User Login if it reopens.
      - model: authentik_flows.flowstagebinding
        id: binding-ai-browser-test-initial-setup-login
        identifiers: {target: !Find [authentik_flows.flow, [slug, initial-setup]], stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]], order: 100}
        attrs: {evaluate_on_plan: false, re_evaluate_policies: true, policy_engine_mode: all}
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf binding-ai-browser-test-initial-setup-login, order: 0}
        attrs: {policy: !KeyOf policy-ai-browser-test-source-login, failure_result: false}
      # Owner and agent grants are separate; Paperclip still has its own login.
      - model: authentik_core.application
        id: app-paperclip
        identifiers:
          slug: paperclip
        attrs:
          name: Paperclip
          slug: paperclip
          group: AI
          policy_engine_mode: any
          meta_launch_url: https://paperclip.homelab0.org
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Paperclip"]]
      - model: authentik_policies.policybinding
        id: binding-paperclip-admins
        identifiers:
          target: !Find [authentik_core.application, [slug, paperclip]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          enabled: true
      - model: authentik_policies.policybinding
        id: binding-paperclip-ai-browser-test
        identifiers:
          target: !Find [authentik_core.application, [slug, paperclip]]
          order: 10
        attrs:
          group: !KeyOf group-ai-browser-test-paperclip
          enabled: true
      # Obsidian desktop remains owner/admin-only, enforced by the
      # forward-auth SecurityPolicy on its route.
      - model: authentik_core.application
        id: app-obsidian
        identifiers:
          slug: obsidian
        attrs:
          name: Obsidian
          slug: obsidian
          group: Tools
          policy_engine_mode: all
          meta_launch_url: https://obsidian.homelab0.org
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Obsidian"]]
      - model: authentik_policies.policybinding
        id: binding-obsidian-admins
        identifiers:
          target: !Find [authentik_core.application, [slug, obsidian]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          enabled: true
      # Exclude the agent from every ungranted app; future grants need review.
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, open-webui]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, book-stack]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, lite-llm]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, toolhive]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, toolhive-mcp-gateway]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, n8n]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, wizarr]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, glycemicgpt]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        conditions: [!Find [authentik_core.application, [slug, light-rag]]]
        identifiers: {target: !Find [authentik_core.application, [slug, light-rag]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, hermes]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, hindsight]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, obsidian]], order: 90}
        attrs: {policy: !KeyOf policy-deny-ungranted-ai-browser-test, enabled: true}
      # OpenClaw retirement tombstones, co-located so authentik applies them in file
      # order inside one transaction: the application goes before the provider it
      # pointed at. Keep them - authentik never prunes an object whose entry vanishes.
      - model: authentik_core.application
        id: app-openclaw
        state: absent
        identifiers:
          slug: moltbot
      - model: authentik_providers_proxy.proxyprovider
        id: proxy-openclaw
        state: absent
        identifiers:
          name: Moltbot

  # =============================================================
  # SOURCES BLUEPRINT
  # External authentication sources (Plex, UID)
  # =============================================================
  sources.yaml: |
    version: 1
    metadata:
      name: Authentication Sources
      labels:
        blueprints.goauthentik.io/description: "External authentication sources for homelab"
    context:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
    entries:
      # Plex Source
      - model: authentik_sources_plex.plexsource
        id: source-plex
        identifiers:
          slug: media-server-access
        attrs:
          name: Sign in with Plex
          slug: media-server-access
          enabled: true
          authentication_flow: !Context authentication_flow
          enrollment_flow: !Context enrollment_flow
          policy_engine_mode: any
          user_matching_mode: identifier
          group_matching_mode: identifier
          user_path_template: goauthentik.io/sources/%(slug)s
          client_id: !Env AUTHENTIK_PLEX_CLIENT_ID
          plex_token: !Env AUTHENTIK_PLEX_TOKEN
          allow_friends: true
          allowed_servers:
            - !Env AUTHENTIK_PLEX_SERVER_ID
      # UniFi Identity Enterprise Source
      - model: authentik_sources_oauth.oauthsource
        id: source-uid
        identifiers:
          slug: unifi-identity-enterprise
        attrs:
          name: Sign in with UID
          slug: unifi-identity-enterprise
          enabled: true
          authentication_flow: !Context authentication_flow
          enrollment_flow: !Context enrollment_flow
          policy_engine_mode: any
          user_matching_mode: email_link
          group_matching_mode: identifier
          provider_type: openidconnect
          consumer_key: !Env AUTHENTIK_UID_CONSUMER_KEY
          consumer_secret: !Env AUTHENTIK_UID_CONSUMER_SECRET

  # =============================================================
  # ENTRA ID SOURCE BLUEPRINT
  # Kept separate from sources.yaml so it validates and applies on its own.
  # =============================================================
  source-entra.yaml: |
    version: 1
    metadata:
      name: Entra ID Source
      labels:
        blueprints.goauthentik.io/description: "Microsoft Entra ID (homelab0org) as an upstream login"
    context:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
    entries:
      # Microsoft Entra ID Source (homelab0org tenant, single-tenant app).
      # Users are matched by Entra identifier, not email, so an Entra login
      # never auto-links to an existing Authentik account (akadmin included).
      # Who may sign in is controlled in Entra: the app requires assignment
      # and only the authentik-users group is assigned.
      - model: authentik_sources_oauth.oauthsource
        id: source-entra
        identifiers:
          slug: entra-id
        attrs:
          name: Sign in with Entra
          slug: entra-id
          icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/entra-id.svg
          enabled: true
          authentication_flow: !Context authentication_flow
          enrollment_flow: !Context enrollment_flow
          policy_engine_mode: any
          user_matching_mode: identifier
          group_matching_mode: identifier
          provider_type: entraid
          consumer_key: !Env AUTHENTIK_ENTRA_CLIENT_ID
          consumer_secret: !Env AUTHENTIK_ENTRA_CLIENT_SECRET
          authorization_url: !Format ["https://login.microsoftonline.com/%s/oauth2/v2.0/authorize", !Env AUTHENTIK_ENTRA_TENANT_ID]
          access_token_url: !Format ["https://login.microsoftonline.com/%s/oauth2/v2.0/token", !Env AUTHENTIK_ENTRA_TENANT_ID]
          oidc_jwks_url: !Format ["https://login.microsoftonline.com/%s/discovery/v2.0/keys", !Env AUTHENTIK_ENTRA_TENANT_ID]
          profile_url: https://graph.microsoft.com/v1.0/me
      # Show the Entra button next to UID on the login pages that offer UID
      # today. The full source list is set here, so UID stays listed.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          sources:
            - !Find [authentik_core.source, [slug, unifi-identity-enterprise]]
            - !KeyOf source-entra
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: external-authentication-identification
        attrs:
          sources:
            - !Find [authentik_core.source, [slug, unifi-identity-enterprise]]
            - !KeyOf source-entra
