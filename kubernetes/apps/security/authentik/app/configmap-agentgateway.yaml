---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-agentgateway
  namespace: security
data:
  agentgateway.yaml: |
    version: 1
    metadata:
      name: Agentgateway
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-agentgateway
        identifiers:
          name: Agentgateway
        attrs:
          name: Agentgateway
          client_id: agentgateway
          client_secret: !Env AUTHENTIK_AGENTGATEWAY_CLIENT_SECRET
          client_type: confidential
          grant_types: [authorization_code]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
          redirect_uris:
            - matching_mode: strict
              url: https://agentgateway.homelab0.org/oauth/callback
          access_code_validity: minutes=1
          access_token_validity: hours=1
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
      - model: authentik_core.application
        id: app-agentgateway
        identifiers:
          slug: agentgateway
        attrs:
          name: Agentgateway
          slug: agentgateway
          group: Tools
          policy_engine_mode: all
          meta_launch_url: https://agentgateway.homelab0.org/ui/
          provider: !KeyOf provider-agentgateway
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-agentgateway
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-agentgateway
          order: 90
        attrs:
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, deny-ungranted-ai-browser-test]]
          enabled: true
