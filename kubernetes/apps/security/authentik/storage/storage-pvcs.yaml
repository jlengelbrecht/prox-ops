---
# PROTECTED: This PVC is in a separate Kustomization with prune: false
# to prevent accidental data loss during Flux reconciliation or cattle upgrades
#
# PostgreSQL stores ALL Authentik configuration:
# - Users, groups, roles
# - OAuth/OIDC providers and applications
# - Branding and customization
# - Policies and flows
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-authentik-postgresql-0
  namespace: security
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: postgresql
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
