---
# Nightly encrypted dump of Authentik's Postgres to the UNAS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik-backup
  namespace: flux-system
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authentik
      namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/security/authentik-backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
