---
# Database URL for the `nyctr` role on the shared CloudNativePG cluster, read
# from the same 1Password fields the cluster uses to manage the role (no
# cross-namespace Secret reads). Nyctr wants the SQLAlchemy psycopg scheme.
# Credentials are URL-encoded so a rotated password containing reserved
# characters cannot corrupt the URL. TLS is negotiated by libpq's default
# sslmode=prefer and required by the role's pg_hba line.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: "postgresql+psycopg://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/nyctr"
  data:
    - secretKey: username
      remoteRef: {key: postgres-cluster, property: NYCTR_USER}
    - secretKey: password
      remoteRef: {key: postgres-cluster, property: NYCTR_PASSWORD}
---
# Client secret of the Nyctr OAuth2 provider. Same 1Password item and field as
# Authentik's side (security/authentik/app/externalsecret-nyctr.yaml), so both
# ends always hold the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: nyctr, property: oidc-client-secret}
---
# Keys Nyctr uses to read its sources. The console only ever sees the
# environment names (NYCTR_CONNECTOR_SECRET_*), never these values. A key is
# enough to read; it does not let Nyctr change anything until the integration
# is also named in providerWrites (helmrelease.yaml).
#   nextdns-api-key  the NextDNS account API key
# NextDNS only for now. Each further source adds one field here, one entry
# under connectors in helmrelease.yaml and one name in networkpolicy.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-connectors
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-connectors
    creationPolicy: Owner
  data:
    - secretKey: nextdns-api-key
      remoteRef: {key: nyctr, property: nextdns-api-key}
