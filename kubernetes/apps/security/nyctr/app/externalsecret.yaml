---
# Database URL for the `nyctr` role on Nyctr's own CloudNativePG cluster
# (../../nyctr-db), built from the same 1Password field that cluster uses to
# manage the role. Nyctr wants the SQLAlchemy psycopg scheme. The password is
# URL-encoded so a rotated one containing reserved characters cannot corrupt
# the URL. sslmode=require: the client refuses an unencrypted connection.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: "postgresql+psycopg://nyctr:{{ .password | urlquery }}@nyctr-db-rw.security.svc.cluster.local:5432/nyctr?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: nyctr, property: db-password}
---
# Client secret of the Nyctr OAuth2 provider. Same 1Password item and field as
# Authentik's side (security/authentik/app/externalsecret-nyctr.yaml), so both
# ends always hold the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: nyctr, property: oidc-client-secret}
---
# Keys Nyctr uses to read its sources. The console only ever sees the
# environment names (NYCTR_CONNECTOR_SECRET_*), never these values. A key is
# enough to read; it does not let Nyctr change anything until the integration
# is also named in providerWrites (helmrelease.yaml).
#   nextdns-api-key  the NextDNS account API key
# NextDNS only for now. Each further source adds one field here, one entry
# under connectors in helmrelease.yaml and one name in networkpolicy.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-connectors
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-connectors
    creationPolicy: Owner
  data:
    - secretKey: nextdns-api-key
      remoteRef: {key: nyctr, property: nextdns-api-key}
