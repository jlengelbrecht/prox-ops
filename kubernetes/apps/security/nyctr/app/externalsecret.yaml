---
# Database URL for the `nyctr` role on the shared CloudNativePG cluster, read
# from the same 1Password fields the cluster uses to manage the role (no
# cross-namespace Secret reads). Nyctr wants the SQLAlchemy psycopg scheme.
#
# Encoding: urlquery writes a space as "+", but SQLAlchemy reads credentials
# with plain percent-decoding and would keep the "+". After urlquery every
# remaining "+" is a space (a real plus is already %2B), so they become %20.
#
# TLS: sslmode=require encrypts but does not check the server's certificate,
# so channel_binding=require ties the SCRAM login to the TLS session: a relay
# presenting another certificate cannot complete authentication. The role's
# pg_hba line is hostssl, so the server refuses plain TCP as well. Mounting
# the cluster CA for sslmode=verify-full (as Groschen does) would be stricter.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: 'postgresql+psycopg://{{ .username | urlquery | replace "+" "%20" }}:{{ .password | urlquery | replace "+" "%20" }}@postgres-rw.database.svc.cluster.local:5432/nyctr?sslmode=require&channel_binding=require'
  data:
    - secretKey: username
      remoteRef: {key: postgres-cluster, property: NYCTR_USER}
    - secretKey: password
      remoteRef: {key: postgres-cluster, property: NYCTR_PASSWORD}
---
# Client secret of the Nyctr OAuth2 provider. Same 1Password item and field as
# Authentik's side (security/authentik/app/externalsecret-nyctr.yaml), so both
# ends always hold the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: nyctr, property: oidc-client-secret}
---
# Keys Nyctr uses to read its sources. The console only ever sees the
# environment names (NYCTR_CONNECTOR_SECRET_*), never these values. A key is
# enough to read; it does not let Nyctr change anything until the integration
# is also named in providerWrites (helmrelease.yaml).
#   nextdns-api-key  the NextDNS account API key
#   unifi-api-key    the Ubiquiti Site Manager API key
# Each further source adds one field here, one entry
# under connectors in helmrelease.yaml and one name in networkpolicy.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-connectors
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-connectors
    creationPolicy: Owner
  data:
    - secretKey: nextdns-api-key
      remoteRef: {key: nyctr, property: nextdns-api-key}
    - secretKey: unifi-api-key
      remoteRef: {key: NYCTR_CONNECTOR_SECRET_UNIFI, property: api_key}
