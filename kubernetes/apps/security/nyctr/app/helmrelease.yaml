---
# Nyctr network console: what the network blocked, who asked for access, and
# guest Wi-Fi. Read-only as deployed here: collection only reads, and Nyctr may
# change a source only when its integration is named in providerWrites.
#
# The chart is Nyctr's own (ocirepository.yaml). It refuses to render unless
# the image, public URL, trusted proxies, database, sign-in and ingress policy
# are all explicit, so every value below is one it requires.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nyctr
spec:
  chartRef:
    kind: OCIRepository
    name: nyctr
  interval: 1h
  # The source egress rules in networkpolicy.yaml are toFQDNs, which only
  # enforce correctly when the pod asks cluster DNS for the exact policed
  # name; the default ndots:5 search path would try
  # <name>.security.svc.cluster.local first and the connection would be
  # dropped (same patch as ai/hermes-hindsight). Drop when the chart grows a
  # dnsConfig value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nyctr
            patch: |
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
  values:
    image:
      repository: ghcr.io/homelab-0/nyctr
      # v0.1.0-alpha.3 (amd64 and arm64), from that release's notes. This
      # digest and the chart tag in ocirepository.yaml move together. The
      # chart takes a digest or a tag, never both.
      digest: sha256:b1e25070da31e31aad58be1fc63fe89a2ed4d1ba4520e464645cbc54677a846f

    # Two addresses, one application.
    #   nyctr.homelab0.org    the console, for administrators
    #   blocked.homelab0.org  where someone with a blocked site goes
    # On the portal address every session has member rights, an
    # administrator's included, and the console does not answer there. On the
    # console address a member is not signed in and is sent to the portal.
    # Sign-in returns to the address it started from, so both callbacks
    # (<address>/api/auth/oidc/callback) are declared in the Authentik
    # blueprint. Nyctr tells the two apart by the Host header: this limits
    # what a session can do on each name, and both names sit on the same
    # internal gateway, so it is not a network boundary between them.
    publicUrl: https://nyctr.homelab0.org
    portalUrl: https://blocked.homelab0.org

    # Peers allowed to supply X-Forwarded-*: the pod CIDR the envoy-internal
    # gateway pods live in (talos/talconfig.yaml clusterPodNets), same range
    # Paperclip trusts. ingressFrom below admits the envoy-internal pods and
    # nothing else, and no other policy may select the Nyctr pod and admit
    # more (networkpolicy.yaml is egress only).
    #
    # Known limit: a pod elsewhere in the cluster that reaches Nyctr through
    # the gateway has an address inside this range too, so Nyctr skips that
    # address and believes the X-Forwarded-For entry the pod supplied. A LAN
    # client cannot do this: the gateway appends its real address, which is
    # outside the range, and that is the one Nyctr takes. Nyctr grants
    # nothing on the address alone (it only picks which of a signed-in
    # member's own devices to highlight; its other use, the local sign-in
    # quota, is off here), so treat the client address as a hint until Nyctr
    # resolves it by hop count instead of by range.
    forwardedAllowIps:
      - 10.42.0.0/16
    networkPolicy:
      enabled: true
      ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal

    httpRoute:
      enabled: true
      # The chart puts both hostnames on the route; the existing DNS
      # automation (k8s-gateway, unifi external-dns) creates both records.
      annotations:
        external-dns.alpha.kubernetes.io/hostname: nyctr.homelab0.org,blocked.homelab0.org
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https

    database:
      existingSecret: nyctr-db
      urlKey: database-url

    # Sign-in is Authentik only. No local accounts, so there is no bootstrap
    # password to store. The role comes from the "groups" claim on every
    # sign-in: nyctr-admins get the console, nyctr-members the portal, anyone
    # else is refused. The client id is a public identifier, declared once in
    # the Authentik blueprint and once here. The issuer must match the
    # provider's discovery document exactly, trailing slash included.
    auth:
      local:
        enabled: false
      oidc:
        enabled: true
        issuer: https://authentik.homelab0.org/application/o/nyctr/
        clientId: nyctr
        existingSecret: nyctr-oidc
        clientSecretKey: client-secret
        adminGroups:
          - nyctr-admins
        allowedGroups:
          - nyctr-members

    # Sources. In the console a source is connected by the environment name,
    # never the key. NextDNS uses its own fixed origin, so it needs no entry
    # under connectors.hosts; every other source does, because a key is sent
    # only to a host listed there. Certificates are always verified and no CA
    # bundle is mounted, so a host must present a publicly trusted
    # certificate for its name. The UniFi console and Proxmox follow once
    # their hostnames, as resolved from inside the cluster, are settled.
    connectors:
      secrets:
        - envName: NYCTR_CONNECTOR_SECRET_NEXTDNS
          existingSecret: nyctr-connectors
          key: nextdns-api-key

    # Read-only: Nyctr changes nothing at any source. Later, one integration
    # at a time: [nextdns] first, then [nextdns, unifi_network].
    providerWrites: []
    # No schedule yet: collect from the console while the adapters are being
    # checked against the real sources. 60 to 86400 seconds once trusted.
    collection:
      intervalSeconds: 0

    # The process reads its secrets only at start: roll the pod when
    # nyctr-db, nyctr-oidc or nyctr-connectors change.
    podAnnotations:
      reloader.stakater.com/auto: "true"
