---
# Nyctr network console (github.com/homelab-0/nyctr). One stateless pod; its
# state is a role + Database CR on the shared CloudNativePG cluster
# (kubernetes/apps/database/cluster) and its sign-in is the Authentik blueprint
# nyctr.yaml (kubernetes/apps/security/authentik).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nyctr
  namespace: flux-system
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The database root applies `namespace: database`, so postgres-cluster's CR
  # lands there (same as ai/paperclip/ks.yaml). Authentik is not listed: Nyctr
  # starts without it and only sign-in waits for the blueprint.
  dependsOn:
    - name: external-secrets-operator
      namespace: flux-system
    - name: postgres-cluster
      namespace: database
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/security/nyctr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
