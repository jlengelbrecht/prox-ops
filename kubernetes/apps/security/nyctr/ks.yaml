---
# Nyctr network console (github.com/homelab-0/nyctr). One stateless pod; its
# state is its own CloudNativePG cluster (../nyctr-db) and its sign-in is the
# Authentik blueprint nyctr.yaml (kubernetes/apps/security/authentik).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nyctr
  namespace: flux-system
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Authentik is not listed: Nyctr starts without it and only sign-in waits
  # for the blueprint.
  dependsOn:
    - name: external-secrets-operator
      namespace: flux-system
    - name: nyctr-db
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/security/nyctr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
