---
# Authentik's own Postgres. Two instances so a node loss or a Talos drain is a
# switchover, not a login outage. Prune is disabled: this holds every user,
# application and signing key.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  enablePDB: true
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202611030838-standard-trixie@sha256:5bf4a23aa13fb560903fba932676773ba4ba2729c162e587b09bf539a2e3df56

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    # One instance per Proxmox host, so losing a host is a switchover.
    topologyKey: topology.kubernetes.io/zone

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-credentials
      # Not tied to the image's glibc, so a base image change cannot leave
      # text indexes stale.
      localeProvider: builtin
      builtinLocale: C.UTF-8
      import:
        type: microservice
        databases:
          - authentik
        source:
          externalCluster: authentik-postgresql

  externalClusters:
    - name: authentik-postgresql
      connectionParameters:
        host: authentik-postgresql.security.svc
        user: authentik
        dbname: authentik
      password:
        name: authentik-db-credentials
        key: password

  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: authentik-db-credentials

  postgresql:
    parameters:
      # The default of 100 is tight: Authentik opens a connection per request.
      max_connections: "200"

  storage:
    size: 10Gi
    storageClass: ceph-block-retain

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
