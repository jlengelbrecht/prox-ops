---
# Only Authentik, its nightly backup and the cluster's own pods reach Postgres,
# matching the policy on the database this replaces. The operator needs the
# instance manager port and Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-db
  namespace: security
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-db
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/name: authentik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-backup
    - ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: authentik-db
    - ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
