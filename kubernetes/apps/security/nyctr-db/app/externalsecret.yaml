---
# Password of the nyctr database role. The Nyctr app reads the same 1Password
# field (security/nyctr/app/externalsecret.yaml), so both ends hold the same
# value. The username is fixed: CNPG requires it to equal the managed role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nyctr-db-credentials
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nyctr-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: nyctr
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: nyctr
        property: db-password
