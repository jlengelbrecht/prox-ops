---
# Identity that kustomize-controller impersonates when it applies pilot-branch
# content, and that helm-controller impersonates for any HelmRelease that
# content declares (flagger-pilot-app patches spec.serviceAccountName in, so
# the branch cannot opt out).
#
# The object lives here, in the control namespace, and not in flagger-pilot
# where most of its permissions apply. That separation is the point: a
# Deployment on the pilot branch cannot name a ServiceAccount from another
# namespace, so branch content cannot get a pod running as this identity, and
# it cannot create a local stand-in either because its Role is read-only on
# serviceaccounts.
#
# What this account may do in flagger-pilot is in
# kubernetes/apps/flagger-pilot/rbac.yaml, which also explains why that
# RoleBinding carries a second subject. What it may do here is exactly the
# rule below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-flagger-pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-flagger-pilot
rules:
  # flagger-pilot-app's postBuild.substituteFrom resolves cluster-secrets from
  # the namespace the Kustomization object lives in, which is this one.
  # Whether kustomize-controller reads it as the impersonated account or as
  # itself is not documented; this grant is correct if it does and harmless if
  # it does not. Narrowed to that one Secret by name - nothing else in this
  # namespace is readable.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cluster-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-flagger-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-flagger-pilot
subjects:
  - kind: ServiceAccount
    name: flux-flagger-pilot
    namespace: flagger-system
