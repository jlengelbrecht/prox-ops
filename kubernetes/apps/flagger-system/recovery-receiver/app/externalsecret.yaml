---
# The shared secret both ends of the webhook path use.
#
# 1Password item: flagger_pilot_webhook_token (Automation vault, API Credential
# type, custom field of the same name) - the same shape as the flux-instance
# webhook token this mirrors.
#
# The receiver mounts the resulting Secret and compares it in constant time.
# The caller cannot: a Flagger webhook definition has no way to reference a
# Secret, so the Canary on the pilot branch carries the token in its webhook
# metadata and gets it there through flagger-pilot-app's
# postBuild.substituteFrom, which resolves this Secret from this namespace.
# That is why the target key is `token` and why pilot-source's Role now names
# this Secret: both ends read the same object, neither end holds a copy in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flagger-pilot-webhook-token
  labels:
    app.kubernetes.io/name: recovery-receiver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flagger-pilot-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: flagger_pilot_webhook_token
        property: flagger_pilot_webhook_token
