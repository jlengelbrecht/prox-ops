---
# The Git credential, and the one file in this app deliberately absent from
# ./kustomization.yaml's `resources:` - which has the window it is applied in.
# 1Password item flagger_recovery_git_token (Automation vault, built-in
# password field): a fine-grained PAT with `contents: write` on this repository
# and nothing else - no workflow scope, no admin, not a bypass actor on the
# `main` ruleset, which has none at all (re-verified 2026-09-07, as the design
# requires). Permanent by the owner's decision, so what keeps it out of reach
# is not an expiry date: it is that this file is not applied.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flagger-recovery-git-token
  namespace: flagger-system
  labels:
    app.kubernetes.io/name: recovery-receiver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flagger-recovery-git-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: flagger_recovery_git_token
        property: password
