---
# The receiver holds a Kubernetes credential and accepts input from a webhook
# body, which is the combination worth fencing. Both directions are listed, so
# this endpoint is default-deny for everything not named below.
#
# Ingress: the Flagger controller and the Alertmanager, and nothing else. Note
# what is absent - flagger-pilot has no rule here, so a pod the pilot branch
# deploys cannot reach this port at all, whatever token it might have scraped
# out of its own Canary.
#
# Egress: DNS, the API server, and one name on the public internet -
# api.github.com on 443, the Git correction writer's whole reach. No
# toEntities: world and no toCIDR, so that rule is the allowance, not a hole.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recovery-receiver
  labels:
    app.kubernetes.io/name: recovery-receiver
    app.kubernetes.io/component: networkpolicy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: recovery-receiver

  ingress:
    # Written against the container port, not the Service's 80: Cilium DNATs to
    # the endpoint before it evaluates policy, so a rule naming 80 matches
    # nothing and every hook is dropped silently.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flagger-system
            app.kubernetes.io/name: flagger
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # The Alertmanager pods, for ./alertmanagerconfig.yaml's webhook. The
    # operator stamps `alertmanager: <name>` on them, which names this
    # StatefulSet's pods and not every workload in observability - the namespace
    # label alone would admit Grafana and Prometheus too. Same container port as
    # above, for the same DNAT-before-policy reason.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            alertmanager: kube-prometheus-stack-alertmanager
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

  egress:
    # CoreDNS pods rather than the kube-dns Service, for the same
    # DNAT-before-policy reason as above.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # What makes the toFQDNs rule below work: Cilium learns a name's
          # addresses from this pod's own DNS answers and proxies only queries
          # a `rules.dns` pattern selects - with none, that rule holds an empty
          # address set and every GitHub request is dropped. "*", not the exact
          # name: an unmatched query is refused, and the resolver expands first.
          rules:
            dns:
              - matchPattern: "*"

    # The kube-apiserver entity, which is how the receiver reads canaries,
    # deployments, replicasets and pods and writes its records. No toPorts on
    # purpose: the pod dials the kubernetes Service on 443 and Cilium sees the
    # post-DNAT port, which is the control plane's real listener - pinning a
    # port here would break on a Talos change that moves it, and a port is not
    # what bounds this reach anyway. RBAC is: two namespaced Roles, read-only
    # outside this namespace, create-and-read within it.
    - toEntities:
        - kube-apiserver

    # GitHub's REST API, one name and one port. Reachable window or not: a dry
    # run reads what a real write does, so closing a window takes the
    # credential, not the reach. A matchName, never a matchPattern. Check the
    # CNP is Valid after this merges; an unparsable policy is refused whole.
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
