---
# Standalone CloudNativePG Cluster for GlycemicGPT
# Separate from the shared postgres cluster in database namespace for:
# - Medical data isolation
# - pgvector extension support (embeddings for RAG)
# - Independent backup/lifecycle management
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: glycemicgpt-db
  namespace: health
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1

  # With instances: 1 the operator's primary PDB (minAvailable=1) leaves
  # disruptionsAllowed=0 forever, so the primary cannot be evicted and its node
  # cannot be drained. Talos cordons then drains during upgrade, so this aborts
  # the upgrade and strands the node cordoned. The PDB guards nothing at a single
  # instance — there is no replica to fail over to. Re-enable if instances > 1.
  # See .claude/.ai-docs/troubleshooting/RCA-2026-08-15-talos-upgrade-stall.md
  enablePDB: false

  # Pinned by digest: upstream has deprecated this tag family. Held on the
  # running image until the move to a current image.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8@sha256:ed9bd4a26b152cf35f2c64e15f48126e3477ad222cfb04794562bdc999b8f0be

  bootstrap:
    initdb:
      database: glycemicgpt
      owner: glycemicgpt
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  superuserSecret:
    name: glycemicgpt-db-superuser

  storage:
    size: 10Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  postgresql:
    shared_preload_libraries:
      - vector
