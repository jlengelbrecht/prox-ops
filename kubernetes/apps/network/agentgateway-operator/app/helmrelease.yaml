---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway-crds
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
  dependsOn:
    - name: agentgateway-crds
      namespace: network
  interval: 1h
  # The old "agentgateway"-named Gateway (fixed in this same change) caused
  # the deployer to merge its per-Gateway proxy Service into this chart's own
  # controller Service; drift detection makes Helm actively restore any such
  # out-of-band mutation instead of silently drifting (post-merge incident,
  # 2026-08-01).
  driftDetection:
    mode: enabled
  values:
    # kube-prometheus-stack selects ALL ServiceMonitors cluster-wide
    # (serviceMonitorSelectorNilUsesHelmValues: false, no label scoping -
    # see observability/kube-prometheus-stack/app/helmrelease.yaml:64), so
    # no extra release-label matching is needed here.
    monitoring:
      enabled: true
