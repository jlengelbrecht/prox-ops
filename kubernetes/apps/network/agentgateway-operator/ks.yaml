---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-operator
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: agentgateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/agentgateway-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
  timeout: 15m
