---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wireguard-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: wireguard-gateway
  interval: 1h
  values:
    controllers:
      wireguard-gateway:
        # The tunnel config forwards everything that arrives on wg0. Narrow that
        # inside the pod, so the NetworkPolicy is not the only thing keeping the
        # VPS on Plex. The rules are inserted at the top of each chain and stay
        # for the life of the pod; the accept rules the tunnel config appends
        # later are never reached.
        initContainers:
          forward-filter:
            image:
              repository: lscr.io/linuxserver/wireguard
              # renovate: datasource=docker depName=lscr.io/linuxserver/wireguard
              tag: 1.0.20250521
            command:
              - /bin/sh
              - -ec
              - |
                # Plex LoadBalancer address the tunnel config DNATs to
                PLEX=10.20.81.100
                # Stateless on purpose: these matches are the ones the tunnel
                # config already uses, so no extra kernel module is needed.
                iptables -I FORWARD 1 -i wg0 -p tcp -d "$PLEX" --dport 32400 -j ACCEPT
                # Replies to the VPS. No source match: the reply's source address
                # depends on where in the path address translation is undone.
                iptables -I FORWARD 2 -o wg0 -p tcp --sport 32400 -j ACCEPT
                iptables -I FORWARD 3 -j DROP
                # Nothing from the tunnel may talk to the pod itself
                iptables -I INPUT 1 -i wg0 -j DROP
                iptables -S FORWARD
                iptables -S INPUT
            securityContext:
              capabilities:
                add: [NET_ADMIN]
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/wireguard
              # renovate: datasource=docker depName=lscr.io/linuxserver/wireguard
              tag: 1.0.20250521
            env:
              # Container config
              - name: PUID
                value: "0"
              - name: PGID
                value: "0"
              - name: TZ
                value: "America/New_York"
              # WireGuard config (generated at runtime)
              - name: INTERFACE
                value: "wg0"
              - name: SERVERURL
                value: "auto"
              - name: SERVERPORT
                value: "51820"
              - name: PEERS
                value: ""  # Not a server, just a client
              - name: PEERDNS
                value: "auto"
              - name: INTERNAL_SUBNET
                value: "10.200.200.0/24"
              - name: ALLOWEDIPS
                value: "0.0.0.0/0"
              - name: PERSISTENTKEEPALIVE_PEERS
                value: ""

            # Security Context - privileged required for WireGuard on Talos
            # SYS_MODULE removed per security review - Talos has WireGuard in kernel
            securityContext:
              privileged: true
              capabilities:
                add: [NET_ADMIN]

            # Resources
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi

            # Probes
            # Liveness: Check for recent handshake (tunnel actually connected)
            # Probe fails if no handshake in 180s. Pod restarts after 6 failures (~6 min total).
            # Readiness: Check interface exists (allows traffic only when interface is up)
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - |
                        # Check if wg0 interface exists and has recent handshake
                        HANDSHAKE=$(wg show wg0 latest-handshakes 2>/dev/null | awk '{print $2}')
                        NOW=$(date +%s)
                        # If no handshake data, fail
                        [ -z "$HANDSHAKE" ] && exit 1
                        # If handshake is 0 (never connected), allow for initial connection
                        [ "$HANDSHAKE" = "0" ] && exit 0
                        # Check if handshake was within last 180 seconds (3 minutes)
                        AGE=$((NOW - HANDSHAKE))
                        [ "$AGE" -lt 180 ]
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - wg show wg0 2>/dev/null | grep -q "interface"
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3

    # Service - not needed for client-only mode but useful for debugging
    service:
      app:
        controller: wireguard-gateway
        ports:
          wireguard:
            port: 51820
            protocol: UDP

    # Persistence
    persistence:
      # TUN device for WireGuard
      dev-tun:
        enabled: true
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          wireguard-gateway:
            app:
              - path: /dev/net/tun
      # Config from encrypted secret
      config:
        enabled: true
        type: secret
        name: wireguard-gateway-config
        # Only the tunnel container gets the key
        advancedMounts:
          wireguard-gateway:
            app:
              - path: /config/wg_confs/wg0.conf
                subPath: wg0.conf
                readOnly: true

    # Pod options - sysctls (net.ipv4.ip_forward, net.ipv4.conf.all.src_valid_mark) set by
    # linuxserver/wireguard entrypoint; privileged mode required on Talos to allow runtime sysctl changes
    defaultPodOptions:
      # Never evicted when a large model wakes (kubernetes/apps/kube-system/priorityclasses).
      priorityClassName: homelab-critical
      # The gateway never talks to the Kubernetes API
      automountServiceAccountToken: false
