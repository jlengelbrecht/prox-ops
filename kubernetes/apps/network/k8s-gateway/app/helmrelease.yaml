---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      # Serve DNS over TCP too. Cilium 1.19+ LB-IPAM drops traffic to
      # ports the Service does not publish, and large or truncated answers need TCP.
      useTcp: true
      annotations:
        lbipam.cilium.io/ips: "10.20.67.21"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service", "DNSEndpoint"]
