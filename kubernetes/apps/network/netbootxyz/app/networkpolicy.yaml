---
# Boot ports are open to the LAN and the cluster; the unauthenticated editor on
# 3000 is open only to the envoy-internal gateway pods, which apply Authentik
# forward auth (securitypolicy.yaml) before proxying. No other pod or LAN host
# can reach 3000 directly. kubectl port-forward uses the pod's loopback, which
# policy does not filter. DSR keeps LAN client addresses (world). No egress
# section: DNS and release/installer downloads stay open.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbootxyz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: netbootxyz
  ingress:
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "69"
              protocol: UDP
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
