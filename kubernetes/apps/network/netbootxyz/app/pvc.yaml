---
# Menus, loaders and web-app settings: nothing secret, all downloadable again, but
# a restart then serves them without the internet. Retain class plus prune
# disabled: removing the app from Git must not delete the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbootxyz-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block-retain
  resources:
    requests:
      storage: 2Gi
---
# Installer images downloaded from the management UI (/assets, served by nginx
# on the boot port). Kept apart from the config volume so a full asset volume
# cannot stop menu or settings writes. Same retention as the config volume:
# a restart, an app removal or a Git mistake must not delete stored installers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbootxyz-assets
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block-retain
  resources:
    requests:
      storage: 50Gi
