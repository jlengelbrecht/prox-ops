---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  annotations:
    # A menu or start-script change restarts the pod, which copies them in.
    reloader.stakater.com/auto: "true"
spec:
  # One writer for the RWO volume; Recreate frees it before the new pod starts.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbootxyz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbootxyz
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Pod networking only: no hostNetwork, hostPort or host devices.
      hostNetwork: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # CPU workers only: no control plane, no GPU node.
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: nvidia.com/gpu.present
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: netbootxyz
          image: ghcr.io/netbootxyz/netbootxyz:0.7.6-nbxyz28@sha256:a3af92f8447d4df33e7d18607c968db792a6b2da0db9c2255ceb7f45e01897bd
          # Replaces the image's /start.sh: see entrypoint.sh in configmap.yaml.
          command: ["/bin/bash", "/netboot/entrypoint.sh"]
          env:
            # renovate: datasource=github-releases depName=netbootxyz/netboot.xyz
            - name: MENU_VERSION
              value: "3.0.3"
            # Signed iPXE and shim for Secure Boot clients, from the iPXE release.
            # renovate: datasource=github-releases depName=ipxe/ipxe
            - name: IPXE_SB_VERSION
              value: "v2.0.0"
            # All TFTP data leaves from UDP 69, so the load balancer sees one flow.
            - name: TFTPD_OPTS
              value: "--tftp-single-port"
            - name: NGINX_PORT
              value: "80"
            - name: WEB_APP_PORT
              value: "3000"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: tftp
              containerPort: 69
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
            - name: admin
              containerPort: 3000
              protocol: TCP
          # Startup runs as root, like the upstream image: it creates the nbxyz
          # user, chowns /config and binds ports 69 and 80. supervisord then runs
          # the web app as nbxyz, dnsmasq drops to nbxyz after binding, and nginx
          # workers run as nbxyz. Only the capabilities for those steps are kept.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            # init.sh edits /etc/passwd and writes under /run and /var/lib/nginx.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
          # Services up: TFTP socket, nginx and the web app (upstream check).
          startupProbe:
            exec:
              command: ["/healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/healthcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          # Served files are the complete pinned release and our menu is in place.
          readinessProbe:
            exec:
              command: ["/bin/bash", "/netboot/ready.sh"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: assets
              mountPath: /assets
            - name: netboot
              mountPath: /netboot
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: netbootxyz-config
        # Local asset mirror is not used; Talos comes from the Image Factory.
        - name: assets
          emptyDir:
            sizeLimit: 1Gi
        - name: netboot
          configMap:
            name: netbootxyz
            defaultMode: 0555
