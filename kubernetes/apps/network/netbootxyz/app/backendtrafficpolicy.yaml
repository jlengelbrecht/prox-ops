---
# The management UI keeps one Socket.IO connection open for as long as the tab
# is open (dashboard, menu editor and download progress). Timeouts only; it
# changes no access decision. mergeType keeps the gateway-wide policy
# (envoy-gateway-config envoy: compression, buffer limit) for this route and
# overrides only the fields set here; without it the route policy would
# replace the gateway policy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: netbootxyz
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: netbootxyz
  mergeType: StrategicMerge
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 3600s
  tcpKeepalive:
    probes: 3
    idleTime: 60s
    interval: 30s
