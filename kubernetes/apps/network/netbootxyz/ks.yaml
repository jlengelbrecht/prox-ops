---
# LAN PXE server (netboot.xyz). The UDM SE stays the only DHCP server and only
# points clients here. No postBuild substitution: the iPXE scripts in
# app/configmap.yaml use ${...} variables that Flux must leave alone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app netbootxyz
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/network/netbootxyz/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
