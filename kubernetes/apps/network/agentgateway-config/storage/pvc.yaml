---
# PROTECTED: This PVC is in a separate Kustomization with prune: false
# to prevent accidental data loss during Flux reconciliation or cattle upgrades
#
# STORY-034-2: sqlite request-log DB for the ai-gateway proxy (single
# replica today - each replica would keep its own local DB, per
# res-agentgateway-core.md sec 6).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentgateway-request-log
  namespace: network
  labels:
    app.kubernetes.io/name: agentgateway-config
    app.kubernetes.io/component: storage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
