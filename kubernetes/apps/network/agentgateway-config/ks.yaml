---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway-config
spec:
  dependsOn:
    - name: agentgateway-operator
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/agentgateway-config/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
