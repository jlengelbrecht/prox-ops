---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot-vlan62
  namespace: network
  labels:
    app.kubernetes.io/name: network-attachment
    app.kubernetes.io/component: iot-vlan
spec:
  # Pod addresses start above .150. Cilium LB-IPAM hands out .100-.150 on this
  # VLAN, and host-local IPAM does not know about those VIPs.
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eth1",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "10.20.62.0/23",
        "rangeStart": "10.20.62.151",
        "rangeEnd": "10.20.62.200",
        "gateway": "10.20.62.1"
      }
    }
