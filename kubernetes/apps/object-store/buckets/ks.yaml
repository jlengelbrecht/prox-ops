---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rgw-buckets
  namespace: flux-system
spec:
  targetNamespace: object-store
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/object-store/buckets/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # The CronJob converges on its own schedule; do not hold Flux on its first run.
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    # The group kustomization places every Flux Kustomization of this group in
    # object-store, so the dependency is looked up there, not in flux-system.
    - name: rgw
      namespace: object-store
    - name: 1password-connect
      namespace: flux-system
