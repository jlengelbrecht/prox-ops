---
# S3 credentials for the users declared in definition.yaml. The
# onepassword-connect ClusterSecretStore reads only the Automation vault.
# Most users read s3-object-store-users; Langfuse reads langfuse-secrets.
# The Secret key prefix is the third column of users.txt in definition.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rgw-users
  namespace: object-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rgw-users
    creationPolicy: Owner
  data:
    - secretKey: PROVISIONER_ACCESS_KEY
      remoteRef:
        key: s3-object-store-users
        property: PROVISIONER_ACCESS_KEY
    - secretKey: PROVISIONER_SECRET_KEY
      remoteRef:
        key: s3-object-store-users
        property: PROVISIONER_SECRET_KEY
    - secretKey: TOFU_PROXMOX_ACCESS_KEY
      remoteRef:
        key: s3-object-store-users
        property: TOFU_PROXMOX_ACCESS_KEY
    - secretKey: TOFU_PROXMOX_SECRET_KEY
      remoteRef:
        key: s3-object-store-users
        property: TOFU_PROXMOX_SECRET_KEY
    - secretKey: LANGFUSE_ACCESS_KEY
      remoteRef:
        key: langfuse-secrets
        property: S3_ACCESS_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse-secrets
        property: S3_SECRET_KEY
    - secretKey: TOFU_OCI_ACCESS_KEY
      remoteRef:
        key: s3-object-store-users
        property: TOFU_OCI_ACCESS_KEY
    - secretKey: TOFU_OCI_SECRET_KEY
      remoteRef:
        key: s3-object-store-users
        property: TOFU_OCI_SECRET_KEY
    - secretKey: SYNC_RO_ACCESS_KEY
      remoteRef:
        key: s3-object-store-users
        property: SYNC_RO_ACCESS_KEY
    - secretKey: SYNC_RO_SECRET_KEY
      remoteRef:
        key: s3-object-store-users
        property: SYNC_RO_SECRET_KEY
