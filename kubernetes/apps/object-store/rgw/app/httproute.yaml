---
# S3 endpoint, internal only (path-style). Attaches to the internal gateway;
# not exposed through the external/Cloudflare gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rgw
  namespace: object-store
  annotations:
    external-dns.alpha.kubernetes.io/hostname: s3.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - s3.homelab0.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rgw
          port: 80
          weight: 1
