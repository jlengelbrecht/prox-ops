---
# Keyring for the Ceph user client.rgw.k8s (created on the Proxmox-managed
# Ceph cluster). The onepassword-connect ClusterSecretStore reads only the
# Automation vault, so the item must exist there:
#   vault: Automation   item: ceph-rgw-k8s   field: CEPH_RGW_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rgw-keyring
  namespace: object-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rgw-keyring
    creationPolicy: Owner
    template:
      data:
        keyring: "[client.rgw.k8s]\n\tkey = {{ .key }}\n"
  data:
    - secretKey: key
      remoteRef:
        key: ceph-rgw-k8s
        property: CEPH_RGW_KEY
