---
# The loadtester's HTTP API executes whatever a Canary webhook asks it to run
# and has no authentication of its own, so reachability is the control. Only
# the Flagger controller in this namespace may call it.
#
# No `egress` key: the loadtester's whole job is to drive traffic at the
# canary through envoy-internal, and the destinations are not known until the
# pilot app exists. Omitting the key leaves this endpoint under ingress
# enforcement only, which is the intended posture here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flagger-loadtester
  labels:
    app: flagger-loadtester
    app.kubernetes.io/component: networkpolicy
spec:
  endpointSelector:
    matchLabels:
      app: flagger-loadtester

  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flagger-pilot
            app.kubernetes.io/name: flagger
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
