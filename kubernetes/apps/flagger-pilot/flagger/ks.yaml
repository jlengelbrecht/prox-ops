---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flagger
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/apps/flagger-pilot/flagger/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flagger-pilot
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flagger
      namespace: flagger-pilot
