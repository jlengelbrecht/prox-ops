---
# Default-deny for the connector in both directions, plus one ingress rule per
# client. The connector is a transport (sessions are authenticated and
# encrypted end to end between the client and the HSM), but it is also the only
# door to the device and has no authentication of its own, so nothing that is
# not a named client can reach it.
#
# Egress is empty: the connector talks only to the USB device. enableDefaultDeny
# makes the egress direction enforced even though no rule allows anything (an
# empty rule matches nothing), so it cannot resolve names or dial anything.
# Kubelet probes come from the host and are not subject to this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yubihsm-connector
  namespace: hsm-system
  labels:
    app.kubernetes.io/name: yubihsm-connector
    app.kubernetes.io/component: networkpolicy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: yubihsm-connector

  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    # Crossplane assertion signer: the provider-azuread pod (label set by its
    # DeploymentRuntimeConfig). Written against the container port: Cilium
    # DNATs the Service to the endpoint before it evaluates policy.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: crossplane-system
            app.kubernetes.io/name: provider-azuread
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP

    # OpenBao's HSM key management: a short-lived pod a cluster admin starts in
    # the openbao namespace to create, back up or rotate OpenBao's HSM objects
    # with the admin key (the owner pipes that password in over stdin). No such
    # pod runs normally, so this path is closed until one is started, and it is
    # deleted after each use.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao-hsm-admin
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP

    # OpenBao's server pods: the seal and External Keys. They authenticate to
    # the HSM with their own auth key (domains 9 and 10 only); the connector is
    # just the transport. OpenBao's policy has the matching egress rule.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP

  egress:
    - {}
