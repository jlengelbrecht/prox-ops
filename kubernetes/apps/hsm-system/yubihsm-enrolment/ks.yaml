---
# Temporary: the pod the owner runs hsm-reset-enrol in after a YubiHSM 2 factory
# reset (see the HSM enrolment runbook). Removed again once the HSM is enrolled.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app yubihsm-enrolment
  namespace: flux-system
spec:
  targetNamespace: hsm-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: yubihsm-connector
      namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/hsm-system/yubihsm-enrolment/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
