---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceph-csi-drivers
spec:
  # A separate Kustomization, so the drivers release is only applied once the
  # operator release (and the CSI operator and CRDs it installs) is Ready.
  dependsOn:
    - name: rook-ceph-operator
  interval: 1h
  path: ./kubernetes/apps/rook-ceph/ceph-csi-drivers/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: rook-ceph
  wait: true
  timeout: 15m
