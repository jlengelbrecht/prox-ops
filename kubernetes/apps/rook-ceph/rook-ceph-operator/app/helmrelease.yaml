---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  chart:
    spec:
      chart: rook-ceph
      # renovate: datasource=helm registryUrl=https://charts.rook.io/release
      version: v1.19.12
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Rook operator configuration for external cluster mode
    crds:
      enabled: true

    # Monitoring
    monitoring:
      enabled: true

    # Resource limits for operator
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi

    # CSI driver configuration
    csi:
      enableRbdDriver: true
      enableCephfsDriver: true
      enableGrpcMetrics: true

      # Group snapshots stay off: nothing here uses them. Rook v1.15's csi-snapshotter
      # v8.0.1 used the v1alpha1 VolumeGroupSnapshot API, which the snapshot-controller
      # v8.6 CRDs no longer serve, and the sidecar stopped creating any VolumeSnapshots
      # with the feature on. Re-test before enabling it.
      # From v1.18 the CSI operator ignores this for CephFS: Rook sets the CephFS
      # driver's snapshotPolicy to volumeGroupSnapshot whenever the group snapshot
      # CRDs exist, so its snapshotter runs with the gate on. That snapshotter
      # (v8.5.0) uses v1beta2, which the v8.6 CRDs serve. RBD stays off.
      enableVolumeGroupSnapshot: false

      # CSI provisioner replicas (reduced for homelab)
      provisionerReplicas: 2

      # Resource limits for CSI containers
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
        - name: csi-resizer
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
        - name: csi-attacher
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
        - name: csi-snapshotter
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi

      csiCephFSProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
        - name: csi-resizer
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
        - name: csi-attacher
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
        - name: csi-snapshotter
          resource:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi

      # Plugin resources
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
        - name: csi-rbdplugin
          resource:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
        - name: liveness-prometheus
          resource:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi

      csiCephFSPluginResource: |
        - name: driver-registrar
          resource:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
        - name: csi-cephfsplugin
          resource:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
        - name: liveness-prometheus
          resource:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
