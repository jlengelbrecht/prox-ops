---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  chart:
    spec:
      chart: rook-ceph
      # renovate: datasource=helm registryUrl=https://charts.rook.io/release
      version: v1.20.9
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # The chart took over rook-csi-operator-image-set-configmap in v1.20. A Helm
  # rollback to a revision without it would delete it, and the CSI operator
  # can't reconcile the drivers without it. Keep it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: rook-csi-operator-image-set-configmap
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: rook-csi-operator-image-set-configmap
                annotations:
                  helm.sh/resource-policy: keep
  values:
    # Rook operator configuration for external cluster mode
    crds:
      enabled: true

    # Monitoring
    monitoring:
      enabled: true

    # Resource limits for operator
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi

    # From v1.20 Rook no longer configures the CSI drivers. The Driver and
    # OperatorConfig resources, the plugin service accounts and RBAC come from
    # the ceph-csi-drivers release (kubernetes/apps/rook-ceph/ceph-csi-drivers).
    # This chart still installs the ceph-csi-operator and sets the CSI images
    # through rook-csi-operator-image-set-configmap.
