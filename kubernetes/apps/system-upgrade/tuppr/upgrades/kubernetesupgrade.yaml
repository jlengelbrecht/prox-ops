---
# Kubernetes upgrade plan. A KubernetesUpgrade has no node selector: it acts on
# the whole cluster as soon as any node's kubelet differs from spec version, and
# tuppr waits for a running TalosUpgrade to finish first. At the running version
# it records Completed and starts no job. Renovate bumps this version in the same
# PR as talos/topf.yaml and talos/talenv.yaml, one minor at a time (Kubernetes
# does not support skipping a minor), and scripts/check-talos-versions.sh fails
# CI if any copy drifts.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # Desired cluster version; must equal kubernetesVersion in talos/topf.yaml.
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  # Start upgrades only at the weekend: Saturday 09:00 to Sunday 21:00 Eastern.
  # A version merged midweek waits in phase MaintenanceWindow (see
  # status.nextMaintenanceWindow) until the window opens; to roll one
  # out sooner, merge a PR that removes this block. An upgrade that has
  # started runs to completion.
  maintenance:
    windows:
      - start: "0 9 * * 6"
        duration: 36h
        timezone: America/New_York
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph-external
      namespace: rook-ceph
      expr: status.ceph.health in ['HEALTH_OK']
      timeout: 10m
      description: External Ceph cluster is HEALTH_OK
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      timeout: 10m
      description: Every node is Ready
