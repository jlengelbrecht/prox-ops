---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    # Leader election keeps one replica active; the standby takes over when
    # the leader's node is drained for its own upgrade.
    replicaCount: 2
    # Keep leader and standby on different nodes so one drain never takes both.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tuppr
    # The chart's talos.dev ServiceAccount asks Talos for an os:admin
    # talosconfig Secret, which the controller pod mounts. Talos only issues it
    # once system-upgrade and os:admin are allowed in
    # machine.features.kubernetesTalosAPIAccess on the control-plane nodes;
    # until then the pods cannot start.
    talosServiceAccount:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      # No grafana-operator in this cluster: render a ConfigMap for the
      # kube-prometheus-stack Grafana sidecar (label grafana_dashboard: "1").
      dashboards:
        enabled: true
        annotations:
          grafana_folder: "Kubernetes"
        grafanaOperator:
          enabled: false
