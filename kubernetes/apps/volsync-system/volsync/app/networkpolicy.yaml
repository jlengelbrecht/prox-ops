---
# The operator only talks to the Kubernetes API. Nothing connects to it
# (no ServiceMonitor yet), so ingress stays denied.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: volsync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: volsync
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEntities:
        - kube-apiserver
