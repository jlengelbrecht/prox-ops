---
# Chart 5.3.0 ships snapshot-controller v8.6.0 and renders the upstream
# snapshot.storage.k8s.io / groupsnapshot.storage.k8s.io CRDs as templates
# (installCRDs: true is the chart default), so Helm owns them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  values:
    # Annotate the CRDs helm.sh/resource-policy: keep. Without it, an
    # uninstall (or a Flux prune of this HelmRelease) deletes the CRDs and,
    # with them, every VolumeSnapshot in the cluster.
    keepCRDs: true
    controller:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # The chart's conversion webhook only matters for VolumeGroupSnapshot
    # objects stored in the old beta versions; none exist here. It is off by
    # default in 5.3.0 and stays off.
    webhook:
      enabled: false
