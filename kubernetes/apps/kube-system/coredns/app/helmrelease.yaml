---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    servers:
      # Split-horizon DNS for internal homelab0.org resolution
      # Routes queries for homelab0.org to k8s-gateway for internal IPs
      - zones:
          - zone: homelab0.org
            scheme: dns://
        port: 53
        plugins:
          - name: forward
            parameters: . 10.20.67.21
          - name: cache
            parameters: 30
          - name: errors
          - name: log
            configBlock: |-
              class error
      # DNS-over-TLS for the GitHub Actions service zone only
      # The UDM intercepts all port-53 traffic and intermittently answers
      # launch.actions.githubusercontent.com with CNAME github.com, which breaks
      # runner TLS (certificate name mismatch). DoT on 853 bypasses the
      # interception. Removed in #1491 after a clean watch, restored when the
      # fault returned on 2026-10-14. Remove once the UDM answers correctly again.
      - zones:
          - zone: actions.githubusercontent.com
            scheme: dns://
        port: 53
        plugins:
          - name: errors
          - name: forward
            parameters: . tls://1.1.1.1 tls://1.0.0.1
            configBlock: |-
              tls_servername cloudflare-dns.com
              health_check 5s
          - name: cache
            parameters: 300
          - name: log
            configBlock: |-
              class error
      # Default zone for all other queries
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
