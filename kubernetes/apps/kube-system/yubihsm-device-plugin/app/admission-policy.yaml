---
# Restricts which namespaces may request devic.es/yubihsm2. The HSM still
# carries its public factory credential until the identity-system setup pod
# runs, so this must be in place from the device's first moment of being
# schedulable. A later change narrows crossplane-system further, to only the
# provider's service account.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: yubihsm-device-consumers
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: wantsHsm
      expression: >-
        object.spec.containers.exists(c,
          (has(c.resources.limits) && 'devic.es/yubihsm2' in c.resources.limits) ||
          (has(c.resources.requests) && 'devic.es/yubihsm2' in c.resources.requests)
        ) ||
        (has(object.spec.initContainers) && object.spec.initContainers.exists(c,
          (has(c.resources.limits) && 'devic.es/yubihsm2' in c.resources.limits) ||
          (has(c.resources.requests) && 'devic.es/yubihsm2' in c.resources.requests)
        ))
  validations:
    - expression: "!variables.wantsHsm || request.namespace in ['identity-system', 'crossplane-system']"
      message: "Only pods in identity-system or crossplane-system may request devic.es/yubihsm2."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: yubihsm-device-consumers
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: yubihsm-device-consumers
  validationActions: ["Deny"]
