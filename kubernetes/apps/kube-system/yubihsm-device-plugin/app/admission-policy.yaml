---
# Restricts which pod may request devic.es/yubihsm2: only a pod in
# crossplane-system running as the provider-azuread service account. The
# identity-system enrolment pod that originally needed the device is gone
# (the HSM's factory credential was replaced during enrolment), so this
# policy now exists purely to limit who can reach the device at all. A
# future re-enrolment adds identity-system back in its own change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: yubihsm-device-consumers
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: wantsHsm
      expression: >-
        object.spec.containers.exists(c,
          (has(c.resources.limits) && 'devic.es/yubihsm2' in c.resources.limits) ||
          (has(c.resources.requests) && 'devic.es/yubihsm2' in c.resources.requests)
        ) ||
        (has(object.spec.initContainers) && object.spec.initContainers.exists(c,
          (has(c.resources.limits) && 'devic.es/yubihsm2' in c.resources.limits) ||
          (has(c.resources.requests) && 'devic.es/yubihsm2' in c.resources.requests)
        ))
  validations:
    - expression: >-
        !variables.wantsHsm ||
        (request.namespace == 'crossplane-system' && object.spec.serviceAccountName == 'provider-azuread')
      message: "Only pods in crossplane-system running as the provider-azuread service account may request devic.es/yubihsm2."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: yubihsm-device-consumers
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: yubihsm-device-consumers
  validationActions: ["Deny"]
