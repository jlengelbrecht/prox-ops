---
# Restricts which pod may request devic.es/yubihsm2: only the yubihsm-connector
# pod in hsm-system, running as the yubihsm-connector service account. The
# connector is the single holder of the USB device; the Crossplane assertion
# signer and any other HSM client reach it over the connector's Service instead.
# A future re-enrolment pod adds its own namespace and service account here in
# its own change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: yubihsm-device-consumers
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: wantsHsm
      expression: >-
        object.spec.containers.exists(c,
          (has(c.resources.limits) && 'devic.es/yubihsm2' in c.resources.limits) ||
          (has(c.resources.requests) && 'devic.es/yubihsm2' in c.resources.requests)
        ) ||
        (has(object.spec.initContainers) && object.spec.initContainers.exists(c,
          (has(c.resources.limits) && 'devic.es/yubihsm2' in c.resources.limits) ||
          (has(c.resources.requests) && 'devic.es/yubihsm2' in c.resources.requests)
        ))
  validations:
    - expression: >-
        !variables.wantsHsm ||
        (request.namespace == 'hsm-system' && object.spec.serviceAccountName == 'yubihsm-connector')
      message: "Only pods in hsm-system running as the yubihsm-connector service account may request devic.es/yubihsm2."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: yubihsm-device-consumers
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyName: yubihsm-device-consumers
  validationActions: ["Deny"]
