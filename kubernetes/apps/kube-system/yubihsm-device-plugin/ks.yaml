---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yubihsm-device-plugin
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/yubihsm-device-plugin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: true
