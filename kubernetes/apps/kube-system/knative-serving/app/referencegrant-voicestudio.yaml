---
# The ai/voicestudio HTTPRoute reaches the scale-to-zero VoiceStudio Knative
# Service through kourier-internal (Host rewritten to the ksvc hostname), so
# the route needs to reference this one Service across namespaces.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ai-voicestudio-route
  namespace: kourier-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ai
  to:
    - group: ""
      kind: Service
      name: kourier-internal
