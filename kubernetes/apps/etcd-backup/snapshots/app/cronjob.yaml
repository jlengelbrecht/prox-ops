---
# Daily etcd snapshot to the UNAS `proxmox` share (etcd/ subdirectory).
#
# The init container is the official talosctl image (no shell), which writes
# the snapshot to an emptyDir. The main container compresses it onto NFS
# under a temporary name, checks it, renames it into place and prunes.
# Retention: the newest 7 snapshots, plus Sunday snapshots for 5 weeks.
#
# Restoring needs the snapshot and the Talos secrets bundle
# (talos/talsecret.sops.yaml): gunzip, then
# `talosctl bootstrap --recover-from=<file>` on a fresh control plane.
#
# Pinned to three non-GPU workers, one per Proxmox host, whose IPs are on the
# share's NFS allowlist. Never the controllers: image pulls there stall etcd.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshots
spec:
  schedule: "17 9 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshots
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-work-1
                          - k8s-work-5
                          - k8s-work-7
          initContainers:
            - name: snapshot
              image: ghcr.io/siderolabs/talosctl:v1.13.10@sha256:3116f64c97ddffb53bd3c5bf87c8614d99f04df4326177dbbb7702b5087f0e4d
              args:
                - --endpoints
                - 10.20.67.1,10.20.67.2,10.20.67.3
                # talosctl needs exactly one target node for a snapshot.
                # Any etcd member has the full data set.
                - --nodes
                - 10.20.67.1
                - etcd
                - snapshot
                - /work/etcd.snapshot
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: work
                  mountPath: /work
          containers:
            - name: store
              image: docker.io/library/alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  umask 077
                  dir=/backup/etcd
                  src=/work/etcd.snapshot
                  mkdir -p "$dir"

                  size=$(stat -c %s "$src")
                  [ "$size" -gt 1048576 ] || { echo "snapshot too small: $size bytes" >&2; exit 1; }

                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  tmp="$dir/.etcd-$ts.snapshot.gz.tmp"
                  out="$dir/etcd-$ts.snapshot.gz"
                  trap 'rm -f "$tmp"' EXIT
                  gzip -c "$src" > "$tmp"
                  gzip -t "$tmp"
                  mv "$tmp" "$out"
                  echo "wrote $out ($size bytes before compression)"

                  # Prune: keep the newest 7, plus Sunday snapshots newer
                  # than 35 days. Names sort by time.
                  now=$(date -u +%s)
                  n=0
                  for f in $(ls -1 "$dir" | grep -E '^etcd-[0-9]{8}T[0-9]{6}Z\.snapshot\.gz$' | sort -r); do
                    n=$((n + 1))
                    [ "$n" -le 7 ] && continue
                    day=${f#etcd-}; day=${day%%T*}
                    epoch=$(date -u -D %Y%m%d -d "$day" +%s)
                    if [ "$(date -u -D %Y%m%d -d "$day" +%u)" = 7 ] && [ $((now - epoch)) -lt 3024000 ]; then
                      continue
                    fi
                    echo "pruning $f"
                    rm -f "$dir/$f"
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: talos-secrets
              secret:
                secretName: etcd-backup
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-backup-nfs
