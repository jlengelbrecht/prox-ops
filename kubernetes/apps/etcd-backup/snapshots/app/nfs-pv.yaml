apiVersion: v1
kind: PersistentVolume
metadata:
  name: etcd-backup-nfs
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
  nfs:
    server: 10.20.66.109
    path: /var/nfs/shared/proxmox
  claimRef:
    name: etcd-backup-nfs
    namespace: etcd-backup
