---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openbao-certificates
  namespace: flux-system
spec:
  targetNamespace: openbao
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cert-manager-config
      namespace: cert-manager
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/openbao/certificates/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
