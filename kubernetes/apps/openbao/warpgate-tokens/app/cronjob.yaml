---
# Hourly rotation of Warpgate's Kubernetes target tokens. Warpgate can only read
# KV, so this asks OpenBao's Kubernetes engine for new tokens and writes them to
# kv/warpgate/k8s-read and kv/warpgate/k8s-admin, where the targets reference
# them. Warpgate rebuilds its upstream client every 5 minutes, so it picks a new
# token up by itself.
#
# A leaked token would work directly against the Kubernetes API, skipping
# Warpgate's approval, so tokens last only 4 hours. That survives 2 failed runs.
# After a third, the token expires as the next run starts, so reads can fail for
# a few minutes; OpenBaoWarpgateTokenStale fires well before that. Rotating
# doesn't revoke older tokens: to do that, delete the account and let Flux
# recreate it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: warpgate-tokens
spec:
  schedule: "23 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: warpgate-tokens
        spec:
          restartPolicy: Never
          serviceAccountName: warpgate-tokens
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # The server image: the bao CLI always matches the servers.
              image: ghcr.io/jlengelbrecht/openbao-hsm:main@sha256:36795275411dbc244dd8386616ac88c8f945e866183f279568ec0f56148a852e
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export BAO_ADDR=https://openbao-active.openbao.svc:8200
                  export BAO_CACERT=/openbao-ca/ca.crt

                  BAO_TOKEN=$(bao write -field=token auth/kubernetes/login \
                    role=warpgate-tokens jwt=@/var/run/secrets/openbao/token)
                  export BAO_TOKEN
                  trap 'bao token revoke -self >/dev/null 2>&1 || true' EXIT

                  for target in k8s-read k8s-admin; do
                    k8s_token=$(bao write -field=service_account_token \
                      "kubernetes/creds/warpgate-$target" kubernetes_namespace=access)
                    printf '{"data":{"token":"%s"}}' "$k8s_token" |
                      bao write "kv/data/warpgate/$target" - >/dev/null
                    echo "rotated kv/warpgate/$target"
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: openbao-ca
                  mountPath: /openbao-ca
                  readOnly: true
                - name: token
                  mountPath: /var/run/secrets/openbao
                  readOnly: true
          volumes:
            # Only the CA certificate from the server's TLS Secret, not its key.
            - name: openbao-ca
              secret:
                secretName: openbao-server-tls
                items:
                  - key: ca.crt
                    path: ca.crt
            - name: token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: openbao
                      expirationSeconds: 600
