---
# The OpenBao web UI and API at bao.homelab0.org, LAN only (envoy-internal).
# Envoy terminates the public certificate and re-encrypts to the active node,
# verifying it against OpenBao's own CA (BackendTLSPolicy below). Standby
# nodes would forward to the active node anyway; going straight there saves
# a hop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  annotations:
    external-dns.alpha.kubernetes.io/hostname: bao.homelab0.org
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - bao.homelab0.org
  rules:
    # The agent PAM approval page, answered by Envoy from the pam-page ConfigMap.
    # Only these two exact paths; everything else still goes to OpenBao. The
    # headers stop other sites framing Approve: a meta tag can't set
    # frame-ancestors.
    - matches:
        - path:
            type: Exact
            value: /pam/
        - path:
            type: Exact
            value: /pam/callback
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: pam-page
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: "frame-ancestors 'none'"
              - name: X-Frame-Options
                value: DENY
              - name: Cache-Control
                value: no-store
              - name: Referrer-Policy
                value: no-referrer
              - name: X-Content-Type-Options
                value: nosniff
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openbao-active
          port: 8200
---
# TLS from Envoy to OpenBao. The CA is the ca.crt key of the server
# certificate's Secret (cert-manager writes the issuing CA there); Envoy
# Gateway reads only that key. The hostname is one of the certificate's SANs.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: openbao
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: openbao-active
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: openbao-server-tls
    hostname: openbao-active.openbao.svc
