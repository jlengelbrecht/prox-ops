---
# OpenBao's PKCS#11 PIN for the YubiHSM: the auth key id 0011 followed directly
# by its password, with no separator and NO trailing newline (the plugin reads
# the file as-is, so a newline would become part of the PIN). The password is
# in OpenBao-Automation/openbao-hsm, readable only through the restricted
# onepassword-openbao store, which serves only this namespace. The pods read
# the PIN once at start; after a password rotation they have to be restarted
# (Reloader does that when this Secret changes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-hsm-pin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-openbao
  target:
    name: openbao-hsm-pin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Flow scalar on purpose: a block scalar (|) would append a newline.
        pin: '0011{{ .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: openbao-hsm
        property: auth-password
