---
# Serves kubernetes/apps/openbao/openbao/app/pam/index.html for the /pam/ rule
# in httproute.yaml. The page signs in through OpenBao's pam-oidc mount and
# talks only to OpenBao's API on the same origin.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: pam-page
spec:
  directResponse:
    statusCode: 200
    contentType: text/html; charset=utf-8
    body:
      type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: pam-page
