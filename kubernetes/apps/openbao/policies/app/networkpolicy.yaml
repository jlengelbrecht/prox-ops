---
# Default-deny for the OpenBao server pods in both directions (the namespace-
# wide default-deny below covers every other pod). Only what the
# servers need to start, unseal and form a Raft cluster is open here; each
# client (envoy-internal for the UI, the snapshot job, workloads using
# Kubernetes auth) gets its own ingress rule in the change that adds it, and
# the OIDC egress to Authentik comes with the login setup. Kubelet probes come
# from the host and are not subject to this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server

  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    # The other replicas: API forwarding (8200) and Raft / cluster traffic (8201).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The other replicas (Raft retry_join, forwarding, the active node).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP

    # The seal and External Keys: the YubiHSM through yubihsm-connector.
    # Written against the connector pod and its container port (Cilium DNATs
    # the Service before it evaluates policy).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hsm-system
            app.kubernetes.io/name: yubihsm-connector
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP

    # Kubernetes auth: TokenReview calls. No toPorts: Cilium sees the post-DNAT
    # port of the control plane's real listener.
    - toEntities:
        - kube-apiserver
---
# The short-lived HSM key-management pod (app.kubernetes.io/name:
# openbao-hsm-admin): nothing reaches it; it reaches only DNS and the
# connector. It runs only while the owner manages OpenBao's HSM objects.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-hsm-admin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-hsm-admin
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hsm-system
            app.kubernetes.io/name: yubihsm-connector
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
---
# Every other pod in the namespace (a snapshot job, a restore drill, anything
# added later) starts with no network access at all; each gets its own policy
# in the change that adds it. Rules are additive, so this doesn't narrow the
# server policy above. The empty rules match nothing; enableDefaultDeny keeps
# both directions enforced.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - {}
