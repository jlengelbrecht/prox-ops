---
# Default-deny for the OpenBao server pods in both directions (the namespace-
# wide default-deny below covers every other pod). Open here: what the
# servers need to start, unseal and form a Raft cluster, the web UI through
# envoy-internal, OIDC login against Authentik, the snapshot job, metrics for
# Prometheus, External Secrets, Warpgate, the merge gate's evidence worker, and
# the database engine. Workloads that use
# Kubernetes auth directly each get an ingress rule in the change that adds
# them; those going through External Secrets need none. Kubelet probes come
# from the host and are not subject to this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server

  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    # The other replicas: API forwarding (8200) and Raft / cluster traffic (8201).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP

    # The daily snapshot job (Kubernetes auth login and the snapshot itself).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao-snapshots
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # The web UI and API through envoy-internal (bao.homelab0.org).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # External Secrets: reads credentials for workloads using Kubernetes auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: external-secrets
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # The job that rotates Warpgate's Kubernetes target tokens. The service
    # account comes from the pod's real identity, so a label can't claim it.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: warpgate-tokens
            io.cilium.k8s.policy.serviceaccount: warpgate-tokens
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # Warpgate's secret backend, directly, so Envoy doesn't see its traffic.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: access
            app.kubernetes.io/name: warpgate
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # The merge gate's evidence worker: asks for short gate-reader tokens.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: steward
            app.kubernetes.io/name: merge-evidence
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # Prometheus: the metrics-only listener.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8220"
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The other replicas (Raft retry_join, forwarding, the active node).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP

    # The seal and External Keys: the YubiHSM through yubihsm-connector.
    # Written against the connector pod and its container port (Cilium DNATs
    # the Service before it evaluates policy).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hsm-system
            app.kubernetes.io/name: yubihsm-connector
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP

    # OIDC login: discovery, keys and token exchange with Authentik.
    # authentik.homelab0.org resolves to the internal VIP, and the policy is
    # evaluated against the gateway pods behind it (443 LB port, 10443 pod
    # port), the same as for Warpgate.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP

    # Database engine: rotating passwords on the shared CNPG cluster.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # Kubernetes auth: TokenReview calls. No toPorts: Cilium sees the post-DNAT
    # port of the control plane's real listener.
    - toEntities:
        - kube-apiserver
---
# The short-lived HSM key-management pod (app.kubernetes.io/name:
# openbao-hsm-admin): nothing reaches it; it reaches only DNS and the
# connector. It runs only while the owner manages OpenBao's HSM objects.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-hsm-admin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-hsm-admin
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hsm-system
            app.kubernetes.io/name: yubihsm-connector
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
---
# The agent PAM approval page (app.kubernetes.io/name: openbao-pam-page): a
# static file for envoy-internal and nothing else. The page talks to OpenBao
# from the browser, through Envoy, so the pod needs no egress at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-pam-page
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-pam-page
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - {}
---
# The daily snapshot job (app.kubernetes.io/name: openbao-snapshots):
# nothing reaches it; it reaches only DNS and the OpenBao servers. The NFS
# share is mounted by the kubelet, outside this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-snapshots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-snapshots
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# The token rotation job: DNS and the OpenBao servers, nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: warpgate-tokens
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: warpgate-tokens
      io.cilium.k8s.policy.serviceaccount: warpgate-tokens
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# Every other pod in the namespace (a snapshot job, a restore drill, anything
# added later) starts with no network access at all; each gets its own policy
# in the change that adds it. Rules are additive, so this doesn't narrow the
# server policy above. The empty rules match nothing; enableDefaultDeny keeps
# both directions enforced.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - {}
