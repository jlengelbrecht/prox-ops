---
# In place before any OpenBao pod exists, so the server never runs without it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openbao-policies
  namespace: flux-system
spec:
  targetNamespace: openbao
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/openbao/policies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
