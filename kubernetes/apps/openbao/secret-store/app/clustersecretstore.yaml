---
# OpenBao's HSM PIN (and nothing else) lives in the OpenBao-Automation vault.
# This store reads only that vault, through the identity Connect server, and
# serves only the openbao namespace: no other namespace can create an
# ExternalSecret against it. The general onepassword-connect store has no
# namespace limits, which is why the PIN is not in the Automation vault.
#
# Transitive reach: the store's token sits in identity-system (see
# externalsecret-connect-token.yaml). Anything that can create an
# ExternalSecret in identity-system or crossplane-system, or read Secrets in
# identity-system, can therefore reach this vault too. Keep RBAC in those
# namespaces, and in openbao, cluster-admin only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-openbao
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.identity-system.svc.cluster.local:8080
      vaults:
        OpenBao-Automation: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-openbao-token
            namespace: identity-system
            key: token
  conditions:
    - namespaces:
        - openbao
