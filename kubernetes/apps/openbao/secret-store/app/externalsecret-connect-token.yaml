---
# The Connect token for the OpenBao-Automation vault (read-only, scoped to that
# vault only, issued by the identity Connect server). It is kept in the
# Identity-Automation vault and lands here, in identity-system, the only
# namespace besides crossplane-system that can read that vault. Nothing in the
# openbao namespace ever sees it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-openbao-token
  namespace: identity-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-identity
  target:
    name: onepassword-openbao-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: openbao-connect-token
        property: token
