---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pam-page
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-pam-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-pam-page
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          # The full config is ours, so skip the image's entrypoint scripts,
          # which try to edit files on a read-only filesystem.
          command: [nginx, -c, /etc/pam/nginx.conf, -g, daemon off;]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /pam/
              port: http
          livenessProbe:
            httpGet:
              path: /pam/
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pam/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /srv/pam/index.html
              subPath: index.html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pam-page
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
