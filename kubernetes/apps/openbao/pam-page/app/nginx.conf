# Serves index.html at /pam/ and /pam/callback and nothing else. The headers
# stop other sites framing Approve (a meta tag can't set frame-ancestors) and
# keep the sign-in code in the callback URL out of caches and referrers. The
# page's own meta tag carries the rest of its Content-Security-Policy.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /srv/pam;
    default_type text/html;
    charset utf-8;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /pam/ {
      try_files /index.html =404;
    }

    location = /pam/callback {
      try_files /index.html =404;
    }

    location / {
      return 404;
    }
  }
}
