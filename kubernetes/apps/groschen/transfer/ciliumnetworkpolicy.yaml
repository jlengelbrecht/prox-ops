apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: groschen-secret-transfer
  namespace: groschen
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: groschen-secret-transfer
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEntities:
        - kube-apiserver
