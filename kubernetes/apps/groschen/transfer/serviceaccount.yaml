apiVersion: v1
kind: ServiceAccount
metadata:
  name: groschen-secret-transfer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: groschen-secret-transfer-target
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - groschen-key
      - groschen-owner-credentials
      - groschen-member-credentials
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: groschen-secret-transfer-target
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: groschen-secret-transfer-target
subjects:
  - kind: ServiceAccount
    name: groschen-secret-transfer
    namespace: groschen
