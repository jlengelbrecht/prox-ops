apiVersion: v1
kind: Service
metadata: {name: groschen-api}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: groschen-api}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: groschen
  annotations:
    external-dns.alpha.kubernetes.io/hostname: groshen.homelab0.org
spec:
  parentRefs:
    - {name: envoy-internal, namespace: network, port: 443, sectionName: https}
  hostnames: [groshen.homelab0.org]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: groschen-api, port: 8080, weight: 1}
