apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: groschen-db-credentials}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: groschen-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        groschen_db_pgpass: 'postgres-rw.database.svc.cluster.local:5432:groschen:{{ .username }}:{{ .password }}'
  data:
    - secretKey: username
      remoteRef: {key: postgres-cluster, property: GROSCHEN_USER}
    - secretKey: password
      remoteRef: {key: postgres-cluster, property: GROSCHEN_PASSWORD}
