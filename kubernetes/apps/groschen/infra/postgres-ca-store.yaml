apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: groschen-postgres-ca-public
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: groschen-postgres-ca-reader
