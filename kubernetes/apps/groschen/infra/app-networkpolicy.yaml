apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: groschen-clients}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [groschen-api, groschen-worker]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: database}
          podSelector:
            matchLabels: {cnpg.io/cluster: postgres}
      ports: [{protocol: TCP, port: 5432}]
# DNS for these clients is owned by the Cilium DNS proxy policy. A parallel
# L4 NetworkPolicy DNS allow could bypass the proxy's response observation.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: groschen-api}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: groschen-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: network}
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
      ports: [{protocol: TCP, port: 8080}]
