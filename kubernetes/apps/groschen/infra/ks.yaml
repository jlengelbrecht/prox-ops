apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: groschen-namespace
  namespace: flux-system
spec:
  dependsOn:
    - name: groschen-postgres-ca-reader
      namespace: database
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/groschen/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      current: "has(status) && has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: "has(status) && has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
