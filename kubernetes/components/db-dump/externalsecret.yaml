---
# The restic password. Lose it and the repository can't be read, so it stays
# in 1Password and nowhere else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-dbdump
  namespace: ${APP_NS}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ${APP}-dbdump
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: ${DUMP_RESTIC_ITEM:=volsync-restic}
        property: RESTIC_PASSWORD
