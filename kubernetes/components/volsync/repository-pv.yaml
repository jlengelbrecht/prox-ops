---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: volsync-repo-${APP_NS}-${APP}
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
  nfs:
    server: 10.20.66.109
    path: /var/nfs/shared/proxmox
  claimRef:
    name: ${APP}-volsync-repo
    namespace: ${APP_NS}
