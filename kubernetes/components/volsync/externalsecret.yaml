---
# Restic repository password, from the 1Password item "volsync-restic"
# (field RESTIC_PASSWORD, Automation vault). Every app using this component
# shares that password; each app has its own repository path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync
  namespace: ${APP_NS}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ${APP}-volsync
    creationPolicy: Owner
    template:
      data:
        RESTIC_REPOSITORY: /mnt/repo/volsync/${APP_NS}/${APP}
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: volsync-restic
        property: RESTIC_PASSWORD
